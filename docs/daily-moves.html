<style>
  body { font-feature-settings: "tnum" 1; }
  .pos{color:var(--pos)}.neg{color:var(--neg)}
  #dgrid{grid-template-columns:minmax(170px,215px) minmax(0,1fr) minmax(310px,400px)}
  #dgrid.nochart{grid-template-columns:minmax(170px,215px) minmax(0,1fr)} #dgrid.nochart #pC{display:none}
  #gHead,.gr{grid-template-columns:minmax(0,1fr) 58px}
  html[data-theme] .os-sg select{border:0;border-left:1px solid var(--border);border-radius:0;background:transparent;color:var(--text);font:inherit;font-size:12.5px;font-weight:500;padding:5px 8px;height:auto;min-height:0;cursor:pointer;max-width:150px}
  #pT .os-ps{flex-wrap:nowrap;gap:6px} html[data-theme] #pT .os-ps input[type="search"]{flex:0 1 170px;min-width:90px;width:auto}
  #note{white-space:normal;margin:-2px 0 10px;line-height:1.5} #note b{color:var(--text);font-weight:600}
  #status{margin-bottom:10px}
  .legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text-faint);white-space:nowrap;margin-left:auto}
  .legend i{display:inline-block;width:11px;height:10px;border-radius:2px} .legend span{margin:0 3px}
  .cind{border-bottom:1px dotted var(--border-strong);cursor:pointer} .cind:hover{color:var(--accent-text)}

  /* the grid: a sticky-header table inside the middle pane */
  #grid{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
  table.dm{border-collapse:separate;border-spacing:0;font-size:12px}
  .dm th,.dm td{box-sizing:border-box;white-space:nowrap;padding:0;font-variant-numeric:tabular-nums}
  .dm thead th{position:sticky;background:var(--surface);z-index:3;font-weight:600}
  .dm thead tr.h0 th{top:0;height:36px;font-size:12px;color:var(--text);cursor:pointer;user-select:none;text-align:center;border-bottom:1px solid var(--border)}
  .dm thead tr.h0 th small{display:block;font-size:10.5px;font-weight:500;color:var(--text-faint);line-height:1.15}
  .dm thead tr.h0 th.srt{color:var(--accent-text)} .dm thead tr.h0 th.sel{box-shadow:inset 0 -2px 0 var(--accent)}
  .dm thead tr.h1 th{top:36px;height:26px}
  .dm thead tr.h2 th{top:62px;height:26px}
  .dm thead tr.h3 th{top:88px;height:38px}
  .dm thead tr.h4 th{top:126px;height:38px;border-bottom:1px solid var(--border-strong)}
  .dm thead tr.h4 th.c0{cursor:pointer}
  .dm .c0{position:sticky;left:0;z-index:2;background:var(--surface);width:128px;min-width:128px;max-width:128px;text-align:left;padding:0 8px;border-right:1px solid var(--border);overflow:hidden}
  .dm thead .c0{z-index:5}
  .dm .cd{width:57px;min-width:57px}
  .dm .cr{width:66px;min-width:66px;background:var(--surface)}
  .dm .cr.r3{position:sticky;right:0;z-index:2;border-left:1px solid var(--border)}
  .dm thead .cr.r3{z-index:5}
  .dm.wide .cr{position:sticky;z-index:2} .dm.wide thead .cr{z-index:5}
  .dm.wide .cr.r3{right:132px} .dm.wide .cr.r2{right:66px} .dm.wide .cr.r1{right:0}
  .dm tbody td{height:42px;cursor:pointer}
  .dm tbody tr.on td.c0{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface);box-shadow:inset 2px 0 0 var(--accent)}
  .dm tbody tr:hover td.c0{background:var(--surface-2)} .dm tbody tr.on:hover td.c0{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface)}
  .dm .sym{font-weight:600;color:var(--text);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis}
  .dm tr.on .sym{color:var(--accent-text)}
  .dm .nm{font-size:11px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .dm .rl{font-size:12px;color:var(--text);font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
  .dm .rl small{display:block;font-size:10.5px;font-weight:500;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis}
  .dm .x{margin:1.5px;border-radius:4px;height:calc(100% - 3px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;position:relative;color:var(--text)}
  .dm .x b{font-weight:600;font-size:11.5px}
  .dm .x span{font-size:10px;color:var(--text-muted);font-weight:500}
  .dm .x .dot{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--text)}
  .dm .x.na{color:var(--text-faint);background:transparent}
  .dm td.cur .x,.dm th.cur .x{outline:2px solid var(--accent);outline-offset:-1px}
  .dm.nopx tbody td{height:27px} .dm.nopx tbody .x span,.dm.nopx tbody .nm{display:none}
  .z{background:var(--surface-2)}
  .p1{background:color-mix(in srgb,var(--pos) 13%,var(--surface))}
  .p2{background:color-mix(in srgb,var(--pos) 24%,var(--surface))}
  .p3{background:color-mix(in srgb,var(--pos) 36%,var(--surface))}
  .p4{background:color-mix(in srgb,var(--pos) 50%,var(--surface))}
  .p5{background:color-mix(in srgb,var(--pos) 66%,var(--surface))}
  .n1{background:color-mix(in srgb,var(--neg) 13%,var(--surface))}
  .n2{background:color-mix(in srgb,var(--neg) 24%,var(--surface))}
  .n3{background:color-mix(in srgb,var(--neg) 36%,var(--surface))}
  .n4{background:color-mix(in srgb,var(--neg) 50%,var(--surface))}
  .n5{background:color-mix(in srgb,var(--neg) 66%,var(--surface))}
  .p3 span,.p4 span,.p5 span,.n3 span,.n4 span,.n5 span{color:var(--text)}
  #more{flex:none;padding:6px 12px;text-align:center;font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--border)}
  #tip{position:fixed;z-index:300;pointer-events:none;background:var(--surface-3,var(--surface));color:var(--text);border:1px solid var(--border-strong);border-radius:var(--radius,8px);
       padding:9px 11px;font-size:12px;line-height:1.55;box-shadow:var(--shadow-lg,0 8px 24px rgba(0,0,0,.25));max-width:290px;display:none}
  #tip .t{font-weight:700;font-size:12.5px}
  #tip .m{color:var(--text-muted)}
  details.how{margin-top:10px;font-size:12px;color:var(--text-faint);line-height:1.55}
  details.how summary{cursor:pointer;color:var(--text-muted)}
  details.how p{margin:8px 0 0;max-width:900px}
  details.how b{color:var(--text-muted);font-weight:600}

  @media (max-width:1500px){ #dgrid{grid-template-columns:196px minmax(0,1fr) 330px} #dgrid.nochart{grid-template-columns:196px minmax(0,1fr)} .legend{display:none} }
  @media (max-width:899px){
    #dgrid,#dgrid.nochart{grid-template-columns:minmax(0,1fr)} #bChart{display:none}
    #grid{flex:none;max-height:76vh}
    .dm .c0{width:108px;min-width:108px;max-width:108px;padding:0 7px}
    .dm .nm{display:none}
    .dm thead tr.h1 th,.dm thead tr.h2 th,.dm thead tr.h3 th,.dm thead tr.h4 th{position:static}
    .dm thead tr.h1 th.c0,.dm thead tr.h2 th.c0,.dm thead tr.h3 th.c0,.dm thead tr.h4 th.c0{position:sticky;left:0}
    html[data-theme] .sw-scrollx table.dm th,html[data-theme] .sw-scrollx table.dm td{padding:0}
    html[data-theme] .sw-scrollx table.dm .c0{padding:0 7px}
    html[data-theme] .sw-scrollx table.dm{font-size:12px}
    html[data-theme] .sw-scrollx table.dm thead th{z-index:4}
    html[data-theme] .sw-scrollx table.dm thead th.c0{z-index:6}
    html[data-theme] .sw-scrollx table.dm tbody td.c0{z-index:2}

<script>
'use strict';
const K = window.OSKit;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAXC = 60;            // most day/week/month columns drawn at once (the latest ones)
const BATCH = 80;           // stock rows drawn per step
const FNO = 'F&O stocks';
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let C = null;                               // the data set on screen: LIVE, or past-year files stitched together
let LIVE = null, HIDX = null, CAL = null, HREADY = null, GOSEQ = 0;      // live file · dm_hist/index.json · every session day · its promise
const HC = {}, SC = {}, XC = {}, MAXW = 260;     // year files · stitched sets · hover files · longest window (sessions)
const atLatest = () => C === LIVE && TO === L - 1;
let DAYS = [], L = 0;
let IX = 'Nifty 50', FROM = 1, TO = 1, G = 'd', IND = '', Q = '', SORT = {k:'per', dir:-1};
let COLS = [], ALLCOLS = [], ROWS = [], DRAWN = 0, TOUCH = false;
/* what the right pane shows: the picked stock (SEL.s) on the picked column (SEL.b = that column's last day, null = the window's last) */
let SEL = {s:null, b:null}, PANE = 'g', GSORT = {k:null, dir:-1}, LROWS = [], CH = null, II = null;
const UI = {chart:true, px:true, iv:'D', range:'6M', log:false, focus:false};
try { const u = JSON.parse(localStorage.getItem('sw_dm_ui') || 'null'); if (u){ UI.chart = u.chart !== false; UI.px = u.px !== false; if (typeof u.iv === 'string') UI.iv = u.iv; if (typeof u.range === 'string') UI.range = u.range; UI.log = !!u.log; } } catch (e) {}
const saveUI = () => { try { localStorage.setItem('sw_dm_ui', JSON.stringify({chart:UI.chart, px:UI.px, iv:UI.iv, range:UI.range, log:UI.log})); } catch (e) {} };

async function gunzipFetch(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → HTTP ' + r.status);
  const buf = await r.arrayBuffer();
  const stream = new Blob([new Uint8Array(buf)]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

/* ---------- dates & numbers ---------- */
const dObj = d => new Date(Date.UTC(Math.floor(d/10000), Math.floor(d/100)%100 - 1, d%100));
const dIso = d => String(d).replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3');
const dShort = d => (d%100) + ' ' + MON[Math.floor(d/100)%100 - 1];
const dLong = d => (d%100) + ' ' + MON[Math.floor(d/100)%100 - 1] + ' ' + Math.floor(d/10000);
const dDow = d => DOW[dObj(d).getUTCDay()];
const weekKey = d => { const t = dObj(d); const dow = (t.getUTCDay() + 6) % 7; return Math.round((t.getTime() - dow*864e5) / 864e5); };
const monKey = d => Math.floor(d/100);
const n2 = v => v.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const n0 = v => Math.round(v).toLocaleString('en-IN');
const pct = v => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + '%';
const sgn0 = v => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + (v !== 0 && Math.abs(v) < 0.5 ? Math.abs(v).toFixed(2) : n0(Math.abs(v)));
const pc = v => v == null ? '' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';

/* colour band for value v on a scale (scale = the size of one step) */
function band(v, scale){
  if (v == null || !isFinite(v)) return 'na';
  const a = Math.abs(v) / scale;
  const k = a < 0.25 ? 0 : a < 1 ? 1 : a < 2 ? 2 : a < 3 ? 3 : a < 4 ? 4 : 5;
  return k === 0 ? 'z' : (v > 0 ? 'p' : 'n') + k;
}
const gScale = () => G === 'd' ? 1 : G === 'w' ? 2 : 4;

/* ---------- series helpers ---------- */
// last non-null close at or before index i (a stock that did not trade keeps its last traded close as the base)
function closeAtOrBefore(c, i){ for (let j = i; j >= 0; j--) if (c[j] != null) return c[j]; return null; }
function chg(c, a, b){
  if (!c || c[b] == null) return null;
  const base = closeAtOrBefore(c, a);
  return base ? (c[b] / base - 1) * 100 : null;
}

/* ---------- columns ---------- */
function buildCols(){
  const out = [];
  if (G === 'd'){
    for (let i = FROM; i <= TO; i++) out.push({a:i-1, b:i, f:i, top:dShort(DAYS[i]), sub:dDow(DAYS[i])});
  } else {
    const key = G === 'w' ? weekKey : monKey;
    let cur = null;
    for (let i = FROM; i <= TO; i++){
      const k = key(DAYS[i]);
      if (!cur || cur.k !== k){ cur = {k, a:i-1, f:i, b:i}; out.push(cur); } else cur.b = i;
    }
    for (const c of out){
      const n = c.b - c.f + 1;
      if (G === 'w'){ c.top = dShort(DAYS[c.b]); c.sub = 'week · ' + n + (n === 1 ? ' day' : ' days'); }
      else { c.top = MON[Math.floor(DAYS[c.b]/100)%100 - 1] + ' ' + String(Math.floor(DAYS[c.b]/10000)).slice(2); c.sub = n + (n === 1 ? ' day' : ' days'); }
    }
  }
  ALLCOLS = out;
  COLS = out.length > MAXC ? out.slice(out.length - MAXC) : out;
}
function sumRange(arr, f, b){
  let s = 0, n = 0;
  for (let i = f; i <= b; i++) if (arr[i] != null){ s += arr[i]; n++; }
  return {s: n ? s : null, n, of: b - f + 1};
}

/* ---------- rows ---------- */
/* member list of roster k on the To date: today's list on the latest day, else the dated list in force that day */
function rosterAt(k){
  const e = C.idx[k]; if (!e) return {m:[], none:true};
  if (atLatest() || !e.snaps) return {m:e.m || [], today:true};
  let best = null; for (const sn of e.snaps){ if (sn[0] <= DAYS[TO]) best = sn; else break; }
  if (!best) return {m:[], none:true, starts:e.snaps.length ? e.snaps[0][0] : null};
  return {m:best[1], eff:best[0], un:(e.un || {})[best[0]] || []};
}
function members(){ return rosterAt(IX).m.filter(s => C.stocks[s]); }

/* ---------- past years (docs/dm_hist, scripts/build_daily_moves_hist.py) ---------- */
function loadCal(){
  return HREADY || (HREADY = fetch('./dm_hist/index.json', {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { HIDX = j; const set = new Set(j.days); LIVE.days.forEach(d => set.add(d)); CAL = [...set].sort((a, b) => a - b); })
    .catch(e => { console.warn('past years not available', e); HIDX = null; CAL = LIVE.days.slice(); }));
}
const calOnOrBefore = d => { for (let i = CAL.length - 1; i >= 1; i--) if (CAL[i] <= d) return i; return 1; };
const calOnOrAfter = d => { for (let i = 1; i < CAL.length; i++) if (CAL[i] >= d) return i; return CAL.length - 1; };
const yearFile = y => HC[y] || (HC[y] = gunzipFetch('./dm_hist/' + y + '.bin'));
const hoverFile = u => XC[u] || (XC[u] = gunzipFetch(u));
/* join files (oldest first) on one day axis. A newer file wins on a day both hold. A year file built earlier sits on
   an older split/bonus basis, so each stock of an older file is rescaled by the days both files hold. */
function stitch(pieces){
  const set = new Set(); pieces.forEach(p => p.days.forEach(d => set.add(d)));
  const days = [...set].sort((a, b) => a - b), pos = new Map(days.map((d, i) => [d, i])), n = days.length;
  const blank = () => new Array(n).fill(null);
  const out = {v:1, hist:true, pieces, days, end:dIso(days[n-1]), idx:{}, stocks:{}, fii:blank(), dii:blank(), fl:blank(), fs:blank(), exd:{}};
  for (let pi = pieces.length - 1; pi >= 0; pi--){
    const p = pieces[pi], map = p.days.map(d => pos.get(d)), m = map.length;

      if (PANE === 'k' && ROWS.length){ const i = ROWS.findIndex(r => r.s === SEL.s) + stp;
        if (i < 0 && SEL.s){ pick(null, SEL.b); syncControls(); } else if (ROWS[i]){ pick(ROWS[i].s, SEL.b, true); syncControls(); } }
      else { const j = LROWS.findIndex(x => x.k === IX) + stp; if (LROWS[j]) pickIx(LROWS[j].k); }
      e.preventDefault(); hideTip(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      if (PANE === 'g'){ if (e.key === 'ArrowRight' && ROWS.length){ PANE = 'k'; pick(ROWS[0].s, SEL.b, true); syncControls(); } }
      else { let i = selCol(); i = i < 0 ? (e.key === 'ArrowLeft' ? COLS.length - 1 : -1) : i + (e.key === 'ArrowRight' ? 1 : -1);
        if (i >= COLS.length) i = -1; if (i < -1) i = -1; pick(SEL.s, i >= 0 ? COLS[i].b : null, true); }
      e.preventDefault(); hideTip(); }
    else if (e.key === 'Escape'){ if (UI.focus) setFocus(false); else if (SEL.s){ PANE = 'g'; pick(null, null); syncControls(); } }
    else if (e.key === 'Enter'){ if (SEL.s) location.href = $('cOpen').href; }
    else if (e.key === 'f' || e.key === 'F'){ setFocus(); }
    else if (e.key === '/'){ $('fQ').focus(); e.preventDefault(); }
  });
}
// show the latest column next to the pinned summary column(s)
function scrollLatest(){
  const g = $('grid'), wide = $('tbl').classList.contains('wide');
  g.scrollLeft = Math.max(0, g.scrollWidth - g.clientWidth - (wide ? 0 : 132));
}

/* ---------- tooltip ---------- */
let TIPKEY = '';
function hideTip(){ $('tip').style.display = 'none'; TIPKEY = ''; }
function ensureX(){
  const ds = C; if (ds.X || ds.XLOAD) return;
  const src = ds === LIVE ? [LIVE] : ds.pieces;
  ds.XLOAD = Promise.all(src.map(p => hoverFile(p === LIVE ? './daily_moves_x.bin' : './dm_hist/' + p.year + 'x.bin')))
    .then(xs => { if (ds === LIVE) ds.X = xs[0].end === ds.end ? xs[0] : {stocks:{}, stale:true}; else ds.X = stitchX(ds, xs); if (C === ds) detail(); })
    .catch(() => { ds.X = {stocks:{}, failed:true}; if (C === ds) detail(); });
}
function tipFor(target, x, y, toggle){
  const cell = target.closest('td,th'); const tr = cell && cell.parentElement;
  if (!cell || cell.dataset.i == null){ hideTip(); return; }
  const i = +cell.dataset.i; let html = '', key = '';
  const colTitle = c => G === 'd' ? dDow(DAYS[c.b]) + ' ' + dLong(DAYS[c.b]) : dLong(DAYS[c.f]) + ' to ' + dLong(DAYS[c.b]);
  if (tr.dataset.r != null){
    const r = ROWS[+tr.dataset.r]; if (!r){ hideTip(); return; }
    const st = r.st; key = r.s + '|' + i;
    if (i >= 0){
      const c = COLS[i], cl = st.c[c.b], base = closeAtOrBefore(st.c, c.a);
      html = '<div class="t">' + esc(r.s) + ' · ' + colTitle(c) + '</div>';
      if (cl == null) html += '<div class="m">No trade stored for this ' + (G === 'd' ? 'day' : 'period’s last day') + '.</div>';
      else html += '<div>Close ₹' + n2(cl/100) + ' <b class="' + pc(r.cells[i]) + '">' + pct(r.cells[i]) + '</b></div><div class="m">Previous close ' + (base != null ? '₹' + n2(base/100) : '—') + ' · click for volume, delivery, RSI</div>';
    } else if (i === -1){
      const base = closeAtOrBefore(st.c, FROM-1), cl = st.c[TO];
      html = '<div class="t">' + esc(r.s) + ' · ' + dLong(DAYS[FROM]) + ' to ' + dLong(DAYS[TO]) + '</div>'
           + (r.per == null ? '<div class="m">No price on ' + (cl == null ? 'the To date' : 'or before ' + dLong(DAYS[FROM-1])) + '.</div>'
              : '<div>₹' + n2(base/100) + ' to ₹' + n2(cl/100) + ' <b class="' + pc(r.per) + '">' + pct(r.per) + '</b></div>');
    } else {
      const cl = st.c[TO];
      html = '<div class="t">' + esc(r.s) + ' · 52 weeks to ' + dLong(DAYS[TO]) + '</div>'
           + (cl == null ? '<div class="m">No close on the To date.</div>'
              : '<div>Close ₹' + n2(cl/100) + '</div><div>High ₹' + n2(st.hh[TO]/100) + ' <b class="neg">' + pct(r.hi) + '</b></div><div>Low ₹' + n2(st.ll[TO]/100) + ' <b class="pos">' + pct(r.lo) + '</b></div>');
    }
  } else if (cell.dataset.f){
    const f = cell.dataset.f; key = f + '|' + i;
    const c = i >= 0 ? COLS[i] : {f:FROM, b:TO, a:FROM-1};
    const title = i >= 0 ? colTitle(c) : dLong(DAYS[FROM]) + ' to ' + dLong(DAYS[TO]);
    if (f === 'fii' || f === 'dii'){
      const o = sumRange(C[f], c.f, c.b);
      html = '<div class="t">' + f.toUpperCase() + ' net · ' + title + '</div>' + (o.s == null ? '<div class="m">No exchange figure stored.</div>' : '<div><b class="' + pc(o.s) + '">' + sgn0(o.s) + ' Cr</b></div>' + (o.of > 1 ? '<div class="m">From ' + o.n + ' of ' + o.of + ' sessions</div>' : ''));
    } else if (f === 'ls'){
      const a = C.fl[c.b], b = C.fs[c.b];
      html = '<div class="t">FII index futures · ' + dLong(DAYS[c.b]) + '</div>' + (a == null ? '<div class="m">No open-interest file stored.</div>' : '<div>Long ' + n0(a) + ' · Short ' + n0(b) + ' contracts</div><div>Net <b class="' + pc(a - b) + '">' + sgn0(a - b) + '</b> · long share ' + (a / (a + b) * 100).toFixed(1) + '%</div>');
    } else if (f === 'ix'){
      const lv = (C.idx[IX] || {}).lv;
      html = '<div class="t">' + esc(IX) + ' · ' + title + '</div>' + (!lv || lv[c.b] == null ? '<div class="m">No daily level stored.</div>' : '<div>Close ' + n2(lv[c.b]) + (lv[c.a] != null ? ' <b class="' + pc(lv[c.b]/lv[c.a]-1) + '">' + pct((lv[c.b]/lv[c.a]-1)*100) + '</b></div><div class="m">Previous close ' + n2(lv[c.a]) + '</div>' : '</div>'));
    }
  }
  if (!html){ hideTip(); return; }
  const tip = $('tip');
  if (toggle && TIPKEY === key && tip.style.display === 'block'){ hideTip(); return; }
  TIPKEY = key;
  tip.innerHTML = html; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let lx = x + 14, ty = y + 16;
  if (lx + w > innerWidth - 8) lx = Math.max(8, x - w - 12);
  if (ty + h > innerHeight - 8) ty = Math.max(8, y - h - 12);
  tip.style.left = lx + 'px'; tip.style.top = ty + 'px';
}
const f1 = v => v == null ? '—' : v.toFixed(1);

/* ---------- csv ---------- */
function exportCsv(){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const cols = ALLCOLS, lines = [];
  lines.push(['Symbol','Name','Industry'].concat(cols.map(c => G === 'd' ? dIso(DAYS[c.b]) : dIso(DAYS[c.f]) + ' to ' + dIso(DAYS[c.b])), ['Period %','% from 52W high','% from 52W low','Close on ' + dIso(DAYS[TO])]).map(q).join(','));
  for (const r of ROWS){
    const cells = cols.map(c => { const v = chg(r.st.c, c.a, c.b); return v == null ? '' : v.toFixed(2); });
    lines.push([q(r.s), q(r.st.n), q(r.st.i)].concat(cells, [r.per == null ? '' : r.per.toFixed(2), r.hi == null ? '' : r.hi.toFixed(2), r.lo == null ? '' : r.lo.toFixed(2), r.st.c[TO] == null ? '' : (r.st.c[TO]/100).toFixed(2)]).join(','));
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv'}));
  a.download = 'daily_moves_' + IX.replace(/[^A-Za-z0-9]+/g, '_') + '_' + dIso(DAYS[FROM]) + '_' + dIso(DAYS[TO]) + '.csv';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- init ---------- */
async function init(){
  try {
    LIVE = C = await gunzipFetch('./daily_moves.bin');
    DAYS = C.days || []; L = DAYS.length;
    if (L < 2 || !C.idx || !Object.keys(C.idx).length || !C.stocks) throw new Error('the data file is empty');
    C.exd = C.exd || {}; C.fii = C.fii || []; C.dii = C.dii || []; C.fl = C.fl || []; C.fs = C.fs || [];
    defaults(); readUrl();
    $('status').classList.add('hidden'); $('content').classList.remove('hidden');
    $('dgrid').classList.toggle('nochart', !UI.chart); $('bChart').classList.toggle('on', UI.chart);
    CH = new K.Chart({chart:$('cChart'), legend:$('cLegend'), msg:$('cMsg'), iv:UI.iv, range:UI.range, log:UI.log});
    wire(); renderHow();
    loadCal().then(() => { if (C) syncControls(); });
    if (URLD){
      await loadCal();
      let pt = URLD.t ? calOnOrBefore(URLD.t) : CAL.length - 1, pf = URLD.f ? calOnOrAfter(URLD.f) : pt - 19;
      if (pf > pt) pf = pt; if (pt - pf + 1 > MAXW) pf = pt - MAXW + 1;
      await go(CAL[pt], pt - Math.max(1, pf));
    }
    fit(); render(); scrollLatest();
    if (SEL.s){ PANE = 'k'; selectCells(); }
  } catch (e){
    $('status').textContent = 'Could not load market data: ' + e.message;
    console.error(e);
  }
}
init();
