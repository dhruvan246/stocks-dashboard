<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STOCKSWORLD · Watchlist</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./theme.css" />
<script src="./theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-feature-settings:"tnum" 1; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
  <div class="max-w-screen-lg mx-auto px-4 h-14 flex items-center justify-between gap-4">
    <a href="./index.html" class="flex items-center gap-2.5 shrink-0 group">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 text-white flex items-center justify-center font-extrabold text-[13px] shadow-md group-hover:scale-105 transition">SW</span>
      <span class="font-bold text-slate-900 tracking-tight hidden sm:block">STOCKS<span class="text-indigo-600">WORLD</span></span>
    </a>
    <nav></nav>
  </div>
</header>

<main class="max-w-screen-lg mx-auto px-4 py-6">
  <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold text-slate-900">⭐ Watchlist</h1>
      <p class="text-sm text-slate-500 mt-0.5">Star stocks anywhere on the site — they collect here, with your notes.</p>
    </div>
    <div id="wlSyncBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-200 text-slate-600">…</div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-4 mb-4 flex flex-wrap items-center gap-2">
    <input id="wlAdd" type="text" placeholder="Add a symbol, e.g. RELIANCE" autocomplete="off"
           class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm uppercase focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-56 max-w-full" />
    <button id="wlAddBtn" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition">+ Add</button>
    <span class="text-xs text-slate-400">or tap the ☆ next to any stock on Discovery, Results or Announcements</span>
  </div>

  <div id="wlList" class="space-y-2"></div>
  <div id="wlEmpty" class="hidden text-center text-slate-400 text-sm py-12 bg-white border border-dashed border-slate-300 rounded-xl">
    Nothing starred yet. Tap the ☆ next to any stock, or add one above.
  </div>
</main>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtD = ts => ts ? new Date(ts).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '';

  function badge(){
    const b = $('wlSyncBadge');
    if (window.swWatch && swWatch.isOwner()) { b.textContent = '🔄 synced across your devices'; b.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700'; }
    else { b.textContent = '💾 saved in this browser only'; b.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-700'; b.title = 'Open any page once with ?ownerkey=YOUR-KEY to sync this list across devices.'; }
  }

  function row(e){
    return '<div class="bg-white border border-slate-200 rounded-xl p-3.5 flex flex-wrap gap-x-4 gap-y-2 items-start" data-row="'+esc(e.s)+'">' +
      '<div class="flex items-center gap-2 min-w-[10rem]">' +
        '<span class="sw-star" data-sym="'+esc(e.s)+'"></span>' +
        '<a class="font-bold text-slate-900 hover:text-indigo-700" href="./stock.html?sym='+encodeURIComponent(e.s)+'">'+esc(e.s)+'</a>' +
        '<span class="text-xs font-semibold whitespace-nowrap" data-px="'+esc(e.s)+'"></span>' +
      '</div>' +
      '<div class="flex-1 min-w-[14rem]">' +
        '<textarea data-note="'+esc(e.s)+'" rows="1" placeholder="Add a note… (why it’s interesting, what to watch)" ' +
          'class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm text-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y">'+esc(e.note)+'</textarea>' +
      '</div>' +
      '<div class="flex items-center gap-3 text-xs text-slate-400 shrink-0 pt-1.5">' +
        '<span title="Added on">'+fmtD(e.ts)+'</span>' +
        '<button data-del="'+esc(e.s)+'" title="Remove" class="text-slate-400 hover:text-rose-600 text-base leading-none">🗑</button>' +
      '</div>' +
    '</div>';
  }

  let noteTimers = {};
  function render(){
    const l = window.swWatch ? swWatch.list() : [];
    $('wlList').innerHTML = l.map(row).join('');
    $('wlEmpty').classList.toggle('hidden', l.length > 0);
    if (window.swWatch) swWatch.paintAll($('wlList'));
    badge();
    paintLive();
  }

  /* ---- live prices (our Cloudflare Worker → Yahoo NSE, ~15-min delay).
     One batched call for the whole list (chunks of 30); silently keeps rows
     bare if the Worker is unreachable or a symbol isn't on Yahoo. ---- */
  const WORKER = 'https://stocksworld-quotes.dhruvan2510.workers.dev';
  let LIVE = {};   // sym -> {ltp, prevClose}
  function marketOpenIST(){
    const n = new Date(Date.now() + 330*60000);
    const d = n.getUTCDay(), h = n.getUTCHours() + n.getUTCMinutes()/60;
    return d >= 1 && d <= 5 && h >= 9 && h <= 15.75;
  }
  function paintLive(){
    document.querySelectorAll('[data-px]').forEach(el => {
      const v = LIVE[el.getAttribute('data-px')];
      if (!v || v.ltp == null) return;
      const ch = v.prevClose > 0 ? (v.ltp / v.prevClose - 1) * 100 : null;
      el.innerHTML = '₹' + (v.ltp >= 1000 ? Math.round(v.ltp).toLocaleString('en-IN') : v.ltp.toFixed(2)) +
        (ch == null ? '' : ' <span class="' + (ch >= 0 ? 'text-emerald-600' : 'text-rose-600') + '">' +
          (ch > 0 ? '+' : '') + ch.toFixed(2) + '%</span>');
      el.title = 'Live price (Yahoo NSE, ~15-min delay)';
    });
  }
  async function fetchLive(){
    const syms = (window.swWatch ? swWatch.list() : []).map(e => e.s);
    if (!syms.length) return;
    try {
      for (let i = 0; i < syms.length; i += 30) {
        const d = await (await fetch(WORKER + '/?symbols=' + encodeURIComponent(syms.slice(i, i + 30).join(',')), {cache:'no-store'})).json();
        Object.assign(LIVE, (d && d.data) || {});
      }
      paintLive();
    } catch (e) { /* keep rows bare */ }
  }

  // Owner-only page: everyone else gets a lock card (client-side curtain; the
  // shared nav also hides this page for non-owners — see theme.js PRIVATE_PAGES).
  function swLock(){ document.querySelector('main').innerHTML =
    '<div class="max-w-md mx-auto text-center py-20"><div class="text-5xl mb-4">🔒</div>' +
    '<h1 class="text-lg font-bold text-slate-800 mb-2">This page is private</h1>' +
    '<p class="text-sm text-slate-500">It\'s a personal tool of the site owner. The rest of the site is open — head back to the <a class="text-indigo-600 font-semibold hover:underline" href="./index.html">home page</a>.</p></div>'; }
  const SW_OWNER = (function(){ try { return !!localStorage.getItem('bt_owner_key'); } catch(e){ return false; } })();

  function boot(){
    if (!SW_OWNER) { swLock(); return; }
    if (!window.swWatch) { setTimeout(boot, 150); return; }
    swWatch.load().then(() => { render(); fetchLive(); });
    document.addEventListener('sw-watch-change', () => { render(); fetchLive(); });
    setInterval(() => { if (!document.hidden && marketOpenIST()) fetchLive(); }, 60000);

    $('wlAddBtn').addEventListener('click', add);
    $('wlAdd').addEventListener('keydown', ev => { if (ev.key === 'Enter') add(); });
    function add(){
      const s = ($('wlAdd').value || '').trim().toUpperCase().replace(/[^A-Z0-9&\-]/g, '');
      if (!s) return;
      $('wlAdd').value = '';
      if (!swWatch.has(s)) swWatch.toggle(s);
    }

    // notes: save 800ms after typing stops (and on blur)
    $('wlList').addEventListener('input', ev => {
      const t = ev.target.closest('textarea[data-note]'); if (!t) return;
      const s = t.getAttribute('data-note');
      clearTimeout(noteTimers[s]);
      noteTimers[s] = setTimeout(() => swWatch.setNote(s, t.value), 800);
    });
    $('wlList').addEventListener('focusout', ev => {
      const t = ev.target.closest('textarea[data-note]'); if (!t) return;
      const s = t.getAttribute('data-note');
      clearTimeout(noteTimers[s]);
      const e = swWatch.entry(s);
      if (!e || (e.note || '') !== t.value) swWatch.setNote(s, t.value);
    });
    // deletes
    $('wlList').addEventListener('click', ev => {
      const b = ev.target.closest('button[data-del]'); if (!b) return;
      swWatch.remove(b.getAttribute('data-del'));
    });
  }
  document.readyState === 'loading' ? addEventListener('DOMContentLoaded', boot) : boot();
})();
</script>
</body>
</html>
