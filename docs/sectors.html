<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STOCKSWORLD · Sector & Industry Indexes</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./theme.css" />
<script src="./theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body{font-feature-settings:"tnum" 1}
  .pos{color:var(--pos)}.neg{color:var(--neg)}
  .card{background:var(--surface,var(--surface));border:1px solid var(--border,var(--border));border-radius:var(--radius-lg);transition:transform .12s,box-shadow .12s,border-color .12s}
  .card.click:hover{transform:translateY(-2px);box-shadow:0 12px 28px -16px rgba(0,0,0,.4);border-color:var(--border-strong,var(--border-strong));cursor:pointer}
  .pill{cursor:pointer;user-select:none;white-space:nowrap}
  .pill.on{background:linear-gradient(135deg,var(--accent,#4f46e5),var(--accent-2,#7c3aed));color:#fff;border-color:transparent}
  .spark-tip{position:absolute;pointer-events:none;display:none;background:var(--surface,var(--surface));border:1px solid var(--border,var(--border));border-radius:var(--radius);padding:.3rem .5rem;font-size:.66rem;line-height:1.25;box-shadow:0 6px 18px -8px rgba(0,0,0,.4);white-space:nowrap;z-index:30}
  .hm-tile{border-radius:var(--radius-sm);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:.25rem;transition:outline .1s}
  .hm-tile:hover{outline:2px solid var(--accent,var(--accent));outline-offset:-2px}
  #modal{position:fixed;inset:0;background:rgba(8,12,22,.55);backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:2.5rem 1rem}
  #modalCard{background:var(--surface,var(--surface));border:1px solid var(--border,var(--border));border-radius:var(--radius-lg);max-width:60rem;width:100%;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
  .mchartWrap{position:relative}
  table.tbl{width:100%;font-size:.8rem;border-collapse:collapse}
  table.tbl th{position:sticky;top:0;background:var(--surface,var(--surface))}
  #ov{position:fixed;inset:0;background:var(--app-bg,var(--surface-2));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80}
  /* On phones theme.js re-uses this table's .overflow-x-auto holder as a .sw-scrollx, which PINS
     the first column. A pinned "SYMBOL Full Company Name" cell measures 228px of a 298px-wide
     scroller at 375px, so it paints over every column you sideways-scroll to — P/E, 1Y and 6M were
     all unreachable. The symbol alone identifies the row; the full name is one tap away. */
  @media (max-width:640px){
    #mPeerBody .pname{display:none}
    #mPeerBody td:first-child{max-width:9.5rem}
  }
  /* 11 columns in a 60rem modal: a number column left to wrap breaks "₹12.77K Cr" over two lines.
     Only the numbers are pinned to one line — the company-name column may still wrap. */
  #mPeerHead th, #mPeerBody td:not(:first-child){white-space:nowrap}

  /* ================= one-screen layout: view tabs, control bar, three panes =================
     Dense and flat on purpose — 1px borders, no shadows, colour only on numbers and the selected row. */
  #pageMain.wide{max-width:none}
  #vbar{display:flex;align-items:flex-end;gap:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  html[data-theme] #vbar h1{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1;padding-bottom:9px;margin:0}
  #vtabs{display:flex;gap:18px}
  html[data-theme] #vtabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:0 1px 8px;margin-bottom:-1px;font-size:14px;font-weight:500;color:var(--text-muted);cursor:pointer;min-height:0;box-shadow:none}
  html[data-theme] #vtabs button:hover{color:var(--text)}
  html[data-theme] #vtabs button.on{color:var(--accent-text);border-bottom-color:var(--accent-text)}
  #asof{margin-left:auto;padding-bottom:9px;font-size:12px;color:var(--text-faint);white-space:nowrap}
  .lvdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-faint);margin-right:5px;vertical-align:1px}
  .lvdot.on{background:var(--pos);animation:lvp 1.6s ease-in-out infinite}
  #asof.live{color:var(--text-muted)}
  @keyframes lvp{50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){ .lvdot.on{animation:none} }
  #trkWrap{font-size:13px}
  #trkBar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
  #trkBar .sp{flex:1}
  #tRew{align-items:center}
  #tRew .lbl{padding:0 8px 0 10px;font-size:12.5px;font-weight:500;color:var(--text-muted)}
  html[data-theme] #tRewDate{border:0;border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:0;background:transparent;color:var(--text);font:inherit;font-size:12.5px;padding:4px 6px;height:auto;min-height:0;width:auto;box-shadow:none;outline-offset:-2px}
  html[data-theme] #tRew.on{border-color:var(--accent)} html[data-theme] #tRew.on .lbl{color:var(--accent-text)}
  html[data-theme] #tRew button:disabled{opacity:.4;cursor:default}
  #asof.rew{color:var(--accent-text)}
  #trkBar .hint{font-size:12px;color:var(--text-faint);white-space:nowrap}
  #trkBar .hint b{font-weight:500;color:var(--text-muted)}
  .sg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
  html[data-theme] .sg button{background:none;border:0;border-right:1px solid var(--border);border-radius:0;padding:5px 10px;font-size:12.5px;font-weight:500;line-height:1.3;color:var(--text-muted);cursor:pointer;min-height:0;box-shadow:none;white-space:nowrap}
  html[data-theme] .sg button:last-child{border-right:0}
  html[data-theme] .sg button:hover{color:var(--text);background:var(--surface-2)}
  html[data-theme] .sg button.on{background:var(--accent);color:var(--on-accent,#fff)}
  html[data-theme] .tbtn{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:500;line-height:1.3;color:var(--text-muted);cursor:pointer;min-height:0;box-shadow:none;white-space:nowrap;text-decoration:none}
  html[data-theme] .tbtn:hover{color:var(--text);border-color:var(--border-strong)}
  html[data-theme] .tbtn.on{color:var(--accent-text);border-color:var(--accent);background:var(--accent-soft)}
  html[data-theme] .tbtn:disabled{opacity:.45;cursor:default}
  .tbtn.static{cursor:default}
  #trk{display:grid;grid-template-columns:minmax(250px,340px) minmax(240px,310px) minmax(0,1fr);gap:10px;min-height:460px}
  #trk.focus{grid-template-columns:minmax(0,1fr)}
  #trk.focus #tpG,#trk.focus #tpS{display:none}
  .tp{background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;animation:none !important}
  .tph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);min-height:44px}
  .tph .ttl{font-size:14px;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tph .ttl i{font-style:normal;font-weight:400;color:var(--text-faint);margin-left:4px}
  .tph .ttl b{font-weight:600;margin-left:6px}
  .tph .r{margin-left:auto;font-size:12px;color:var(--text-faint);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .tps{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center}
  html[data-theme] #tSearch{width:100%;background:var(--app-bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--text);min-height:0}
  .tch{display:grid;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-faint);user-select:none}
  .tch span[data-k]{cursor:pointer}.tch span[data-k]:hover{color:var(--text)}
  .tch span:not(:first-child){text-align:right}
  #tgHead,.gr{grid-template-columns:minmax(0,1fr) 58px 26px 64px}
  #tsHead,.sr{grid-template-columns:minmax(0,1fr) 30px 64px}
  .tl{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
  .gr,.sr{display:grid;align-items:center;gap:8px;padding:0 12px;height:33px;border-bottom:1px solid var(--border);cursor:pointer;box-shadow:inset 2px 0 0 transparent}
  .gr:hover,.sr:hover{background:var(--surface-2)}
  .gr.on,.sr.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
  .gr>span:not(:first-child),.sr>span:not(:first-child){text-align:right;white-space:nowrap}
  .gn,.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .gn i,.sn i{font-style:normal;color:var(--text-faint)}
  .gr.on .gn{color:var(--accent-text)}
  .gb{font-size:12.5px;color:var(--text-faint)} .gb b{font-weight:500}
  .gbar{height:8px;display:flex;justify-content:flex-start;background:var(--surface-2);border-radius:2px;overflow:hidden}
  .gbar i{display:block;height:100%;border-radius:2px}
  .gv{font-weight:500}
  .sn b{font-weight:500;color:var(--accent-text)}
  .sn i{font-size:12.5px;margin-left:4px}
  .rs{color:var(--text-muted)}
  .tempty{padding:28px 12px;text-align:center;color:var(--text-faint);font-size:12.5px}
  #tcSym{font-size:16px;font-weight:700;color:var(--text)}
  #tcName{color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  #tcPx{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap}
  .chg{font-size:12px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--surface-2);white-space:nowrap}
  #tChartWrap{position:relative;flex:1;min-height:0}
  #tChart{position:absolute;inset:0}
  #tLegend{position:absolute;left:10px;top:6px;right:70px;z-index:3;font-size:12px;line-height:1.55;pointer-events:none;color:var(--text)}
  #tLegend div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tLegend .mut{color:var(--text-faint)}
  #tMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px;pointer-events:none;z-index:2}
  #tStats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--border)}
  #tStats div{padding:9px 12px;border-right:1px solid var(--border);min-width:0}
  #tStats div:last-child{border-right:0}
  #tStats span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tStats b{display:block;font-size:14px;font-weight:600;margin-top:3px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tStats b.pos{color:var(--pos)} #tStats b.neg{color:var(--neg)}
  @media (max-width:1180px){ #trk{grid-template-columns:minmax(220px,270px) minmax(210px,250px) minmax(0,1fr)} #trkBar .hint.keys{display:none} }
  @media (max-width:899px){
    #trk{grid-template-columns:minmax(0,1fr);height:auto}
    #tpG .tl{max-height:266px} #tpS .tl{max-height:266px}
    #tChartWrap{flex:none;height:380px}
    #tStats{grid-template-columns:repeat(3,minmax(0,1fr))} #tStats div:nth-child(3){border-right:0} #tStats div:nth-child(-n+3){border-bottom:1px solid var(--border)}
    #tcFocus{display:none}
    #trkBar .sg{max-width:100%;overflow-x:auto}
    #tpC .tps{flex-wrap:wrap}
  }
</style>
</head>
<body class="min-h-screen text-slate-800">
<div id="ov"><div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div><p class="text-sm text-slate-600" id="ovT">Loading market data…</p></div>

<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
  <div class="max-w-screen-2xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
    <a href="./index.html" class="flex items-center gap-2.5 shrink-0 group">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 text-white flex items-center justify-center font-extrabold text-[13px] shadow-md group-hover:scale-105 transition">SW</span>
      <span class="font-bold text-slate-900 tracking-tight hidden sm:block">STOCKS<span class="text-indigo-600">WORLD</span></span>
    </a>
    <nav></nav>
  </div>
</header>

<main id="pageMain" class="max-w-screen-2xl mx-auto px-4 py-4 space-y-3">
  <!-- title + view tabs -->
  <div id="vbar">
    <h1>Sectors</h1>
    <div id="vtabs" role="tablist" aria-label="View"></div>
    <div id="asof"></div>
  </div>

  <!-- TRACKER: sectors → stocks → chart on one screen -->
  <div id="trkWrap" class="hidden">
    <div id="trkBar">
      <div class="sg" id="tPeriods" role="group" aria-label="Period"></div>
      <div class="sg" id="tLevels" role="group" aria-label="Grouping"></div>
      <button type="button" class="tbtn" id="tBse" title="Also count companies listed only on BSE">Include BSE-only stocks</button>
      <button type="button" class="tbtn" id="tSme" title="Also count SME-platform companies">Include SME stocks</button>
      <span class="tbtn static" id="tFloor" title="Only companies of this size are counted, and only groups with at least this many of them are listed"></span>
      <span class="sg" id="tRew" role="group" aria-label="Rewind to a past date" title="Rewind: see this page as it stood at the close of a past date">
        <span class="lbl">Rewind</span>
        <button type="button" id="tRewPrev" title="One trading day back" aria-label="One trading day back">◀</button>
        <input type="date" id="tRewDate" aria-label="Show the page as of this date" />
        <button type="button" id="tRewNext" title="One trading day forward" aria-label="One trading day forward">▶</button>
        <button type="button" id="tRewNow" title="Back to the latest prices">Latest</button>
      </span>
      <span class="sp"></span>
      <span class="hint keys"><b>↑↓</b> stock · <b>←→</b> group · <b>F</b> focus · <b>Enter</b> open</span>
    </div>
    <div id="trk">
      <section class="tp" id="tpG" aria-label="Groups">
        <div class="tph"><span class="ttl" id="tgTitle"></span><span class="r" id="tgBy"></span></div>
        <div class="tps"><input id="tSearch" type="search" placeholder="Find sector or a stock" autocomplete="off" aria-label="Find sector or a stock" /></div>
        <div class="tch" id="tgHead"></div>
        <div class="tl" id="tgList" role="listbox" aria-label="Groups"></div>
      </section>
      <section class="tp" id="tpS" aria-label="Stocks in the group">
        <div class="tph"><span class="ttl" id="tsTitle"></span><span class="r" id="tsCount"></span></div>
        <div class="tps"><button type="button" class="tbtn" id="tsIdx" title="This group as an index against Nifty 500, with every member's returns and P/E">Index vs Nifty 500</button>
          <button type="button" class="tbtn" id="tsCopy" title="Copy these symbols as a TradingView watchlist (NSE:AAA,NSE:BBB…)" style="margin-left:auto">Copy TV</button></div>
        <div class="tch" id="tsHead"></div>
        <div class="tl" id="tsList" role="listbox" aria-label="Stocks"></div>
      </section>
      <section class="tp" id="tpC" aria-label="Chart">
        <div class="tph"><span id="tcSym"></span><span id="tcName"></span><span id="tcPx"></span><span id="tcChg"></span>
          <span class="r"><a class="tbtn" id="tcOpen" href="#" title="Open the stock's own page">Open ↗</a><button type="button" class="tbtn" id="tcFocus" title="Hide the lists and give the chart the whole width (F)">Focus</button></span></div>
        <div class="tps"><div class="sg" id="tIv" role="group" aria-label="Bar size"></div><div class="sg" id="tRg" role="group" aria-label="Range"></div>
          <button type="button" class="tbtn" id="tLog" title="Logarithmic price scale">Log</button>
          <a class="tbtn" id="tcFull" href="#" style="margin-left:auto" title="Open in the full chart page — drawing tools, indicators, compare">Full chart ↗</a></div>
        <div id="tChartWrap"><div id="tLegend"></div><div id="tMsg"></div><div id="tChart"></div></div>
        <div id="tStats"></div>
      </section>
    </div>
  </div>

  <div id="oldWrap" class="space-y-3 hidden">
  <p class="text-xs text-slate-500" id="subT">Self-made indexes · equal-weighted, rebased to 100 · hover any chart for values</p>

  <!-- breadth summary -->
  <div id="breadth" class="card p-3 text-sm flex flex-wrap items-center gap-x-5 gap-y-1.5"></div>

  <!-- toolbar -->
  <div class="card p-3 space-y-2.5">
    <div class="flex flex-wrap items-center gap-2">
      <div class="relative flex-1 min-w-[180px] max-w-xs">
        <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"><svg class="sw-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input id="search" placeholder="Search indexes…" class="w-full border border-slate-300 rounded-lg pl-8 pr-2.5 py-1.5 text-sm bg-white" />
      </div>
      <!-- five rungs don't fit one phone line: wrap instead of hiding NSE Indices off the right edge -->
      <div class="flex flex-wrap items-center gap-1 text-xs">
        <span class="text-slate-400 font-semibold mr-0.5">Level</span>
        <div id="levels" class="flex flex-wrap items-center gap-1"></div>
      </div>
      <div class="flex items-center gap-1 text-xs">
        <span class="text-slate-400 font-semibold mr-0.5">Show</span>
        <div id="movers" class="flex items-center gap-1"></div>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2 text-xs">
      <div class="flex items-center gap-1">
        <span class="text-slate-400 font-semibold mr-0.5">Period</span>
        <div id="periods" class="flex items-center gap-1"></div>
      </div>
      <span class="text-slate-200">|</span>
      <div class="flex items-center gap-1">
        <span class="text-slate-400 font-semibold mr-0.5">Weight</span>
        <div id="weights" class="flex items-center gap-1"></div>
      </div>
      <span class="text-slate-200">|</span>
      <label class="flex items-center gap-1 text-slate-500">Sort
        <select id="sort" class="border border-slate-300 rounded-lg px-1.5 py-1 text-xs bg-white">
          <option value="ret">Return ▼</option>
          <option value="retA">Return ▲</option>
          <option value="name">Name A–Z</option>
          <option value="n">Most stocks</option>
          <option value="mcap">Market cap</option>
          <option value="pe">Median P/E ▲</option>
          <option value="peD">Median P/E ▼</option>
        </select>
      </label>
      <button id="csv" class="ml-auto px-2.5 py-1 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 font-semibold"><svg class="sw-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> CSV</button>
    </div>
  </div>

  <!-- deep-link miss. Text colour is a token, not amber-700: on the dark theme a #b45309 on
       #111930 is unreadable — the amber border carries the "warning" signal on every theme. -->
  <div id="dlNote" class="hidden rounded-xl border border-amber-400 px-3 py-2 text-xs" style="background:var(--surface-2,#fffbeb);color:var(--text,#78350f)"></div>
  <div id="count" class="text-xs text-slate-400 px-1"></div>
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
  <div id="heat" class="hidden"></div>
  </div>
</main>

<!-- detail modal -->
<div id="modal"><div id="modalCard"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const DAY=86400;
let START_TS=820454400, END_OFF=0, EARLIEST=0, FULL=false;
let META={}, SERIES={}, CLS={}, IDXH={}, NIFTY_ARR=[];
const fmtPct=n=>(n==null?'—':(n>=0?'+':'')+n.toFixed(2)+'%');
const clsPN=n=>n==null?'':(n>=0?'pos':'neg');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtCr(cr){ if(cr==null||!isFinite(cr))return'—'; if(cr>=1e5)return'₹'+(cr/1e5).toFixed(2)+'L Cr'; if(cr>=1e3)return'₹'+(cr/1e3).toFixed(2)+'K Cr'; return'₹'+Math.round(cr).toLocaleString('en-IN')+' Cr'; }

/* ---- date / price helpers ---- */
function isoOff(off){ return new Date((START_TS+off*DAY)*1000).toISOString().slice(0,10); }
function dayOff(d){ return Math.floor((Date.parse(d+'T00:00:00Z')/1000-START_TS)/DAY); }
function idxLE(arr,off){ let lo=0,hi=arr.length-1,ans=-1; while(lo<=hi){const m=(lo+hi)>>1; if(arr[m]<=off){ans=m;lo=m+1;}else hi=m-1;} return ans; }
function priceAt(tkr,off){ const s=SERIES[tkr]; if(!s)return null; const i=idxLE(s.d,off); return i<0?null:s.p[i]/100; }
function niftyAt(off){ if(!NIFTY_ARR.length)return null; const i=idxLE(NIFTY_ARR.map(x=>x[0]),off); return i<0?NIFTY_ARR[0][1]:NIFTY_ARR[i][1]; }
// precomputed offset array for nifty binary search
let NIFTY_OFFS=[];
function niftyValAt(off){ if(!NIFTY_OFFS.length)return null; const i=idxLE(NIFTY_OFFS,off); return i<0?NIFTY_ARR[0][1]:NIFTY_ARR[i][1]; }

/* ---- config ---- */
/* NSE files every company under four nested labels: macro sector -> sector -> industry ->
   basic industry. `sub` (the 22-bucket `sector` field) was the one rung this page skipped;
   stock.html's breadcrumb links into all four, so every rung needs a level to land on. */
const LEVELS=[
  {key:'sector',   label:'Sectors',        field:'macro'},
  {key:'sub',      label:'Sub-Sectors',    field:'sector'},
  {key:'industry', label:'Industries',     field:'igroup'},
  {key:'basic',    label:'Sub-Industries', field:'industry'},
  {key:'nse',      label:'Indices',        field:null},   // NSE indices + BSE SME IPO (§195) + Nifty SME Emerge (§210); key kept for saved links
];
const PERIODS=[['Today',1],['1W',7],['1M',30],['3M',91],['6M',182],['YTD',-1],['1Y',365],['3Y',1095]];
const ST={ level:'industry', mover:'all', period:'Today', weight:'equal', view:'tracker', sort:'ret', q:'' };
let WATCH=new Set(JSON.parse(localStorage.getItem('sw_sec_watch')||'[]'));
function saveWatch(){ localStorage.setItem('sw_sec_watch',JSON.stringify([...WATCH])); }

/* ---- grouping ---- */
let GROUPS={};           // name -> [tickers]
function buildGroups(){
  const lv=LEVELS.find(l=>l.key===ST.level); GROUPS={};
  if(lv.key==='nse'){
    const today=isoOff(END_OFF);
    for(const name in IDXH){
      const snaps=IDXH[name]; let best=null;
      for(const s of snaps){ if(s.effectiveDate<=today&&(!best||s.effectiveDate>best.effectiveDate))best=s; }
      const syms=(best?best.symbols:[]).map(s=>SERIES[s]?s:(SERIES[s+'.NS']?s+'.NS':null)).filter(Boolean);
      if(syms.length)GROUPS[name]=syms;
    }
    return;
  }
  for(const tkr in META){
    if(!SERIES[tkr])continue;
    const c=CLS[tkr]; if(!c)continue;
    let name=c[lv.field]; if(!name)continue;
    name=name.replace(/\s+/g,' ').trim();   // BSE labels carry stray double-spaces
    (GROUPS[name]||(GROUPS[name]=[])).push(tkr);
  }
}

/* ---- period -> start offset ---- */
function periodStart(){
  const p=PERIODS.find(x=>x[0]===ST.period);
  if(p[1]===-1){ return dayOff(isoOff(END_OFF).slice(0,4)+'-01-01'); } // YTD
  return END_OFF-p[1];
}

/* ---- stats for a group over the window ---- */
function groupStats(members,startOff,endOff){
  let wsum=0,wret=0,up=0,down=0,n=0,mcapSum=0; const mem=[],peV=[];
  for(const t of members){
    const p1=priceAt(t,endOff), p0=priceAt(t,startOff);
    if(p0==null||p1==null||p0<=0)continue;
    const r=(p1/p0-1)*100;
    const mc=(META[t]&&META[t].mcap)||0;
    const w=ST.weight==='mcap'?mc:1;
    if(ST.weight==='mcap'&&w<=0)continue;
    wsum+=w; wret+=w*r; if(r>=0)up++;else down++; n++; mcapSum+=mc;
    const pe=peOf(t); if(pe!=null&&pe>0)peV.push(pe);
    mem.push({t,r,p1,mc,pe,name:(META[t]&&META[t].name)||t});
  }
  // MEDIAN, not mean: a cross-section of valuations has a long right tail (one 400x name would
  // drag a mean into nonsense), and the median is the number a screener actually quotes.
  // peN travels with it — a median over 54 of 113 members is a different claim from one over all.
  return { ret:wsum>0?wret/wsum:null, up,down,n,mcapSum, mem, peMed:medianOf(peV), peN:peV.length };
}

/* ---- index series (sampled, rebased to 100) + benchmark ---- */
function indexSeries(members,startOff,endOff,nPts){
  nPts=nPts||58; const pts=[],bench=[];
  const n0Bench=niftyValAt(startOff);
  // base prices at startOff for members that exist then
  const bases=[]; for(const t of members){ const p0=priceAt(t,startOff); if(p0!=null&&p0>0)bases.push([t,p0,(META[t]&&META[t].mcap)||0]); }
  for(let i=0;i<nPts;i++){
    const off=Math.round(startOff+(endOff-startOff)*i/(nPts-1));
    let wsum=0,wv=0;
    for(const [t,p0,mc] of bases){ const p=priceAt(t,off); if(p==null)continue; const w=ST.weight==='mcap'?mc:1; if(w<=0)continue; wsum+=w; wv+=w*(p/p0); }
    pts.push([off, wsum>0?100*wv/wsum:null]);
    const nb=niftyValAt(off); bench.push([off, (nb!=null&&n0Bench)?100*nb/n0Bench:null]);
  }
  return {idx:pts,bench};
}

/* ---- sparkline svg (index line + dashed benchmark) ---- */
function sparkSVG(series,id){
  const W=300,H=70,P=3;
  const all=series.idx.map(p=>p[1]).filter(v=>v!=null).concat(series.bench.map(p=>p[1]).filter(v=>v!=null));
  if(all.length<2)return '<div class="text-slate-300 text-xs h-[70px] flex items-center justify-center">no data</div>';
  let mn=Math.min(...all),mx=Math.max(...all); if(mn===mx){mn*=.99;mx*=1.01;}
  const xs=series.idx.map(p=>p[0]); const x0=xs[0],x1=xs[xs.length-1];
  const X=o=>P+(o-x0)/((x1-x0)||1)*(W-2*P);
  const Y=v=>P+(1-(v-mn)/((mx-mn)||1))*(H-2*P);
  const path=arr=>{ let d='',started=false; for(const [o,v] of arr){ if(v==null){started=false;continue;} d+=(started?'L':'M')+X(o).toFixed(1)+' '+Y(v).toFixed(1)+' '; started=true; } return d.trim(); };
  const last=series.idx.filter(p=>p[1]!=null); const first=last[0], end=last[last.length-1];
  const up=end&&first&&end[1]>=first[1];
  const col=up?'#16a34a':'#dc2626', fill=up?'rgba(22,163,74,.12)':'rgba(220,38,38,.12)';
  const il=path(series.idx);
  const area=il?(il+` L ${X(x1).toFixed(1)} ${(H-P).toFixed(1)} L ${X(x0).toFixed(1)} ${(H-P).toFixed(1)} Z`):'';
  const bl=path(series.bench);
  return `<svg class="spark" data-id="${id}" viewBox="0 0 ${W} ${H}" width="100%" height="70" preserveAspectRatio="none" style="display:block">
    <path d="${area}" fill="${fill}" stroke="none"/>
    <path d="${bl}" fill="none" stroke="var(--text-faint,#94a3b8)" stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>
    <path d="${il}" fill="none" stroke="${col}" stroke-width="1.8"/>
    <line class="sk-cross" x1="0" y1="${P}" x2="0" y2="${H-P}" stroke="var(--text-faint,#94a3b8)" stroke-width="1" stroke-dasharray="2 2" style="display:none"/>
    <circle class="sk-dot" r="3" fill="${col}" style="display:none"/>
  </svg>`;
}

/* ---- main compute + render ---- */
let ROWS=[];     // current group rows
function compute(){
  buildGroups();
  const startOff=periodStart(), endOff=END_OFF;
  ROWS=[];
  for(const name in GROUPS){
    const members=GROUPS[name];
    const st=groupStats(members,startOff,endOff);
    if(st.n===0)continue;
    ROWS.push({name,members,...st,startOff,endOff});
  }
}
function filterSort(){
  let r=ROWS.slice();
  if(ST.q){ const q=ST.q.toLowerCase(); r=r.filter(x=>x.name.toLowerCase().includes(q)); }
  if(ST.mover==='watch') r=r.filter(x=>WATCH.has(x.name));
  const s=ST.sort;
  if(s==='name')r.sort((a,b)=>a.name.localeCompare(b.name));
  else if(s==='n')r.sort((a,b)=>b.n-a.n);
  else if(s==='mcap')r.sort((a,b)=>b.mcapSum-a.mcapSum);
  // an index with no priced member sinks either way — "no P/E on file" is not "the cheapest"
  else if(s==='pe'||s==='peD'){ const d=s==='pe'?1:-1;
    r.sort((a,b)=>{ if(a.peMed==null&&b.peMed==null)return 0; if(a.peMed==null)return 1; if(b.peMed==null)return -1;
      return (a.peMed-b.peMed)*d; }); }
  else if(s==='retA')r.sort((a,b)=>(a.ret==null?1e9:a.ret)-(b.ret==null?1e9:b.ret));
  else r.sort((a,b)=>(b.ret==null?-1e9:b.ret)-(a.ret==null?-1e9:a.ret));
  if(ST.mover==='top')r=r.slice(0,20);
  else if(ST.mover==='bottom'){ r=ROWS.slice().filter(x=>x.ret!=null).sort((a,b)=>a.ret-b.ret).slice(0,20); if(ST.q){const q=ST.q.toLowerCase();r=r.filter(x=>x.name.toLowerCase().includes(q));} }
  return r;
}
function renderBreadth(){
  const valid=ROWS.filter(x=>x.ret!=null);
  const up=valid.filter(x=>x.ret>=0).length, dn=valid.length-up;
  const sorted=valid.slice().sort((a,b)=>b.ret-a.ret);
  const lead=sorted[0], lag=sorted[sorted.length-1];
  const lvLabel=LEVELS.find(l=>l.key===ST.level).label.toLowerCase();
  $('breadth').innerHTML=
    `<span class="font-semibold text-slate-700">${ST.period} market breadth</span>`+
    `<span><b class="pos">${up}</b> advancing · <b class="neg">${dn}</b> declining <span class="text-slate-400">of ${valid.length} ${lvLabel}</span></span>`+
    (lead?`<span>Leading: <b>${esc(lead.name)}</b> <span class="pos font-semibold">${fmtPct(lead.ret)}</span></span>`:'')+
    (lag?`<span>Lagging: <b>${esc(lag.name)}</b> <span class="neg font-semibold">${fmtPct(lag.ret)}</span></span>`:'');
}
function card(row){
  const ser=indexSeries(row.members,row.startOff,row.endOff);
  const id='g'+Math.abs(hashStr(row.name));
  SPARK[id]=ser;
  const star=WATCH.has(row.name)?'★':'☆';
  const total=row.up+row.down;
  const upPct=total?Math.round(row.up/total*100):0;
  return `<div class="card click p-3.5" data-name="${esc(row.name)}">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <div class="font-bold text-slate-900 text-[15px] leading-tight truncate" title="${esc(row.name)}">${esc(row.name)}</div>
        <div class="text-[11px] text-slate-400 mt-0.5"${row.peMed!=null?` title="Median P/E (TTM) of the ${row.peN} of ${row.n} members with four contiguous quarters of profit on file"`:''}>${row.n} stock${row.n!==1?'s':''} · ${fmtCr(row.mcapSum)}${row.peMed!=null?` · P/E ${row.peMed.toFixed(1)} <span class="text-slate-300">(${row.peN})</span>`:''}</div>
      </div>
      <div class="text-right shrink-0">
        <div class="text-lg font-extrabold ${clsPN(row.ret)}">${fmtPct(row.ret)}</div>
        <button class="star text-base leading-none ${WATCH.has(row.name)?'text-amber-400':'text-slate-300 hover:text-amber-400'}" data-name="${esc(row.name)}" title="Watchlist">${star}</button>
      </div>
    </div>
    <div class="relative mt-2" style="height:70px">${sparkSVG(ser,id)}<div class="spark-tip" id="tip_${id}"></div></div>
    <div class="mt-2 flex items-center gap-2">
      <div class="flex-1 h-1.5 rounded-full bg-slate-200 overflow-hidden flex">
        <div style="width:${upPct}%" class="bg-green-500"></div><div style="width:${100-upPct}%" class="bg-red-400"></div>
      </div>
      <span class="text-[10px] text-slate-400 whitespace-nowrap"><b class="pos">${row.up}</b>↑ <b class="neg">${row.down}</b>↓</span>
    </div>
  </div>`;
}
let SPARK={};
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return h; }
function renderGrid(){
  const r=filterSort();
  $('count').textContent=`${r.length} index${r.length!==1?'es':''} · ${ST.weight==='mcap'?'market-cap':'equal'}-weighted · benchmark = Nifty 500 (dashed)`;
  SPARK={};
  if(ST.view==='heat'){ $('grid').classList.add('hidden'); $('heat').classList.remove('hidden'); renderHeat(r); return; }
  $('heat').classList.add('hidden'); $('grid').classList.remove('hidden');
  $('grid').innerHTML=r.map(card).join('')||`<div class="col-span-full text-center text-slate-400 py-10 text-sm">No indexes match.</div>`;
  wireCards(); wireSparks();
}
/* ---- tile text colour, MEASURED against the tile it sits on -----------------------------------
 * A tile is rgba(green|red, a) composited over --surface, and the text was hard-coded #fff. On the
 * light and soft themes that measures 1.18:1 at low alpha — the text-shadow was disguising an
 * unreadable tile, and adding a 10px P/E line made it plain. So composite the colour and take
 * whichever of white / ink contrasts more: dark theme keeps white on every tile (4.65-16.9:1),
 * light and soft flip to ink (4.96-15.8:1). Backgrounds are untouched. */
function surfaceRGB(){
  const v=(getComputedStyle(document.documentElement).getPropertyValue('--surface')||'').trim();
  const m=v.match(/^rgba?\(([^)]+)\)$/);
  if(m){ const p=m[1].split(',').map(x=>parseFloat(x)); return [p[0]||0,p[1]||0,p[2]||0]; }
  let h=v.replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(h.length<6) return [255,255,255];                       // token missing → assume a light card
  return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)||0);
}
function relLum(c){ const f=v=>{v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2]); }
function contrast(a,b){ const l1=relLum(a),l2=relLum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); }
function tileInk(rgb,alpha,srf){
  const comp=rgb.map((c,i)=>Math.round(alpha*c+(1-alpha)*srf[i]));
  return contrast(comp,[255,255,255])>=contrast(comp,[11,18,32])
    ? {fg:'#fff',   sh:'text-shadow:0 1px 2px rgba(0,0,0,.35)'}
    : {fg:'#0b1220',sh:''};                                  // a dark shadow under dark text is mud
}
function renderHeat(r){
  r=r.filter(x=>x.ret!=null);
  const mx=Math.max(1,...r.map(x=>Math.abs(x.ret)));
  const srf=surfaceRGB();
  const tiles=r.map(x=>{
    const t=Math.min(1,Math.abs(x.ret)/mx);
    const alpha=.15+t*.65, rgb=x.ret>=0?[22,163,74]:[220,38,38];
    const bg=`rgba(${rgb},${alpha})`;
    const ink=tileInk(rgb,alpha,srf);
    const fs=Math.max(10,Math.min(15,9+Math.sqrt(x.mcapSum)/120));
    // Third line: the same median groupStats() puts on the card, with the same member count beside
    // it — a tile is the densest surface here, but it is not the one place the coverage gets
    // dropped. Colour still encodes RETURN alone; P/E is read, never shaded.
    const pe=x.peMed==null?'' :
      `<div style="font-size:10px;font-weight:600;opacity:.92;${ink.sh}">P/E ${x.peMed.toFixed(1)} <span style="opacity:.75">(${x.peN})</span></div>`;
    // Names truncate on a 130px tile, so the tooltip carries the whole row in words.
    const tip=`${x.name} — ${x.n} stock${x.n!==1?'s':''}, ${fmtCr(x.mcapSum)}, ${fmtPct(x.ret)} over ${ST.period}`+
      (x.peMed==null?', no median P/E (no member has four contiguous quarters of profit on file)'
                    :`, median P/E ${x.peMed.toFixed(1)} across ${x.peN} of ${x.n} members`);
    return `<div class="hm-tile" data-name="${esc(x.name)}" title="${esc(tip)}" style="background:${bg};color:${ink.fg};min-height:64px">
      <div style="font-size:${fs}px;font-weight:700;line-height:1.05;${ink.sh}">${esc(x.name)}</div>
      <div style="font-size:12px;font-weight:800;${ink.sh}">${fmtPct(x.ret)}</div>
      ${pe}
    </div>`;
  }).join('');
  $('heat').innerHTML=`<div class="grid gap-1.5" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${tiles}</div>`;
  $('heat').querySelectorAll('.hm-tile').forEach(t=>t.onclick=()=>openDetail(t.dataset.name));
}
function wireCards(){
  $('grid').querySelectorAll('.card.click').forEach(c=>{
    c.onclick=e=>{ if(e.target.closest('.star'))return; openDetail(c.dataset.name); };
  });
  $('grid').querySelectorAll('.star').forEach(b=>{
    b.onclick=e=>{ e.stopPropagation(); const n=b.dataset.name; if(WATCH.has(n))WATCH.delete(n);else WATCH.add(n); saveWatch(); renderGrid(); };
  });
}
function wireSparks(){
  $('grid').querySelectorAll('svg.spark').forEach(svg=>{
    const id=svg.dataset.id, ser=SPARK[id]; if(!ser)return;
    const tip=$('tip_'+id), cross=svg.querySelector('.sk-cross'), dot=svg.querySelector('.sk-dot');
    const W=300,H=70,P=3;
    const xs=ser.idx.map(p=>p[0]); const x0=xs[0],x1=xs[xs.length-1];
    const all=ser.idx.map(p=>p[1]).filter(v=>v!=null).concat(ser.bench.map(p=>p[1]).filter(v=>v!=null));
    let mn=Math.min(...all),mx=Math.max(...all); if(mn===mx){mn*=.99;mx*=1.01;}
    const X=o=>P+(o-x0)/((x1-x0)||1)*(W-2*P), Y=v=>P+(1-(v-mn)/((mx-mn)||1))*(H-2*P);
    svg.onmousemove=e=>{ const rc=svg.getBoundingClientRect(); const px=(e.clientX-rc.left)/rc.width*W;
      let bi=0,bd=1e9; for(let i=0;i<ser.idx.length;i++){ const d=Math.abs(X(ser.idx[i][0])-px); if(d<bd){bd=d;bi=i;} }
      const iv=ser.idx[bi][1], bv=ser.bench[bi][1]; if(iv==null)return;
      const cx=X(ser.idx[bi][0]);
      cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.style.display='';
      dot.setAttribute('cx',cx);dot.setAttribute('cy',Y(iv));dot.style.display='';
      tip.style.display='block';
      tip.innerHTML=`<b>${isoOff(ser.idx[bi][0])}</b><br>Index <b class="${clsPN(iv-100)}">${fmtPct(iv-100)}</b>`+(bv!=null?`<br><span class="text-slate-400">Nifty500 ${fmtPct(bv-100)}</span>`:'');
      const wrap=svg.parentElement.clientWidth, tx=cx/W*wrap; tip.style.left=Math.min(Math.max(tx+8,2),wrap-92)+'px'; tip.style.top='2px';
    };
    svg.onmouseleave=()=>{ cross.style.display='none';dot.style.display='none';tip.style.display='none'; };
  });
}

/* ---- market-wide P/E, for the peer-comparison table ------------------------------------------
 * Lives beside the per-stock slices on the sf-data Pages repo (same origin as the site, so a plain
 * fetch), written by build_stock_slices.py off the SAME point-in-time owners-PAT TTM that feeds the
 * stock page's peer table — one P/E rule, not two. ~4.5k symbols, fetched once when the first index
 * detail opens, never on the grid. Only the ratio comes from there: market cap and returns are
 * already on this page, and one number with two sources is how two pages start disagreeing. */
const SFD_BASE=(location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.protocol==='file:')
  ? './' : 'https://dhruvan246.github.io/sf-data/';
let PE=null, PE_END='', PE_FAIL=false, pePromise=null;
function ensurePE(){
  if(PE||pePromise)return pePromise||Promise.resolve();
  pePromise=fetch(SFD_BASE+'pe_ttm.json').then(r=>{ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
    .then(j=>{ PE=(j&&j.pe)||{}; PE_END=(j&&j.end)||''; })
    .catch(e=>{ PE={}; PE_FAIL=true; console.warn('P/E feed unavailable: '+(e&&e.message||e)); });
  return pePromise;
}
const symOf=t=>(META[t]&&META[t].symbol)||t;
function peOf(t){ return (PE&&PE[symOf(t)]!=null)?PE[symOf(t)]:null; }
function medianOf(a){ if(!a.length)return null; const v=a.slice().sort((x,y)=>x-y), h=v.length>>1;
  return v.length%2?v[h]:(v[h-1]+v[h])/2; }

/* ---- deep links (stock page -> one index's chart) ----------------------------------------------
 * ?level=<sector|sub|industry|basic|nse>&name=<index name> opens that index's detail on load, and
 * every open rewrites the URL to match, so any chart here is a shareable link.
 * The level is a HINT, not a key: several names sit at more than one rung ("Power" is both a
 * sub-sector and an industry; "Diversified" is all four), so a link carrying the wrong rung falls
 * back to searching every level instead of dead-ending. */
function normName(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }   // same shape buildGroups() keys on
function syncURL(name){
  try{
    const u=new URL(location.href);
    if(name){ u.searchParams.set('level',ST.level); u.searchParams.set('name',name); }
    else{ u.searchParams.delete('level'); u.searchParams.delete('name'); }
    history.replaceState(null,'',u.pathname+u.search+u.hash);
  }catch(e){}
}
function resolveDeep(name){
  const want=name.toLowerCase(), save=ST.level;
  const order=[ST.level].concat(LEVELS.map(l=>l.key).filter(k=>k!==ST.level));
  for(const k of order){
    ST.level=k; buildGroups();
    const hit=Object.keys(GROUPS).find(g=>g.toLowerCase()===want);
    if(hit){ ST.level=save; return {level:k,name:hit}; }
  }
  ST.level=save; buildGroups();     // leave GROUPS matching ROWS again
  return null;
}
async function openDeepLink(raw){
  const name=normName(raw); if(!name)return;
  const hit=resolveDeep(name);
  if(!hit){
    $('dlNote').textContent='\u201c'+name+'\u201d is not a tracked index here \u2014 no stock filed under it has price history on this page.';
    $('dlNote').classList.remove('hidden');
    return;
  }
  ST.level=hit.level; recompute();
  await openDetail(hit.name);
}

/* ---- detail modal ---- */
async function openDetail(name){
  const lv=LEVELS.find(l=>l.key===ST.level);
  const members=GROUPS[name]; if(!members)return;
  syncURL(name);

/* ---- peer-comparison table (the index's members, sortable on every column) --------------------

let PEER={mem:[],pers:[],per:'',sort:{k:'r',dir:-1}};
function peerCols(){

function peerVal(m,k){
  if(k==='sym') return String(symOf(m.t)).toLowerCase();

  const rows=PEER.mem.slice().sort((a,b)=>{

function drawBigChart(ser){

  const xs=ser.idx.map(p=>p[0]); const x0=xs[0],x1=xs[xs.length-1];
  const X=o=>PADL+(o-x0)/((x1-x0)||1)*(W-PADL-PADR), Y=v=>PADT+(1-(v-mn)/((mx-mn)||1))*(H-PADT-PADB);

  const il=path(ser.idx),bl=path(ser.bench);

  let grid='';for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,y=Y(v).toFixed(1);grid+=`<line x1="${PADL}" y1="${y}" x2="${W-PADR}" y2="${y}" stroke="var(--border,#e5e7eb)"/><text x="${PADL-5}" y="${+y+3}" text-anchor="end" font-size="10" fill="var(--text-faint,#94a3b8)">${v.toFixed(0)}</text>`;}
  let xlab='';[0,Math.floor(ser.idx.length/2),ser.idx.length-1].forEach(i=>{xlab+=`<text x="${X(ser.idx[i][0]).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--text-faint,#94a3b8)">${isoOff(ser.idx[i][0]).slice(0,7)}</text>`;});
  wrap.innerHTML=`<svg id="bigsvg" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">
    ${grid}<path d="${bl}" fill="none" stroke="var(--text-faint,#94a3b8)" stroke-width="1.4" stroke-dasharray="4 3" opacity=".9"/>

  svg.onmousemove=e=>{const rc=svg.getBoundingClientRect();const px=(e.clientX-rc.left)/rc.width*W;let bi=0,bd=1e9;for(let i=0;i<ser.idx.length;i++){const d=Math.abs(X(ser.idx[i][0])-px);if(d<bd){bd=d;bi=i;}}const iv=ser.idx[bi][1],bv=ser.bench[bi][1];if(iv==null)return;const cx=X(ser.idx[bi][0]);cr.setAttribute('x1',cx);cr.setAttribute('x2',cx);cr.style.display='';dot.setAttribute('cx',cx);dot.setAttribute('cy',Y(iv));dot.style.display='';tip.style.display='block';tip.innerHTML=`<b>${isoOff(ser.idx[bi][0])}</b><br>Index <b class="${clsPN(iv-100)}">${fmtPct(iv-100)}</b>`+(bv!=null?`<br>Nifty500 <span class="${clsPN(bv-100)}">${fmtPct(bv-100)}</span>`:'');const tx=cx/W*wrap.clientWidth;tip.style.left=Math.min(Math.max(tx+8,2),wrap.clientWidth-120)+'px';tip.style.top='4px';};

/* ---- lazy full history ---- */
// stock_data.bin (full history) is committed on a much slower cadence than dash_slim.bin
// (daily) and has been observed to lag by weeks when that job stalls. Merge instead of
// replacing SERIES, so dash_slim's fresher recent bars always win over stale/older ones
// for the same date instead of silently regressing "current" prices.
function mergeSeries(base,overlay){
  const merged={};
  for(const t in base)merged[t]=base[t];
  for(const t in overlay){
    const ov=overlay[t], ba=merged[t];
    if(!ba){ merged[t]=ov; continue; }
    const byOff=new Map();
    for(let i=0;i<ba.d.length;i++)byOff.set(ba.d[i],ba.p[i]);
    for(let i=0;i<ov.d.length;i++)byOff.set(ov.d[i],ov.p[i]);   // overlay (fresher) wins on overlap
    const offs=[...byOff.keys()].sort((a,b)=>a-b);
    merged[t]={ d:offs, p:offs.map(o=>byOff.get(o)) };
  }
  return merged;
}
let fullPromise=null;
function ensureFull(){
  if(FULL)return Promise.resolve();
  if(fullPromise)return fullPromise;
  fullPromise=(async()=>{
    const note=document.createElement('div'); note.id='loadnote'; note.className='fixed bottom-4 right-4 bg-slate-900 text-white text-xs px-3 py-2 rounded-lg shadow-lg z-50'; note.textContent='Loading full history…'; document.body.appendChild(note);
    const buf=await(await fetch('./stock_data.bin')).arrayBuffer();
    const txt=await new Response(new Blob([new Uint8Array(buf)]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const D=JSON.parse(txt);
    SERIES=mergeSeries(D.series,SERIES); EARLIEST=0; FULL=true;
    note.remove();
  })();
  return fullPromise;
}

/* ================= TRACKER — sector list → its stocks → the stock's chart, on one screen =================
 * Reads the same GROUPS / groupStats() the cards use, so a sector's return here is the card's return
 * (given the same members). What differs is the universe: the tracker drops names under ₹500 Cr and
 * groups left with fewer than 5 stocks, and hides SME / BSE-only lines unless asked — a 1W sector
 * move made of three illiquid microcaps is noise on a screen meant for picking a stock to open.
 * NSE/SME index groups keep their official members untouched.
 * Candles come from the per-stock slices the chart page uses (sf-data/stk + sf-data/ohlc). */
const MIN_MC=500, MIN_N=5;
const T={g:null,s:null,q:'',gsort:{k:'ret',dir:-1},ssort:{k:'r',dir:-1},bse:false,sme:false,rows:[],vis:[],stocks:[],
  focus:false,iv:'D',range:'6M',log:false,data:null,bars:[],ema:[],tIdx:new Map(),tok:0};
let RS={};
function saveUI(){ try{ localStorage.setItem('sw_sec_ui',JSON.stringify({view:ST.view,period:ST.period,level:ST.level,bse:T.bse,sme:T.sme,iv:T.iv,range:T.range,log:T.log})); }catch(e){} }
function loadUI(){ try{ const u=JSON.parse(localStorage.getItem('sw_sec_ui')||'null'); if(!u)return;
  if(['tracker','cards','heat'].includes(u.view))ST.view=u.view;
  // the period is deliberately not restored: the page always opens on Today (user, 2026-11-25)
  if(LEVELS.some(l=>l.key===u.level))ST.level=u.level;
  T.bse=!!u.bse; T.sme=!!u.sme; T.log=!!u.log;
  if(['D','W','M'].includes(u.iv))T.iv=u.iv; if(['3M','6M','1Y','3Y','Max'].includes(u.range))T.range=u.range; }catch(e){} }

function retOver(t,days){ const p1=priceAt(t,END_OFF), p0=priceAt(t,END_OFF-days); return (p0==null||p1==null||p0<=0)?null:(p1/p0-1)*100; }
/* RS rating: where a stock's recent return ranks among every stock of ₹500 Cr and up, 1 (weakest) to 99.
   Blend = 20% 1-month + 40% 3-month + 40% 6-month return. A stock without 6 months of prices has no rating. */
function buildRS(){
  const sc=[];
  for(const t in META){ if(!SERIES[t]||((META[t].mcap||0)<MIN_MC))continue;
    const a=retOver(t,30),b=retOver(t,91),c=retOver(t,182); if(a==null||b==null||c==null)continue;
    sc.push([t,.2*a+.4*b+.4*c]); }
  sc.sort((x,y)=>x[1]-y[1]); RS={};
  sc.forEach(([t],i)=>{ RS[t]=Math.max(1,Math.min(99,Math.round((i+1)/sc.length*99))); });
}
function trkOK(t){ const m=META[t]||{}; if((m.mcap||0)<MIN_MC)return false; if(!T.sme&&m.sme)return false; if(!T.bse&&/\.BO$/.test(t))return false; return true; }
function trkCompute(){
  const so=periodStart(), isIdx=ST.level==='nse'; T.rows=[];
  for(const name in GROUPS){
    const mem=isIdx?GROUPS[name]:GROUPS[name].filter(trkOK);
    if(!isIdx&&mem.length<MIN_N)continue;
    const st=groupStats(mem,so,END_OFF);
    if(!st.n||(!isIdx&&st.n<MIN_N))continue;
    T.rows.push({name,...st});
  }
}
const stockHit=(m,q)=>String(symOf(m.t)).toLowerCase().startsWith(q)||m.name.toLowerCase().includes(q);
function trkGroups(){
  const q=T.q.toLowerCase(); let r=T.rows;
  if(q) r=r.filter(x=>x.name.toLowerCase().includes(q)||(q.length>=2&&x.mem.some(m=>stockHit(m,q))));
  const {k,dir}=T.gsort;
  return r.slice().sort((a,b)=>k==='name'?a.name.localeCompare(b.name)*dir:((a.ret==null?-1e9:a.ret)-(b.ret==null?-1e9:b.ret))*dir);
}
function trkStocks(){
  const row=T.rows.find(x=>x.name===T.g); if(!row)return [];
  const {k,dir}=T.ssort, val=m=>k==='sym'?String(symOf(m.t)):k==='rs'?RS[m.t]:m.r;
  return row.mem.slice().sort((a,b)=>{ const va=val(a),vb=val(b);
    if(va==null&&vb==null)return 0; if(va==null)return 1; if(vb==null)return -1; return (va<vb?-1:va>vb?1:0)*dir; });
}

function loadBars(sym){
  if(BARS[sym])return BARS[sym];
  const slug=String(sym).replace(/[^A-Za-z0-9._-]/g,'_');
  const p=(async()=>{
    const [S,J]=await Promise.all([
      fetch(SF_STK+slug+'.json').then(r=>{ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); }),
      fetch(SF_OHLC+slug+'.json').then(r=>r.ok?r.json():null).catch(()=>null) ]);
    if(!S||!Array.isArray(S.p)||!S.p.length)throw new Error('empty');
    const n=S.p.length, dd=S.dd||[], vq=Array.isArray(S.v)?S.v:[], v0=n-vq.length;
    // open/high/low only when that file lines up bar-for-bar with the closes — otherwise a line, never guessed candles
    const ok=!!(J&&J.n===n&&Array.isArray(J.o)&&J.o.length===n&&J.h.length===n&&J.l.length===n);
    const bars=[]; let off=S.d0, prev=-Infinity;
    for(let i=0;i<n;i++){ if(i>0)off+=dd[i-1]; if(!(off>prev))continue; prev=off; const c=S.p[i]/100; if(!(c>0))continue;
      const b={ts:S.ts+off*DAY,c}; if(ok){ b.o=c+J.o[i]/100; b.h=c+J.h[i]/100; b.l=c+J.l[i]/100; }
      if(v0>=0&&i>=v0&&vq[i-v0]!=null)b.v=vq[i-v0]; bars.push(b); }
    if(!bars.length)throw new Error('empty');
    return {bars,ohlc:ok};
  })();
  BARS[sym]=p; p.catch(()=>{ delete BARS[sym]; });
  return p;
}
function aggBars(bars,iv){
  if(iv==='D')return bars;

  for(const b of bars){
    const d=new Date(b.ts*1000), k=iv==='M'?d.getUTCFullYear()*12+d.getUTCMonth():Math.floor((b.ts/DAY+3)/7);   // weeks run Monday–Sunday
    if(k!==key){ cur={ts:b.ts,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v}; out.push(cur); key=k; }
    else{ cur.ts=b.ts; cur.c=b.c; if(b.h!=null){ cur.h=Math.max(cur.h,b.h); cur.l=Math.min(cur.l,b.l); } if(b.v!=null)cur.v=(cur.v||0)+b.v; }

const WORKER='https://stocksworld-quotes.dhruvan2510.workers.dev', BSE_LIVE_URL='https://raw.githubusercontent.com/dhruvan246/stocks-dashboard/live-bse/bse_live.json';
const MON={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
let LIVE=null, EOD_END=0, NOW_OFF=0, REW=null, liveBusy=false; const LVSET=new Set(), XIDX=new Set();
function istNow(){ return new Date(Date.now()+19800000); }
function marketOpenIST(){ const d=istNow(), wd=d.getUTCDay(), m=d.getUTCHours()*60+d.getUTCMinutes(); return wd>=1&&wd<=5&&m>=540&&m<=945; }
async function fetchLive(tries){
  let nse=null, bse=null;
  // NSE answers 502/403 now and then (movers.html measured it) — so retry, with a growing pause
  for(let a=0;a<tries&&!nse;a++){
    try{ const j=await fetch(WORKER+'/?nse=traded',{cache:'no-store'}).then(r=>r.json());
      const m=/^(\d{1,2})-([A-Za-z]{3})-(\d{4}) (\d{2}):(\d{2})/.exec((j&&j.timestamp)||'');
      if(m&&MON[m[2]]&&j.data&&Object.keys(j.data).length>=200) nse={date:m[3]+'-'+MON[m[2]]+'-'+m[1].padStart(2,'0'),time:m[4]+':'+m[5],data:j.data};
    }catch(e){}
    if(!nse&&a<tries-1) await new Promise(r=>setTimeout(r,2000*(a+1)));
  }
  if(!nse)return null;
  try{ const b=await fetch(BSE_LIVE_URL,{cache:'no-store'}).then(r=>r.json());
    const m=/^(\d{4}-\d{2}-\d{2})T/.exec((b&&b.timestamp)||'');
    if(m&&m[1]===nse.date&&b.data) bse=b.data;   // a BSE file from another day is ignored, never mixed in
  }catch(e){}
  return {nse,bse};
}
function prevWeekday(off){ for(let o=off-1;;o--){ const wd=new Date((START_TS+o*DAY)*1000).getUTCDay(); if(wd>=1&&wd<=5)return o; } }
function putLive(t,off,pv,ltp,prev){
  const s=SERIES[t]; if(!s||!s.d||!s.d.length||!(ltp>0))return 0;
  const n=s.d.length, last=s.d[n-1], v=Math.round(ltp*100);
  if(last>off)return 0;
  if(last===off){ if(!LVSET.has(t))return 0; s.p[n-1]=v; return 1; }   // a real end-of-day bar for that day is never overwritten
  // when our last close is not the feed's previous close (a session our end-of-day file lacks), the feed's
  // previous close fills that one bar — so "Today" is today's move, not two days' worth. After a market
  // holiday the two are equal and nothing is added, so no bar ever lands on a non-trading day by this path.
  if(last<pv&&prev>0&&Math.round(prev*100)!==s.p[n-1]){ s.d.push(pv); s.p.push(Math.round(prev*100)); }
  s.d.push(off); s.p.push(v); LVSET.add(t); return 1;
}
function applyLive(L){
  const off=dayOff(L.nse.date); if(!isFinite(off)||off<=EOD_END)return false;   // end-of-day file already has this day
  const pv=prevWeekday(off); let n=0;
  for(const sym in L.nse.data){ const q=L.nse.data[sym]; n+=putLive(sym+'.NS',off,pv,+q[0],+q[1]); }
  if(n<200)return false;
  if(L.bse) for(const code in L.bse){ const q=L.bse[code], t=SERIES[q[3]+'.BO']?q[3]+'.BO':code+'.BO'; n+=putLive(t,off,pv,+q[0],+q[1]); }
  NOW_OFF=Math.max(NOW_OFF,off); if(REW==null)END_OFF=NOW_OFF;
  LIVE={off,date:L.nse.date,time:L.nse.time,n};
  return true;
}
function setAsof(){
  const end=niceDate(isoOff(END_OFF)), lv=!!(LIVE&&LIVE.off===END_OFF), fresh=lv&&LIVE.date===istNow().toISOString().slice(0,10)&&marketOpenIST();
  const span=(REW!=null?'Rewound · ':'')+(ST.period==='Today'?(REW!=null?'':'Today: ')+end+' vs previous close':ST.period+': '+niceDate(isoOff(periodStart()))+' → '+end);
  $('asof').innerHTML=esc(span)+' · '+(lv?`<i class="lvdot${fresh?' on':''}"></i>${fresh?'Live':'Last traded prices'} ${esc(LIVE.time)} IST`:'closing prices');
  $('asof').classList.toggle('live',fresh); $('asof').classList.toggle('rew',REW!=null);
  $('asof').title=lv?`Prices as of ${LIVE.time} IST on ${niceDate(LIVE.date)} for ${LIVE.n.toLocaleString('en-IN')} stocks. Refreshes every minute while the market is open. The candles and the stats under the chart are end-of-day.`
    :REW!=null?'The page as it stood at the close of '+end+'. Prices, returns, rankings and RS are as of that date; company size (the ₹'+MIN_MC+' Cr floor) is today’s. NSE indices use their members on that date. A sector or theme index whose history starts later is not shown before its first checked date.'+(XIDX.size?' '+XIDX.size+' use today’s members for every date (no checked history): '+[...XIDX].map(n=>n.replace(/^Nifty /,'')).join(', ')+'.':'')
    :'End-of-day data, refreshed after the market closes (about 7 PM IST)';
}
/* ---- Rewind: the whole page as it stood at the close of a past date. END_OFF is the only thing that moves;
   every return, ranking and RS already reads prices through priceAt(…, END_OFF). ---- */
function calDays(){ const s=SERIES['RELIANCE.NS']||SERIES['TCS.NS']||SERIES['INFY.NS']; if(!s)return []; const c=s.d.filter(o=>o<=EOD_END); if(NOW_OFF>EOD_END)c.push(NOW_OFF); return c; }
async function setRewind(off){
  if(off!=null&&!FULL&&off-200<EARLIEST){ try{ await ensureFull(); }catch(e){} }   // RS needs 6 months before the date
  const cal=calDays();
  if(off==null||!cal.length||off>=NOW_OFF){ REW=null; END_OFF=NOW_OFF; }
  else{ const i=Math.max(0,idxLE(cal,off)); REW=cal[i]; END_OFF=REW; if(REW>=NOW_OFF){ REW=null; END_OFF=NOW_OFF; } }
  if(periodStart()<EARLIEST&&!FULL){ try{ await ensureFull(); }catch(e){ ST.period='Today'; } }
  buildRS(); recompute(); rewBar();
}
function rewStep(dir){ const cal=calDays(); if(!cal.length)return; const i=idxLE(cal,END_OFF);
  if(dir<0){ if(i>0)setRewind(cal[i-1]); else if(!FULL)setRewind(END_OFF-1); } else setRewind(i+1<cal.length?cal[i+1]:null); }
function rewBar(){
  const d=$('tRewDate'), cal=calDays(); d.value=isoOff(END_OFF); d.max=isoOff(NOW_OFF); d.min='1996-01-01';
  $('tRew').classList.toggle('on',REW!=null); $('tRewNext').disabled=$('tRewNow').disabled=REW==null;
}
function rewWire(){
  $('tRewPrev').onclick=()=>rewStep(-1); $('tRewNext').onclick=()=>rewStep(1); $('tRewNow').onclick=()=>setRewind(null);
  $('tRewDate').onchange=e=>{ const v=e.target.value; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ rewBar(); return; } setRewind(dayOff(v)); };
  rewBar();
}
function liveRefresh(){
  const g=$('tgList'), s=$('tsList'), gy=g.scrollTop, sy=s.scrollTop;
  buildRS(); compute(); renderBreadth(); setAsof(); rewBar();
  if(ST.view==='tracker'){ trkCompute(); trkRenderGroups(); trkRenderStocks(true); g.scrollTop=gy; s.scrollTop=sy; trkLiveLine(); }
  else if($('modal').style.display!=='flex') renderGrid();
}
async function liveTick(){ if(liveBusy)return; liveBusy=true; try{ const L=await fetchLive(1); if(L&&applyLive(L)&&REW==null)liveRefresh(); }catch(e){} finally{ liveBusy=false; } }
function liveStart(){
  setInterval(()=>{ if(!document.hidden&&marketOpenIST())liveTick(); },60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&marketOpenIST())liveTick(); });
}
function applyView(){
  setAsof();
  const tr=ST.view==='tracker';
  $('trkWrap').classList.toggle('hidden',!tr); $('oldWrap').classList.toggle('hidden',tr);
  $('pageMain').classList.toggle('wide',tr);
  if(tr)trkRender(); else renderGrid();
}

/* ---- boot ---- */
async function gunzipJSON(url){ const buf=await(await fetch(url)).arrayBuffer(); const s=new Blob([new Uint8Array(buf)]).stream().pipeThrough(new DecompressionStream('gzip')); return JSON.parse(await new Response(s).text()); }
(async function boot(){
  const liveP=fetchLive(4).catch(()=>null);
  try{
    $('ovT').textContent='Loading market data…';
    // P/E joins the boot fetch now that every CARD carries a median, not just the detail modal.
    // 14 KB gzipped against dash_slim's megabytes, in parallel — it lands long before the prices do,
    // and ensurePE() never rejects, so a missing feed costs the cards their P/E and nothing else.
    const [slim,cls,nifty,smeipo,smeem,xidx,xhist]=await Promise.all([
      gunzipJSON('./dash_slim.bin'),
      fetch('./sector_classification.json').then(r=>r.json()),
      fetch('./nifty.json').then(r=>r.json()).catch(()=>({px:{}})),
      // BSE SME IPO membership history (runbook §195) — own file, full "<ID>.BO" keys; a missing file costs only this group
      fetch('./bse_sme_ipo/history.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      // Nifty SME Emerge membership history (runbook §210) — bare NSE tickers, resolved like Nifty's by buildGroups()
      fetch('./nse_sme_emerge/history.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      // NSE sector / theme indices outside the 28 of the shared pipeline (scripts/fetch_nse_extra_indices.py) — CURRENT members only
      fetch('./nse_extra_indices/members.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      // their point-in-time history (scripts/build_extra_index_history.py): only indices whose rebuilt lists match NSE's archived files
      fetch('./nse_extra_indices/history.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      ensurePE(),
    ]);
    START_TS=slim.startTs; META=slim.meta; SERIES=slim.series; IDXH=Object.assign({},slim.indicesHistory||{}); CLS=cls;
    if(smeipo&&Array.isArray(smeipo['BSE SME IPO'])&&smeipo['BSE SME IPO'].length){
      // a BSE-only row can be keyed by its scrip CODE ("544671.BO") rather than its id — map id → the key SERIES uses
      const boKey={}; for(const k in META) if(k.endsWith('.BO')&&META[k]&&META[k].symbol) boKey[META[k].symbol+'.BO']=k;
      IDXH['BSE SME IPO']=smeipo['BSE SME IPO'].map(s=>({effectiveDate:s.effectiveDate,symbols:s.symbols.map(x=>SERIES[x]?x:(boKey[x]||x))}));
    }
    if(smeem&&Array.isArray(smeem['Nifty SME Emerge'])&&smeem['Nifty SME Emerge'].length)
      IDXH['Nifty SME Emerge']=smeem['Nifty SME Emerge'].map(s=>({effectiveDate:s.effectiveDate,symbols:s.symbols}));
    // Checked history where there is one: dated snapshots from the first date NSE's own archived list confirms (the index is
    // not shown before that). The rest: one undated snapshot = today's members for every date (named in the Rewind note).
    if(xidx&&xidx.indices) for(const nm in xidx.indices){
      const cur=xidx.indices[nm], sy=cur.symbols; if(IDXH[nm]||!Array.isArray(sy)||!sy.length)continue;
      const h=xhist&&xhist.indices&&xhist.indices[nm];
      if(h&&Array.isArray(h.snapshots)&&h.snapshots.length){
        const snaps=h.snapshots.map(x=>({effectiveDate:x.effectiveDate,symbols:x.symbols}));
        let last=new Set(snaps[snaps.length-1].symbols), lastD=snaps[snaps.length-1].effectiveDate;
        // changes the daily fetch saw after the history was built
        for(const c of (cur.changes||[])){ if(!(c.date>xhist.built)||!(c.date>lastD))continue;
          last=new Set(last); (c.removed||[]).forEach(x=>last.delete(x)); (c.added||[]).forEach(x=>last.add(x));
          snaps.push({effectiveDate:c.date,symbols:[...last]}); lastD=c.date; }
        const want=new Set(sy);
        if(want.size!==last.size||[...want].some(x=>!last.has(x))){ const d=new Date().toISOString().slice(0,10); if(d>lastD)snaps.push({effectiveDate:d,symbols:sy}); else snaps[snaps.length-1].symbols=sy; }
        IDXH[nm]=snaps;
      } else { IDXH[nm]=[{effectiveDate:'1900-01-01',symbols:sy}]; XIDX.add(nm); }
    }
    EARLIEST=slim.recentCutoffOff||0;
    // latest offset with data
    let mx=0; for(const k in SERIES){ const d=SERIES[k].d; if(d&&d.length){ const v=d[d.length-1]; if(v>mx)mx=v; } } END_OFF=mx;
    NIFTY_ARR=Object.entries(nifty.px||{}).map(([d,v])=>[dayOff(d),v]).filter(x=>isFinite(x[0])&&x[1]>0).sort((a,b)=>a[0]-b[0]);
    NIFTY_OFFS=NIFTY_ARR.map(x=>x[0]);
    EOD_END=NOW_OFF=END_OFF;
    // live prices were requested when boot began; if they are back already they go in before the first paint
    const L0=await Promise.race([liveP,new Promise(r=>setTimeout(r,0,null))]);
    if(L0)applyLive(L0); else liveP.then(L=>{ if(L&&applyLive(L)&&REW==null)liveRefresh(); });
    buildRS(); trkWire(); rewWire(); liveStart();
    let nCls=0; for(const k in SERIES) if(CLS[k])nCls++;
    document.title='STOCKSWORLD · Sectors';
    loadUI();
    const dq=new URLSearchParams(location.search);
    const dlLevel=(dq.get('level')||'').trim(), dlName=dq.get('name')||dq.get('g');
    if(dlLevel&&LEVELS.some(l=>l.key===dlLevel)) ST.level=dlLevel;   // level first, so the grid behind the modal matches
    renderToolbar(); recompute();
    $('ov').style.display='none';
    if(dlName) openDeepLink(dlName);
  }catch(e){ $('ovT').textContent='Failed to load: '+(e&&e.message||e); console.error(e); }
})();
</script>
