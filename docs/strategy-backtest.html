<body class="bg-slate-50 min-h-screen text-slate-800">

<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">

<main class="max-w-screen-xl mx-auto px-4 py-6">
  <div class="mb-1 flex items-center justify-between flex-wrap gap-2">

  </div>

  <!-- Trendlyne-style action tabs: the strategy IS a live screen; backtests & rewind hang off it -->
  <div id="tabs" class="hidden items-center gap-1.5 mb-4 flex-wrap">
    <button id="tabPicks" class="tabbtn">🎯 Live Picks</button>

<script>
'use strict';
const $ = id => document.getElementById(id);
const FREQ = { 1: 'Monthly', 3: 'Quarterly', 6: 'Half-yearly', 12: 'Yearly' };
const SORTL = { changePercent: 'Change % desc', rsi: 'RSI', d52: '% from 52w High', d52_low_pct: '% from 52w Low', indRank: 'Industry rank', mcap: 'Mcap', hist_mcap: 'Hist mcap', profitYoyPct: 'Net Profit Qtr Growth YoY %', profitBase: 'Net Profit (year-ago Q)', profitAccel: 'Profit-growth acceleration', profitTTM: 'Profit growth TTM %', profitStreak: 'Profit-growth streak', postDrift: 'Post-result drift %', composite: 'Quality-Momentum composite' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;   // shared history is untrusted — guard every metric

let HIST = [];
let SF_END = '';   // latest data date (tiny sf_meta.json) → default End date for the run form
let STRAT = null;  // the strategy this page shows
// --- identity + backtest lookup: IDENTICAL semantics to saved-strategies.html so a strategy
//     resolves to exactly the same set of runs there and here. ---
// Identity + variant keys: IDENTICAL semantics to saved-strategies.html so this page shows exactly the
// runs that the Saved-Strategies row represents. INCLUDES topN (each stock count is its own strategy
// row) and normalizes boundary operators (<≡<=, >≡>=); the variant key (winKey) carries start+method.
// identityKey / ruleKey / winKey come from bt-identity.js (one shared definition).
function windowEnd(c) { return (typeof SF !== 'undefined' && SF && SF.end) ? SF.end : (c.end || 'today'); }
function metricsFor(cfg) {
  const k = identityKey(cfg), wk = winKey(cfg);
  let best = null;
  for (const h of HIST) {
    if (!h.cfg || identityKey(h.cfg) !== k) continue;
    if (winKey(h.cfg) !== wk) continue;                 // same window + method + stock count
    if (h.m && h.m.cagr != null && (!best || (h.ts || 0) > (best.ts || 0))) best = h;
  }
  return best ? best.m : null;
}
// Runs belong to a strategy if they carry its id (sid — stamped on every run launched from this page;
// survives later ✏️ edits of the config) OR if their config matches the identity (legacy runs, pre-sid).
function backtestsFor(savedVars, sidSet) {
  if (!savedVars.length) return [];
  const k = identityKey(savedVars[0].cfg), byWin = new Map();
  const consider = (id, c, name, m, ts) => {
    const wk = winKey(c);                                         // window + method + stock count
    const score = (m && m.cagr != null ? 1e15 : 0) + (ts || 0);
    const prev = byWin.get(wk);
    if (!prev || score > prev._score) byWin.set(wk, { id, cfg: c, name, m: m || {}, _score: score });
  };
  // Both paths must match this strategy's STOCK COUNT: the sid survives a ✏️ edit of topN, so without
  // the guard a run re-launched at a different count would list itself under this one (same as
  // saved-strategies.html's backtestsFor).
  const n0 = savedVars[0].cfg.topN != null ? savedVars[0].cfg.topN : '';
  const sameN = c => (c.topN != null ? c.topN : '') === n0;
  for (const h of HIST) if (h.cfg && sameN(h.cfg) && ((h.sid && sidSet && sidSet.has(h.sid)) || identityKey(h.cfg) === k)) consider(h.id, h.cfg, h.label || h.name, h.m, h.ts);
  for (const v of savedVars) consider(v.id, v.cfg, v.name, metricsFor(v.cfg), v.ts);
  return [...byWin.values()].sort((a, b) => (b.m && b.m.cagr != null ? b.m.cagr : -1e9) - (a.m && a.m.cagr != null ? a.m.cagr : -1e9) || (a.cfg.start || '').localeCompare(b.cfg.start || ''));
}

// Universe dropdown options — index constituents + daily-turnover buckets + F&O (mirrors the builder).
function uniOptionsHTML() {
  const indices = ['Nifty 50', 'Nifty 100', 'Nifty 200', 'Nifty 500', 'Nifty Midcap 150', 'Nifty Smallcap 250'];
  let h = `<option value="">All stocks</option>`;
  h += `<optgroup label="Index constituents">` + indices.map(k => `<option value="${k}">${k}</option>`).join('') + `</optgroup>`;
  h += `<optgroup label="Min daily turnover">` + (typeof TURN_OPTS !== 'undefined' ? TURN_OPTS : [['500', '≥₹5 Cr']]).map(([v, l]) => `<option value="mcap:${v}">${l}</option>`).join('') + `</optgroup>`;
  h += `<optgroup label="Derivatives"><option value="__FNO__">F&O stocks</option></optgroup>`;
  return h;
}
function uniValue(c) { return c.indexName ? c.indexName : (c.mcapFloor ? 'mcap:' + c.mcapFloor : ''); }
const sortOptionsHTML = () => (typeof FIELDS !== 'undefined' ? FIELDS : []).map(f => `<option value="${f.v}">${esc(f.l)}</option>`).join('');

// TOP panel of the Backtests tab: an editable "Run a new backtest" form, pre-filled from the saved
// strategy (Trendlyne-style). Market data isn't loaded here — Run hands the (possibly tweaked) config to
// the fast builder, which loads data only when it runs, records the result to History WITH this
// strategy's id (sid), and it then nests back under Run history. Tweaking here NEVER creates a new
// strategy — to change the strategy itself, use ✏️ Edit Strategy.
function paramsCard(c) {
  const filt = filterExpr(c) || 'none';
  return `<div class="card p-5 mb-6">
    <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
      <div class="text-base font-bold text-slate-900">Run a new backtest</div>
      <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 rounded-full px-2.5 py-1">pre-filled from this strategy — tweak &amp; run · results stay under THIS strategy</span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
      <div><label class="lbl">Rebalance frequency</label><select id="fFreq" class="inp"><option value="1">Monthly</option><option value="3">Quarterly</option><option value="6">Half-yearly</option><option value="12">Yearly</option></select></div>
      <div><label class="lbl">Start date</label><input id="fFrom" type="date" class="inp"></div>
      <div><label class="lbl">End date</label><input id="fTo" type="date" class="inp"></div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
      <div><label class="lbl">Universe</label><select id="fUni" class="inp">${uniOptionsHTML()}</select></div>
      <div><label class="lbl">Sort by</label><select id="fSort" class="inp">${sortOptionsHTML()}</select></div>
      <div><label class="lbl">Direction</label><select id="fDir" class="inp"><option value="high">Prefer High</option><option value="low">Prefer Low</option></select></div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <div><label class="lbl">Holdings (top-N)</label><input id="fTopN" type="number" min="1" max="1000" class="inp"></div>
      <div><label class="lbl">Capital (₹)</label><input id="fCap" type="number" class="inp"></div>
      <div><label class="lbl">Rebalance method</label><select id="fMethod" class="inp"><option value="reset">Reset to equal-weight</option><option value="hold">Hold winners · replace exits</option></select></div>
      <div><label class="lbl">Earnings basis</label><select id="fEarn" class="inp"><option value="con">Consolidated</option><option value="std">Standalone</option></select></div>
    </div>
    <div class="flex items-center justify-between flex-wrap gap-2 border-t border-slate-100 pt-3">
      <div class="text-[12px] text-slate-600 min-w-0"><span class="font-semibold text-slate-500">Filters:</span> <span class="mono break-words">${esc(filt)}</span> <a href="./stock-backtest.html" id="editFilters" class="text-indigo-600 hover:underline whitespace-nowrap">edit filters →</a></div>
      <button id="runBtn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5 py-2.5 text-sm font-semibold shadow-sm transition shrink-0">▶ Run Backtest</button>
    </div>
    <div id="runNote" class="text-[11px] text-slate-400 mt-2">Market data loads only when you run. To change the strategy itself, use ✏️ Edit Strategy (top-right) — it updates in place, never a duplicate.</div>
  </div>`;
}
// Fill the form controls from the strategy config (called after the HTML is inserted).
function fillForm(c) {
  $('fFreq').value = c.freq || 1;
  $('fFrom').value = c.start || '2020-03-31';
  $('fTo').value = (SF_END || c.end || '');
  $('fUni').value = uniValue(c);
  $('fSort').value = c.sortBy; if ($('fSort').value !== c.sortBy) { const o = document.createElement('option'); o.value = c.sortBy; o.textContent = SORTL[c.sortBy] || c.sortBy; $('fSort').appendChild(o); $('fSort').value = c.sortBy; }
  $('fDir').value = c.dir || 'high';
  $('fTopN').value = c.topN || 5;
  $('fCap').value = c.capital || 100000;
  $('fMethod').value = c.method || 'reset';
  $('fEarn').value = c.earnBasis || 'con';
}
// Read the (edited) form back into a full config, PRESERVING the strategy's filters + lookback.
function readForm(base) {
  const u = $('fUni').value || '', isCap = u.slice(0, 5) === 'mcap:';
  const cfg = {
    ...base,
    start: $('fFrom').value, end: $('fTo').value,
    freq: +$('fFreq').value, indexName: isCap ? '' : u, mcapFloor: isCap ? +u.slice(5) : 0,
    sortBy: $('fSort').value, dir: $('fDir').value,
    topN: Math.max(1, +$('fTopN').value || 5), capital: +$('fCap').value || 100000,
    method: $('fMethod').value, earnBasis: $('fEarn').value,
    filters: (base.filters || []).slice(), mode: 'sf'
  };
  if (base.lookback != null) cfg.lookback = base.lookback;   // keep identity (see stock-backtest CUR_LOOKBACK)
  return cfg;
}

function historyTable(list) {
  if (!list.length) return '<div class="card p-8 text-center text-slate-400 text-sm">No saved backtests for this strategy yet.</div>';
  const rows = list.map(b => {
    const c = b.cfg, m = b.m || {};
    const cagr = (m.cagr != null) ? `<span class="font-bold ${m.cagr >= 0 ? 'pos' : 'neg'}">${pct(m.cagr)}</span>` : '<span class="text-slate-400">—</span>';
    const dd = (m.maxDD != null) ? `<span class="neg font-semibold">-${(+m.maxDD).toFixed(1)}%</span>` : '<span class="text-slate-400">—</span>';
    const fin = (m.finalV != null) ? `₹1L → ${fmtINR(m.finalV)}` : '—';
    const meth = c.method === 'reset' ? 'reset' : 'hold';
    return `<tr class="border-b border-slate-100 hover:bg-slate-50">
      <td class="px-4 py-3 whitespace-nowrap font-medium text-slate-700">${esc(c.start)} → ${esc(windowEnd(c))}</td>
      <td class="px-3 py-3"><span class="text-[10px] font-semibold text-indigo-600 bg-indigo-50 rounded px-1.5 py-0.5">top-${c.topN}</span></td>
      <td class="px-3 py-3"><span class="text-[10px] font-semibold text-slate-500 bg-slate-100 rounded px-1.5 py-0.5">${meth}</span></td>
      <td class="px-3 py-3 text-right text-sm">${cagr}</td>
      <td class="px-3 py-3 text-right text-sm">${dd}</td>
      <td class="px-3 py-3 text-right text-xs text-slate-500 whitespace-nowrap">${fin}</td>
      <td class="px-3 py-3 text-right"><button class="text-slate-400 hover:text-indigo-600 text-base" data-eye="${esc(b.id)}" title="View result">👁</button></td>
    </tr>`;
  }).join('');
  return `<div class="text-base font-bold text-slate-900 mb-2 flex items-center justify-between">
      <span>Run history</span><span class="text-xs font-normal text-slate-400">${list.length} backtest${list.length > 1 ? 's' : ''}</span></div>
    <div class="card overflow-x-auto tscroll"><table class="w-full text-sm border-collapse">
      <thead><tr class="text-[11px] uppercase tracking-wide text-slate-500 border-b border-slate-200 bg-slate-50">
        <th class="text-left font-semibold px-4 py-2.5">Period</th>
        <th class="text-left font-semibold px-3 py-2.5">Holdings</th>
        <th class="text-left font-semibold px-3 py-2.5">Method</th>
        <th class="text-right font-semibold px-3 py-2.5">CAGR</th>
        <th class="text-right font-semibold px-3 py-2.5">Max DD</th>
        <th class="text-right font-semibold px-3 py-2.5 whitespace-nowrap">₹1L grows to</th>
        <th class="text-right font-semibold px-3 py-2.5">View</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---- shared lazy engine loader (picks + rewind both use it; loads once) ----
// (stockHref/stockLink/pct/fmtINR/screenAsOf/fieldVal come from backtest-engine.js — don't redeclare.)
let ENGINE_READY = false, ENGINE_LOADING = null;
async function ensureEngine(msgEl) {
  if (ENGINE_READY) return true;
  if (!ENGINE_LOADING) ENGINE_LOADING = loadEngineData(m => { if (msgEl && m) msgEl.textContent = m; })
    .then(() => { ENGINE_READY = true; }).catch(() => { ENGINE_LOADING = null; });
  await ENGINE_LOADING;
  return ENGINE_READY;
}

// ---- 🎯 LIVE PICKS (default tab — the Trendlyne "screener results" view) ----
// Instant first paint from the DAILY BAKED picks (live_tracking.json — tiny, no market data), then
// "⚡ Full details" loads the engine once for the complete ranked view: every qualifying stock, sort
// metric, Chg%/52w/RSI, capital allocation for the Top-N, and 🆕 badges vs the previous rebalance.
function hash36(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = (h * 33 + str.charCodeAt(i)) >>> 0; return h.toString(36); }
let LAST_PICKS = null;   // rows of the last rendered full view (for CSV)
let BAKED = null;        // { day, picks:[{s,p}], updated } from live_tracking.json
function picksCard(c) {
  return `<div class="card p-5 mb-6" id="picksCard">
    <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
      <div><div class="text-base font-bold text-slate-900">🎯 Live Picks — current basket</div>
        <div class="text-[12px] text-slate-500">The stocks this strategy selects right now — its filters + <b>${esc(SORTL[c.sortBy] || c.sortBy)}</b> (${c.dir === 'high' ? 'prefer high' : 'prefer low'}) ranking. Top ${c.topN} ⭐ = the basket.</div></div>
      <div class="flex items-end gap-2 flex-wrap">
        <button id="pkFull" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-semibold shadow-sm shrink-0">⚡ Full details</button>
        <button id="pkCsv" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-3 py-2 text-sm font-semibold shadow-sm shrink-0">⬇ CSV</button>
      </div>
    </div>
    <div id="pkMsg" class="text-xs text-slate-500"></div>
    <div id="pkOut" class="mt-3"></div>
    <div id="pkNote" class="text-[11px] text-slate-400 mt-2"></div>
  </div>`;
}
// Instant view: the nightly-logged basket (no market data download).
function renderBakedPicks(c) {
  if (!BAKED || !BAKED.picks || !BAKED.picks.length) {
    $('pkMsg').innerHTML = 'Computing the live qualifying list (one-time market-data load)…';
    return;
  }
  $('pkMsg').innerHTML = `Basket as of <b>${esc(BAKED.day)}</b> (nightly log) · ${BAKED.picks.length} stocks · loading the full qualifying list…`;
  const rows = BAKED.picks.map((p, i) => `<tr class="border-b border-slate-50 bg-indigo-50/40">
      <td class="py-1.5 pr-2 text-slate-400 whitespace-nowrap">${i + 1} ⭐</td>
      <td class="pr-3 font-semibold">${stockLink(p.s, 'text-indigo-700 hover:underline')}</td>
      <td class="text-right px-2">${p.p != null ? (+p.p).toFixed(2) : '—'}</td></tr>`).join('');
  $('pkOut').innerHTML = `<div class="overflow-x-auto tscroll"><table class="w-full text-sm border-collapse">
    <thead><tr class="text-[11px] uppercase tracking-wide text-slate-500 border-b border-slate-200 bg-slate-50">
      <th class="text-left px-2 py-2">#</th><th class="text-left pr-3 py-2">Symbol</th>
      <th class="text-right px-2 py-2">Close ₹</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  $('pkNote').textContent = 'Prices = official daily close (bhavcopy).';
  LAST_PICKS = { date: BAKED.day, rows: BAKED.picks.map((p, i) => ({ rank: i + 1, sym: p.s, close: p.p })) };
}
// Previous rebalance boundary: the month-end `freq` months before the given date (for 🆕 badges).
function monthEndBefore(dstr, months) {
  const y = +dstr.slice(0, 4), m = +dstr.slice(5, 7);
  const t = y * 12 + (m - 1) - months, yy = Math.floor(t / 12), mm = ((t % 12) + 12) % 12;
  return new Date(Date.UTC(yy, mm + 1, 0)).toISOString().slice(0, 10);
}
// Full view: complete ranked qualifying list from the engine (screenAsOf) — sorted by the strategy's
// sort factor, with ONE COLUMN PER STRATEGY PARAMETER (the sort field + every filter field) + 🆕 badges.
// Short column headers for the parameter columns (mirror simulate()'s SHORT; fall back to FIELD_LABEL).
const SHORTF = { changePercent: 'Chg %', rsi: 'RSI', d52: '% 52wHi', d52_low_pct: '% 52wLo', indRank: 'Ind rank', mcap: 'Mcap ₹Cr', hist_mcap: 'HMcap ₹Cr', profitYoyPct: 'NP YoY %', profitBase: 'NP base ₹Cr', profitAccel: 'NP accel', profitTTM: 'NP TTM %', profitStreak: 'NP streak', postDrift: 'Drift %', composite: 'Composite', ret1m: '1m %', ret3m: '3m %', ret6m: '6m %', ret12m: '12m %', stoch: 'Stoch %K', bollB: 'Boll %b', macdH: 'MACD hist', vol: 'Vol %', beta: 'Beta', turn: 'Turnover ₹L', fiiPct: 'FII %', fiiChgPp: 'FII Δpp', diiPct: 'DII %', diiChgPp: 'DII Δpp' };
const shortLabel = f => SHORTF[f] || (typeof FIELD_LABEL !== 'undefined' && FIELD_LABEL[f]) || f;
async function renderFullPicks(c) {
  const btn = $('pkFull'), msg = $('pkMsg'); btn.disabled = true;
  msg.textContent = 'Loading market data…';
  if (!await ensureEngine(msg)) { msg.innerHTML = '<span class="neg">Couldn’t load market data — try again.</span>'; btn.disabled = false; return; }
  // LIVE: overlay today's prices onto the series and screen as of TODAY, so both intraday moves and
  // results filed after the last bhavcopy count. Re-runs (↻ Recompute) re-fetch. Fail-silent.
  let live = { date: SF.end, n: 0, quoted: 0, skipped: true };
  try { live = await applyLiveOverlay(c, m => { msg.textContent = m; }); } catch (e) { /* stay on closes */ }
  const date = live.date, topN = c.topN || 5;
  const ranked = screenAsOf(c, date);   // already sorted by the strategy's sort-by parameter
  // 🆕 badge: picks that were NOT in the basket at the previous rebalance boundary
  let prevSet = null, prevDate = monthEndBefore(date, Math.max(1, c.freq || 1));
  if (prevDate >= SF.start) { try { prevSet = new Set(screenAsOf(c, prevDate).slice(0, topN).map(r => r.sym)); } catch (e) { prevSet = null; } }
  // strategy-parameter columns = the sort field + every filter field (deduped, in order), with the
  // filter condition shown under the header. Same pattern as the rebalance log's dispCols.
  const conds = {}; (c.filters || []).forEach(f => { (conds[f.field] = conds[f.field] || []).push(f.op + ' ' + f.val); });
  const dispFields = [...new Set([c.sortBy, ...(c.filters || []).map(f => f.field)])];
  const fmtV = (f, r) => {
    const v = fieldVal(r, f);
    if (v == null || isNaN(v)) return '—';
    if (f === 'changePercent') return `<span class="${v >= 0 ? 'pos' : 'neg'}">${pct(v)}</span>`;
    if (f === 'd52' || f === 'd52_low_pct') return (+v).toFixed(2) + '%';
    return Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-IN') : (+v).toFixed(2);
  };
  const csvRows = [];
  const rowsHtml = ranked.map((r, i) => {
    const inTop = i < topN;
    // With the live overlay on, r.price IS the LTP; META.raw is the unadjusted last close (fallback).
    const q = (typeof liveQuote === 'function') ? liveQuote(r.sym) : null;
    const rawClose = (typeof META !== 'undefined' && META[r.tkr] && META[r.tkr].raw) ? META[r.tkr].raw : r.price;
    const shown = (q && q.ltp != null) ? q.ltp : rawClose;   // real ₹ to trade at
    const dayChg = (q && q.ltp != null && q.prevClose > 0) ? (q.ltp / q.prevClose - 1) * 100 : null;
    const isNew = inTop && prevSet && !prevSet.has(r.sym);
    csvRows.push({ rank: i + 1, sym: r.sym, isNew, vals: dispFields.map(f => fieldVal(r, f)), close: shown, dayChg });
    return `<tr class="border-b border-slate-50 ${inTop ? 'bg-indigo-50/60' : ''}">
      <td class="py-1.5 pr-2 text-slate-400 whitespace-nowrap">${i + 1}${inTop ? ' ⭐' : ''}</td>
      <td class="pr-3 font-semibold">${stockLink(r.sym, 'text-indigo-700 hover:underline')}${isNew ? '<span class="newbadge" title="Entered the basket since ' + esc(prevDate) + '">🆕 NEW</span>' : ''}</td>
      <td class="pr-3 text-slate-500 text-xs hidden sm:table-cell">${esc(r.ind || '')}</td>
      ${dispFields.map((f, di) => `<td class="text-right px-2 ${di === 0 ? 'font-semibold' : ''}">${fmtV(f, r)}</td>`).join('')}
      <td class="text-right px-2 whitespace-nowrap">${shown == null ? '—' : (+shown).toFixed(2)}${dayChg == null ? '' : ` <span class="${dayChg >= 0 ? 'pos' : 'neg'} text-[11px]">${dayChg >= 0 ? '+' : ''}${dayChg.toFixed(2)}%</span>`}</td></tr>`;
  }).join('');
  // exits since the previous rebalance (were in the basket then, not now)
  let exitsLine = '';
  if (prevSet) {
    const curTop = new Set(ranked.slice(0, topN).map(r => r.sym));
    const exits = [...prevSet].filter(s => !curTop.has(s));
    if (exits.length) exitsLine = `<div class="text-[11px] text-slate-500 mt-2">↩ Dropped since ${esc(prevDate)}: ${exits.map(s => stockLink(s, 'text-slate-600 hover:underline')).join(', ')}</div>`;
  }
  const stamp = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  const liveTag = live.n
    ? `<span class="text-emerald-600 font-semibold">🟢 LIVE</span> ${live.n}/${live.tried} quoted at ${esc(stamp)}`
    : `<span class="text-slate-400">prices = last close (${esc(SF.end)})</span>`;
  msg.innerHTML = `As of <b>${esc(date)}</b> · ${liveTag} · <b>${ranked.length}</b> qualifying · Top ${topN} ⭐ = the basket · sorted by <b>${esc(shortLabel(c.sortBy))}</b> (${c.dir === 'high' ? 'high → low' : 'low → high'}) · universe ${esc(universeLabel(c))}`;
  const headCells = dispFields.map(f => `<th class="text-right px-2 py-2">${esc(shortLabel(f))}${f === c.sortBy ? ' ' + (c.dir === 'high' ? '▾' : '▴') : ''}${conds[f] ? `<span class="block normal-case text-[9px] font-normal text-slate-400">${esc(conds[f].join(' & '))}</span>` : ''}</th>`).join('');
  $('pkOut').innerHTML = ranked.length ? `<div class="overflow-x-auto tscroll"><table class="w-full text-sm border-collapse">
    <thead><tr class="text-[11px] uppercase tracking-wide text-slate-500 border-b border-slate-200 bg-slate-50">
      <th class="text-left px-2 py-2">#</th><th class="text-left pr-3 py-2">Symbol</th><th class="text-left pr-3 py-2 hidden sm:table-cell">Industry</th>
      ${headCells}<th class="text-right px-2 py-2">${live.n ? 'Price ₹' : 'Close ₹'}</th></tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>` + exitsLine
    : '<div class="text-center text-slate-400 text-sm py-6">No stocks qualify right now.</div>';
  $('pkNote').textContent = 'Columns = this strategy\'s sort + filter parameters (condition under each header). 🆕 = entered the basket since the previous rebalance. '
    + (live.n
      ? 'Prices are live (Yahoo NSE, ~15-min delay) and every price factor is recomputed off them; earnings use every result filed up to today. ↻ Recompute re-fetches.'
      : 'Prices = official daily close (bhavcopy).');
  LAST_PICKS = { date, full: true, fields: dispFields, rows: csvRows };
  btn.disabled = false; btn.textContent = '↻ Recompute';
}
function downloadPicksCSV() {
  if (!LAST_PICKS || !LAST_PICKS.rows.length) return;
  let head, lines;
  if (LAST_PICKS.full) {
    head = ['Rank', 'Symbol', 'New'].concat(LAST_PICKS.fields.map(f => shortLabel(f).replace(/[^A-Za-z0-9%]+/g, '_'))).concat(['Price', 'Day%']);
    lines = LAST_PICKS.rows.map(r => [r.rank, r.sym, r.isNew ? 'NEW' : ''].concat(r.vals.map(v => v == null || isNaN(v) ? '' : (+v).toFixed(2))).concat([r.close == null ? '' : (+r.close).toFixed(2), r.dayChg == null ? '' : r.dayChg.toFixed(2)]).join(','));
  } else {
    head = ['Rank', 'Symbol', 'Close'];
    lines = LAST_PICKS.rows.map(r => [r.rank, r.sym, r.close == null ? '' : (+r.close).toFixed(2)].join(','));
  }
  const blob = new Blob([[head.join(',')].concat(lines).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `picks_${(STRAT ? STRAT.name : 'strategy').replace(/[^a-z0-9]+/gi, '_')}_${LAST_PICKS.date}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

// ---- 🕘 REWIND: show ALL stocks that qualified for this strategy as of ANY past date ----
// (Trendlyne "Screener Rewind" analogue.) The heavy market data loads ONLY when Rewind is first used.
function rewindCard(c) {
  return `<div class="card p-5 mb-6" id="rewindCard">
    <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
      <div><div class="text-base font-bold text-slate-900">🕘 Rewind — qualifying stocks on a date</div>
        <div class="text-[12px] text-slate-500">Every stock that passed this strategy's filters on the chosen day, ranked. The Top ${c.topN} ⭐ are the picks.</div></div>
      <div class="flex items-end gap-2">
        <div><label class="lbl">As of date</label><input id="rwDate" type="date" class="inp" style="width:auto"></div>
        <button id="rwBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-semibold shadow-sm shrink-0">Show</button>
      </div>
    </div>
    <div id="rwMsg" class="text-xs text-slate-500">Pick a date and click <b>Show</b> — market data loads on first use.</div>
    <div id="rwOut" class="mt-3"></div>
  </div>`;
}
async function runRewind(c) {
  const btn = $('rwBtn'), msg = $('rwMsg'); btn.disabled = true;
  msg.textContent = 'Loading market data…';
  if (!await ensureEngine(msg)) { msg.innerHTML = '<span class="neg">Couldn’t load market data — try again.</span>'; btn.disabled = false; return; }
  const inp = $('rwDate'); inp.min = SF.start; inp.max = SF.end;
  let date = inp.value || SF.end; if (date < SF.start) date = SF.start; if (date > SF.end) date = SF.end; inp.value = date;
  await ensureHistoryFor(date, m => { if (m) msg.textContent = m; });   // rewinds before ~2020 pull the deep parts once
  const ranked = screenAsOf(c, date), topN = c.topN || 5;
  const sortL = SORTL[c.sortBy] || ((typeof FIELDS !== 'undefined' ? FIELDS.find(f => f.v === c.sortBy) : null) || {}).l || c.sortBy;
  msg.innerHTML = `As of <b>${esc(date)}</b> · <b>${ranked.length}</b> stock${ranked.length === 1 ? '' : 's'} qualified · Top ${topN} ⭐ = the picks · universe ${esc(universeLabel(c))}`;
  const fmtV = v => (v == null || isNaN(v)) ? '—' : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-IN') : (+v).toFixed(2));
  const rowsHtml = ranked.map((r, i) => `<tr class="border-b border-slate-50 ${i < topN ? 'bg-indigo-50/60' : ''}">
    <td class="py-1.5 pr-2 text-slate-400 whitespace-nowrap">${i + 1}${i < topN ? ' ⭐' : ''}</td>
    <td class="pr-3 font-semibold">${stockLink(r.sym, 'text-indigo-700 hover:underline')}</td>
    <td class="pr-3 text-slate-500 text-xs hidden sm:table-cell">${esc(r.ind || '')}</td>
    <td class="text-right px-2 font-semibold">${fmtV(fieldVal(r, c.sortBy))}</td>
    <td class="text-right px-2 ${r.chg >= 0 ? 'pos' : 'neg'}">${pct(r.chg)}</td>
    <td class="text-right px-2">${r.d52 == null ? '—' : r.d52.toFixed(2) + '%'}</td>
    <td class="text-right px-2">${r.d52low == null ? '—' : r.d52low.toFixed(2) + '%'}</td>
    <td class="text-right px-2">${r.rsi == null ? '—' : r.rsi.toFixed(2)}</td>
    <td class="text-right px-2">${r.price == null ? '—' : r.price.toFixed(2)}</td></tr>`).join('');
  $('rwOut').innerHTML = ranked.length ? `<div class="overflow-x-auto tscroll"><table class="w-full text-sm border-collapse">
    <thead><tr class="text-[11px] uppercase tracking-wide text-slate-500 border-b border-slate-200 bg-slate-50">
      <th class="text-left px-2 py-2">#</th><th class="text-left pr-3 py-2">Symbol</th><th class="text-left pr-3 py-2 hidden sm:table-cell">Industry</th>
      <th class="text-right px-2 py-2">${esc(sortL)}</th><th class="text-right px-2 py-2">Chg %</th><th class="text-right px-2 py-2">% 52wHi</th>
      <th class="text-right px-2 py-2">% 52wLo</th><th class="text-right px-2 py-2">RSI</th><th class="text-right px-2 py-2">Close ₹</th></tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>`
    : '<div class="text-center text-slate-400 text-sm py-6">No stocks qualified on this date.</div>';
  btn.disabled = false;
}

// ---- tabs ----
let TAB = 'picks';
function setTab(t) {
  TAB = t;
  $('tabPicks').className = 'tabbtn ' + (t === 'picks' ? 'on' : 'off');
  $('tabBt').className = 'tabbtn ' + (t === 'bt' ? 'on' : 'off');
  $('tabRw').className = 'tabbtn ' + (t === 'rw' ? 'on' : 'off');
  $('secPicks').classList.toggle('hidden', t !== 'picks');
  $('secBt').classList.toggle('hidden', t !== 'bt');
  $('secRw').classList.toggle('hidden', t !== 'rw');
}

function renderStrategy(strat, list) {
  const c = strat.cfg;
  $('title').textContent = strat.name || 'Strategy';
  // config as chips (strategy fields come from the world-writable shared list — esc() everything)
  const fx = filterExpr(c) || '';
  const chip = (t, title) => `<span class="sw-chip" ${title ? `title="${esc(title)}"` : ''} style="max-width:360px;overflow:hidden;text-overflow:ellipsis">${t}</span>`;
  $('subtitle').innerHTML = [
    chip('🌐 ' + esc(universeLabel(c))),
    chip('🔁 ' + esc(FREQ[c.freq] || c.freq + 'mo')),
    chip('🧺 Top ' + (+c.topN || '?')),
    chip('📊 ' + esc(SORTL[c.sortBy] || c.sortBy) + (c.dir === 'high' ? ' · prefer high' : ' · prefer low')),
    chip('🔍 ' + esc(fx || 'no filters'), fx),
  ].join('');
  // at-a-glance record from this strategy's saved runs
  let best = null, beat = 0, scored = 0, worstDD = null;
  for (const b of list) { const m = b.m || {}, cg = num(m.cagr), bc = num(m.benchCagr), dd = num(m.maxDD);
    if (cg != null && (best == null || cg > best.cg)) best = { cg, cfg: b.cfg || {} };
    if (cg != null && bc != null) { scored++; if (cg >= bc) beat++; }
    if (dd != null && (worstDD == null || dd > worstDD)) worstDD = dd; }
  if (list.length) {
    $('stratStats').classList.remove('hidden'); $('stratStats').classList.add('grid');
    $('stratStats').innerHTML =
      `<div class="sw-stat"><div class="sw-lb">Saved backtests</div><div class="sw-v">${list.length}</div><div class="sw-d">distinct windows for this strategy</div></div>
       <div class="sw-stat"><div class="sw-lb">Best CAGR</div><div class="sw-v ${best && best.cg < 0 ? 'neg' : 'pos'}">${best ? (best.cg >= 0 ? '+' : '') + best.cg.toFixed(2) + '%' : '—'}</div><div class="sw-d">${best ? esc((best.cfg.start || '?') + ' → ' + (best.cfg.end || '?')) : 'run one to find out'}</div></div>
       <div class="sw-stat"><div class="sw-lb">Beat Nifty 500</div><div class="sw-v ${scored ? (beat >= scored / 2 ? 'pos' : 'neg') : ''}">${scored ? beat + ' / ' + scored : '—'}</div><div class="sw-d">${scored ? Math.round(beat / scored * 100) + '% of scored runs' : 'no scored runs yet'}</div></div>
       <div class="sw-stat"><div class="sw-lb">Worst drawdown</div><div class="sw-v ${worstDD != null ? 'neg' : ''}">${worstDD != null ? '-' + worstDD.toFixed(1) + '%' : '—'}</div><div class="sw-d">deepest fall across saved runs</div></div>`;
  }
  $('tabs').classList.remove('hidden'); $('tabs').classList.add('flex');
  $('editBtn').classList.remove('hidden'); $('editBtn').classList.add('inline-flex');
  $('tabBt').textContent = `📈 Backtests (${list.length})`;
  $('body').innerHTML =
    `<div id="secPicks">${picksCard(c)}</div>
     <div id="secBt" class="hidden">${paramsCard(c)}${historyTable(list)}</div>
     <div id="secRw" class="hidden">${rewindCard(c)}</div>`;
  fillForm(c);   // populate the editable form from the strategy config
  $('rwDate').value = SF_END || c.end || '';
  $('rwBtn').onclick = () => runRewind(c);
  $('tabPicks').onclick = () => setTab('picks');
  $('tabBt').onclick = () => setTab('bt');
  $('tabRw').onclick = () => setTab('rw');
  const t0 = new URLSearchParams(location.search).get('tab');
  setTab(t0 === 'backtests' ? 'bt' : t0 === 'rewind' ? 'rw' : 'picks');

  // 🎯 Live Picks wiring — instant baked view, then AUTO-upgrade to the FULL qualifying list
  // (every stock that passes the filters, ranked; market data loads once in the background)
  renderBakedPicks(c);
  renderFullPicks(c);
  $('pkFull').onclick = () => renderFullPicks(c);
  $('pkCsv').onclick = downloadPicksCSV;

  // ✏️ Edit Strategy → the builder in EDIT mode: 💾 updates THIS strategy in place (same id — its
  // backtests stay attached), never a duplicate. This is the Trendlyne Edit-screener semantics.
  $('editBtn').onclick = () => {
    localStorage.setItem('bt_load', JSON.stringify({ cfg: c, sid: strat.id, name: strat.name || '', view: 'edit' }));
    location.href = './stock-backtest.html';
  };

  // Run Backtest → hand the (tweaked) config to the fast builder, which auto-runs, records the result to
  // History WITH this strategy's id (sid), and it then nests back here under Run history. Tweaks never
  // create a new strategy. view:'run' = auto-run AND save (not view-only).
  $('runBtn').onclick = () => {
    const cfg = readForm(c);
    if (!cfg.start || !cfg.end || cfg.start >= cfg.end) { $('runNote').innerHTML = '<span class="neg">Pick a valid date range.</span>'; return; }
    localStorage.setItem('bt_load', JSON.stringify({ cfg, saved: null, view: 'run', sid: strat.id }));
    location.href = './stock-backtest.html';
  };
  // "edit filters →" carries the current form state into the full builder in EDIT mode too (filters are
  // edited there); saving updates this strategy in place.
  const ef = $('editFilters'); if (ef) ef.onclick = (e) => { e.preventDefault(); localStorage.setItem('bt_load', JSON.stringify({ cfg: readForm(c), sid: strat.id, name: strat.name || '', view: 'edit' })); location.href = './stock-backtest.html'; };
  // Each eye → open the saved result. 'snapshot' mode renders the stored full result INSTANTLY
  // (no 17 MB load, no recompute); if no snapshot exists yet it falls back to a one-time recompute
  // that then caches the snapshot, so the next open is instant.
  const byId = {}; list.forEach(b => byId[b.id] = b);
  $('body').querySelectorAll('[data-eye]').forEach(btn => btn.onclick = () => {
    const b = byId[btn.dataset.eye]; if (!b) return;
    localStorage.setItem('bt_load', JSON.stringify({ cfg: b.cfg, saved: null, view: 'snapshot' }));
    location.href = './stock-backtest.html';
  });
}

// Landing when there's no strategy to show: a stale/deleted link (hadId) or no ?id= at all.
// Instead of a dead end, offer the strategies this browser CAN open (names are untrusted — esc()).
function renderNotFound(all, hadId) {
  $('title').textContent = hadId ? 'Strategy not found' : 'Pick a strategy';
  const strats = (all || []).filter(s => s && s.id && s.cfg).sort((a, b) => (+b.ts || 0) - (+a.ts || 0)).slice(0, 12);
  const rows = strats.map(s => `<a href="?id=${encodeURIComponent(s.id)}" class="block rounded-xl border border-slate-200 bg-slate-50 p-4 hover:border-indigo-400 transition min-w-0">
      <div class="font-bold text-slate-900 text-sm truncate">${esc(s.name || 'Unnamed strategy')}</div>
      <div class="text-xs text-slate-500 mt-1 truncate">${esc(universeLabel(s.cfg))} · Top ${+s.cfg.topN || '?'} · ${esc(SORTL[s.cfg.sortBy] || s.cfg.sortBy || '')}</div>
    </a>`).join('');
  $('body').innerHTML = `<div class="card p-8 text-center">
      <div class="text-4xl mb-3">🎯</div>
      <div class="font-bold text-slate-900 mb-1">${hadId ? 'This strategy doesn’t exist any more' : strats.length ? 'Which strategy do you want to open?' : 'No strategies saved yet'}</div>
      <p class="text-xs text-slate-500 max-w-md mx-auto mb-5">${hadId ? 'It may have been renamed or deleted. ' : ''}Every saved strategy gets a page like this — its 🎯 live picks, 📈 backtest history and 🕘 rewind all live here.${strats.length ? '' : ' Build one in the strategy builder and it shows up in Saved Strategies.'}</p>
      ${strats.length ? `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 text-left mb-6">${rows}</div>` : ''}
      <div class="flex items-center justify-center gap-2 flex-wrap">
        <a href="./saved-strategies.html" class="inline-flex items-center gap-2 bg-indigo-600 text-white text-sm font-semibold px-5 py-2.5 rounded-xl hover:bg-indigo-700 transition">⭐ Saved Strategies</a>
        <a href="./stock-backtest.html" class="inline-flex items-center gap-2 border border-slate-300 text-sm font-semibold px-5 py-2.5 rounded-xl text-slate-700 hover:bg-slate-100 transition">🧪 Create a strategy</a>
      </div></div>`;
}

(async function boot() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id'), kParam = params.get('k');
  try { SF_END = (await (await fetch('./sf_meta.json')).json()).end || ''; } catch (e) {}   // tiny; default End date
  if (window.btSync) {
    try { await btSync.pullStrategies(); } catch (e) {}
    try { HIST = await btSync.pull() || []; } catch (e) { HIST = []; }
  }
  HIST = HIST.concat(loadLS('bt_private_history'));   // 🔒 private runs (this browser only) — display merge, never synced
  const all = loadLS('bt_strategies').concat(loadLS('bt_private_strategies'));   // 🔒 private strategies resolve by id/k too
  let strat = id ? all.find(s => s.id === id) : null;
  if (!strat && kParam) strat = all.find(s => identityKey(s.cfg) === kParam);
  if (!strat) { renderNotFound(all, !!(id || kParam)); return; }
  STRAT = strat;
  const k = identityKey(strat.cfg);
  const savedVars = all.filter(s => identityKey(s.cfg) === k);
  if (!savedVars.some(s => s.id === strat.id)) savedVars.push(strat);
  const sidSet = new Set(savedVars.map(s => s.id));
  // baked basket for the instant Live-Picks paint (tiny json; sid there = 'st'+hash36(RULE key — the
  // logger keys picks per rule, not per stock count, so use ruleKey here or nothing ever matches)
  try {
    const trk = await (await fetch('./live_tracking.json')).json();
    const tsid = 'st' + hash36(ruleKey(strat.cfg));
    const t = (trk.strategies || []).find(s => s.sid === tsid);
    if (t && t.latest) BAKED = { day: t.latest.day, picks: t.latest.picks || [], updated: trk.updated };
  } catch (e) {}
  renderStrategy(strat, backtestsFor(savedVars, sidSet));
})();
</script>
