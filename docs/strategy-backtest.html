<script>
'use strict';
const $ = id => document.getElementById(id);
const FREQ = { 1: 'Monthly', 3: 'Quarterly', 6: 'Half-yearly', 12: 'Yearly' };
const SORTL = { changePercent: 'Change % desc', rsi: 'RSI', d52: '% from 52w High', d52_low_pct: '% from 52w Low', indRank: 'Industry rank', mcap: 'Mcap', hist_mcap: 'Hist mcap', profitYoyPct: 'Net Profit Qtr Growth YoY %', profitBase: 'Net Profit (year-ago Q)', profitAccel: 'Profit-growth acceleration', profitTTM: 'Profit growth TTM %', profitStreak: 'Profit-growth streak', postDrift: 'Post-result drift %', composite: 'Quality-Momentum composite' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let HIST = [];
let SF_END = '';   // latest data date (tiny sf_meta.json) → default End date for the run form
// --- identity + backtest lookup: IDENTICAL semantics to saved-strategies.html so a strategy
//     resolves to exactly the same set of runs there and here. ---
// Identity + variant keys: IDENTICAL semantics to saved-strategies.html so this page shows exactly the
// runs that the merged Saved-Strategies row represents. Excludes topN (stock count is a variation) and
// normalizes boundary operators (<≡<=, >≡>=); the variant key (winKey) carries start+method+topN.
function identityKey(c) {
  const normOp = op => ({ '<=': '<', '>=': '>' }[op] || op);
  const f = (c.filters || []).map(x => x.field + normOp(x.op) + x.val).sort().join(',');
  return [c.indexName || '', c.mcapFloor || 0, c.freq, c.sortBy, c.dir, c.lookback || 1, c.earnBasis || 'con', f].join('|');
}
function winKey(c) { return (c.start || '') + '|' + (c.method || '') + '|' + (c.topN != null ? c.topN : ''); }
function windowEnd(c) { return (typeof SF !== 'undefined' && SF && SF.end) ? SF.end : (c.end || 'today'); }
function metricsFor(cfg) {
  const k = identityKey(cfg), wk = winKey(cfg);
  let best = null;
  for (const h of HIST) {
    if (!h.cfg || identityKey(h.cfg) !== k) continue;
    if (winKey(h.cfg) !== wk) continue;                 // same window + method + stock count
    if (h.m && h.m.cagr != null && (!best || (h.ts || 0) > (best.ts || 0))) best = h;
  }
  return best ? best.m : null;
}
function backtestsFor(savedVars) {
  if (!savedVars.length) return [];
  const k = identityKey(savedVars[0].cfg), byWin = new Map();
  const consider = (id, c, name, m, ts) => {
    const wk = winKey(c);                                         // window + method + stock count
    const score = (m && m.cagr != null ? 1e15 : 0) + (ts || 0);
    const prev = byWin.get(wk);
    if (!prev || score > prev._score) byWin.set(wk, { id, cfg: c, name, m: m || {}, _score: score });
  };
  for (const h of HIST) if (h.cfg && identityKey(h.cfg) === k) consider(h.id, h.cfg, h.label || h.name, h.m, h.ts);
  for (const v of savedVars) consider(v.id, v.cfg, v.name, metricsFor(v.cfg), v.ts);
  return [...byWin.values()].sort((a, b) => (b.m && b.m.cagr != null ? b.m.cagr : -1e9) - (a.m && a.m.cagr != null ? a.m.cagr : -1e9) || (a.cfg.start || '').localeCompare(b.cfg.start || ''));
}

// Universe dropdown options — index constituents + daily-turnover buckets + F&O (mirrors the builder).
function uniOptionsHTML() {
  const indices = ['Nifty 50', 'Nifty 100', 'Nifty 200', 'Nifty 500', 'Nifty Midcap 150', 'Nifty Smallcap 250'];
  let h = `<option value="">All stocks</option>`;
  h += `<optgroup label="Index constituents">` + indices.map(k => `<option value="${k}">${k}</option>`).join('') + `</optgroup>`;
  h += `<optgroup label="Min daily turnover">` + (typeof TURN_OPTS !== 'undefined' ? TURN_OPTS : [['500', '≥₹5 Cr']]).map(([v, l]) => `<option value="mcap:${v}">${l}</option>`).join('') + `</optgroup>`;
  h += `<optgroup label="Derivatives"><option value="__FNO__">F&O stocks</option></optgroup>`;
  return h;
}
function uniValue(c) { return c.indexName ? c.indexName : (c.mcapFloor ? 'mcap:' + c.mcapFloor : ''); }
const sortOptionsHTML = () => (typeof FIELDS !== 'undefined' ? FIELDS : []).map(f => `<option value="${f.v}">${esc(f.l)}</option>`).join('');
const sel = (id, opts, val) => `<select id="${id}" class="inp">${opts}</select>`;   // value set after insert

// TOP panel: an editable "Run a new backtest" form, pre-filled from the saved strategy (Trendlyne-style).
// Market data isn't loaded here — Run hands the (possibly edited) config to the fast builder, which loads
// data only when it runs, records the result to History, and it then nests back under this strategy's Run history.
function paramsCard(c) {
  const filt = filterExpr(c) || 'none';
  return `<div class="card p-5 mb-6">
    <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
      <div class="text-base font-bold text-slate-900">Run a new backtest</div>
      <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 rounded-full px-2.5 py-1">pre-filled from this strategy — tweak &amp; run</span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
      <div><label class="lbl">Rebalance frequency</label><select id="fFreq" class="inp"><option value="1">Monthly</option><option value="3">Quarterly</option><option value="6">Half-yearly</option><option value="12">Yearly</option></select></div>
      <div><label class="lbl">Start date</label><input id="fFrom" type="date" class="inp"></div>
      <div><label class="lbl">End date</label><input id="fTo" type="date" class="inp"></div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
      <div><label class="lbl">Universe</label><select id="fUni" class="inp">${uniOptionsHTML()}</select></div>
      <div><label class="lbl">Sort by</label><select id="fSort" class="inp">${sortOptionsHTML()}</select></div>
      <div><label class="lbl">Direction</label><select id="fDir" class="inp"><option value="high">Prefer High</option><option value="low">Prefer Low</option></select></div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <div><label class="lbl">Holdings (top-N)</label><input id="fTopN" type="number" min="1" max="1000" class="inp"></div>
      <div><label class="lbl">Capital (₹)</label><input id="fCap" type="number" class="inp"></div>
      <div><label class="lbl">Rebalance method</label><select id="fMethod" class="inp"><option value="reset">Reset to equal-weight</option><option value="hold">Hold winners · replace exits</option></select></div>
      <div><label class="lbl">Earnings basis</label><select id="fEarn" class="inp"><option value="con">Consolidated</option><option value="std">Standalone</option></select></div>
    </div>
    <div class="flex items-center justify-between flex-wrap gap-2 border-t border-slate-100 pt-3">
      <div class="text-[12px] text-slate-600 min-w-0"><span class="font-semibold text-slate-500">Filters:</span> <span class="mono break-words">${esc(filt)}</span> <a href="./stock-backtest.html" id="editFilters" class="text-indigo-600 hover:underline whitespace-nowrap">edit filters →</a></div>
      <button id="runBtn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5 py-2.5 text-sm font-semibold shadow-sm transition shrink-0">▶ Run Backtest</button>
    </div>
    <div id="runNote" class="text-[11px] text-slate-400 mt-2">Market data loads only when you run.</div>
  </div>`;
}
// Fill the form controls from the strategy config (called after the HTML is inserted).
function fillForm(c) {
  $('fFreq').value = c.freq || 1;
  $('fFrom').value = c.start || '2020-03-31';
  $('fTo').value = (SF_END || c.end || '');
  $('fUni').value = uniValue(c);
  $('fSort').value = c.sortBy; if ($('fSort').value !== c.sortBy) { const o = document.createElement('option'); o.value = c.sortBy; o.textContent = SORTL[c.sortBy] || c.sortBy; $('fSort').appendChild(o); $('fSort').value = c.sortBy; }
  $('fDir').value = c.dir || 'high';
  $('fTopN').value = c.topN || 5;
  $('fCap').value = c.capital || 100000;
  $('fMethod').value = c.method || 'reset';
  $('fEarn').value = c.earnBasis || 'con';
}
// Read the (edited) form back into a full config, PRESERVING the strategy's filters + lookback.
function readForm(base) {
  const u = $('fUni').value || '', isCap = u.slice(0, 5) === 'mcap:';
  const cfg = {
    ...base,
    start: $('fFrom').value, end: $('fTo').value,
    freq: +$('fFreq').value, indexName: isCap ? '' : u, mcapFloor: isCap ? +u.slice(5) : 0,
    sortBy: $('fSort').value, dir: $('fDir').value,
    topN: Math.max(1, +$('fTopN').value || 5), capital: +$('fCap').value || 100000,
    method: $('fMethod').value, earnBasis: $('fEarn').value,
    filters: (base.filters || []).slice(), mode: 'sf'
  };
  if (base.lookback != null) cfg.lookback = base.lookback;   // keep identity (see stock-backtest CUR_LOOKBACK)
  return cfg;
}

function historyTable(list) {
  if (!list.length) return '<div class="card p-8 text-center text-slate-400 text-sm">No saved backtests for this strategy yet.</div>';
  const rows = list.map(b => {
    const c = b.cfg, m = b.m || {};
    const cagr = (m.cagr != null) ? `<span class="font-bold ${m.cagr >= 0 ? 'pos' : 'neg'}">${pct(m.cagr)}</span>` : '<span class="text-slate-400">—</span>';
    const dd = (m.maxDD != null) ? `<span class="neg font-semibold">-${(+m.maxDD).toFixed(1)}%</span>` : '<span class="text-slate-400">—</span>';
    const fin = (m.finalV != null) ? `₹1L → ${fmtINR(m.finalV)}` : '—';
    const meth = c.method === 'reset' ? 'reset' : 'hold';
    return `<tr class="border-b border-slate-100 hover:bg-slate-50">
      <td class="px-4 py-3 whitespace-nowrap font-medium text-slate-700">${esc(c.start)} → ${esc(windowEnd(c))}</td>
      <td class="px-3 py-3"><span class="text-[10px] font-semibold text-indigo-600 bg-indigo-50 rounded px-1.5 py-0.5">top-${c.topN}</span></td>
      <td class="px-3 py-3"><span class="text-[10px] font-semibold text-slate-500 bg-slate-100 rounded px-1.5 py-0.5">${meth}</span></td>
      <td class="px-3 py-3 text-right text-sm">${cagr}</td>
      <td class="px-3 py-3 text-right text-sm">${dd}</td>
      <td class="px-3 py-3 text-right text-xs text-slate-500 whitespace-nowrap">${fin}</td>
      <td class="px-3 py-3 text-right"><button class="text-slate-400 hover:text-indigo-600 text-base" data-eye="${esc(b.id)}" title="View result">👁</button></td>
    </tr>`;
  }).join('');
  return `<div class="text-base font-bold text-slate-900 mb-2 flex items-center justify-between">
      <span>Run history</span><span class="text-xs font-normal text-slate-400">${list.length} backtest${list.length > 1 ? 's' : ''}</span></div>
    <div class="card overflow-x-auto"><table class="w-full text-sm border-collapse">
      <thead><tr class="text-[11px] uppercase tracking-wide text-slate-500 border-b border-slate-200 bg-slate-50">
        <th class="text-left font-semibold px-4 py-2.5">Period</th>
        <th class="text-left font-semibold px-3 py-2.5">Holdings</th>
        <th class="text-left font-semibold px-3 py-2.5">Method</th>
        <th class="text-right font-semibold px-3 py-2.5">CAGR</th>
        <th class="text-right font-semibold px-3 py-2.5">Max DD</th>
        <th class="text-right font-semibold px-3 py-2.5 whitespace-nowrap">₹1L grows to</th>
        <th class="text-right font-semibold px-3 py-2.5">View</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---- 🕘 REWIND: show ALL stocks that qualified for this strategy as of ANY past date ----
// (Trendlyne "Screener Rewind" analogue.) The heavy market data loads ONLY when Rewind is first used.
// (stockHref/stockLink come from backtest-engine.js — don't redeclare them here.)
let ENGINE_READY = false, ENGINE_LOADING = null;
async function ensureEngine(msgEl) {
  if (ENGINE_READY) return true;
  if (!ENGINE_LOADING) ENGINE_LOADING = loadEngineData(m => { if (msgEl && m) msgEl.textContent = m; })
    .then(() => { ENGINE_READY = true; }).catch(() => { ENGINE_LOADING = null; });
  await ENGINE_LOADING;
  return ENGINE_READY;
}
function rewindCard(c) {
  return `<div class="card p-5 mb-6" id="rewindCard">
    <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
      <div><div class="text-base font-bold text-slate-900">🕘 Rewind — qualifying stocks on a date</div>
        <div class="text-[12px] text-slate-500">Every stock that passed this strategy's filters on the chosen day, ranked. The Top ${c.topN} ⭐ are the picks.</div></div>
      <div class="flex items-end gap-2">
        <div><label class="lbl">As of date</label><input id="rwDate" type="date" class="inp" style="width:auto"></div>
        <button id="rwBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-semibold shadow-sm shrink-0">Show</button>
      </div>
    </div>
    <div id="rwMsg" class="text-xs text-slate-500">Pick a date and click <b>Show</b> — market data loads on first use.</div>
    <div id="rwOut" class="mt-3"></div>
  </div>`;
}
async function runRewind(c) {
  const btn = $('rwBtn'), msg = $('rwMsg'); btn.disabled = true;
  msg.textContent = 'Loading market data…';
  if (!await ensureEngine(msg)) { msg.innerHTML = '<span class="neg">Couldn’t load market data — try again.</span>'; btn.disabled = false; return; }
  const inp = $('rwDate'); inp.min = SF.start; inp.max = SF.end;
  let date = inp.value || SF.end; if (date < SF.start) date = SF.start; if (date > SF.end) date = SF.end; inp.value = date;
  const ranked = screenAsOf(c, date), topN = c.topN || 5;
  const sortL = SORTL[c.sortBy] || ((typeof FIELDS !== 'undefined' ? FIELDS.find(f => f.v === c.sortBy) : null) || {}).l || c.sortBy;
  msg.innerHTML = `As of <b>${esc(date)}</b> · <b>${ranked.length}</b> stock${ranked.length === 1 ? '' : 's'} qualified · Top ${topN} ⭐ = the picks · universe ${esc(universeLabel(c))}`;
  const fmtV = v => (v == null || isNaN(v)) ? '—' : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-IN') : (+v).toFixed(2));
  const rowsHtml = ranked.map((r, i) => `<tr class="border-b border-slate-50 ${i < topN ? 'bg-indigo-50/60' : ''}">
    <td class="py-1.5 pr-2 text-slate-400 whitespace-nowrap">${i + 1}${i < topN ? ' ⭐' : ''}</td>
    <td class="pr-3 font-semibold">${stockLink(r.sym, 'text-indigo-700 hover:underline')}</td>
    <td class="pr-3 text-slate-500 text-xs hidden sm:table-cell">${esc(r.ind || '')}</td>
    <td class="text-right px-2 font-semibold">${fmtV(fieldVal(r, c.sortBy))}</td>
    <td class="text-right px-2 ${r.chg >= 0 ? 'pos' : 'neg'}">${pct(r.chg)}</td>
    <td class="text-right px-2">${r.d52 == null ? '—' : r.d52.toFixed(2) + '%'}</td>
    <td class="text-right px-2">${r.d52low == null ? '—' : r.d52low.toFixed(2) + '%'}</td>
    <td class="text-right px-2">${r.rsi == null ? '—' : r.rsi.toFixed(2)}</td>
    <td class="text-right px-2">${r.price == null ? '—' : r.price.toFixed(2)}</td></tr>`).join('');
  $('rwOut').innerHTML = ranked.length ? `<div class="overflow-x-auto"><table class="w-full text-sm border-collapse">
    <thead><tr class="text-[11px] uppercase tracking-wide text-slate-500 border-b border-slate-200 bg-slate-50">
      <th class="text-left px-2 py-2">#</th><th class="text-left pr-3 py-2">Symbol</th><th class="text-left pr-3 py-2 hidden sm:table-cell">Industry</th>
      <th class="text-right px-2 py-2">${esc(sortL)}</th><th class="text-right px-2 py-2">Chg %</th><th class="text-right px-2 py-2">% 52wHi</th>
      <th class="text-right px-2 py-2">% 52wLo</th><th class="text-right px-2 py-2">RSI</th><th class="text-right px-2 py-2">Close ₹</th></tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>`
    : '<div class="text-center text-slate-400 text-sm py-6">No stocks qualified on this date.</div>';
  btn.disabled = false;
}

function renderStrategy(strat, list) {
  const c = strat.cfg;
  $('title').textContent = strat.name || 'Strategy';
  $('subtitle').innerHTML = `${esc(universeLabel(c))} · ${FREQ[c.freq] || c.freq + 'mo'} · Top ${c.topN} · ${esc(SORTL[c.sortBy] || c.sortBy)} ${c.dir === 'high' ? '↓' : '↑'}`;
  $('body').innerHTML = paramsCard(c) + rewindCard(c) + historyTable(list);
  fillForm(c);   // populate the editable form from the strategy config
  $('rwDate').value = SF_END || c.end || '';
  $('rwBtn').onclick = () => runRewind(c);

  // Run Backtest → hand the (edited) config to the fast builder, which auto-runs, records the result to
  // History, and it then nests back here under Run history. view:'run' = auto-run AND save (not view-only).
  $('runBtn').onclick = () => {
    const cfg = readForm(c);
    if (!cfg.start || !cfg.end || cfg.start >= cfg.end) { $('runNote').innerHTML = '<span class="neg">Pick a valid date range.</span>'; return; }
    localStorage.setItem('bt_load', JSON.stringify({ cfg, saved: null, view: 'run' }));
    location.href = './stock-backtest.html';
  };
  // "edit filters →" carries the current form state into the full builder (filters are edited there)
  const ef = $('editFilters'); if (ef) ef.onclick = (e) => { e.preventDefault(); localStorage.setItem('bt_load', JSON.stringify({ cfg: readForm(c), saved: null })); location.href = './stock-backtest.html'; };
  // Each eye → open the saved result. 'snapshot' mode renders the stored full result INSTANTLY
  // (no 17 MB load, no recompute); if no snapshot exists yet it falls back to a one-time recompute
  // that then caches the snapshot, so the next open is instant.
  const byId = {}; list.forEach(b => byId[b.id] = b);
  $('body').querySelectorAll('[data-eye]').forEach(btn => btn.onclick = () => {
    const b = byId[btn.dataset.eye]; if (!b) return;
    localStorage.setItem('bt_load', JSON.stringify({ cfg: b.cfg, saved: null, view: 'snapshot' }));
    location.href = './stock-backtest.html';
  });
}

function renderNotFound() {
  $('title').textContent = 'Strategy not found';
  $('body').innerHTML = '<div class="card p-8 text-center text-slate-500 text-sm">Couldn\'t find this strategy. <a href="./saved-strategies.html" class="text-indigo-600 hover:underline">← Back to Saved Strategies</a></div>';
}

(async function boot() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id'), kParam = params.get('k');
  try { SF_END = (await (await fetch('./sf_meta.json')).json()).end || ''; } catch (e) {}   // tiny; default End date
  if (window.btSync) {
    try { await btSync.pullStrategies(); } catch (e) {}
    try { HIST = await btSync.pull() || []; } catch (e) { HIST = []; }
  }
  const all = loadLS('bt_strategies');
  let strat = id ? all.find(s => s.id === id) : null;
  if (!strat && kParam) strat = all.find(s => identityKey(s.cfg) === kParam);
  if (!strat) { renderNotFound(); return; }
  const k = identityKey(strat.cfg);
  const savedVars = all.filter(s => identityKey(s.cfg) === k);
  renderStrategy(strat, backtestsFor(savedVars));
})();
</script>
</body>
</html>
