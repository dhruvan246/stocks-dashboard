<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STOCKSWORLD · Backtest History</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./theme.css" />
<script src="./theme.js"></script>
<script src="./bt-names.js"></script>
<script src="./bt-identity.js"></script>
<script src="./strategy-hover-card.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./bt-sync.js"></script>
<style>
  body{font-feature-settings:"tnum" 1}
  .pos{color:#15803d;font-weight:600}.neg{color:#b91c1c;font-weight:600}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:.75rem}
  /* keep long strategy names on the KPI tiles to one tidy line */
  .sw-stat .sw-d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* expand chevron rotates instead of swapping glyphs */
  .exparrow{display:inline-block;width:12px;color:var(--text-faint,#8b94a6);transition:transform .18s ease;font-size:10px}
  tr.isopen .exparrow{transform:rotate(90deg)}
  /* action buttons, themed via tokens so they work on light / soft / dark */
  .btn-load{
    font-size:11.5px;font-weight:700;padding:5px 13px;border-radius:999px;white-space:nowrap;
    color:var(--accent,#4f46e5);background:var(--accent-soft,rgba(79,70,229,.10));
    border:1px solid color-mix(in srgb, var(--accent,#4f46e5) 32%, transparent);
  }
  .btn-load:hover{background:color-mix(in srgb, var(--accent,#4f46e5) 20%, transparent)}
  .btn-del{
    font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;
    color:var(--neg,#b91c1c);background:transparent;
    border:1px solid color-mix(in srgb, var(--neg,#b91c1c) 30%, transparent);opacity:.85;
  }
  .btn-del:hover{background:color-mix(in srgb, var(--neg,#b91c1c) 12%, transparent);opacity:1}
  /* year-by-year panel inside the expand row */
  .yby-panel{border:1px solid var(--border,#e7eaf2);border-radius:var(--radius-sm,10px);background:var(--surface,#fff);padding:12px 14px}
  .yby-panel table td,.yby-panel table th{padding:3px 10px;white-space:nowrap}
  .yby-panel .rowlab{font-weight:700;font-size:11.5px}
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
  <div class="max-w-screen-xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
    <a href="./index.html" class="flex items-center gap-2.5 shrink-0 group">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 text-white flex items-center justify-center font-extrabold text-[13px] shadow-md group-hover:scale-105 transition">SW</span>
      <span class="font-bold text-slate-900 tracking-tight hidden sm:block">STOCKS<span class="text-indigo-600">WORLD</span></span>
    </a>
    <nav></nav>
  </div>
</header>

<main class="max-w-screen-xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
    <h1 class="text-xl md:text-2xl font-bold text-slate-900">Backtest History</h1>
    <button id="clearAll" class="text-xs text-red-600 hover:underline font-semibold">Clear all</button>
  </div>
  <p class="text-xs text-slate-500 mb-4">Shared backtest history, newest first — anyone can <b>run a backtest to add one</b>. Click a row for its year-by-year returns, or <b>Load</b> to re-open &amp; re-run the setup. <a href="./stock-backtest.html" class="text-indigo-600 hover:underline">← back to Backtest</a></p>
  <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4"></div>
  <div id="list"></div>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
function load(){try{const a=JSON.parse(localStorage.getItem('bt_history')||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x==='object'&&x.id):[];}catch(e){return[];}}
function save(v){localStorage.setItem('bt_history',JSON.stringify(v)); if(window.btSync)btSync.push();}
// The shared history is world-writable — treat EVERY field of a pulled entry as untrusted:
// esc() before injecting into HTML, and never call number methods without a finite check.
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(typeof v==='number'&&isFinite(v))?v:null;
const fmtINR=n=>num(n)==null?'—':'₹'+Math.round(n).toLocaleString('en-IN');
const pct=n=>num(n)==null?'—':(n>=0?'+':'')+n.toFixed(2)+'%';
const fdateD=ts=>{const t=num(ts);return t==null?'—':new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};
const fdateT=ts=>{const t=num(ts);return t==null?'':new Date(t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});};
const rel=ts=>{const t=num(ts);if(t==null)return'';const s=(Date.now()-t)/1e3;
  if(s<0)return'';if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';
  if(s<86400)return Math.round(s/3600)+'h ago';if(s<604800)return Math.round(s/86400)+'d ago';return'';};

/* ---------- the strategy hover card (strategy-hover-card.js) ----------
 * Hovering a run's strategy name opens the same card Saved Strategies and All Picks show: calendar
 * years across EVERY run of that strategy, then the four market-cycle windows from the baked
 * snapshot. Different question from the ▶ expander next to it, which shows THIS ONE RUN's own
 * year-by-year row — the card answers "how has this strategy done", the expander "what did this run
 * do". The module takes live getters, so the card always reads the history this page just re-pulled.
 * The snapshot is the only extra fetch, it happens after the first paint, and it fails silent — the
 * card then says the waves aren't baked rather than showing a wrong number. */
let BTH_SNAP = null;
scWire({ hist: () => load(), snap: () => BTH_SNAP });

function renderStats(items){
  if(!items.length){ $('stats').innerHTML=''; return; }
  let beat=0,scored=0,best=null;
  for(const it of items){const m=it.m||{},c=num(m.cagr),b=num(m.benchCagr);
    if(c!=null&&b!=null){scored++; if(c>=b)beat++;}
    if(c!=null&&(best==null||c>best.c))best={c,label:it.label,cfg:it.cfg};}
  const latest=items.find(it=>num(it.ts)!=null);   // items arrive sorted newest-first
  const hit=scored?Math.round(beat/scored*100):null;
  $('stats').innerHTML=`
    <div class="sw-stat"><div class="sw-lb">Backtests</div><div class="sw-v">${items.length}</div><div class="sw-d">in the shared history</div></div>
    <div class="sw-stat"><div class="sw-lb">Beat Nifty 500</div><div class="sw-v ${hit==null?'':(hit>=50?'pos':'neg')}">${scored?beat+' / '+scored:'—'}</div><div class="sw-d">${hit==null?'no scored runs yet':hit+'% of scored runs'}</div></div>
    <div class="sw-stat"><div class="sw-lb">Best CAGR</div><div class="sw-v ${best&&best.c<0?'neg':'pos'}">${best?pct(best.c):'—'}</div><div class="sw-d" title="${best?'Code-name: '+esc(nameWithBasis(best.label,best.cfg)):''}">${best?esc(strategyEnglish(best.cfg)||best.label||''):'run one to claim it'}</div></div>
    <div class="sw-stat"><div class="sw-lb">Latest run</div><div class="sw-v">${latest?(rel(latest.ts)||fdateD(latest.ts)):'—'}</div><div class="sw-d" title="${latest?'Code-name: '+esc(nameWithBasis(latest.label,latest.cfg)):''}">${latest?esc(strategyEnglish(latest.cfg)||latest.label||''):''}</div></div>`;
}

function render(){
  // Always show newest-first by saved time — the shared array's stored order can drift
  // (concurrent appends, whole-array owner rewrites). ts is untrusted: num() guards it,
  // entries with a missing/invalid ts sink to the bottom.
  const items=load().sort((a,b)=>(num(b.ts)||0)-(num(a.ts)||0));
  renderStats(items);
  if(!items.length){
    $('list').innerHTML=`<div class="card p-10 text-center">
      <div class="text-4xl mb-3">📜</div>
      <div class="font-bold text-slate-900 mb-1">No backtests yet</div>
      <p class="text-xs text-slate-500 mb-5 max-w-sm mx-auto">Every backtest anyone runs lands here automatically — strategy, period, CAGR and how it did against the Nifty 500.</p>
      <a href="./stock-backtest.html" class="inline-flex items-center gap-2 bg-indigo-600 text-white text-sm font-semibold px-5 py-2.5 rounded-xl hover:bg-indigo-700 transition"><svg class="sw-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg> Run the first backtest</a>
    </div>`; return; }
  YRG.clear();   // rebuilt by scRegister below, as the rows are laid out
  $('list').innerHTML=`<div class="card"><div class="overflow-x-auto tscroll" style="--tscroll-h:38rem"><table class="w-full text-sm">
    <thead class="text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-200"><tr>
      <th class="text-left py-2.5 px-4 font-semibold">Saved</th><th class="text-left px-3 font-semibold">Strategy</th>
      <th class="text-right px-3 font-semibold">CAGR</th><th class="text-right px-3 font-semibold">vs Nifty 500</th>
      <th class="text-right px-3 font-semibold">Max DD</th><th class="text-right px-3 font-semibold">Final ₹1L</th><th class="px-4"></th></tr></thead>
    <tbody>${items.map(it=>{const m=it.m||{},c=it.cfg||{},beat=num(m.benchCagr)!=null&&num(m.cagr)!=null&&m.cagr>=m.benchCagr;
      // hover target → this run's strategy. `sid` (when the run carries one) lets the card pick up
      // sibling runs launched from the strategy page even if their config was edited since.
      scRegister(it.id, { id: it.id, name: it.label, cfg: c, ts: it.ts }, new Set(it.sid ? [it.sid] : []));
      const hasY=Array.isArray(it.yby)&&it.yby.length, r=rel(it.ts), mult=num(m.finalV)!=null?(m.finalV/1e5):null;
      return `<tr class="border-b border-slate-50 ${hasY?'cursor-pointer':''}" ${hasY?`data-exp="${esc(it.id)}"`:''}>
        <td class="px-4 py-2.5 whitespace-nowrap"><div class="flex items-center gap-2">
          <span class="exparrow">${hasY?'▶':''}</span>
          <div><div class="sw-cellmain text-[13px]">${fdateD(it.ts)}</div><div class="sw-cellsub">${esc(fdateT(it.ts))}${r?' · '+r:''}</div></div>
        </div></td>
        <td class="px-3"><div class="sw-cellmain text-[13px]" data-yrs="${esc(it.id)}" title="Code-name: ${esc(nameWithBasis(it.label,c))}">${esc(strategyEnglish(c)||it.label||'—')}</div><div class="sw-cellsub">${esc(c.start||'?')} → ${esc(c.end||'?')}</div></td>
        <td class="text-right px-3 ${(num(m.cagr)||0)>=0?'pos':'neg'}">${pct(m.cagr)}</td>
        <td class="text-right px-3 whitespace-nowrap"><span class="sw-chip ${beat?'pos':'neg'}" title="Nifty 500 CAGR over the same period — ${beat?'strategy beat it':'strategy lagged it'}"><span class="sw-dot"></span>${pct(m.benchCagr)}</span></td>
        <td class="text-right px-3 neg">${num(m.maxDD)!=null?'-'+m.maxDD.toFixed(2)+'%':'—'}</td>
        <td class="text-right px-3"><div class="font-semibold">${fmtINR(m.finalV)}</div>${mult!=null?`<div class="sw-cellsub text-right">${mult.toFixed(1)}×</div>`:''}</td>
        <td class="px-4 py-2 whitespace-nowrap text-right">
          <button class="btn-load" data-load="${esc(it.id)}">Load ↗</button>
          ${OWNER?`<button class="btn-del ml-1.5" data-del="${esc(it.id)}">Delete</button>`:''}</td></tr>${hasY?`
      <tr id="exp_${esc(it.id)}" style="display:none"><td colspan="7" class="px-4 pb-4 pt-1 bg-slate-50">
        <div class="yby-panel">
          <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
            <div class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Calendar-year returns — strategy vs Nifty 500</div>
            ${(w=>w.n?`<span class="sw-chip ${w.won>=w.n/2?'pos':'neg'}"><span class="sw-dot"></span>beat Nifty in ${w.won} of ${w.n} yrs</span>`:'')(
              it.yby.reduce((a,y)=>{const s=num(y&&y[1]),b=num(y&&y[2]);if(s!=null&&b!=null){a.n++;if(s>=b)a.won++;}return a;},{n:0,won:0}))}
          </div>
          <div class="overflow-x-auto"><table class="text-xs"><thead><tr><th class="text-left"></th>${it.yby.map(y=>`<th class="text-right text-slate-500 font-semibold">${esc(y&&y[0])}</th>`).join('')}</tr></thead><tbody>
            <tr><td class="rowlab text-blue-700 whitespace-nowrap">Strategy</td>${it.yby.map(y=>`<td class="text-right ${(num(y&&y[1])||0)>=0?'pos':'neg'}">${pct(y&&y[1])}</td>`).join('')}</tr>
            <tr><td class="rowlab text-amber-600 whitespace-nowrap">Nifty 500</td>${it.yby.map(y=>`<td class="text-right ${(num(y&&y[2])||0)>=0?'pos':'neg'}">${pct(y&&y[2])}</td>`).join('')}</tr>
          </tbody></table></div>
        </div></td></tr>`:''}`;}).join('')}
    </tbody></table></div></div>`;
  scAttach($('list'));   // hover a strategy name → its years + market cycles
  $('list').querySelectorAll('[data-exp]').forEach(row=>row.addEventListener('click',e=>{ if(e.target.closest('button'))return; const d=$('exp_'+row.dataset.exp); if(!d)return; const open=d.style.display==='none'; d.style.display=open?'table-row':'none'; row.classList.toggle('isopen',open); }));
  $('list').querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const it=load().find(x=>x.id===b.dataset.load); if(it){localStorage.setItem('bt_load',JSON.stringify({cfg:it.cfg, saved:{m:it.m, yby:it.yby, label:it.label}})); location.href='./stock-backtest.html';}});
  $('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{save(load().filter(x=>x.id!==b.dataset.del)); render();});
}
const OWNER = !!(window.btSync && btSync.isOwner());
if($('clearAll') && !OWNER) $('clearAll').style.display='none';   // visitors can add, but not erase via the UI
$('clearAll').onclick=()=>{ if(confirm('Clear the ENTIRE shared history for everyone?')){ save([]); render(); } };

// Paint the cached history immediately (pull() persists it to localStorage), THEN refresh from the
// shared pull — so a cold/slow free-tier DB waking up never leaves the page blank while it responds.
render();
(async()=>{ if(!window.btSync) return;
  try{ await btSync.pull(); }catch(e){}
  render();
  try{ BTH_SNAP = await btSync.snapGet('waves'); }catch(e){ BTH_SNAP = null; }   // hover card's market cycles
})();
</script>
</body>
</html>
