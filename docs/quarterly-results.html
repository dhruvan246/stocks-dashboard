async function load(){
  try{
    const [qr,cal,feed,bse,vfill,rbase]=await Promise.all([
      // ⚠️ MUST cache-bust like the siblings below: the numbers map is what the feed's "numbers being
      // parsed" state checks against. Without ?t, the browser serves a STALE co map while the feed loads
      // fresh, so results whose numbers ALREADY landed (RBLBANK, FEDERALBNK, HAVELLS…) render as pending.
      fetch('./quarterly_results.json?t='+Date.now()).then(r=>{ if(!r.ok) throw new Error('quarterly_results HTTP '+r.status); return r.json(); }),
      fetch('./results_calendar.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('./results_feed.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('./bse_results.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),  // BSE-listed-only companies (cache-bust so fresh numbers always load)
      fetch('./vision_fills.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),  // NSE vision overlay (fills gaps until XBRL lands)
      fetch('./fund_rbase.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)    // restated comparative bases (§214b)
    ]);
    QR=qr; CAL=cal; FEED=feed; QTRS=qr.quarters; CO=qr.co;
    // CALENDAR RULE (runbook §218, user 2026-10-04): from a quarter's first calendar day (IST) the newest column is
    // that quarter, with zero results filed if nobody has filed yet. The payload adopts it on its next rebuild; this
    // opens it from midnight so the page never waits for a CI run (or a first filing) to show the new quarter.
    (function(){ const ist=new Date(Date.now()+330*60000), y=ist.getUTCFullYear(), md=(ist.getUTCMonth()+1)*100+ist.getUTCDate();
      const want=md>=1001?y*10000+930:md>=701?y*10000+630:md>=401?y*10000+331:(y-1)*10000+1231;   // latest quarter-end before today
      const nextQ=q=>{ const yy=Math.floor(q/10000), m=q%10000; return m===1231?(yy+1)*10000+331:yy*10000+({331:630,630:930,930:1231})[m]; };
      let n=0; while(QTRS.length&&QTRS[0]<want&&n<4){ QTRS.unshift(nextQ(QTRS[0])); for(const k in CO){ if(Array.isArray(CO[k].q)) CO[k].q.unshift(null); } n++; }
      if(n) console.log('opened '+n+' new quarter column(s) by the calendar: '+QTRS[0]);
    })();
    // Merge BSE-only companies (not on NSE) as first-class rows; never shadow an existing NSE symbol.
    // build_bse_results.py aligns their q-arrays to qr.quarters, but the two files are rebuilt by different
    // jobs: on the day the quarter list moves (a new quarter opens on its first calendar day, runbook §218)
    // they differ for a while. Re-align BY QUARTER instead of dropping every BSE-only company until then.
    const bseSame=bse&&JSON.stringify(bse.quarters)===JSON.stringify(qr.quarters);
    const bseIx={}; ((bse&&bse.quarters)||[]).forEach((q,i)=>bseIx[q]=i);
    const bseAlign=row=>bseSame?row:qr.quarters.map(q=>bseIx[q]==null?null:(row[bseIx[q]]||null));
    if(bse&&bse.co){
      let added=0; for(const k in bse.co){ if(!CO[k]){ const c=bse.co[k]; if(!bseSame) c.q=bseAlign(c.q||[]); CO[k]=c; added++; } }
      BSE_COUNT=added;
      if(!bseSame) console.log('bse_results quarters differ from quarterly_results — re-aligned by quarter');
    }
    if(bse&&bse.pdf_only) PDF_ONLY=new Set(bse.pdf_only);   // filed but not machine-readable → label honestly
    // DUAL-LISTED OVERLAY: a BSE scrip whose ticker is also an NSE symbol can't be merged into CO as a
    // row (it would shadow the NSE company), but its numbers are still real. build_bse_results emits
    // them separately; apply them to EMPTY cells only — same rule as vision_fills below, so a real
    // NSE/XBRL value always supersedes. Without this, 47 tickers / 140 quarter-cells were unreachable
    // and the biggest names on the "+N coming" list (FREDUN, KMCSHIL, INDOKEM, MIIL…) stayed pending
    // forever despite having been read months earlier. See runbook §17d.
    if(bse&&bse.nse_overlay){   // keyed by quarter (oqix), so a differing quarter list is harmless
      const oqix={}; qr.quarters.forEach((q,i)=>oqix[q]=i);
      let ocells=0;
      for(const sym in bse.nse_overlay){ const c=CO[sym]; if(!c) continue;
        for(const qk in bse.nse_overlay[sym]){ const qi=oqix[+qk]; if(qi==null) continue;
          const cur=c.q[qi], o=bse.nse_overlay[sym][qk];
          if(!cur||!(cur[0]!=null||cur[2]!=null||cur[3]!=null||cur[5]!=null)){ c.q[qi]=o; c.bsefill=1; ocells++; continue; }
          // a PARTIAL cell (profit parsed, revenue missing): fill only its empty slots, per basis, and only
          // where the stored profit agrees with the overlay's — one filing, never two reads mixed (§219)
          const r=cur.slice(); let n=0;
          [0,3].forEach(b=>{ if(r[b+2]==null||!samePat(r[b+2],o[b+2])) return;
            [0,1,2].forEach(k=>{ if(r[b+k]==null&&o[b+k]!=null){ r[b+k]=o[b+k]; n++; } }); });
          if(n){ c.q[qi]=r; c.bsefill=1; ocells++; } } }
      if(ocells) console.log('bse overlay: filled '+ocells+' empty cells on dual-listed tickers');
    }
    // NSE vision overlay: fill a company's quarter cell ONLY when it has no parsed number yet, so the
    // authoritative XBRL always supersedes the vision estimate the moment it lands. q row layout:
    // [revS,opS,patS,revC,opC,patC,ann,rx,sr].
    FEEDROWS=(feed&&feed.rows||[]).slice();
    if(vfill){ const qix={}; QTRS.forEach((q,i)=>qix[q]=i);
      const fname={}; FEEDROWS.forEach(r=>{ if(!fname[r[0]]) fname[r[0]]=r[1]; });
      for(const sym in vfill){ let c=CO[sym];
        if(!c){                                             // orphan: NSE filer with no price-universe row
          if(!fname[sym]) continue;                         // need a display name (from the feed)
          c=CO[sym]={ n:fname[sym], s:'', m:0, orphan:1, q:QTRS.map(()=>null) }; BSE_COUNT+=0;
        }
        for(const qk in vfill[sym]){ const qi=qix[+qk]; if(qi==null) continue;
          const cur=c.q[qi];
          const f=vfill[sym][qk], rev=f.rev==null?null:+f.rev, pat=f.pat==null?null:+f.pat, op=f.op==null?null:+f.op;
          // A real number in the estimate's basis wins. But a PARTIAL cell — profit parsed, revenue/OP empty —
          // used to be skipped whole, leaving Sales blank beside a Net profit (HIIL Jun-2026: PAT 36.62 stored,
          // the vision read of the SAME filing had revenue 116.02). Fill its empty slots when the stored profit
          // agrees with the estimate's (= same filing); a disagreeing profit means a different read → skip (§219).
          const bb=f.basis==='S'?0:3;
          if(cur&&(cur[2]!=null||cur[5]!=null)&&!(cur[bb+2]!=null&&samePat(cur[bb+2],pat))) continue;
          // Into the estimate's OWN basis slots only (a con estimate in the std slot made std YoY compare
          // it with a real std base — GOLDSTAR +1955% vs −127% same-basis), filling only empty slots so a
          // real revenue/OP already parsed stays, and keeping the row's real ann/rx/sr. No invented date:
          // vision_fills carries none (the old "+qk===20260630?20260715" stamped 15-Jul on every June cell).
          const r=cur?cur.slice():[null,null,null,null,null,null,null,null,null], b=f.basis==='S'?0:3;
          [rev,op,pat].forEach((v,k)=>{ if(v!=null&&r[b+k]==null) r[b+k]=v; });
          if(f.prov===1&&!cur) r[9]=1;                     // §222c: an SME half the vision read made — provisional (§195)
          c.q[qi]=r; c.vfill=1;
        } } }
    // §214b: each company's restated comparative bases ride on its q array (survives the calendar unshift — same array)
    if(rbase){ let n=0; for(const sym in rbase){ const c=CO[sym]; if(sym[0]!=='_'&&c&&Array.isArray(c.q)){ c.q.rbase=rbase[sym]; n++; } }
      if(n) console.log('restated comparative bases on '+n+' companies'); }
    liveKeys=new Set(FEEDROWS.map(feedKey));
    $('updatedBox').textContent='Numbers '+qr.updated+' · prices as of '+qr.asof;
    const p=new URLSearchParams(location.search);
    if(p.get('tab')&&['overview','results','feed','calendar','season'].includes(p.get('tab'))) ST.tab=p.get('tab');
    // Deep link: ?tab=results&qe=20260630&uni=n500 pre-selects that quarter + universe
    // (what the Season Trends quarter click-through writes to the URL, so it's shareable).
    const uq=p.get('uni');
    if(uq&&['all','n50','n100','n500','m150','s250','mc250','fno','nse','bse','watch','smeipo','smeemerge'].includes(uq)) ST.uni=uq;
    if(ST.uni==='smeipo'){ try{ await loadSmeIpo(); }catch(e){ ST.uni='all'; } }
    if(ST.uni==='smeemerge'){ try{ await loadSmeEmerge(); }catch(e){ ST.uni='all'; } }
    const dqi=QTRS.indexOf(+(p.get('qe')||0));
    if(dqi>=0&&dqi<Math.min(8,QTRS.length-4)) ST.qi=dqi;
    // ?uniIdx=Nifty%20Bank → filter by that index's current member list (from results_season.json,
    // fetched here only when the param is present — the season click-through writes these URLs).
    const idxKey=p.get('uniIdx');
    if(idxKey){ try{
      const d=await fetch('./results_season.json?t='+Date.now()).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
      const u=(d.universes||[]).find(x=>x.key===idxKey);
      if(u&&u.members&&u.members.length) setIdxUniverse(u.key,u.label,u.members);
    }catch(e){} }
    // The view's own settings, so a copied link reopens the same screen
    renderSectorSel();
    const has=(sel,v)=>[...$(sel).options].some(o=>o.value===v);
    if(p.get('sector')!=null&&has('selSector',p.get('sector'))){ ST.sector=p.get('sector'); $('selSector').value=ST.sector; }
    if(['l','m','s'].includes(p.get('mcap'))){ ST.mcap=p.get('mcap'); $('selMcap').value=ST.mcap; }
    if(p.get('mode')==='qoq') ST.mode='qoq';
    if(['con','std'].includes(p.get('basis'))) ST.basis=p.get('basis');
    if(SCREENS.some(s=>s[0]===p.get('screen'))) ST.screen=p.get('screen');
    if(SORTS[p.get('sort')]) ST.sort={k:p.get('sort'),dir:(p.get('sort')==='sym'?1:-1)};
    if(p.get('rev')==='1') ST.sort.dir=-ST.sort.dir;
    if(p.get('cal')==='both') ST.cal='both';
    if(['rev','rx'].includes(p.get('heat'))) ST.heat=p.get('heat');
    if(p.get('su')) RS_WANT=p.get('su');
    if(p.get('sm')==='total') RS_MODE='total';
    if(['3y','5y','all'].includes(p.get('sp'))) RS_PERIOD=p.get('sp');
    if(p.get('chart')==='price') CHART='px';
    // ?sym=TCS selects that company (the old page opened a pop-up); with no tab named it opens in All Results
    const sy=(p.get('sym')||'').toUpperCase();
    if(sy&&CO[sy]){ CUR.sym=sy; CUR.k=sy; CUR.pin=true; if(!p.get('tab')) ST.tab='results'; }
    $('selUni').value=ST.uni; wire();
    $('status').classList.add('hidden'); $('app').classList.remove('hidden');
    render();
    const on=$('lList').querySelector('.os-row.on'); if(on) on.scrollIntoView({block:'center'});
    liveTopUp(); setInterval(()=>{ if(!document.hidden) liveTopUp(); },60000);
  }catch(e){
    $('status').innerHTML='Could not load results data ('+esc(e.message)+'). Please try again in a minute.';
  }
}
load();
</script>
</body>
</html>
