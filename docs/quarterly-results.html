<html lang="en">

<style>
  body{font-feature-settings:"tnum" 1}
  html[data-theme] .pos{color:var(--pos)} html[data-theme] .neg{color:var(--neg)}
  :root{--rs1:#0284c7;--rs2:#059669;--rs3:#d97706}
  html[data-theme="dark"]{--rs1:#38bdf8;--rs2:#34d399;--rs3:#fbbf24}
  #grid{grid-template-columns:minmax(300px,30%) minmax(270px,25%) minmax(0,1fr)}
  #grid.focus{grid-template-columns:minmax(0,1fr)}   /* the page's own #grid columns would otherwise outrank the kit's .os-grid.focus */
  #grid[data-view="results"] #lHead,.lr-results{grid-template-columns:minmax(0,1fr) 60px 60px 56px 68px}
  #grid[data-view="feed"] #lHead,.lr-feed{grid-template-columns:minmax(0,1fr) 62px 62px 58px}
  #grid[data-view="calendar"] #lHead,.lr-calendar{grid-template-columns:minmax(0,1fr) 84px 44px}
  #grid[data-view="overview"] #lHead,.lr-overview{grid-template-columns:minmax(0,1fr) 62px 62px 56px 44px}
  #grid[data-view="season"] #lHead,.lr-season{grid-template-columns:minmax(0,1fr) 46px 54px 54px 54px}
  .lr-pend{grid-template-columns:minmax(0,1fr) auto}
  .os-row > span:not(:first-child){text-align:right;white-space:nowrap}
  .vdot{display:inline-block;width:8px;height:8px;border-radius:9999px;vertical-align:middle;margin-right:6px}
  .nov{display:inline-block;width:8px;margin-right:6px;color:var(--text-faint);text-align:center}
  sup.rb{color:var(--text-faint);font-size:9px;margin-left:1px}
  .star{cursor:pointer;font-size:16px;color:var(--text-faint);user-select:none} .star.on{color:#f59e0b}
  .sec{padding:6px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--text-muted);display:flex;justify-content:space-between;position:sticky;top:0;z-index:1}
  .sec.today{color:var(--accent-text)} .sec i{font-style:normal;font-weight:400;color:var(--text-faint)}
  .sec.sub{position:static;background:none;font-weight:500;color:var(--text-faint)}
  .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:13px}
  .kv > span{color:var(--text-muted);white-space:nowrap} .kv > b{font-weight:600;color:var(--text);text-align:right;overflow-wrap:anywhere}
  .kv > b small{display:block;font-weight:400;font-size:11.5px;color:var(--text-faint)}
  .kv[data-go]{cursor:pointer} .kv[data-go]:hover{background:var(--surface-2)}
  .det{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.5;color:var(--text-muted);overflow-wrap:anywhere}
  .dh{padding:9px 12px 6px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border)}
  .act{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;border-bottom:1px solid var(--border)}
  .bb{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted)}
  .bb div:first-child{display:flex;justify-content:space-between;margin-bottom:5px}
  .bb .t{display:flex;height:8px;background:var(--surface-2)} .bb .t i{display:block;height:100%}
  .mv{grid-template-columns:minmax(0,1fr) 64px}
  .ft,.qt{width:100%;border-collapse:collapse;font-size:12px}
  .ft td,.qt td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);color:var(--text)}
  .ft td:first-child,.qt td:first-child{text-align:left;color:var(--text-muted);font-weight:600;padding-left:12px;position:sticky;left:0;background:var(--surface)}
  .ft tr.fh td,.qt tr.h td{font-size:11px;color:var(--text-faint);font-weight:500;background:var(--surface-2)}
  .qt td.cur{background:var(--accent-soft)} .qt tr.h td.cur{color:var(--accent-text);font-weight:600}
  .qt small{font-size:10.5px;margin-left:5px}
  #cTbl{border-top:1px solid var(--border);overflow:auto;flex:0 1 auto;max-height:46%;scrollbar-width:thin}
  #cWrap{min-height:170px}
  #lHead span{white-space:nowrap}
  #qc,#rsChart,#ovC{position:absolute;inset:0}
  #rsChart{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin} #ovC{overflow-y:auto;scrollbar-width:thin}
  #qc svg,#rsChart svg{display:block}

  #qc text.lb{font-size:11.5px;fill:var(--text-faint)}

  #rsLegend{display:inline-flex;gap:12px;font-size:12px;color:var(--text-muted);align-items:center}

  .hb{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 62px;gap:10px;align-items:center;height:27px;padding:0 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:12.5px;box-shadow:inset 2px 0 0 transparent}
  .hb:hover{background:var(--surface-2)} .hb.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}

  #lFoot{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--border)} #lFoot.hidden{display:none}
  html[data-theme] .os-sg.hidden{display:none}
  html[data-theme] .os-bar select,html[data-theme] .os-bar input[type="search"]{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12.5px;color:var(--text);min-height:0;height:auto;max-width:190px}

<script>
'use strict';
const K=window.OSKit;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const PDF_PREFIX = 'https://nsearchives.nseindia.com/corporate/';
const WORKER = 'https://stocksworld-quotes.dhruvan2510.workers.dev';
const MONTHS = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// YYYY-MM-DD of (today + n days) in India — feed/calendar dates are IST days (runbook §218b)
const istDay=n=>new Date(Date.now()+330*60000+n*864e5).toISOString().slice(0,10);
let QR=null, CAL=null, FEED=null, QTRS=[], CO=null, BSE_COUNT=0, PDF_ONLY=new Set();
const ST = { tab:'overview', qi:0, mode:'yoy', basis:'auto', uni:'all', mcap:'all', sector:'all',
             search:'', screen:'all', heat:'pat', cal:'conf', sort:{k:'ann',dir:-1}, shown:100,
             uniSet:null, uniName:'' };   // uni:'idx' → filter by uniSet (a season-universe member list)
let WATCH = new Set(); try{ WATCH = new Set(JSON.parse(localStorage.getItem('qr_watch')||'[]')); }catch(e){}
/* Stars here are BRIDGED to the site-wide synced ⭐ Watchlist (sw-watchlist.js):
   toggling a star on this page adds/removes it there too, and vice versa.
   qr_watch stays as a local mirror (and one-time seed for pre-bridge stars). */
const saveWatch = () => {
  try{ localStorage.setItem('qr_watch', JSON.stringify([...WATCH])); }catch(e){}
  try{
    if(!window.swWatch || !swWatch.list()) return;
    const cur = new Set(swWatch.list().map(e=>e.s));
    WATCH.forEach(s=>{ if(!cur.has(s)) swWatch.toggle(s); });
    cur.forEach(s=>{ if(!WATCH.has(s)) swWatch.toggle(s); });
  }catch(e){}
};
const paintStars = () => document.querySelectorAll('[data-star]').forEach(el=>el.classList.toggle('on', WATCH.has(el.getAttribute('data-star'))));
(function bridgeWatch(){
  if(!window.swWatch){ setTimeout(bridgeWatch, 250); return; }
  swWatch.load().then(()=>{
    try{
      if(!localStorage.getItem('qr_watch_migrated')){           // one-time: old local stars → shared list
        [...WATCH].forEach(s=>{ if(!swWatch.has(s)) swWatch.toggle(s); });
        localStorage.setItem('qr_watch_migrated','1');
      }
    }catch(e){}
    WATCH = new Set(swWatch.list().map(e=>e.s));
    try{ localStorage.setItem('qr_watch', JSON.stringify([...WATCH])); }catch(e){}
    paintStars();
  });
  document.addEventListener('sw-watch-change', ()=>{
    WATCH = new Set(swWatch.list().map(e=>e.s));
    try{ localStorage.setItem('qr_watch', JSON.stringify([...WATCH])); }catch(e){}
    paintStars();
  });
})();

/* ---------- formatting ---------- */
function qlabel(qe, long){
  const y=Math.floor(qe/10000), m=Math.floor(qe/100)%100;
  const fy=(m>=4? y+1 : y)%100, qn={6:1,9:2,12:3,3:4}[m];
  return long ? MONTHS[m]+' '+y+' · Q'+qn+' FY'+fy : MONTHS[m]+"’"+String(y).slice(2);
}
function fmtCr(v){
  if(v==null) return '—';
  const a=Math.abs(v);
  if(a>=100000) return (v/100000).toFixed(2)+' L cr';
  const s=a>=100? Math.round(v).toLocaleString('en-IN') : v.toFixed(a>=10?1:2);
  return s;
}
function fmtPct(v,dp){
  if(v==null) return '—';
  return (v>0?'+':'')+v.toFixed(dp==null?1:dp)+'%';
}
function pctCls(v){ return v==null?'text-slate-400':(v>0?'pos':(v<0?'neg':'text-slate-500')); }
function fmtMcap(v){ return v>=100000 ? (v/100000).toFixed(2)+' L cr' : Math.round(v).toLocaleString('en-IN')+' cr'; }
function fmtDate8(a){ if(!a) return '—'; const s=String(a); return s.slice(6,8)+' '+MONTHS[+s.slice(4,6)]+' '+s.slice(2,4); }
/* A feed row may appear under quarter Q ONLY when it was FILED after Q ended — results can't be
   declared before the quarter closes, for ANY quarter. Guards two paths: qe===0 rows shown on the
   live quarter (stale unresolved leftovers from last month = the 2026-07-21 "June dates on the June
   quarter" bug), and qe-labelled rows whose caption/ledger quarter is impossibly ahead of the filing
   date (a mislabel — the writers also demote those to qe=0 at write time, this is the belt). */
function filedAfterQE(r,qeSel){ const s=String(qeSel); return r[2].slice(0,10) > s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); }
function isoNice(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}); }
function median(arr){ if(!arr.length) return null; const a=[...arr].sort((x,y)=>x-y); const m=a.length>>1; return a.length%2? a[m] : (a[m-1]+a[m])/2; }
/* search match ignoring case, spaces and punctuation: "cellaspace" matches "Cella Space Ltd" */
function normSearch(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

/* ---------- growth engine ---------- */
/* q row layout: [revS,opS,patS,revC,opC,patC,ann,rx,sr] */
const IDX = { rev:{s:0,c:3}, op:{s:1,c:4}, pat:{s:2,c:5} };
function pick(row, metric){                       // -> [value, basisUsed] honouring ST.basis
  if(!row) return [null,null];
  const ix=IDX[metric];
  if(ST.basis==='con') return [row[ix.c],'c'];
  if(ST.basis==='std') return [row[ix.s],'s'];
  return row[ix.c]!=null ? [row[ix.c],'c'] : [row[ix.s],'s'];
}
// RESTATED COMPARATIVE BASE (runbook §214b, user policy A 2026-11-17): the figure the company printed for quarter bq
// beside quarter fq's current figure in fq's own filing (docs/fund_rbase.json, attached as qarr.rbase; rule in
// scripts/rbase.py — the same in stock.html and both backtest engines). Used only while the current figure in use is
// the one it was printed beside. Levels on the page stay as first filed.
const RB_TIP='Against the comparative figure as restated in this quarter’s own filing (the earlier quarter keeps the figure first filed)';
function rbBase(rbase, fq, bq, b, metric, cv){
  const e=rbase&&rbase[fq+'|'+bq], v=e&&e[b]&&e[b][metric];
  if(!Array.isArray(v)||cv==null||Math.abs(cv-v[1])>Math.max(0.015,0.002*Math.abs(v[1]))) return null;
  return v[0];
}
function growth(qarr, qi, metric, lag){           // same-basis growth; returns {pct,flag,cur,base,rb}
  const cur=qarr[qi], base=qarr[qi+lag];
  if(!cur||!base) return null;
  const ix=IDX[metric];
  let order = ST.basis==='con' ? ['c'] : ST.basis==='std' ? ['s'] : ['c','s'];
  for(const b of order){
    const cv=cur[ix[b]], rv=rbBase(qarr.rbase,QTRS[qi],QTRS[qi+lag],b,metric,cv), bv=rv!=null?rv:base[ix[b]];
    if(cv==null||bv==null) continue;
    if(rv!=null){ const g=growth1(cv,bv); if(g) g.rb=1; return g; }
    return growth1(cv,bv);
  }
  return null;
}
function growth1(cv,bv){
    if(bv>0)  return {pct:(cv/bv-1)*100, cur:cv, base:bv};
    // NEGATIVE base (22% of all PAT YoY cells — not an edge case): divide by |base|, so a
    // loss→profit swing reads POSITIVE. Same rule as Trendlyne, profitAt() in stock-backtest.html /
    // backtest-engine.js, and build_results_season/build_discovery — BHEL Q1FY27 = +182.7%, MRPL
    // = +449.4%, both exactly TL's printed figures. NEVER divide straight through: that sign-flips
    // a turnaround to -182.7%. The LP/LL/PL flag rides ALONGSIDE the number (it says something the
    // % can't — that the base was a loss), and the counts/filters keep keying off it.
    if(bv<0)  return {pct:(cv-bv)/Math.abs(bv)*100, flag: cv>=0?'LP':'LL', cur:cv, base:bv};
    return null;   // base == 0 -> ÷0
}
// "Profit up" = grew from a profitable base, OR turned a loss into a profit (LP). A SHRINKING LOSS
// (LL) now computes a POSITIVE % against |base| — but it is not profit growth, so it must stay out of
// the up-counts/filters/streaks, where it would otherwise be counted as BOTH up and down.
function isUp(pct, flag){ return flag==='LP' || (pct!=null && pct>0 && !flag); }
// Two profit figures from the same filing: equal to the paise after rounding to 2 dp (0.015 cr tolerance).
// A null stored profit always "agrees" (nothing to contradict); a null estimate never does.
function samePat(stored,est){ return stored==null || (est!=null && Math.abs(stored-est)<=0.015); }
// Turnaround = a loss becoming a real profit. The LP flag also covers a loss → exactly 0.00 (it scores and
// counts as 'not down' there), which is not a profit, so the card, screen, feed chip and badge test this instead.
function isTurn(g){ return !!g && g.flag==='LP' && g.cur>0; }
function patFlag(g){                              // profit→loss detection needs cur sign too
  if(!g) return null;
  if(g.flag) return g.flag;
  if(g.cur<0 && g.base>0) return 'PL';
  return null;
}
function opmB(row,b){ if(!row) return null; const op=row[IDX.op[b]], rev=row[IDX.rev[b]];
  return (op!=null&&rev!=null&&rev>0) ? op/rev*100 : null; }
function opm(row){                                // opm% on the first basis that has one
  if(!row) return null;
  for(const b of basisOrder()){ const v=opmB(row,b); if(v!=null) return v; }
  return null;
}
function opmPair(r1,r0){                          // [opm now, opm year-ago] on ONE basis for both — a
  for(const b of basisOrder()){                   // con margin vs a std margin flipped 74 verdicts
    const a=opmB(r1,b), z=opmB(r0,b); if(a!=null&&z!=null) return [a,z]; }
  return [opm(r1), null];
}
function basisOrder(){ return ST.basis==='con' ? ['c'] : ST.basis==='std' ? ['s'] : ['c','s']; }
/* The basis a row's DISPLAYED figures use: the one its YoY PAT growth can use (same basis both
   quarters), else the first with a value — so the PAT shown sits next to the growth computed from it
   (AEQUS Mar-26 showed con −53.72 beside a std-based +164.7%). */
function rowBasis(q,qi){
  const cur=q[qi], base=q[qi+4], ord=basisOrder();
  for(const b of ord){ if(cur&&base&&cur[IDX.pat[b]]!=null&&base[IDX.pat[b]]!=null) return b; }
  for(const b of ord){ if(cur&&cur[IDX.pat[b]]!=null) return b; }
  for(const b of ord){ if(cur&&(cur[IDX.rev[b]]!=null||cur[IDX.op[b]]!=null)) return b; }   // no PAT: the basis that has figures
  return ord[0];
}

/* per-quarter computed records, cached per (qi|basis) */
const CACHE = {};
function recsFor(qi){
  const key=qi+'|'+ST.basis;
  if(CACHE[key]) return CACHE[key];
  const out=[];
  for(const sym in CO){
    const c=CO[sym], row=c.q[qi];
    if(!row) continue;
    // every figure on the row from ONE basis: a missing con revenue shows "—", never the std figure beside a
    // con PAT (26 rows did that in Jun-26 — AAKASH, CSBBANK …)
    const rb=rowBasis(c.q,qi), pk=(m)=>row[IDX[m][rb]];
    const rev=pk('rev'), pat=pk('pat'), op=pk('op');
    if(rev==null&&pat==null&&op==null) continue;
    const gy=growth(c.q,qi,'pat',4), gq=growth(c.q,qi,'pat',1);
    const ry=growth(c.q,qi,'rev',4), rq=growth(c.q,qi,'rev',1);
    const [o1,o0]=c.f?[null,null]:opmPair(row,c.q[qi+4]);
    const dOpm=(o1!=null&&o0!=null)? (o1-o0)*100 : null;   // bps
    // record PAT: highest positive PAT across the stored window
    let rec=false;
    if(pat!=null&&pat>0){ rec=true;
      for(let k=0;k<c.q.length;k++){ if(k===qi) continue; const [p]=pick(c.q[k],'pat'); if(p!=null&&p>=pat){rec=false;break;} } }
    // 4-quarter YoY growth streak
    let streak=true;
    for(let k=0;k<4;k++){ const g=growth(c.q,qi+k,'pat',4); if(!(g&&isUp(g.pct,g.flag))){streak=false;break;} }
    const pf=patFlag(gy);
    // verdict score (YoY, fundamentals only)
    let score=0, scoreable=false;
    if(gy){ scoreable=true;
      if(pf==='LP') score+=2; else if(pf==='PL'||pf==='LL') score-=2;
      else if(gy.pct!=null){ score += gy.pct>=15?2 : gy.pct>=0?1 : -2; } }
    if(ry&&ry.pct!=null){ score += ry.pct>=10?1 : ry.pct<0?-1:0; }
    if(dOpm!=null){ score += dOpm>=100?1 : dOpm<=-100?-1:0; }
    const verdict = !scoreable? null : score>=3?'S' : score<=-2?'W' : 'M';
    out.push({ sym, c, rev, op, pat,
      ry:ry&&ry.pct, rq:rq&&rq.pct, py:gy&&gy.pct, pq:gq&&gq.pct,
      ryR:!!(ry&&ry.rb), rqR:!!(rq&&rq.rb), pyR:!!(gy&&gy.rb), pqR:!!(gq&&gq.rb),
      pfY:pf, pfQ:patFlag(gq), turnY:isTurn(gy), turnQ:isTurn(gq), opm:o1, dOpm, rec, streak, verdict, score,
      ann:row[6]||null, rx:row[7], sr:row[8], prov:row[9]===1 });
  }
  CACHE[key]=out; return out;
}

const UNIBIT={n50:1,n100:2,n500:4,m150:8,s250:16,fno:32,mc250:64};   // mc250: Nifty Microcap 250 (§227)
// BSE SME IPO (runbook §195): the index's CURRENT constituents from BSE's official list (bse_sme_ipo/members.json), as the
// bare BSE ids this page keys BSE-only companies by. Loaded on first use.
let SMEIPO_SET=null, SMEIPO_P=null;
function loadSmeIpo(){
  if(!SMEIPO_P) SMEIPO_P=fetch('./bse_sme_ipo/members.json',{cache:'no-store'}).then(r=>r.json()).then(M=>{
    SMEIPO_SET=new Set((M.members||[]).map(m=>(m.sym||'').replace(/\.BO$/,'')).filter(Boolean)); }).catch(e=>{ SMEIPO_P=null; throw e; });
  return SMEIPO_P;
}
// Nifty SME Emerge (runbook §210): the index's CURRENT constituents from NSE's official list (nse_sme_emerge/members.json),
// bare NSE symbols as this page keys them. Loaded on first use.
let SMEEM_SET=null, SMEEM_P=null;
function loadSmeEmerge(){
  if(!SMEEM_P) SMEEM_P=fetch('./nse_sme_emerge/members.json',{cache:'no-store'}).then(r=>r.json()).then(M=>{
    SMEEM_SET=new Set((M.members||[]).map(m=>m.sym).filter(Boolean)); }).catch(e=>{ SMEEM_P=null; throw e; });
  return SMEEM_P;
}
function passFilters(r){
  const c=r.c;
  if(ST.uni==='watch'){ if(!WATCH.has(r.sym)) return false; }
  else if(ST.uni==='idx'){ if(!ST.uniSet||!ST.uniSet.has(r.sym)) return false; }
  else if(ST.uni==='smeipo'){ if(!SMEIPO_SET||!SMEIPO_SET.has(r.sym)) return false; }
  else if(ST.uni==='smeemerge'){ if(!SMEEM_SET||!SMEEM_SET.has(r.sym)) return false; }
  else if(ST.uni==='bse'){ if(!c.bse) return false; }
  else if(ST.uni==='nse'){ if(c.bse) return false; }
  else if(ST.uni!=='all'){ if(!(c.x & UNIBIT[ST.uni])) return false; }
  if(ST.mcap!=='all'){
    const m=c.m||0;
    if(ST.mcap==='l'&&m<20000) return false;
    if(ST.mcap==='m'&&(m<5000||m>=20000)) return false;
    if(ST.mcap==='s'&&m>=5000) return false;
  }
  if(ST.sector!=='all'&&c.s!==ST.sector) return false;
  if(ST.search){
    const q=normSearch(ST.search);
    if(normSearch(r.sym).indexOf(q)<0 && normSearch(c.n).indexOf(q)<0) return false;
  }
  return true;
}
function filtered(qi){ return recsFor(qi).filter(passFilters); }

/* company passes non-quarter filters (for calendar/feed scoping) */
function coPass(sym){
  const c=CO[sym]; if(!c) return ST.uni==='all'&&ST.sector==='all'&&ST.mcap==='all'&&!ST.search;
  return passFilters({sym, c});
}

const OV2RS={ n50:'Nifty 50', n100:'Nifty 100', n500:'Nifty 500', m150:'Nifty Midcap 150', s250:'Nifty Smallcap 250', mc250:'Nifty Microcap 250' };
function ensureRS(cb,force){                      // loads results_season.json ONCE, data only (no UI)
  if(RS_STATE===2&&!force){ cb&&cb(); return; }
  if(RS_STATE===1) return;                        // in-flight; the .then re-renders the active tab
  const wasReady=RS_STATE===2;
  RS_STATE=1;

/* Data-freshness clock: the backend rebuilds results_season.json every ~15min whenever new filings
   land (see DATA_RUNBOOK §11) — but a browser tab left open never sees that unless it refetches.
   Poll quietly in the background (only while the tab is visible/foreground) and tick the "X ago"
   label every 30s so it's obvious the page is live, not stalled. */
function rsAgeText(){
  if(!RS_DATA||!RS_DATA.updated) return '';
  const m=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}) IST$/.exec(RS_DATA.updated);
  if(!m) return 'data refreshed '+RS_DATA.updated;
  const utcMs=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5])-5.5*3600000;
  const mins=Math.max(0,Math.round((Date.now()-utcMs)/60000));
  const age = mins<1?'moments ago' : mins<60?mins+' min ago' : Math.round(mins/60)+' hr ago';
  return 'data refreshed '+age+' ('+RS_DATA.updated+')';
}

  const el=$('rsRefreshed'); if(!el||ST.tab!=='season') return;
  el.textContent=rsAgeText();

const SCREENS=[

];
function screenPass(r){
  const gKey=ST.mode==='yoy'?'py':'pq', fKey=ST.mode==='yoy'?'pfY':'pfQ';
  switch(ST.screen){
    case 'grow': return isUp(r[gKey],r[fKey]);
    case 'rocket': return r[gKey]!=null&&r[gKey]>20&&r[ST.mode==='yoy'?'ry':'rq']!=null&&r[ST.mode==='yoy'?'ry':'rq']>20;
    case 'turn': return ST.mode==='yoy'?r.turnY:r.turnQ;
    case 'slump': return r[fKey]==='PL';
    case 'marginup': return r.dOpm!=null&&r.dOpm>=200;
    case 'record': return r.rec;
    case 'streak': return r.streak;
    case 'loved': return r.rx!=null&&r.rx>=5;
    case 'hated': return r.rx!=null&&r.rx<=-5;
    default: return true;
  }
}
function sortRows(rows){
  const k=ST.sort.k, d=ST.sort.dir;
  const val=r=>{
    switch(k){ case 'sym': return r.sym; case 'm': return r.c.m||0; case 'rev': return r.rev; case 'ry': return r.ry;
      case 'rq': return r.rq; case 'opm': return r.dOpm; case 'pat': return r.pat; case 'py': return r.py; case 'pq': return r.pq;
      case 'v': return r.score==null?-99:r.score; case 'ann': return r.ann||0; case 'rx': return r.rx; case 'sr': return r.sr; }
  };
  rows.sort((a,b)=>{
    let x=val(a), y=val(b);
    if(typeof x==='string') return d*x.localeCompare(y);
    if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    return d*(x-y);
  });

}
function vdot(r){

function gcell(pct,flag,dp,rb){
  // The number ONLY — the same (cur−base)/|base| figure the backtest uses (profitAt in backtest-engine.js),
  // even when the base quarter was a loss (user 2026-10-05: no LP/PL/LL text, show the %). The flag stays
  // internal (counts, chips, verdict) and in the tooltip, which says the base was a loss.
  const tip = flag==='LP'?'Loss → profit: growth vs |base|':flag==='PL'?'Profit → loss':flag==='LL'?'Loss both periods: growth vs |base|':'';
  return '<span class="font-bold '+pctCls(pct)+'"'+(tip?' title="'+tip+'"':'')+'>'+fmtPct(pct)+'</span>'+
    (rb&&pct!=null?'<sup class="text-slate-400" title="'+RB_TIP+'">R</sup>':'');
}

/* ---------- feed engine ---------- */
let FEEDROWS=[];   // [sym,co,dt,qe,caption,file]
/* Live top-up filter = fetch_announcements.py RESULT_CAT_RE / RESULT_CAP_RE, kept IDENTICAL (runbook §228): the result PDF often
   rides only on an "Outcome of Board Meeting" row, worded "results of the Company, for the second quarter" / "considered and
   approved the Unaudited … Financial Results" / "submitted … [long] … financial results" — 75 such filings (GRASIM, LUPIN, DLF,
   COALINDIA…) slipped the old two-branch test in one season window; every one read, all genuine results. */
const FEED_CAT_RE=/^(?:financial\s+result|integrated\s+filing\s*[-–]?\s*financial)/i,
      FEED_CAP_RE=/financial\s+results?[^.;:]{0,60}?\bfor\s+the\s+(?:\w+[\s,]+){0,3}(?:period|quarter|half|year|nine|six|three)\b|submitted[^.;]{0,80}?financial\s+results?|(?:approv|adopt|taken\s+on\s+record|took\s+on\s+record)\w*[^.;]{0,100}?financial\s+results?|financial\s+results?[^.;]{0,80}?\b(?:quarter|half[- ]?year|period|year|nine\s+months|q[1-4])\b[^.;]{0,40}?\bend(?:ed|ing)\b/i;
/* Quarter named in a live caption: "quarter ended September 30, 2026" | "half year ended 30th September, 2026" | "quarter ending
   30.09.2026" (fetch_announcements.parse_qe reads the same forms when the file is built; day-first dates used to parse as no
   quarter and the row sat in "numbers pending" even with numbers stored — Swaraj Engines 12-Oct-2026, runbook §228). */
const FEED_QE_RE=/(period|quarter|half[- ]?year|year|nine\s+months)\s+end(?:ed|ing)\s+(?:on\s+)?(?:(\d{1,2})(?:st|nd|rd|th)?[\s,.\-]+([A-Za-z]{3})[a-z]*\.?[\s,.\-]+(\d{4})|([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})|(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{4}))/i;
function feedCaptionQE(cap){
  const m=FEED_QE_RE.exec(cap||''); if(!m) return 0;
  let mo=0,y=0;
  if(m[3]){ mo=MONTHS.findIndex(x=>x.toLowerCase()===m[3].toLowerCase()); y=+m[4]; }          // 30th September, 2026
  else if(m[5]){ mo=MONTHS.findIndex(x=>x.toLowerCase()===m[5].toLowerCase()); y=+m[7]; }     // September 30, 2026
  else if(m[8]){ mo=+m[9]; y=+m[10]; }                                                          // 30.09.2026
  if(!(mo>=1&&mo<=12&&y>2000&&y<2100)) return 0;
  return y*10000+mo*100+new Date(Date.UTC(y,mo,0)).getUTCDate();                               // quarter = that month's last day
}
let feedDays='7', feedSort='latest', feedDay='all', feedTurn=false, feedShown=24;
const feedPdf = f => f.indexOf('http')===0 ? f : PDF_PREFIX+f;
/* "Numbers pending" (filings we've seen but haven't parsed yet) is the owner's coverage tool, not a
   visitor feature — same client-side curtain as results-coverage/analytics. Visitors see cards only,
   and every count keys off cards so the numbers they see always reconcile. */
const FEED_OWNER = (()=>{ try{ return !!localStorage.getItem('bt_owner_key'); }catch(e){ return false; } })();
/* A feed row earns a CARD when its company + quarter have parsed numbers; else it's "numbers pending". */
function feedItem(r){
  const c=CO[r[0]]; if(!c) return null;
  let qi=r[3]?QTRS.indexOf(qe2qe(r[3])):-1;
  if(qi<0&&!r[3]){
    /* No quarter in the caption ("Please find enclosed file" — Swaraj Engines 12-Oct-2026, numbers parsed, card impossible):
       take the quarter whose numbers were ANNOUNCED on the filing day (q row [6] = ann YYYYMMDD). Same company + same day =
       this filing's own numbers; no numbers announced that day = still "numbers pending". Never the calendar, never a guess —
       only the stored announcement date (runbook §228). */
    const d=+r[2].slice(0,10).replace(/-/g,'');
    qi=c.q.findIndex(q=>q&&q[6]!=null&&+q[6]===d);
  }
  if(qi<0||!c.q[qi]) return null;
  if(pick(c.q[qi],'rev')[0]==null && pick(c.q[qi],'pat')[0]==null) return null;
  return {r,c,qi, ry:growth(c.q,qi,'rev',4), oy:growth(c.q,qi,'op',4), gy:growth(c.q,qi,'pat',4), rx:c.q[qi][7]};
}
function fYoyTd(g,isPat){
  if(!g) return '<td class="text-slate-400">—</td>';
  // Always the % (backtest formula, ÷|base| when the year-ago quarter was a loss) — never an LP/PL/LL word.
  const fl=isPat?patFlag(g):(g.flag||null);
  const tip=g.rb?' title="'+RB_TIP+'"':fl==='LP'?' title="Turnaround: loss a year ago, profit now (growth vs |base|)"':fl==='PL'?' title="Profit a year ago, loss now"':fl==='LL'?' title="Loss both years (growth vs |base|)"':'';
  if(g.pct==null) return '<td class="text-slate-400">—</td>';
  return '<td class="'+pctCls(g.pct)+' font-bold"'+tip+'>'+(g.pct>=0?'⇡ ':'⇣ ')+Math.abs(g.pct).toFixed(0)+'%'+(g.rb?'<sup class="text-slate-400">R</sup>':'')+'</td>';
}
const fValTd = v => '<td class="'+(v!=null&&v<0?'neg font-semibold':'text-slate-800')+'">'+fmtCr(v)+'</td>';
/* Price · market cap · PE under the company name on every Just Declared card (user, 13-Oct-2026).
   PE = market cap ÷ owners' PAT of the FOUR quarters ending at the card's quarter, all four on ONE basis
   (the Auto/Consol./Standalone toggle's order) — the trailing-twelve-month PE the other sites quote,
   computed from the filings this page already holds. No PE when one of the four quarters is missing;
   "—" when the trailing profit is a loss. Price = last close from the price store (`p`, published by
   build_quarterly_results.py / build_bse_results.py when the close is within 10 days of the store's end). */
function ttmPat(c,qi){
  for(const b of basisOrder()){
    let s=0, ok=true;
    for(let k=qi;k<qi+4;k++){ const r=k<QTRS.length?c.q[k]:null; const v=r?r[IDX.pat[b]]:null; if(v==null){ ok=false; break; } s+=v; }
    if(ok) return s;
  }
  return null;
}
function fmtPx(v){ return (+v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ---------- live feed top-up ---------- */
let liveKeys=new Set();
function feedKey(r){ return r[0]+'|'+r[2]+'|'+r[5]; }
async function liveTopUp(){
  try{
    const res=await fetch(WORKER+'/?announcements=1',{cache:'no-store'});
    if(!res.ok) return;
    const j=await res.json();
    if(!Array.isArray(j.rows)) return;
    let added=0;
    for(const a of j.rows){
      const cat=a[3]||'', cap=a[4]||'';
      if(!(FEED_CAT_RE.test(cat)||(cat==='Outcome of Board Meeting'&&FEED_CAP_RE.test(cap)))) continue;
      const k=feedKey(a); if(liveKeys.has(k)) continue;
      liveKeys.add(k);
      FEEDROWS.push([a[0],a[1],a[2],feedCaptionQE(cap),cap,a[5]]); added++;
    }
    if(added){ FEEDROWS.sort((x,y)=>y[2].localeCompare(x[2])||x[0].localeCompare(y[0])); if(ST.tab==='feed') renderFeed(); }
    const el=$('feedLive');
    if(el){ const ist=new Date(Date.now()+(new Date().getTimezoneOffset()*60000)+5.5*3600000);
      el.textContent='● LIVE · '+('0'+ist.getHours()).slice(-2)+':'+('0'+ist.getMinutes()).slice(-2)+' IST'; el.classList.remove('hidden'); }
  }catch(e){}
}

/* ---------- season trends engine ---------- */
let RS_DATA=null, RS_CUR={quarters:[]}, RS_MODE='median', RS_PERIOD='1y', RS_CFROM=null, RS_CTO=null;

function rsQuarters(){
  const qs=RS_CUR.quarters||[];
  if(!qs.length||RS_PERIOD==='all') return qs;
  if(RS_PERIOD==='custom'){
    const lo=RS_CFROM!=null?RS_CFROM:qs[0].qe, hi=RS_CTO!=null?RS_CTO:qs[qs.length-1].qe;
    return qs.filter(q=>q.qe>=lo&&q.qe<=hi);
  }
  const yrs={'1y':1,'3y':3,'5y':5}[RS_PERIOD]||100;
  const latest=qs.reduce((m,q)=>q.qe>m?q.qe:m,0);
  const cutoff=latest-yrs*10000;   // e.g. 1Y from Jun-2026 (20260630) → >20250630 = last 4 quarters
  return qs.filter(q=>q.qe>cutoff);
}
function rsVal(m){ return m?m[RS_MODE]:null; }                       // value for the current mode
function rsCnt(m){ return m?(RS_MODE==='median'?m.n:m.tn):null; }    // company count for the current mode

/* Quarter click-through: clicking a quarter (chart bar / table row) opens the All Results tab
   pinned to that quarter + this universe. Broad universes map onto the main filter's index
   bitmask; every other index (sectoral, Nifty 200, Midcap 50 …) filters by its CURRENT member
   list shipped in results_season.json. Quarters older than the main window stay tooltip-only. */
const RS2UNI={ 'liquid':'all','Nifty 50':'n50','Nifty 100':'n100','Nifty 500':'n500',
               'Nifty Midcap 150':'m150','Nifty Smallcap 250':'s250','Nifty Microcap 250':'mc250' };
function rsClickable(qe){
  const qi=QTRS.indexOf(qe);
  return ((RS_CUR.key in RS2UNI)||(RS_CUR.members&&RS_CUR.members.length)) &&
         qi>=0 && qi<Math.min(8,QTRS.length-4);
}
/* Filter the main table by an arbitrary member list: a transient "(index)" option in the
   universe dropdown, so the active filter stays visible and the user can switch away. */
function setIdxUniverse(key,label,members){
  ST.uni='idx'; ST.uniSet=new Set(members); ST.uniName=label||key;
  const sel=$('selUni');
  let o=sel.querySelector('option[value="idx"]');
  if(!o){ o=document.createElement('option'); o.value='idx'; sel.insertBefore(o,sel.options[1]||null); }
  o.textContent=(label||key)+' (index)';
}
function rsOpenResults(qe){
  if(!rsClickable(qe)) return;
  ST.qi=QTRS.indexOf(qe); ST.shown=100;
  if(RS_CUR.key in RS2UNI){
    ST.uni=RS2UNI[RS_CUR.key];
    try{ history.replaceState(null,'','?tab=results&qe='+qe+'&uni='+ST.uni); }catch(e){}
  }else{
    setIdxUniverse(RS_CUR.key,RS_CUR.label,RS_CUR.members);
    try{ history.replaceState(null,'','?tab=results&qe='+qe+'&uniIdx='+encodeURIComponent(RS_CUR.key)); }catch(e){}
  }
  $('selUni').value=ST.uni;
  setTab('results');
  window.scrollTo(0,0);
}
function rsSelectUniverse(key){
  const uvs=RS_DATA&&RS_DATA.universes||[];
  RS_CUR=uvs.find(u=>u.key===key)||uvs[0]||{quarters:[]};
  rsPopulateCustom();
  rsRenderChart(); rsRenderTable();
}
// Fill the custom-range dropdowns with this universe's quarters; reset bounds to the full span.
function rsPopulateCustom(){
  const cf=$('rsCFrom'), ct=$('rsCTo');
  if(!cf||!ct) return;
  const qs=RS_CUR.quarters||[];
  const opts=qs.map(q=>'<option value="'+q.qe+'">'+q.label+'</option>').join('');
  cf.innerHTML=opts; ct.innerHTML=opts;
  if(qs.length){ RS_CFROM=qs[0].qe; RS_CTO=qs[qs.length-1].qe; cf.value=RS_CFROM; ct.value=RS_CTO; }
}
setIdxUniverse=(function(f){ return function(key,label,members){ f(key,label,members); ST.uniKey=key; }; })(setIdxUniverse);

/* ---------- view: overview (sectors → that sector's season numbers → trend and sector medians) ---------- */
function renderOverview(){ if(ST.tab==='overview') render(); }      // ensureRS calls this when the season medians arrive
function buildOverview(){
  if(RS_STATE!==2) ensureRS();               // kick off Season-Trends median load; its .then re-renders
  const qi=ST.qi, lag=ST.mode==='yoy'?4:1;
  const gKey=ST.mode==='yoy'?'py':'pq', rKey=ST.mode==='yoy'?'ry':'rq', fKey=ST.mode==='yoy'?'pfY':'pfQ';
  // the sector list is computed with the sector filter lifted, so every sector stays visible while one is selected
  const keepSec=ST.sector; ST.sector='all';
  const allRows=filtered(qi), allPrev=recsFor(qi+lag).filter(passFilters), rsmAll=rsMedianFor(QTRS[qi]);
  ST.sector=keepSec;
  const rows=keepSec==='all'?allRows:allRows.filter(r=>r.c.s===keepSec);
  // expected = year-ago reporters within current filters
  const prev=keepSec==='all'?allPrev:allPrev.filter(r=>r.c.s===keepSec);
  const expected=new Set(prev.map(r=>r.sym)); rows.forEach(r=>expected.add(r.sym));
  const pats=rows.map(r=>r[gKey]).filter(v=>v!=null);
  const revs=rows.map(r=>r[rKey]).filter(v=>v!=null);
  const rxs=rows.map(r=>r.rx).filter(v=>v!=null);
  const pUp=rows.filter(r=>isUp(r[gKey],r[fKey])).length;
  const pDn=rows.filter(r=>(r[gKey]!=null&&r[gKey]<0&&!r[fKey])||r[fKey]==='PL'||r[fKey]==='LL').length;
  const rUp=revs.filter(v=>v>0).length, rDn=revs.filter(v=>v<0).length;
  const lp=rows.filter(r=>ST.mode==='yoy'?r.turnY:r.turnQ).length;
  // "Declared" = companies with parsed numbers + those we've SEEN FILE (in the feed) but whose numbers
  // haven't been parsed yet (our XBRL sync runs nightly, so a same-day filing shows here before its
  // numbers land). Bridges the gap between the live filing feed and the numbers scoreboard.
  const qe=QTRS[qi], haveNums=new Set(rows.map(r=>r.sym)), pendSet=new Set();
  // dual-listed cos can appear in the feed under a BSE ticker (INDBNK) while their numbers sit
  // under the NSE symbol (INDBANK) — also match by normalized company name to avoid double-count
  const normN=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'').replace(/(limited|ltd)$/,'');
  const haveNames=new Set(rows.map(r=>normN(r.c.n)));
  // qe===0 feed rows (filing didn't state its period; the vision prep resolves it within hours)
  // count as pending on the LIVE quarter only — never attributed to a specific quarter, never hidden
  FEEDROWS.forEach(r=>{ if((r[3]===qe||(qi===0&&r[3]===0)) && filedAfterQE(r,qe) && !haveNums.has(r[0]) && !haveNames.has(normN(r[1])) && coPass(r[0])) pendSet.add(r[0]); });
  const pending=pendSet.size, declared=rows.length+pending;
  let pdfOnly=0; pendSet.forEach(s=>{ if(PDF_ONLY.has(s)) pdfOnly++; }); const coming=pending-pdfOnly;
  // Season-Trends parity: read the exact universe median where available, else the live per-reporter one
  const rsm=rsMedianFor(QTRS[qi]);
  const medRev=(rsm&&rsm.rev!=null)?rsm.rev:median(revs);
  const medPat=(rsm&&rsm.pat!=null)?rsm.pat:median(pats);
  const medSub=rsm?'matches Season Trends':(ST.mode==='yoy'?'vs year-ago quarter':'vs previous quarter');
  // 5-season strip
  const meds=[];
  for(let k=4;k>=0;k--){
    const rr=recsFor(qi+k).filter(passFilters);
    const rsk=rsMedianFor(QTRS[qi+k]);                         // Season-Trends parity per quarter
    const m=(rsk&&rsk.pat!=null)?rsk.pat:median(rr.map(r=>r[gKey]).filter(v=>v!=null));
    meds.push({k, med:m, n:rr.length});
  }
  // sector aggregation
  const by={};
  allRows.forEach(r=>{ (by[r.c.s]=by[r.c.s]||[]).push(r); });
  const prevBy={};
  allPrev.forEach(r=>{ prevBy[r.c.s]=(prevBy[r.c.s]||0)+1; });
  const agg=(s,rr,exp)=>{
    const pu=rr.filter(r=>isUp(r[gKey],r[fKey])).length;
    const pn=rr.filter(r=>r[gKey]!=null||r[fKey]).length;
    return { s, n:rr.length, exp,
      mr:median(rr.map(r=>r[rKey]).filter(v=>v!=null)),
      mp:median(rr.map(r=>r[gKey]).filter(v=>v!=null)),
      rx:median(rr.map(r=>r.rx).filter(v=>v!=null)), pu, pn };
  };
  const secs=Object.keys(by).map(s=>agg(s,by[s],Math.max(prevBy[s]||0, by[s].length)))
    .sort((a,b)=>(b.mp==null?-1e9:b.mp)-(a.mp==null?-1e9:a.mp));
  const expAll=new Set(allPrev.map(r=>r.sym)); allRows.forEach(r=>expAll.add(r.sym));
  const all=agg('all',allRows,expAll.size);
  if(rsmAll&&rsmAll.rev!=null) all.mr=rsmAll.rev; if(rsmAll&&rsmAll.pat!=null) all.mp=rsmAll.pat;   // same figure the detail shows
  // movers
  const base=rows.filter(r=>r[gKey]!=null && !r[fKey] && Math.abs(r.pat||0)>=1 && (r.c.m||0)>=100);
  const grow=base.filter(r=>r[gKey]>0).sort((a,b)=>b[gKey]-a[gKey]).slice(0,10).map(r=>[r,r[gKey]]);
  const fall=base.filter(r=>r[gKey]<0).sort((a,b)=>a[gKey]-b[gKey]).slice(0,10).map(r=>[r,r[gKey]]);
  const rxr=rows.filter(r=>r.rx!=null);
  const rbest=rxr.filter(r=>r.rx>0).sort((a,b)=>b.rx-a.rx).slice(0,10).map(r=>[r,r.rx]);
  const rworst=rxr.filter(r=>r.rx<0).sort((a,b)=>a.rx-b.rx).slice(0,10).map(r=>[r,r.rx]);
  OV={rows,declared,pending,coming,pdfOnly,rsm,medRev,medPat,medSub,pUp,pDn,rUp,rDn,lp,rxs,meds,secs,all,grow,fall,rbest,rworst,
      cur:keepSec==='all'?all:secs.find(x=>x.s===keepSec)||null};
  $('fCount').textContent=declared.toLocaleString('en-IN')+' declared'+(pending?' ('+rows.length+' with numbers)':'')+' · '+qlabel(QTRS[qi],true);

  $('vctl').innerHTML='<span class="os-hint">Pick a sector to see its season numbers — the filters above apply to every view.</span>';
  $('keys').innerHTML='<b>↑↓</b> sector · <b>←→</b> quarter · <b>/</b> search · <b>Enter</b> open its results · <b>F</b> focus';
  LIST=[{k:'all',sec:all}].concat(secs.map(x=>({k:x.s,sec:x})));
  $('lTitle').textContent='Sectors'; $('count').textContent=secs.length+' with results · by median PAT growth';
  head([['Sector'],['PAT '+(ST.mode==='yoy'?'YoY':'QoQ')],['Rev'],['React.'],['Cos','',2]]);
  $('lList').innerHTML=LIST.map((e,i)=>{ const x=e.sec, on=e.k===ST.sector;
    return '<div class="os-row lr-overview'+(on?' on':'')+'" role="option" aria-selected="'+on+'" data-i="'+i+'" title="'+(e.k==='all'?'All sectors':esc(x.s))+': '+x.n+' reported of '+x.exp+' expected">'+
      '<span class="n">'+(e.k==='all'?'All sectors':esc(x.s||'(no sector)'))+'</span><span class="v">'+pcl(x.mp)+'</span><span class="v">'+pcl(x.mr)+'</span><span class="v">'+pc(x.rx)+'</span><span class="m c4">'+x.n+'</span></div>'; }).join('')
    + (secs.length?'':'<div class="os-empty">No companies reported yet under these filters.</div>');
  foot(false,false);
}

/* ---------- view: all results (companies → that company's quarter → its quarters / price) ---------- */
const SORTS={sym:'Stock',m:'Market cap',rev:'Revenue',ry:'Rev YoY',rq:'Rev QoQ',opm:'OPM change',pat:'PAT',py:'PAT YoY',pq:'PAT QoQ',v:'Verdict',ann:'Announced',rx:'Reaction',sr:'Since result'};
function sortBy(k){ if(ST.sort.k===k) ST.sort.dir=-ST.sort.dir; else ST.sort={k,dir:(k==='sym'?1:-1)}; render(); }
function buildResults(){
  $('vctl').innerHTML='<div class="os-sg" id="screenChips" role="group" aria-label="Screen"></div>'+
    '<select id="selSort" aria-label="Sort by">'+Object.keys(SORTS).map(k=>'<option value="'+k+'"'+(ST.sort.k===k?' selected':'')+'>Sort: '+SORTS[k]+'</option>').join('')+'</select>'+
    '<button type="button" class="os-btn" id="bDir" title="Reverse the order">'+(ST.sort.dir>0?'↑ Low first':'↓ High first')+'</button>';
  seg('screenChips',SCREENS,ST.screen,v=>{ ST.screen=v; ST.shown=PAGE; render(); });
  $('selSort').onchange=e=>{ ST.sort={k:e.target.value,dir:(e.target.value==='sym'?1:-1)}; render(); };
  $('bDir').onclick=()=>{ ST.sort.dir=-ST.sort.dir; render(); };
  $('keys').innerHTML='<b>↑↓</b> move · <b>←→</b> quarter · <b>/</b> search · <b>Enter</b> open stock · <b>F</b> focus';
  let rows=filtered(ST.qi).filter(screenPass);
  rows=sortRows(rows);
  // PENDING: companies that filed a result for this quarter but whose numbers aren't parsed yet
  // (BSE OCR pending / NSE XBRL not yet posted). OWNER-ONLY, same curtain as the Feed view's
  // "Numbers pending" rows (FEED_OWNER / bt_owner_key): to a visitor an empty row reads as a
  // broken page, but to the owner it is the coverage tool saying which names still need a
  // vision fill. The "+N numbers coming" count in the header stays visible to EVERYONE so the
  // Declared total still reconciles — the ROWS are hidden, the ARITHMETIC is not.
  // Only when no numbers-based screen is on.
  const qeSel=QTRS[ST.qi], haveNums=new Set(recsFor(ST.qi).map(r=>r.sym));

  // Owner curtain: visitors get the numbers-only list (an empty row reads as a broken page).
  LIST=shown.map(r=>({k:r.sym,sym:r.sym,rec:r})).concat(!FEED_OWNER?[]:pend.map(r=>({k:'p|'+r[0],sym:CO[r[0]]?r[0]:null,pend:r})));
  syncSel();

/* ---------- view: just declared (filings by day → that result → the company's quarters / price) ---------- */
function renderFeed(){ if(ST.tab==='feed') render(); }              // the live top-up calls this when new filings arrive
function fy(g,isPat){                               // fYoyTd's figure and tooltip for a list cell
  if(!g||g.pct==null) return '<span class="m">—</span>';

  const tip=g.rb?RB_TIP:fl==='LP'?'Turnaround: loss a year ago, profit now (growth vs |base|)':fl==='PL'?'Profit a year ago, loss now':fl==='LL'?'Loss both years (growth vs |base|)':'';
  return '<span class="'+pctCls(g.pct)+'"'+(tip?' title="'+tip+'"':'')+'>'+fmtPct(g.pct,0)+'</span>'+(g.rb?'<sup class="rb">R</sup>':'');

function feedTable(it){                             // the old card's mini table: YoY · this quarter · previous · year-ago
  const c=it.c, qi=it.qi;

  const head='<tr class="fh"><td></td><td>YoY</td><td>'+qlabel(QTRS[qi],false)+'</td><td>'+
    (i1>=0?qlabel(QTRS[i1],false):'')+'</td><td>'+(i4>=0?qlabel(QTRS[i4],false):'')+'</td></tr>';

      const o1=i1>=0?opm(c.q[i1]):null, o4=i4>=0?opm(c.q[i4]):null;
      const pr=i4>=0?opmPair(c.q[qi],c.q[i4]):[o0,null];          // bps change on ONE basis
      const d=pr[1]!=null?Math.round((pr[0]-pr[1])*100):null;
      body+='<tr><td>OPM</td><td class="'+(d==null?'text-slate-400':(d>=0?'pos':'neg'))+' font-bold" title="Margin change vs year-ago quarter, basis points">'+

function buildFeed(){
  const cut=istDay(-(+feedDays));
  let all=FEEDROWS.filter(r=>r[2].slice(0,10)>=cut && (coPass(r[0])||!CO[r[0]]&&ST.uni==='all'&&ST.sector==='all'&&ST.mcap==='all'))
                  .filter(r=>!ST.search||normSearch(r[0]).indexOf(normSearch(ST.search))>=0||normSearch(r[1]).indexOf(normSearch(ST.search))>=0);
  const items=new Map(); all.forEach(r=>items.set(r,feedItem(r)));
  // One row per company, filing day and quarter: the same filing arrives as a BSE row AND an NSE row, or as an "Outcome" row
  // plus a "Financial Results" row (Swaraj Engines, Adroit 12-Oct-2026). `all` is newest-first, so the newest row keeps the
  // place; the older twin is a duplicate ROW — the owner still counts it as a filing, a visitor never sees it (visitor counts
  // key off results). Gammon's nine quarters in one day are nine quarters → nine rows (runbook §228).
  const seenCard=new Set(), dupRow=new Set();
  all.forEach(r=>{ const it=items.get(r); if(!it) return; const k=r[0]+'|'+r[2].slice(0,10)+'|'+it.qi; if(seenCard.has(k)) dupRow.add(r); else seenCard.add(k); });
  /* The QUARTER applies to this view too (user 12-Oct-2026: "I selected Sep'26 above, still June results are seen
     below"): a result shows only when its numbers are the selected quarter's — a late Jun'26 filing on a Sep'26 results day sits
     under the Jun'26 quarter. The owner's "numbers pending" rows follow their caption quarter; a row whose caption names no
     quarter (qe 0) cannot be placed and stays. Results hidden this way are counted per quarter for the "other quarters" buttons,
     so no filing is silently invisible (runbook §228a). */
  const qeSel=QTRS[ST.qi], otherQ={};
  all=all.filter(r=>{ const it=items.get(r);
    if(it){ if(it.qi===ST.qi) return true; if(!dupRow.has(r)) otherQ[it.qi]=(otherQ[it.qi]||0)+1; return false; }
    return !r[3]||r[3]===qeSel; });
  if(!FEED_OWNER) all=all.filter(r=>items.get(r)&&!dupRow.has(r));
  const dayC={}; all.forEach(r=>{ const d=r[2].slice(0,10); dayC[d]=(dayC[d]||0)+1; });
  const days=Object.keys(dayC).sort().reverse();
  if(feedDay!=='all'&&!dayC[feedDay]) feedDay='all';          // the day picked under another quarter has no rows here
  const rows= feedDay==='all'? all : all.filter(r=>r[2].slice(0,10)===feedDay);
  const cards=[], pend=[];
  rows.forEach(r=>{ const it=items.get(r); if(!it) pend.push(r); else if(!dupRow.has(r)) cards.push(it); });
  let list=feedTurn? cards.filter(it=>isTurn(it.gy)) : cards;
  const countTxt=(FEED_OWNER
    ? rows.length+' filings · '+list.length+(feedTurn?' turnarounds':' with numbers')
    : list.length+(feedTurn?' turnarounds':' results'))+' · '+qlabel(QTRS[ST.qi],false);
  /* Results filed in this window for OTHER quarters: a button per quarter the picker offers (click = switch the quarter),
     a plain count for quarters older than the picker (Gammon's 2024 back-filings, 12-Oct-2026 — open the company for those). */
  const oqs=Object.keys(otherQ).map(Number).sort((a,b)=>a-b), nChip=NCHIP();
  $('vctl').innerHTML='<div class="os-sg" id="fdDays" role="group" aria-label="Window"></div><div class="os-sg" id="fdSort" role="group" aria-label="Order"></div>'+
    '<button type="button" class="os-btn'+(feedTurn?' on':'')+'" id="fdTurn" title="Only loss→profit turnarounds (PAT)">Turnarounds</button>'+
    (days.length>1?'<select id="fdDay" aria-label="Declaration day"><option value="all">All days</option>'+days.map(d=>'<option value="'+d+'"'+(feedDay===d?' selected':'')+'>'+isoNice(d)+' · '+dayC[d]+'</option>').join('')+'</select>':'')+
    (!oqs.length?'':'<span class="os-hint">Other quarters declared in this window:</span>'+oqs.map(i=>i<nChip
      ? '<button type="button" class="os-btn" data-oq="'+i+'" title="Show '+qlabel(QTRS[i],true)+'">'+qlabel(QTRS[i],false)+' · '+otherQ[i]+'</button>'
      : '<span class="os-hint" title="Older than the quarter picker — open the company to see these">'+qlabel(QTRS[i],false)+' · '+otherQ[i]+'</span>').join(''));
  seg('fdDays',[['1','Today'],['2','Since yesterday'],['7','Last 7 days'],['31','Last month']],feedDays,v=>{ feedDays=v; feedDay='all'; feedShown=FEED_PAGE; render(); });
  seg('fdSort',[['latest','Latest'],['sales','Sales growth'],['profit','Profit growth'],['rx','Reaction']],feedSort,v=>{ feedSort=v; feedShown=FEED_PAGE; render(); });
  $('fdTurn').onclick=()=>{ feedTurn=!feedTurn; feedShown=FEED_PAGE; render(); };
  if($('fdDay')) $('fdDay').onchange=e=>{ feedDay=e.target.value; feedShown=FEED_PAGE; render(); };
  $('vctl').querySelectorAll('[data-oq]').forEach(b=>b.onclick=()=>{ ST.qi=+b.getAttribute('data-oq'); ST.shown=PAGE; feedShown=FEED_PAGE; render(); });
  $('keys').innerHTML='<b>↑↓</b> move · <b>←→</b> quarter · <b>/</b> search · <b>Enter</b> open stock · <b>F</b> focus';
  const pv=g=>g&&g.pct!=null?g.pct:-1e9;
  if(feedSort==='sales')       list=list.slice().sort((a,b)=>pv(b.ry)-pv(a.ry));
  else if(feedSort==='profit') list=list.slice().sort((a,b)=>pv(b.gy)-pv(a.gy));
  else if(feedSort==='rx')     list=list.slice().sort((a,b)=>(b.rx==null?-1e9:b.rx)-(a.rx==null?-1e9:a.rx));
  const today=istDay(0), yest=istDay(-1);   // India dates (toISOString is UTC: 00:00-05:30 IST read as yesterday)
  LIST=[]; const out=[]; let used=0;
  const cardRow=it=>{ const i=LIST.length, fl=patFlag(it.gy); LIST.push({k:'f|'+it.r[0]+'|'+it.r[2]+'|'+it.qi,sym:it.r[0],it});
    out.push([i,'<div class="os-row lr-feed" role="option" data-i="'+i+'" title="'+esc(it.c.n||it.r[1])+' · declared '+it.r[2].slice(11,16)+'">'+
      '<span class="n">'+esc(it.r[0])+(isTurn(it.gy)?'<span class="os-tag" title="Loss a year ago, profit now">TURNAROUND</span>':'')+(fl==='PL'?'<span class="os-tag" title="Profit a year ago, loss now">INTO LOSS</span>':'')+
        (it.c.bse?'<span class="os-tag" title="Listed on BSE only">BSE</span>':'')+'<i>'+esc(it.c.n||it.r[1])+'</i></span>'+
      '<span class="v">'+fy(it.ry)+'</span><span class="v">'+fy(it.gy,true)+'</span><span class="v">'+pc(it.rx)+'</span></div>']); };
  const pendRow=r=>{ const i=LIST.length; LIST.push({k:'p|'+feedKey(r),sym:CO[r[0]]?r[0]:null,pend:r});
    out.push([i,'<div class="os-row lr-pend" role="option" data-i="'+i+'" title="'+esc(r[4]||'Financial results filed')+'"><span class="n">'+esc(r[0])+'<i>'+esc(r[1])+'</i></span><span class="m">'+(r[3]?qlabel(qe2qe(r[3]),false)+' · ':'')+r[2].slice(11,16)+'</span></div>']); };
  if(feedSort==='latest'){
    const groups={}, pgroups={};
    list.forEach(it=>{ const d=it.r[2].slice(0,10); (groups[d]=groups[d]||[]).push(it); });
    pend.forEach(r=>{ const d=r[2].slice(0,10); (pgroups[d]=pgroups[d]||[]).push(r); });
    for(const d of [...new Set([...Object.keys(groups),...Object.keys(pgroups)])].sort().reverse()){
      if(used>=feedShown) break;
      const g=groups[d]||[], p=pgroups[d]||[];
      const take=g.slice(0,feedShown-used); used+=take.length;
      out.push([-1,'<div class="sec'+(d===today?' today':'')+'"><span>'+(d===today?'Today':d===yest?'Yesterday':isoNice(d))+'</span><i>'+(g.length+p.length)+(FEED_OWNER?' filings':' results')+'</i></div>']);
      take.forEach(cardRow);
      if(take.length<g.length) break;                      /* rest of this day + older days sit behind Load more */
      if(p.length&&!feedTurn&&FEED_OWNER){ out.push([-1,'<div class="sec sub"><span>Numbers pending · '+p.length+'</span></div>']); p.forEach(pendRow); }
    }
  }else{
    const take=list.slice(0,feedShown); used=take.length; take.forEach(cardRow);
    if(pend.length&&!feedTurn&&FEED_OWNER) out.push([-1,'<div class="os-note">'+pend.length+' filings without parsed numbers are hidden under this order — switch to <b>Latest</b> to see them.</div>']);
  }
  syncSel();
  $('lTitle').textContent='Just declared'; $('count').textContent=countTxt;
  $('fCount').textContent=countTxt;
  head([['Stock'],['Sales YoY'],['PAT YoY'],['React.']]);
  $('lList').innerHTML=out.map(o=>o[0]>=0&&LIST[o[0]].k===CUR.k?o[1].replace('class="os-row','aria-selected="true" class="os-row on'):o[1]).join('')
    || '<div class="os-empty">No '+qlabel(QTRS[ST.qi],false)+' results '+(feedTurn?'with a loss→profit turnaround ':'')+'declared in this window'+(ST.uni!=='all'||ST.sector!=='all'||ST.mcap!=='all'?' under these filters':'')+'.</div>';
  foot(used<list.length,false);
  if($('bMore')) $('bMore').onclick=()=>{ feedShown+=200; const st=$('lList').scrollTop; render(); $('lList').scrollTop=st; };

/* ---------- view: calendar (result dates → that date → the company's quarters / price) ---------- */
function buildCalendar(){
  $('vctl').innerHTML='<div class="os-sg" id="segCal" role="group" aria-label="Which dates"></div><span class="os-hint">✓ = board-meeting date filed with NSE / BSE · est. = our prediction from the company\'s past reporting dates</span>';
  seg('segCal',[['conf','Confirmed only'],['both','Confirmed + predicted']],ST.cal,v=>{ ST.cal=v; render(); });
  $('keys').innerHTML='<b>↑↓</b> move · <b>/</b> search · <b>Enter</b> open stock · <b>F</b> focus';
  const confBy={};                                  // sym -> [date,purpose]
  (CAL&&CAL.rows||[]).forEach(r=>{ if(!confBy[r[0]]||r[2]<confBy[r[0]][0]) confBy[r[0]]=[r[2],r[3],r[1]]; });
  const today=istDay(0);
  const horizon=istDay(56);
  const items=[];                                   // {d, sym, co, conf, purpose}
  for(const sym in confBy){
    const [d,purpose,co]=confBy[sym];
    if(d<today||d>horizon) continue;
    if(CO[sym]? !coPass(sym) : (ST.uni!=='all'||ST.sector!=='all'||ST.mcap!=='all')) continue;
    if(ST.search&&normSearch(sym).indexOf(normSearch(ST.search))<0&&normSearch(co).indexOf(normSearch(ST.search))<0) continue;
    items.push({d,sym,co:co||(CO[sym]&&CO[sym].n)||sym,conf:true,purpose});
  }
  if(ST.cal==='both'){
    for(const sym in CO){
      const c=CO[sym];
      if(!c.e||confBy[sym]) continue;
      if(c.e<today||c.e>horizon) continue;
      if(!coPass(sym)) continue;
      if(ST.search&&normSearch(sym).indexOf(normSearch(ST.search))<0&&normSearch(c.n).indexOf(normSearch(ST.search))<0) continue;
      items.push({d:c.e,sym,co:c.n,conf:false,purpose:'Predicted from past reporting dates'});
    }
  }
  const groups={};
  items.forEach(it=>{ (groups[it.d]=groups[it.d]||[]).push(it); });
  const days=Object.keys(groups).sort();
  LIST=[]; let h='';
  days.forEach(d=>{
    const arr=groups[d].sort((a,b)=>((CO[b.sym]&&CO[b.sym].m)||0)-((CO[a.sym]&&CO[a.sym].m)||0));
    const isToday=d===today;
    h+='<div class="sec'+(isToday?' today':'')+'"><span>'+isoNice(d)+(isToday?' · today':'')+'</span><i>'+arr.length+' compan'+(arr.length===1?'y':'ies')+'</i></div>';
    arr.forEach(it=>{ const c=CO[it.sym], i=LIST.length; LIST.push({k:it.sym,sym:c?it.sym:null,cal:it});
      h+='<div class="os-row lr-calendar" role="option" data-i="'+i+'" title="'+esc(it.purpose)+'"><span class="n">'+esc(it.sym)+
        (c&&(c.x&1)?'<span class="os-tag">N50</span>':'')+(c&&(c.x&32)?'<span class="os-tag">F&amp;O</span>':'')+'<i>'+esc(it.co)+'</i></span>'+
        '<span class="m">'+(c&&c.m?fmtMcap(c.m):'—')+'</span><span class="m" title="'+(it.conf?'Confirmed':'Predicted')+'">'+(it.conf?'✓':'est.')+'</span></div>'; });
  });
  if(CUR.k!=null&&!LIST.find(x=>x.k===CUR.k)&&CUR.sym==null) CUR.k=null;
  syncSel();
  $('lTitle').textContent='Upcoming result dates'; $('count').textContent='next 8 weeks';
  head([['Stock'],['MCap'],['']]);
  $('lList').innerHTML=h||'<div class="os-empty">No upcoming result dates in the next 8 weeks under these filters.</div>';
  markRows();
  const nToday=(groups[today]||[]).length;
  $('fCount').textContent=items.length+' scheduled'+(nToday?' · '+nToday+' today':'');
  foot(false,false);
}

/* ---------- middle pane for the three company views ---------- */
function coBody(sym,c){
  const qi=ST.qi, r=recsFor(qi).find(x=>x.sym===sym), ql=qlabel(QTRS[qi],false);
  const tags=[c.bse?'BSE only':'', c.f?'Bank / NBFC':'', (c.x&1)?'Nifty 50':(c.x&4)?'Nifty 500':'', (c.x&32)?'F&amp;O':'', c.orphan?'not in the price universe':''].filter(Boolean);
  let h='<div class="det">'+esc(c.n)+(c.s?' · '+esc(c.s):'')+(c.i&&c.i!==c.s?' · '+esc(c.i):'')+(c.cd?' · BSE '+esc(c.cd):'')+(tags.length?'<br>'+tags.join(' · '):'')+'</div>';
  const t=c.m?ttmPat(c,qi):null;
  if(c.m) h+=kv('Market cap','₹'+fmtMcap(c.m));
  if(c.p!=null) h+=kv('Price','₹'+fmtPx(c.p),'','Last close from the price store');
  if(t!=null) h+=kv('PE', t>0?(c.m/t).toFixed(1):'—','','Market cap ÷ owners\' profit of the four quarters ending '+ql+(t>0?'':' (trailing loss)'));
  h+='<div class="dh">'+qlabel(QTRS[qi],true)+'</div>';
  if(!r) h+='<div class="os-note">No '+ql+' numbers on file for '+esc(sym)+'.'+(c.e&&!c.q[0]?' Next result expected '+esc(c.e)+'.':'')+'</div>';
  else{
    const rb=rowBasis(c.q,qi);
    h+=kv('Basis', rb==='c'?'Consolidated':'Standalone','','Every figure on this row comes from one reporting basis')+
      (r.prov?kv('Status',(QTRS[qi]%10000===331?'H2':'H1')+' · unconfirmed','',QTRS[qi]%10000===331?'SME half-year (Oct–Mar) from the March filing — confirmed or corrected when the year is proven':'SME half-year (Apr–Sep) from the September filing — confirmed or corrected when the March full-year filing arrives'):'')+
      kv(c.f?'Total income':'Revenue', fmtCr(r.rev)+(r.rev==null?'':' cr'),'','₹ crore (banks/NBFCs: total income)')+
      kv((c.f?'Income':'Rev')+' YoY', gcell(r.ry,null,0,r.ryR))+kv((c.f?'Income':'Rev')+' QoQ', gcell(r.rq,null,0,r.rqR))+
      (c.f?'':kv('Op. profit', fmtCr(r.op)+(r.op==null?'':' cr'))+
        kv('OPM', r.opm!=null? r.opm.toFixed(1)+'% <span class="'+pctCls(r.dOpm)+'" style="font-weight:500">'+(r.dOpm==null?'':(r.dOpm>0?'+':'')+Math.round(r.dOpm)+'bps')+'</span>':'—','','Operating margin; the change is vs year-ago, basis points'))+
      kv('PAT', fmtCr(r.pat)+(r.pat==null?'':' cr'), r.pat!=null&&r.pat<0?'neg':'','Net profit (owners-attributable), ₹ crore')+
      kv('PAT YoY', gcell(r.py,r.pfY,0,r.pyR))+kv('PAT QoQ', gcell(r.pq,r.pfQ,0,r.pqR))+
      kv('Verdict', r.verdict?vdot(r)+(r.verdict==='S'?'Strong':r.verdict==='W'?'Weak':'Mixed'):'—','','Rule-based verdict from PAT growth, revenue growth and margin change');
    const fl=[r.rec?'Record PAT':'', r.streak?'4-quarter growth streak':'', r.turnY?'Loss → profit YoY':'', r.pfY==='PL'?'Profit → loss YoY':''].filter(Boolean);
    if(fl.length) h+=kv('Flags', fl.join(' · '));
    h+=kv('Announced', fmtDate8(r.ann),'','Result announcement date (post-close filings dated next trading day)')+
      kv('Reaction', pc(r.rx),'','% price move on result day')+
      kv('Since result', pc(r.sr),'','Drift from result-day close to '+QR.asof);
  }
  const rxs=c.q.map(q=>q?q[7]:null).filter(v=>v!=null);
  const avgAbs=rxs.length? rxs.reduce((a,b)=>a+Math.abs(b),0)/rxs.length : null;
  const upRate=rxs.length? Math.round(rxs.filter(v=>v>0).length/rxs.length*100) : null;
  h+='<div class="dh">On result days</div>'+kv('Typical move', avgAbs!=null?('±'+avgAbs.toFixed(1)+'%'):'—')+
    kv('Closed up', upRate==null?'—':upRate+'% of '+rxs.length+' results')+(c.e?kv('Next result', '~'+esc(c.e),'','Expected from the company\'s past reporting dates'):'');
  const feedRow=FEEDROWS.find(x=>x[0]===sym&&x[5]);
  h+='<div class="act">'+
    (feedRow?'<a class="os-btn" target="_blank" rel="noopener" href="'+esc(feedRow[5].indexOf('http')===0?feedRow[5]:PDF_PREFIX+feedRow[5])+'">Latest filing PDF ↗</a>':'')+
    (c.bse
      ? '<a class="os-btn" target="_blank" rel="noopener" href="https://www.bseindia.com/stock-share-price/x/x/'+encodeURIComponent(c.cd||'')+'/">BSE page ↗</a>'
      : '<a class="os-btn" href="./stock.html?sym='+encodeURIComponent(sym)+'">Price chart &amp; profile →</a>'+
        '<a class="os-btn" target="_blank" rel="noopener" href="https://www.nseindia.com/get-quotes/equity?symbol='+encodeURIComponent(sym)+'">NSE page ↗</a>')+
    '<a class="os-btn" href="./announcements.html'+(c.bse?'':'?s='+encodeURIComponent(sym))+'">All announcements →</a></div>';
  return h;
}
function detailCo(){
  const e=CUR.e, sym=CUR.sym, c=sym&&CO[sym];
  const label=sym||(e&&(e.pend?e.pend[0]:e.cal?e.cal.sym:''))||'';
  if(!label){ $('dTitle').textContent='Details'; $('dTag').textContent=''; $('dList').innerHTML='<div class="os-empty">Nothing selected.</div>'; return; }

    h+=kv('Result date', isoNice(it.d)+(it.d===istDay(0)?' · today':''))+kv('Status', it.conf?'✓ Confirmed':'est. — predicted','',it.conf?'Board-meeting date filed with the exchange':'Predicted from the company\'s past reporting dates')+
      '<div class="det">'+esc(it.purpose||'')+'</div>'; }
  if(e&&e.pend){ const r=e.pend, pdfOnly=PDF_ONLY.has(r[0]);
    h+=kv('Filed', isoNice(r[2].slice(0,10))+' · '+r[2].slice(11,16))+(r[3]?kv('Quarter named', qlabel(qe2qe(r[3]),true)):'')+

      '<div class="det">'+esc(r[4]||'Financial results filed')+'</div>'+
      (r[5]?'<div class="act"><a class="os-btn" target="_blank" rel="noopener" href="'+esc(feedPdf(String(r[5])))+'">Filing PDF ↗</a></div>':''); }
  if(e&&e.it){ const it=e.it, r=it.r;
    h+=kv('Declared', isoNice(r[2].slice(0,10))+' · '+r[2].slice(11,16))+
      (it.rx!=null?kv('On result day', pc(it.rx),'','Price move on result day'):'')+feedTable(it)+
      (r[5]?'<div class="act"><a class="os-btn" target="_blank" rel="noopener" href="'+esc(feedPdf(r[5]))+'">This filing (PDF) ↗</a></div>':''); }
  if(c) h+=coBody(sym,c);
  else if(!e||!e.pend) h+='<div class="os-note">'+esc(label)+' has no parsed results on file here.</div>';
  $('dList').innerHTML=h; $('dList').scrollTop=0;
}

/* ---------- right pane for the three company views: the company's quarters, or its price with result days marked ---------- */
function qTable(c){
  const cols=Math.min(9,QTRS.length), cc=i=>i===ST.qi?' class="cur"':'';
  let head='<tr class="h"><td></td>'; for(let i=cols-1;i>=0;i--) head+='<td'+cc(i)+'>'+qlabel(QTRS[i],false)+'</td>'; head+='</tr>';
  const rowHtml=(label,metric)=>{
    let tds='';
    for(let i=cols-1;i>=0;i--){
      if(metric==='opm'){ const v=c.f?null:opm(c.q[i]); tds+='<td'+cc(i)+'>'+(v==null?'—':v.toFixed(1)+'%')+'</td>'; continue; }
      const [v]=pick(c.q[i],metric);
      const g=growth(c.q,i,metric,4);
      tds+='<td'+cc(i)+'><span class="'+(v!=null&&v<0?'neg':'')+'">'+fmtCr(v)+'</span>'+(g?'<small class="'+pctCls(g.pct)+'">'+fmtPct(g.pct,0)+'</small>':'')+'</td>';   // the % even off a loss base (backtest formula), never LP/LL
    }
    return '<tr><td>'+label+'</td>'+tds+'</tr>';
  };
  let rowsHtml='';
  if(!c.f) rowsHtml+=rowHtml('Revenue','rev')+rowHtml('Op. profit','op')+rowHtml('OPM','opm');
  else rowsHtml+=rowHtml('Total income','rev');
  rowsHtml+=rowHtml('PAT','pat');
  let rxRow='<tr><td>Reaction</td>';
  for(let i=cols-1;i>=0;i--){ const v=c.q[i]?c.q[i][7]:null; rxRow+='<td'+cc(i)+'>'+pc(v)+'</td>'; }
  rxRow+='</tr>';
  let annRow='<tr><td>Announced</td>';
  for(let i=cols-1;i>=0;i--){ const v=c.q[i]?c.q[i][6]:null; annRow+='<td'+cc(i)+'>'+fmtDate8(v)+'</td>'; }
  annRow+='</tr>';
  return '<table class="qt">'+head+rowsHtml+rxRow+annRow+'</table>';
}
function drawQ(){
  const el=$('qc'), sym=CUR.sym, c=sym&&CO[sym];
  if(!c||CHART!=='q'||!isCo()){ el.innerHTML=''; return; }
  const W=el.clientWidth, H=el.clientHeight; if(W<80||H<90) return;
  const n=QTRS.length, nChip=NCHIP(), rev=[], pat=[];
  for(let i=n-1;i>=0;i--){ const r=c.q[i]; rev.push(r?pick(r,'rev')[0]:null); pat.push(r?pick(r,'pat')[0]:null); }   // oldest → newest
  const L=10, R=10, T=4, B=22, gap=12, ph=(H-T-B-gap)/2, bw=(W-L-R)/n;
  let s='';
  const panel=(vals,y0,label)=>{
    const nn=vals.filter(v=>v!=null);
    s+='<text class="lb" x="'+L+'" y="'+(y0+12)+'">'+label+'</text>';
    if(!nn.length){ s+='<text x="'+(W/2)+'" y="'+(y0+ph/2)+'" text-anchor="middle">no figures on file</text>'; return; }
    const mx=Math.max(...nn.map(Math.abs))||1, top=y0+30, bot=y0+ph-(nn.some(v=>v<0)?12:0), zero=nn.some(v=>v<0)? top+(bot-top)*0.62 : bot;
    s+='<line class="z" x1="'+L+'" x2="'+(W-R)+'" y1="'+zero.toFixed(1)+'" y2="'+zero.toFixed(1)+'"/>';
    vals.forEach((v,j)=>{
      if(v==null) return;
      const qi=n-1-j, bh=Math.max(1.5,Math.abs(v)/mx*(v>=0?zero-top:bot-zero)), y=v>=0? zero-bh : zero, x=L+j*bw+bw*0.16, w=bw*0.68, cx=L+j*bw+bw/2;
      s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+(v>=0?'var(--pos)':'var(--neg)')+'" opacity="'+(qi===ST.qi?1:.5)+'"/>';
      if(bw>=46||qi===ST.qi) s+='<text class="v'+(qi===ST.qi?' on':'')+'" x="'+cx.toFixed(1)+'" y="'+(v>=0?y-4:y+bh+11).toFixed(1)+'" text-anchor="middle">'+fmtCr(v)+'</text>';
    });
  };
  panel(rev,T,(c.f?'Total income':'Revenue')+' · ₹ cr'); panel(pat,T+ph+gap,'PAT (owners) · ₹ cr');
  for(let j=0;j<n;j++){ const qi=n-1-j, cx=L+j*bw+bw/2;
    if(bw>=44||qi===ST.qi||(qi%2===0&&Math.abs(qi-ST.qi)>1)) s+='<text'+(qi===ST.qi?' class="on"':'')+' x="'+cx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+qlabel(QTRS[qi],false)+'</text>';
    s+='<rect x="'+(L+j*bw).toFixed(1)+'" y="0" width="'+bw.toFixed(1)+'" height="'+H+'" fill="transparent"'+(qi<nChip?' data-qi="'+qi+'" style="cursor:pointer"':'')+'><title>'+qlabel(QTRS[qi],true)+
      ' — '+(c.f?'total income':'revenue')+' '+(rev[j]==null?'—':'₹'+fmtCr(rev[j])+' cr')+' · PAT '+(pat[j]==null?'—':'₹'+fmtCr(pat[j])+' cr')+(qi<nChip&&qi!==ST.qi?' · click to switch to this quarter':'')+'</title></rect>'; }
  el.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
  el.querySelectorAll('[data-qi]').forEach(x=>x.onclick=()=>setQ(+x.getAttribute('data-qi')));
}
function chartBar(){
  seg('cTabs',[['q','Quarters','Revenue and PAT, every quarter on file'],['px','Price','Daily prices with result days marked']],CHART,v=>{ CHART=v; renderRight(false); saveUrl(); });
  const iv=CH?CH.iv:'D', rg=CH?CH.range:'3Y';
  seg('cIv',[['D','D','Daily bars'],['W','W','Weekly bars'],['M','M','Monthly bars']],iv,v=>{ if(!CH) return; CH.setIv(v); chartBar(); mark(); });
  seg('cRg',['6M','1Y','3Y','Max'].map(k=>[k,k]),rg,v=>{ if(!CH) return; CH.setRange(v); chartBar(); });
}
function mark(){
  const sym=CUR.sym, c=sym&&CO[sym], LC=window.LightweightCharts; $('cMark').textContent='';
  if(!c||CHART!=='px'||!isCo()||!CH||!CH.ch||!CH.data||!LC||!LC.createSeriesMarkers) return;
  if(MARK&&MARK.ch===CH.ch){ try{ MARK.h.setMarkers([]); }catch(e){} }
  const ser=CH.data.ohlc?CH.ch.candle:CH.ch.line, seen={}, ms=[];
  for(let i=c.q.length-1;i>=0;i--){ const r=c.q[i]; if(!r||!r[6]) continue;
    const s=String(r[6]), iso=s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8), b=CH.bars.find(x=>K.tsISO(x.ts)>=iso); if(!b) continue;
    const t=K.tsISO(b.ts); if(seen[t]) continue; seen[t]=1;
    ms.push({time:t,position:'aboveBar',shape:i===ST.qi?'arrowDown':'circle',color:CH.ch.accent,text:i===ST.qi?qlabel(QTRS[i],false):''}); }
  ms.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
  try{ MARK={ch:CH.ch,h:LC.createSeriesMarkers(ser,ms)}; }catch(e){}
  $('cMark').textContent=ms.length?'● result days on file · ▼ '+qlabel(QTRS[ST.qi],false):'no result day falls inside the price history';
}
function renderCoChart(lazy){
  const e=CUR.e, sym=CUR.sym, c=sym&&CO[sym], tok=++TOK; clearTimeout(showTimer);
  const label=sym||(e&&(e.pend?e.pend[0]:e.cal?e.cal.sym:''))||'';

  const a=$('cOpen'); if(c&&!c.bse){ a.href='./stock.html?sym='+encodeURIComponent(sym); a.classList.remove('hidden'); } else a.classList.add('hidden');
  chartBar();
  if(!c){ $('cTbl').innerHTML=''; $('qc').innerHTML=''; if(CH) CH.clear(''); $('cMark').textContent=''; $('cMsg').textContent=label?'No parsed numbers on file for '+label+' yet.':'Nothing selected.'; return; }
  $('cTbl').innerHTML=qTable(c);
  { const tb=$('cTbl'), cu=tb.querySelector('td.cur'); if(cu) tb.scrollLeft=Math.max(0,cu.offsetLeft+cu.offsetWidth+8-tb.clientWidth); }   // keep the selected quarter's column in view
  if(CHART==='q'){ $('cMsg').textContent=''; $('cMark').textContent=''; drawQ(); return; }
  $('qc').innerHTML='';
  showTimer=setTimeout(()=>{
    $('cMsg').textContent='Loading chart…';
    K.loadStockBars(sym).then(d=>{ if(tok!==TOK) return;
      if(!CH) CH=new K.Chart({chart:$('cChart'), legend:$('cLegend'), msg:$('cMsg'), iv:'D', range:'3Y'});
      CH.show(d,{name:sym,tag:c.bse?'BSE':'NSE'}); chartBar(); mark(); },
      ()=>{ if(tok!==TOK) return; if(CH) CH.clear(''); $('cMark').textContent=''; $('cMsg').textContent='No daily price history on file for '+sym+'.'; });
  }, lazy?140:0);
}

let RS_WANT=null;
function rsInit(){
  const uvs=RS_DATA.universes||[];

  const sel=$('rsUniverseSelect');
  sel.innerHTML=uvs.map(u=>'<option value="'+esc(u.key)+'">'+esc(u.label)+'</option>').join('');
  // Default universe = Nifty 500 (set here, not in the JSON — the JSON is regenerated daily).
  sel.value=(RS_WANT&&uvs.some(u=>u.key===RS_WANT))?RS_WANT:uvs.some(u=>u.key==='Nifty 500')?'Nifty 500':(RS_DATA.defaultUniverse||uvs[0].key);
  sel.onchange=()=>{ RSQ=null; rsSelectUniverse(sel.value); };
  $('rsCFrom').onchange=function(){ RS_CFROM=+this.value; render(); };
  $('rsCTo').onchange=function(){ RS_CTO=+this.value; render(); };

function drawRs(){
  const root=$('rsChart');
  $('cSym').textContent=RS_CUR.label||'Season trends'; $('cName').textContent=(RS_MODE==='median'?'Median':'Total')+' YoY growth by quarter';
  $('rsLegend').innerHTML=RSM.map(mm=>'<span><i style="background:'+mm.color+'"></i>'+mm.name+'</span>').join('');
  if(RS_STATE!==2){ root.innerHTML=''; $('cMsg').textContent='Loading season-trend data…'; return; }
  const Q=rsQuarters().filter(q=>rsVal(q.rev)!==null||rsVal(q.op)!==null||rsVal(q.pat)!==null);
  if(!Q.length){ root.innerHTML=''; $('cMsg').textContent='No comparable data for this universe.'; return; }
  $('cMsg').textContent='';
  let dMax=0, dMin=0;
  Q.forEach(q=>RSM.forEach(mm=>{ const v=rsVal(q[mm.key]);
    if(v!==null){ if(v>dMax) dMax=v; if(v<dMin) dMin=v; } }));
  dMax=Math.ceil((dMax+1)/5)*5;
  dMin=dMin<0?Math.floor((dMin-1)/5)*5:0;
  const range=(dMax-dMin)||1;
  const n=Q.length, M={l:40,r:14,t:30,b:44};
  // The chart fills the pane: few quarters → each group widens; many quarters → natural width + horizontal scroll.
  const avail=root.clientWidth||0, Hc=root.clientHeight||0; if(avail<120||Hc<120) return;
  const innerAvail=avail-M.l-M.r, minGroupW=66;
  const groupW=n*minGroupW<=innerAvail?innerAvail/n:minGroupW;
  const bw=Math.max(15,Math.min(30,Math.round(groupW*0.2))), gap=Math.max(3,Math.round(bw*0.2));
  const W=M.l+n*groupW+M.r, H=Hc-(W>avail?12:2);
  const plotTop=M.t, plotBot=H-M.b;
  const y=v=>plotTop+(dMax-v)/range*(plotBot-plotTop);
  const zeroY=y(0);
  const fmt=v=>(v>=0?'+':'')+v.toFixed(1)+'%';
  const cf=x=>x.toLocaleString('en-IN');
  const step=range>80?20:range>40?10:5;
  let g='';
  Q.forEach((q,i)=>{ if(q.qe===RSQ) g+='<rect x="'+(M.l+i*groupW)+'" y="'+(plotTop-8)+'" width="'+groupW+'" height="'+(H-plotTop+8)+'" fill="var(--accent-soft)"/>'; });
  for(let t=dMin;t<=dMax+0.001;t+=step){
    const yy=y(t), zero=t===0;
    g+='<line'+(zero?' class="z"':'')+' x1="'+M.l+'" x2="'+(W-M.r)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" pointer-events="none"/>'+
       '<text x="'+(M.l-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end" font-size="10" pointer-events="none">'+t+'%</text>';
  }
  Q.forEach((q,i)=>{
    const gx=M.l+i*groupW, cx=(gx+groupW/2).toFixed(1), on=q.qe===RSQ;
    let gt=esc(q.label)+' — '+cf(q.reported)+' companies reported'+(q.partial?' (in progress — preliminary, few reporters so far)':'');
    RSM.forEach(mm=>{ if(rsVal(q[mm.key])!==null) gt+=' · '+mm.name+' '+fmt(rsVal(q[mm.key])); });
    const totW=RSM.length*bw+(RSM.length-1)*gap, x0=gx+(groupW-totW)/2;
    RSM.forEach((mm,j)=>{
      const v=rsVal(q[mm.key]); if(v===null) return;
      const bx=x0+j*(bw+gap), yv=y(v);
      const top=Math.min(yv,zeroY), hh=Math.max(0.5,Math.abs(zeroY-yv));
      g+='<rect x="'+bx.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" fill="'+mm.color+'"'+(q.partial?' fill-opacity="0.4"':'')+'/>';
      const pos=v>=0, lx=(bx+bw/2).toFixed(1), ly=(pos?yv-3:yv+3).toFixed(1);
      g+='<text x="'+lx+'" y="'+ly+'" transform="rotate(-90 '+lx+' '+ly+')" text-anchor="'+(pos?'start':'end')+'" font-size="9.5" font-weight="600" style="fill:'+mm.color+'" pointer-events="none">'+fmt(v)+'</text>';
    });
    g+='<text'+(on?' class="on"':'')+' x="'+cx+'" y="'+(plotBot+17)+'" text-anchor="middle" font-size="11" font-weight="600" pointer-events="none">'+esc(q.label)+'</text>'+
       '<text x="'+cx+'" y="'+(plotBot+31)+'" text-anchor="middle" font-size="9.5" pointer-events="none">'+(q.partial?cf(q.reported)+' • in progress':cf(q.reported)+' Results')+'</text>'+
       '<rect x="'+gx+'" y="'+(plotTop-8)+'" width="'+groupW+'" height="'+(H-plotTop+8)+'" fill="transparent" data-qe="'+q.qe+'" style="cursor:pointer"><title>'+gt+'</title></rect>';
  });
  root.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="max-width:none">'+g+'</svg>';
  root.querySelectorAll('[data-qe]').forEach(el=>{ el.onclick=()=>{ const e=LIST.find(x=>x.k===+el.getAttribute('data-qe')); if(e) choose(e,true); }; });
  if(W>avail){ const i=Q.findIndex(q=>q.qe===RSQ); root.scrollLeft=i<0?W:Math.max(0,M.l+(i+.5)*groupW-avail/2); }
}
