name: Auto-rerun failed workflows

# Safety net: whenever any of the data-refresh workflows finishes in failure,
# re-run its failed jobs automatically — waiting between tries so a transient
# upstream blip (NSE/BSE/Yahoo timeout) clears — until it succeeds.
#
# Capped at 5 retries: a transient failure almost always clears on the 1st-2nd
# try, while a genuine code/data break (e.g. a missing file) would otherwise loop
# forever burning CI minutes and never recover. After 5 failed retries this job
# itself fails, so the normal failure email still reaches you for a human to look.

# Scope (widened 2026-08-07): the 2026-08-06 Actions outage failed 19 workflows, but only
# 7 were watched here — the other 18 sat red until a human re-ran them, some a full day
# later. Every data-refresh workflow is now covered. Excluded on purpose: this workflow
# itself (retrying the retry-driver loops), "Deploy site to Pages" (its `concurrency:
# group: pages, cancel-in-progress: true` means a retry just cancels whatever is waiting
# its turn — ci-janitor.yml unwedges Pages instead), the workflow_run-triggered bakers
# (they re-fire from their upstream), and the manual debug tools.

on:
  workflow_run:
    workflows:
      - "Daily stock data refresh"
      - "Daily mutual fund refresh"
      - "Daily FII/DII refresh"
      - "Daily backtest data refresh"
      - "Daily fundamentals refresh"
      - "Daily shareholding (FII/DII holdings) refresh"
      - "Weekly index membership refresh"
      - "Daily backtest-history backup (keep 7 days)"
      - "Hourly results feed + calendar"
      - "Refresh ex-dates calendar"
      - "Refresh announcements"
      - "Refresh BSE-only coverage"
      - "Refresh bulk & block deals"
      - "Refresh delivery spikes"
      - "Refresh Global Markets"
      - "Refresh index monthly returns"
      - "Refresh indices table"
      - "Refresh insider trades (PIT)"
      - "Refresh IPOs & listings"
      - "Refresh Macro dashboard"
      - "Refresh Market Mood (Nifty 500 turnover + breadth)"
      - "Refresh sector classification"
      - "Refresh Banking Growth (bank credit)"
      - "Rebuild per-stock financial slices"
      - "Nightly Trendlyne reconcile"
      - "Supabase keep-alive (prevent free-tier pause)"
    types: [completed]

permissions:
  actions: write       # required to re-run workflow runs
  contents: read

# One retry-driver per failed run; don't pile up duplicates for the same run.
concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    # Only act on the ORIGINAL failure (run_attempt == 1). The retry loop below calls
    # `gh run rerun --failed`, which creates a NEW attempt whose own completion fires this
    # workflow_run event again — without this guard each of the 5 retries spawns a fresh
    # auto-rerun job, chaining EXPONENTIALLY (a dead commit hit 38 attempts). Gating on the
    # first attempt keeps exactly one retry-driver per genuinely-failed run.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    # 150, not 60: the backoff ladder alone sleeps ~35 min, and a slow watched workflow
    # (BSE-only coverage runs ~75 min) can eat the rest in a single attempt. Hitting this
    # cap is fine — ci-janitor.yml sweeps up whatever is still red.
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RID: ${{ github.event.workflow_run.id }}
      WF_NAME: ${{ github.event.workflow_run.name }}
    steps:
      - name: Stand down if GitHub Actions itself is broken
        id: platform
        run: |
          set -uo pipefail
          # A platform outage is NOT what this workflow is for. Retrying inside a runner
          # means paying for a runner that sits in `sleep` for the whole incident, and the
          # 2026-08-06 outage lasted ~9 h — far longer than any in-runner retry budget.
          # Bail out cheaply and let ci-janitor.yml (scheduled, holds no runner between
          # sweeps) re-run this once the platform is healthy again.
          status=$(curl -sf --max-time 20 https://www.githubstatus.com/api/v2/components.json \
                   | jq -r '.components[] | select(.name=="Actions") | .status' 2>/dev/null || echo "")
          echo "githubstatus Actions component: '${status:-unknown}'"
          if [ -n "$status" ] && [ "$status" != "operational" ]; then
            echo "::notice::Actions is '$status' — standing down; ci-janitor will re-run '$WF_NAME' after the incident."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry the failed run until it succeeds (max 5, exponential backoff)
        if: steps.platform.outputs.skip != 'true'
        run: |
          set -uo pipefail
          # Backoff grows 90s → 3m → 6m → 10m → 15m (was a flat 90s). A flat wait retried
          # the same broken upstream five times inside eight minutes and burned the whole
          # budget before a slow-recovering feed came back.
          backoff="90 180 360 600 900"
          attempt=0
          for wait_s in $backoff; do
            attempt=$((attempt+1))
            echo "::group::Auto-retry $attempt/5 for '$WF_NAME' (run $RID) — waiting ${wait_s}s first"
            sleep "$wait_s"                                     # let a transient upstream issue clear
            gh run rerun "$RID" --failed --repo "$REPO" || echo "rerun trigger returned non-zero (continuing)"

            # wait for the new attempt to actually start
            for _ in $(seq 1 20); do
              st=$(gh run view "$RID" --repo "$REPO" --json status -q .status 2>/dev/null || echo "")
              [ -n "$st" ] && [ "$st" != "completed" ] && break
              sleep 6
            done
            # wait for the new attempt to finish
            while :; do
              st=$(gh run view "$RID" --repo "$REPO" --json status -q .status 2>/dev/null || echo "")
              [ "$st" = "completed" ] && break
              sleep 15
            done

            concl=$(gh run view "$RID" --repo "$REPO" --json conclusion -q .conclusion 2>/dev/null || echo "")
            echo "attempt $attempt conclusion: $concl"
            echo "::endgroup::"
            if [ "$concl" = "success" ]; then
              echo "✅ '$WF_NAME' recovered on auto-retry $attempt"
              exit 0
            fi
          done
          echo "❌ '$WF_NAME' (run $RID) still failing after 5 auto-retries — needs a human"
          exit 1
