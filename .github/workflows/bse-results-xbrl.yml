name: BSE results XBRL (fill-only)
# Quarterly results XBRL from BSE for BSE-only stocks and for NSE stocks whose quarter NSE never served (runbook §178).
# One plain, honestly identified client. When BSE's api answers 403 the fetch prints BSE-REFUSED, writes no fills,
# and the job ends green with nothing committed — it simply tries again tomorrow.
on:
  # SCHEDULE — started by scripts/cron_dispatch.py (cron-job.org tick every 5 min), NOT GitHub cron,
  # which runs 4-7 h late in this repo (measured 2026-09-29, runbook §217). The dispatcher reads the
  # "dispatch-cron" lines below (UTC, standard cron syntax); edit them to change the time.
  # dispatch-cron: "20 4 * * *"  # 09:50 IST daily
  repository_dispatch:
    types: [tick-bse-results-xbrl]   # sent by scripts/cron_dispatch.py
  workflow_dispatch:
    inputs:
      budget:
        description: "scrips to list this run"
        required: false
        default: "300"
permissions:
  contents: write
  actions: write
concurrency:
  group: bse-results-xbrl
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch (list + download + parse) — writes a fills file only
        run: |
          B="${{ github.event.inputs.budget }}"; B="${B:-300}"
          python3 -X utf8 scripts/fetch_bse_results_xbrl.py --fetch --budget "$B" --out "$RUNNER_TEMP/fills.json"
          cp scripts/_bse_xbrl_state.json "$RUNNER_TEMP/state.json" 2>/dev/null || true
      - name: Apply fill-only and push (re-apply on a rejected push — never merge minified JSON)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(python3 -c "import json;print(len(json.load(open('$RUNNER_TEMP/fills.json'))))")
          echo "fills: $N"
          # §218b: an XBRL fill (NSE gap quarters land in sf_fundamentals/sf_revop) must reach the results page in THIS
          # run — refresh-fundamentals rebuilds the payload only on its own NSE updates or at night (up to ~11 h later)
          if [ "$N" -gt 0 ]; then mkdir -p /tmp/qr; python3 scripts/fetch_release_bin.py /tmp/qr/sf_stock_data.bin --tries 3 || echo "::warning::bin download failed — results payload waits for the nightly rebuild"; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp "$RUNNER_TEMP/state.json" scripts/_bse_xbrl_state.json 2>/dev/null || true
            if [ "$N" -gt 0 ]; then python3 -X utf8 scripts/fetch_bse_results_xbrl.py --apply "$RUNNER_TEMP/fills.json"; fi
            # BSE-only fills reach the results page only through bse_results.json — rebuild it here too
            # (it used to wait for the next refresh-bse run)
            if [ "$N" -gt 0 ] && [ -f /tmp/qr/sf_stock_data.bin ]; then
              SF_BIN=/tmp/qr/sf_stock_data.bin python3 -X utf8 scripts/build_quarterly_results.py > /tmp/qr.log 2>&1 && git add docs/quarterly_results.json \
                || { tail -3 /tmp/qr.log; echo "::warning::quarterly_results rebuild failed — keeps origin's copy"; }
            fi
            if [ "$N" -gt 0 ]; then python3 -X utf8 scripts/build_bse_results.py && git add docs/bse_results.json; fi
            git add docs/bse_fundamentals.json docs/sf_fundamentals.json docs/sf_revop.json scripts/revop_fundamentals.json scripts/xbrl_extra.json.gz
            git add -f scripts/_bse_xbrl_state.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "BSE results XBRL fill $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST') ($N fills)"
            if git push origin HEAD:main; then gh workflow run refresh-stock-fin.yml; exit 0; fi
            echo "push #$attempt rejected; re-apply on fresh main"; sleep $((attempt*5))
          done
          exit 1
