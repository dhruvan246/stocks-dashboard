name: Refresh announcements

on:
  schedule:
    # ~4×/day IST: 08:30, 14:00, 18:00, 21:30 — filings arrive all day, with the
    # big flood after market close. Runs daily (weekend board meetings exist).
    # GitHub cron is best-effort; the fetch self-heals (31-day window, merge-based).
    - cron: "0 3 * * *"
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "0 16 * * *"
  repository_dispatch:
    types: [announcements-refresh]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a change so the data publishes itself

concurrency:
  group: refresh-announcements
  cancel-in-progress: false

jobs:
  refresh-announcements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch NSE corporate announcements (rolling ~31 days) + results feed
        run: python3 -X utf8 scripts/fetch_announcements.py

      # Upcoming results calendar (board meetings with a "Financial Results" purpose) for the
      # Quarterly Results page. Non-fatal: a failed fetch keeps the previous calendar.
      - name: Fetch NSE results calendar
        run: python3 -X utf8 scripts/fetch_results_calendar.py || echo "(calendar fetch failed — keeping previous file)"

      # Merge BSE-listed result filings + forthcoming dates on top (covers BSE-only names → ~all
      # listed companies, like the big sites). Additive + self-healing; a BSE failure leaves the
      # NSE feed/calendar untouched.
      - name: Merge BSE results into feed + calendar
        run: python3 -X utf8 scripts/fetch_bse_results.py || echo "(BSE merge failed — keeping NSE-only files)"

      # Order-value cache (docs/order_values.json) — extracts "₹1,180 cr" from each order-win PDF so
      # the Discovery "Order Wins" bucket shows the value, not NSE's generic caption. Incremental
      # (only fetches new PDFs). Non-fatal: a failure just leaves last run's values in place.
      - name: Extract order values from PDFs
        run: python3 -X utf8 scripts/enrich_order_values.py || echo "(order-value extraction failed — keeping previous cache)"

      # Discovery buckets (docs/discovery.json) — recomputed from the fresh announcements +
      # committed fundamentals/price/classification files. Non-fatal: keeps the previous file.
      - name: Build Discovery buckets
        run: python3 -X utf8 scripts/build_discovery.py || echo "(discovery build failed — keeping previous file)"

      - name: Commit updated announcements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/ann/docs
          cp docs/announcements.json /tmp/ann/docs/
          cp docs/results_feed.json     /tmp/ann/docs/ 2>/dev/null || true
          cp docs/results_calendar.json /tmp/ann/docs/ 2>/dev/null || true
          cp docs/discovery.json        /tmp/ann/docs/ 2>/dev/null || true
          cp docs/order_values.json     /tmp/ann/docs/ 2>/dev/null || true

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ann/docs/announcements.json docs/announcements.json
            cp /tmp/ann/docs/results_feed.json     docs/results_feed.json     2>/dev/null || true
            cp /tmp/ann/docs/results_calendar.json docs/results_calendar.json 2>/dev/null || true
            cp /tmp/ann/docs/discovery.json        docs/discovery.json        2>/dev/null || true
            cp /tmp/ann/docs/order_values.json     docs/order_values.json     2>/dev/null || true
            git add docs/announcements.json docs/results_feed.json docs/results_calendar.json docs/discovery.json docs/order_values.json

            if git diff --cached --quiet; then
              echo "No new announcements — nothing to commit"
              exit 0
            fi

            git commit -m "Announcements refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              gh workflow run pages.yml || echo "(pages deploy dispatch failed — will publish on next push)"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
