name: Daily mutual fund refresh

on:
  schedule:
    # Fallback only (GitHub cron is best-effort). 16:30 UTC = 22:00 IST, on
    # weekdays. The reliable primary trigger is the cron-job.org job below.
    - cron: "30 16 * * 1-5"
  # External scheduler (cron-job.org) hits
  #   POST /repos/dhruvan246/stocks-dashboard/dispatches
  # with header `Authorization: Bearer <PAT>` and body
  #   {"event_type":"mf-refresh"}
  # This is a SEPARATE event type from the stock dashboard's "scheduled-refresh"
  # so the two dashboards refresh independently on their own schedules.
  repository_dispatch:
    types: [mf-refresh]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a change so the data publishes itself

# Independent of the stock refresh; runs one at a time.
concurrency:
  group: refresh-mf
  cancel-in-progress: false

jobs:
  refresh-mf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refresh mutual fund prices & returns
        run: python3 scripts/fetch_mf_returns.py

      - name: Build mutual funds dashboard
        run: python3 scripts/build_mutualfunds.py

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit updated mutual fund dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reset-and-replay, landing only what this run changed and only where origin still holds the copy the run
          # started from. The page is built from the data files, so all five land together or not at all: a page
          # edit a session landed mid-run stays theirs (with a ::warning::) and the next run rebuilds on it (§212).
          BASE=$(git rev-parse HEAD)   # nothing has committed yet: the tree the builders above read
          python3 -X utf8 scripts/ci_land.py snapshot "$BASE" /tmp/land docs/mutual-funds.html docs/mf_funds.json docs/mf_history.bin scripts/mutual_funds.json scripts/gold_inr.json
          cp scripts/ci_land.py /tmp/ci_land.py   # the reset below must not swap it mid-loop

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -X utf8 /tmp/ci_land.py apply "$BASE" /tmp/land
            git add docs/mutual-funds.html docs/mf_funds.json docs/mf_history.bin scripts/mutual_funds.json scripts/gold_inr.json

            if git diff --cached --quiet; then
              echo "Remote already has identical mutual fund data — nothing to commit"
              exit 0
            fi

            git commit -m "Daily MF refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')" -m "$(cat /tmp/land/landing.txt)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              gh workflow run pages.yml || echo "(pages deploy dispatch failed — will publish on next push)"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
