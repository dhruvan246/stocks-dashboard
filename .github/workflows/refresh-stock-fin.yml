name: Rebuild per-stock financial slices

# docs/stock.html reads ONE company's financials from docs/fin/<SLUG>.json (~2 KB) instead of
# pulling sf_fundamentals.json + sf_revop.json + shareholding.json (8 MB of whole-market data)
# on every visit — see runbook §40. Those three feeds are written by a dozen different results
# workflows at all hours, so rather than teach each of them to rebuild the slices, this job
# watches the files themselves: whatever lands a new quarter, the affected company's slice is
# refreshed minutes later. Only the stocks that actually filed produce new blobs, so the repo
# grows by kilobytes, not by the 40 MB/day the PRICE slices would cost (those are force-pushed
# to the sf-data repo by refresh-backtest-data.yml instead).
#
# No self-trigger: this job only ever commits docs/fin/**, which is not in the paths filter.
#
# It must dispatch pages.yml explicitly, though — runbook §41b. This job pushes as the default
# GITHUB_TOKEN, and GitHub's recursion guard means a GITHUB_TOKEN push creates no new workflow
# run, so pages.yml's `on: push: paths: docs/**` never fires for the slice commit. Left alone
# the slices sit on main undeployed until some unrelated push happens to carry them to the
# site: on 2026-08-11, commit 2b78445f produced no pages.yml run at all and the live slice
# stayed at 54 shareholding quarters (93 in git) until the deploy was kicked by hand.
# workflow_dispatch is the documented exception to the recursion guard, which is why the same
# trailing dispatch works in refresh-bse / refresh-announcements / refresh-fii-dii and ~7 more.

on:
  push:
    branches: [main]
    paths:
      - "docs/sf_fundamentals.json"
      - "docs/sf_revop.json"
      - "docs/shareholding.json"
      - "scripts/shp_history.json"
      - "scripts/xbrl_extra.json.gz"
      - "scripts/kpi_insights/*.json"     # Insights card ledgers (runbook §137)
      - "scripts/build_stock_fin.py"
      - "scripts/_rename_map.json"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a change so the data publishes itself

concurrency:
  group: refresh-stock-fin
  cancel-in-progress: true      # a burst of results commits only needs the LAST rebuild

jobs:
  rebuild-fin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build per-stock financial slices
        run: python3 scripts/build_stock_fin.py

      # NOTE: the retry loop resets --hard, so the freshly built directory is stashed in /tmp and
      # copied back INSIDE the loop — anything left only in the workspace would be discarded.
      # `git add --all -- docs/fin` is scoped to that one directory (and this is an ephemeral CI
      # checkout, not the shared working tree CLAUDE.md rule 1 protects); --all is what stages the
      # DELETIONS for companies that dropped out of the feeds.
      - name: Commit refreshed slices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/fin && cp -r docs/fin /tmp/fin
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            rm -rf docs/fin && cp -r /tmp/fin docs/fin
            git add --all -- docs/fin
            if git diff --cached --quiet; then echo "financial slices unchanged"; exit 0; fi
            git commit -q -m "Per-stock financial slices $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "pushed (attempt #$attempt)"
              # Guarded by the two exits above: the "unchanged" branch leaves before reaching
              # here, and this one exits immediately after, so a run dispatches AT MOST ONE
              # deploy and only when a commit actually landed. Bursts are already collapsed
              # upstream by this workflow's own cancel-in-progress, and pages-deploy keeps a
              # single pending run per group, so this cannot pile deploys up (runbook §41b).
              gh workflow run pages.yml || echo "(pages deploy dispatch failed — will publish on next push)"
              exit 0
            fi
            sleep $(( attempt * 5 ))
          done
          echo "fin slice push failed after 5 attempts"; exit 1
