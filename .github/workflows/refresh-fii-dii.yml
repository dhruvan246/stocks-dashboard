name: Daily FII/DII refresh

on:
  schedule:
    # 14:45 UTC = 20:15 IST, weekdays — after NSE publishes provisional cash
    # FII/DII (~19:00 IST). GitHub cron is best-effort; the data also self-heals
    # on the next run since the history file only grows.
    - cron: "45 14 * * 1-5"
  # Optional external trigger (cron-job.org) — SEPARATE event type from the
  # stock ("scheduled-refresh") and MF ("mf-refresh") jobs so all three are
  # independent. POST /repos/dhruvan246/stocks-dashboard/dispatches with
  #   {"event_type":"fii-dii-refresh"}
  repository_dispatch:
    types: [fii-dii-refresh]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a change so the data publishes itself

concurrency:
  group: refresh-fii-dii
  cancel-in-progress: false

jobs:
  refresh-fii-dii:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps (xlrd reads NSE's FII derivative-stats .xls)
        run: pip install xlrd==2.0.1

      - name: Fetch latest FII/DII activity
        run: python3 scripts/fetch_fii_dii.py

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit updated FII/DII history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each file lands on its own (the cash day, the monthly table and each index close are separate reads),
          # except the F&O set: fii_fo.json's "lf"/"lfs" columns are built from fii_fo_lots.json and the stock-lot
          # ledger, so those four land together or not at all. A file origin changed during the run stays
          # origin's with a ::warning:: - the next run re-reads it from there (runbook §212).
          BASE=$(git rev-parse HEAD)   # nothing has committed yet: the tree the builders above read
          python3 -X utf8 scripts/ci_land.py snapshot "$BASE" /tmp/land docs/fii_dii.json docs/fii_dii_monthly.json docs/fii_fo.json docs/fii_fo_lots.json \
                 docs/nifty.json docs/nifty500.json docs/nifty_bank.json docs/india_vix.json \
                 scripts/_fo_stk_state.json scripts/_fo_stk_lots/
          cp scripts/ci_land.py /tmp/ci_land.py   # the reset below must not swap it mid-loop

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -X utf8 /tmp/ci_land.py apply "$BASE" /tmp/land --each \
              --group 'docs/fii_fo.json docs/fii_fo_lots.json scripts/_fo_stk_state.json scripts/_fo_stk_lots/'
            git add docs/fii_dii.json docs/fii_dii_monthly.json docs/fii_fo.json docs/fii_fo_lots.json docs/nifty.json docs/nifty500.json docs/nifty_bank.json docs/india_vix.json scripts/_fo_stk_state.json scripts/_fo_stk_lots

            if git diff --cached --quiet; then
              echo "No new FII/DII data — nothing to commit"
              exit 0
            fi

            git commit -m "Daily FII/DII refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')" -m "$(cat /tmp/land/landing.txt)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              gh workflow run pages.yml || echo "(pages deploy dispatch failed — will publish on next push)"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
