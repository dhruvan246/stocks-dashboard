name: CI janitor (unwedge Pages + resweep stragglers)

# Written after the 2026-08-06 GitHub Actions outage (Critical, ~15:22-24:00 UTC), which
# exposed two holes that auto-rerun.yml structurally cannot cover:
#
#   1. The `pages` concurrency group wedged on GitHub's side: runs queued into it stayed
#      `pending` (which in the Actions API means "blocked by concurrency") and never got a
#      runner, with zero jobs ever created — including one run left in `waiting` for TWELVE
#      HOURS. The live site froze on a 13-hour-old build while all ~30 data workflows
#      reported success and kept committing fresh data. NOTHING was red: staleness was the
#      only symptom, and no workflow was watching for it.
#      That specific wedge was cleared by renaming the group to `pages-deploy` (2c7dcb41) —
#      a fresh group name carries no wedged state. This janitor is the standing net so the
#      next occurrence is caught in 30 min instead of 13 h.
#      (memory: project-stocks-pages-wedged-concurrency)
#
#   2. auto-rerun.yml retries inside a runner, so its budget is minutes. An outage lasting
#      hours outlives it, and it then exits 1 and gives up permanently. 18 workflows sat red
#      until a human re-ran them by hand the next morning.
#
# This job holds no runner between sweeps, so it can keep trying for as long as it takes.

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 min — cheap (a few API calls), no runner held between sweeps
  workflow_dispatch: {}

permissions:
  actions: write               # rerun + cancel runs, dispatch pages.yml
  contents: read

concurrency:
  group: ci-janitor
  cancel-in-progress: false    # never cancel a sweep mid-flight; they are short and idempotent

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Unwedge Pages
        run: |
          set -uo pipefail
          # 45 min, not 30: pages.yml deliberately waits up to 30 min for a deployment
          # (1fad678c), so a run legitimately queued behind a slow-but-healthy deploy can sit
          # pending for nearly that long. The threshold has to clear that window or this step
          # would cancel healthy work.
          cutoff=$(date -u -d '45 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "cutoff = $cutoff"

          # If a deploy is genuinely running, anything behind it is queued for a REASON —
          # that is normal serialisation, not a wedge. Only intervene when nothing is moving.
          running=$(gh run list --workflow=pages.yml --repo "$REPO" --limit 20 \
                      --json status --jq '[.[] | select(.status=="in_progress")] | length')
          if [ "$running" -gt 0 ]; then
            echo "✅ a Pages deploy is in flight — anything pending behind it is queued normally, leaving it alone"
            exit 0
          fi

          wedged=$(gh run list --workflow=pages.yml --repo "$REPO" --limit 60 \
                     --json databaseId,status,createdAt \
                     --jq "[.[] | select((.status==\"waiting\" or .status==\"pending\" or .status==\"queued\") and .createdAt < \"$cutoff\")] | .[].databaseId")

          if [ -z "$wedged" ]; then
            echo "✅ no wedged Pages runs"
          else
            for id in $wedged; do
              echo "::warning::cancelling wedged Pages run $id (stuck >45 min with no deploy in flight — holding the concurrency group)"
              gh run cancel "$id" --repo "$REPO" \
                || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 \
                || echo "  (could not cancel $id)"
            done
          fi

      - name: Make sure the site actually deployed recently
        run: |
          set -uo pipefail
          # Guard against the silent-staleness failure mode: data workflows all green, but
          # nothing published. If no Pages run has SUCCEEDED in 3 h, kick one.
          cutoff=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list --workflow=pages.yml --repo "$REPO" --limit 40 \
                     --json conclusion,createdAt \
                     --jq "[.[] | select(.conclusion==\"success\" and .createdAt >= \"$cutoff\")] | length")
          active=$(gh run list --workflow=pages.yml --repo "$REPO" --limit 20 \
                     --json status --jq "[.[] | select(.status != \"completed\")] | length")

          echo "successful Pages deploys in last 3h: $recent   currently active: $active"
          if [ "$recent" -eq 0 ] && [ "$active" -eq 0 ]; then
            echo "::warning::no successful Pages deploy in 3 h and none in flight — dispatching one"
            gh workflow run pages.yml --repo "$REPO" --ref main || echo "(dispatch failed)"
          else
            echo "✅ Pages is publishing"
          fi

      - name: Re-run workflows still red
        run: |
          set -uo pipefail
          # "Still red" = its most recent FAILURE is newer than its most recent SUCCESS.
          # Bounded deliberately, so a genuinely broken workflow does not get re-run forever:
          #   - only failures from the last 12 h
          #   - skip anything with an active run (do not fight auto-rerun.yml mid-retry)
          #   - skip runs already on attempt >= 5 (auto-rerun.yml had its go; a human is needed)
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          red=$(gh run list --repo "$REPO" --limit 200 \
                  --json name,conclusion,status,createdAt,databaseId \
                  --jq "
                    [.[] | select(.createdAt >= \"$since\")]
                    | group_by(.name)
                    | map({
                        wf:     .[0].name,
                        active: ([.[] | select(.status != \"completed\")] | length),
                        fail:   ([.[] | select(.conclusion==\"failure\")] | if length>0 then max_by(.createdAt) else null end),
                        okAt:   ([.[] | select(.conclusion==\"success\")] | if length>0 then (max_by(.createdAt).createdAt) else null end)
                      })
                    | map(select(.fail != null and .active == 0 and (.okAt == null or .okAt < .fail.createdAt)))
                    | map(select(.wf != \"Auto-rerun failed workflows\" and .wf != \"CI janitor (unwedge Pages + resweep stragglers)\" and .wf != \"Deploy site to Pages\"))
                    | .[] | \"\(.fail.databaseId)\t\(.wf)\"
                  ")

          if [ -z "$red" ]; then
            echo "✅ nothing still red"
            exit 0
          fi

          printf '%s\n' "$red" | while IFS=$'\t' read -r id wf; do
            [ -z "$id" ] && continue
            att=$(gh run view "$id" --repo "$REPO" --json attempt -q .attempt 2>/dev/null || echo 1)
            if [ "${att:-1}" -ge 5 ]; then
              echo "::warning::'$wf' (run $id) has had $att attempts — leaving it red for a human"
              continue
            fi
            echo "::notice::re-running '$wf' (run $id, attempt $att)"
            gh run rerun "$id" --failed --repo "$REPO" || echo "  (rerun failed for $id)"
            sleep 20        # stagger: these workflows push commits, do not stampede the rebase
          done
