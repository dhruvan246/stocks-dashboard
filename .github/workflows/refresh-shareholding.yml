name: Daily shareholding (FII/DII holdings) refresh

on:
  # SCHEDULE — started by scripts/cron_dispatch.py (cron-job.org tick every 5 min), NOT GitHub cron,
  # which runs 4-7 h late in this repo (measured 2026-09-29, runbook §217). The dispatcher reads the
  # "dispatch-cron" lines below (UTC, standard cron syntax); edit them to change the time.
  # Twice daily INCLUDING weekends — SHP filings land any day (quarterly deadline
  # can fall on a weekend). 07:10 UTC = 12:40 IST midday sweep; 16:10 UTC = 21:40 IST
  # evening sweep (AFTER the 20:45 IST price refresh publishes the `data` release
  # asset, so the backtest rebuild sees today's closes). Off-season runs are cheap.
  # dispatch-cron: "10 7 * * *"
  # dispatch-cron: "10 16 * * *"
  repository_dispatch:
    types: [shareholding-refresh, tick-refresh-shareholding]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a change so the data publishes itself

concurrency:
  group: refresh-shareholding
  cancel-in-progress: false

jobs:
  refresh-shareholding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # §142a: a visibility function was silently deleted from the fetcher by a stale-copy commit on
      # 2026-09-05 and nothing noticed for 16 days. §149 (2026-09-23): the rule is now MIDNIGHT (a filing
      # counts for the calendar day it was broadcast). Refuse to ingest unless BOTH paths apply exactly that.
      - name: Guard — midnight visibility rule must be wired into both ingestion paths
        run: python3 scripts/guard_shp_gate.py

      # §151 (2026-09-24, user rule): FII excludes the "Overseas Depositories (holding DRs)" custodian
      # line in every format (Screener/Trendlyne convention). Parses two real Dr Reddy's filings from
      # scripts/tests/ and refuses to run if the parser ever returns the bucket total again.
      - name: Guard — FII definition excludes depository-receipt shares
        run: python3 scripts/guard_shp_definition.py

      - name: Fetch new/revised shareholding filings (last 3 quarter-ends)
        run: python3 -X utf8 scripts/fetch_shareholding.py

      # Event-driven (mid-quarter) SHPs — capital changes / SAST. Same master endpoint, same
      # window; we dropped them until 2026-08-13 and a stake sale stayed invisible until the next
      # quarterly (AWL: DII 0.05 shown for six weeks while the filed number was 8.76 — §22k).
      # Runs after the quarterly pass so build_engine_feed merges both into shp_engine.json.
      - name: Fetch event-driven (mid-quarter) shareholding filings
        run: python3 -X utf8 scripts/fetch_shareholding.py --events

      # §149: rows the RETIRED 15:30 gate dated at ingestion carry no ledger entry (their raw broadcast
      # lives only in NSE's master). Re-read the master for the same window and move any stored
      # quarterly / event / revision date that equals the old gate's output to the filing day. No XBRL
      # parsed, holdings untouched; a quiet day moves 0 rows. Non-fatal: a failed pass retries tomorrow.
      - name: Regate — move retired-gate dates to the filing day
        run: python3 -X utf8 scripts/fetch_shareholding.py --regate || echo "::warning::regate pass failed — retired-gate dates stay this run"

      # NSE files SME-platform (Emerge) shareholding on a SEPARATE board (index=sme). This pass banks
      # only their total share counts into scripts/shares_outstanding.json (already committed below),
      # which gives the ~570 SME names a market cap on the dashboard and stock pages (shares x close).
      # Non-fatal: a failed SME pass keeps yesterday's counts. DATA_RUNBOOK §145.
      - name: Bank NSE SME share counts (market caps)
        run: python3 -X utf8 scripts/fetch_shareholding.py --sme-shares || echo "::warning::SME share-count pass failed — SME market caps keep yesterday's counts"

      # NOTE: the on-page backtest section was REMOVED per user preference (2026-07-16) —
      # backtests run on demand in chat via scripts/build_shp_backtest.py (runbook §22c).
      # §152 (2026-09-24): a re-filing row must carry the stored original's adjudicated heals (SW-2 foreign
      # Any-Other blocks, §142e, §151) and the store must still hold every audited block. Fails the run
      # before anything is committed if either has been undone.
      - name: Guard — re-filings carry the original's heals
        run: python3 scripts/guard_shp_revisions.py

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit updated shareholding data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ⚠️ reset-and-replay: EVERY file the fetch steps write must be listed here (DATA_RUNBOOK §18 gotcha).
          # They are one read - the history store, the payloads built from it, the share counts, the re-filings
          # sidecar (§142k), the event filings, the Government sidecar - so they land together or not at all, and
          # only if origin still holds the copies this run started from. Sessions commit these files (heals, fill
          # rounds); a copy put back over one of those reverts it. A refused run is re-fetched by the next (§212).
          # shp_events.json is absent until the first --events run lands it; shp_gov.json on an --events-only run.
          BASE=$(git rev-parse HEAD)   # nothing has committed yet: the tree the builders above read
          python3 -X utf8 scripts/ci_land.py snapshot "$BASE" /tmp/land docs/shareholding.json docs/shp_meta.json docs/shp_engine.json docs/shp_gov.json \
                 scripts/shp_history.json scripts/shares_outstanding.json scripts/shp_events.json scripts/shp_revisions.json
          cp scripts/ci_land.py /tmp/ci_land.py   # the reset below must not swap it mid-loop

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -X utf8 /tmp/ci_land.py apply "$BASE" /tmp/land
            git add docs/shareholding.json docs/shp_meta.json docs/shp_engine.json \
                    scripts/shp_history.json scripts/shares_outstanding.json
            [ -f scripts/shp_events.json ] && git add scripts/shp_events.json || true
            [ -f scripts/shp_revisions.json ] && git add scripts/shp_revisions.json || true
            [ -f docs/shp_gov.json ] && git add docs/shp_gov.json || true

            if git diff --cached --quiet; then
              echo "No new shareholding data — nothing to commit"
              exit 0
            fi

            git commit -m "Shareholding refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')" -m "$(cat /tmp/land/landing.txt)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              gh workflow run pages.yml || echo "(pages deploy dispatch failed — will publish on next push)"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1

      # ---------------------------------------------------------------- revision sweep (§22h)
      # BSE carries a company's REVISED shareholding pattern; NSE's master keeps serving the
      # ORIGINAL, so newest-submission-wins never sees the revision and a stored cell silently
      # reflects a superseded filing. First full pass found 231 stale cells accumulated over ~6
      # years, 51 field-values wrong in one earlier sample alone.
      #
      # Runs LAST and cannot affect the data refresh: it is dry-run (writes only its --out report
      # and the gitignored scripts/_shp_bse_cache/), it is continue-on-error, and it sits after the
      # commit + pages dispatch. ⚠️ Deliberately NOT on the reset-and-replay lists above (§18) —
      # those exist for files the fetch step writes into the working tree, and this writes none.
      #
      # Weekly on the evening run is plenty for something that accrues ~40 stale cells a year.
      # Heals are NOT automatic: the report is an artifact, and cell_fix entries are authored from
      # it deliberately (shp_cell_fix.json), because ~15% of flagged "revisions" are themselves the
      # wrong document — APTECHT Mar-2024 has sites backing the STORED value over the revision.
      - name: Weekly BSE revision sweep (report only, never heals)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '10 16 * * *' || github.event.client_payload.schedule == '10 16 * * *'   # client_payload = the cron dispatcher's slot (runbook §217)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" != "7" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not Sunday — skipping the weekly revision sweep"; exit 0
          fi
          mkdir -p /tmp/shpsweep
          # the report is JSONL — one record per verified revision, "diffs" non-empty = STALE
          python3 -X utf8 scripts/shp_revision_sweep.py --out /tmp/shpsweep/revision_report.jsonl
          python3 - <<'PY'
          import json, os
          p = "/tmp/shpsweep/revision_report.jsonl"
          if not os.path.exists(p):
              print("::warning::revision sweep produced no report"); raise SystemExit(0)
          recs = [json.loads(l) for l in open(p, encoding="utf-8") if l.strip()]
          stale = [r for r in recs if r.get("diffs")]
          print("revision sweep: %d records, %d STALE" % (len(recs), len(stale)))
          for r in stale[:20]:
              print("   %-12s %s  %s" % (r.get("sym"), r.get("qe"), r.get("diffs")))
          if stale:
              print("::warning::BSE revision sweep flagged %d stale cell(s) — see the artifact, "
                    "then author shp_cell_fix.json entries by hand (§22h). Do NOT bulk-apply: "
                    "some flagged revisions are themselves the wrong document." % len(stale))
          PY

      - name: Upload revision-sweep report
        if: always() && hashFiles('/tmp/shpsweep/revision_report.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shp-revision-sweep
          path: /tmp/shpsweep/revision_report.jsonl
          retention-days: 30
