name: Data checks (second-reader audit)

# Re-runs scripts/xcheck_run.py — every served number read against a second, independent source
# (NSE bin vs Yahoo bin prices, XBRL vs PDF results, PBT−tax and EPS×shares identities, BSE market cap
# vs shares×close, index feeds vs the niftyindices archive, daily vs monthly flows) — and publishes
# docs/xcheck.json for docs/data-checks.html (runbook §214). The first three checks are the results-season fill checks
# (runbook §251: newest two quarters, every stock — missing rows and wrong figures); their newest-quarter count drives
# the "Results fill check" alert issue at the end of this job. Report-only: it never edits data; a real
# defect is healed through its own ledger, a non-defect is recorded in scripts/xcheck_accept.json.
on:
  # SCHEDULE — started by scripts/cron_dispatch.py (cron-job.org tick every 5 min), NOT GitHub cron,
  # which runs 4-7 h late in this repo (measured 2026-09-29, runbook §217). The dispatcher reads the
  # "dispatch-cron" lines below (UTC, standard cron syntax); edit them to change the time.
  # dispatch-cron: "40 1 * * *"  # 07:10 IST, after the overnight price / fundamentals / shareholding refreshes
  repository_dispatch:
    types: [tick-xcheck]   # sent by scripts/cron_dispatch.py
  workflow_dispatch:
    inputs:
      push_test:
        description: "Send the phone push even if the list is unchanged off season"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write              # the results-season alert issue (runbook §251)

concurrency:
  group: xcheck
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # ~15 s of checks + a 210 MB release download
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run every check
        id: run
        run: |
          set +e
          XCHECK_CACHE=/tmp/xcheck python3 -X utf8 scripts/xcheck_run.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Guard — refuse to publish an empty or truncated report
        run: |
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("docs/xcheck.json", encoding="utf-8"))
          ok = [c for c in r["checks"].values() if (c.get("compared") or 0) > 0]
          if len(ok) < 5:
              sys.exit("only %d checks compared anything" % len(ok))
          print("guard ok: %d checks, %d values compared" % (len(ok), sum(c["compared"] for c in ok)))
          EOF

      # Lands only what this run changed, and only where origin still holds the copy this run started from;
      # a file another writer committed during the run stays theirs with a ::warning:: (runbook §212).
      - name: Commit the report (only if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          python3 -X utf8 scripts/ci_land.py snapshot "$BASE" /tmp/land docs/xcheck.json
          cp scripts/ci_land.py /tmp/ci_land.py
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -X utf8 /tmp/ci_land.py apply "$BASE" /tmp/land
            git add docs/xcheck.json
            if git diff --cached --quiet; then
              echo "Report unchanged — nothing to commit"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Data checks $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')" -m "$(cat /tmp/land/landing.txt)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1

      - name: Publish to Pages (only when the report changed)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run pages.yml && exit 0
            echo "::warning::pages dispatch attempt $i failed (GitHub-side); retrying in 15s"
            sleep 15
          done
          echo "::warning::pages dispatch failed 3x — report is committed; next push or ci-janitor publishes it"

      # Runbook §251. Keeps ONE issue "Results fill check" in step with the newest quarter's lists (checks fill_missing,
      # fill_vision, fund_new_results + the index gaps of docs/_season_coverage.json): opens / comments while anything is
      # listed, closes itself when the list is empty. Cadence by scripts/season_state.py — IN season a comment every
      # morning, OFF season only when the list changed. Report-only; it never touches a stored value.
      - name: Results-season alert, issue + phone push (while the newest quarter has listed cells)
        if: always() && hashFiles('docs/xcheck.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}      # phone push, same cadence as the issue; skipped while unset
          FILL_FORCE_PUSH: ${{ inputs.push_test && '1' || '0' }}
        run: python3 -X utf8 scripts/fill_check_alert.py || echo "::warning::fill-check alert step failed — the lists are still on the Data Checks page"

      - name: Fail the run if a check crashed (the page shows the previous result for it)
        if: steps.run.outputs.rc != '0'
        run: |
          echo "::error::a check raised — see the 'Run every check' step; its card shows the last good result"
          exit 1
