name: Refresh index monthly returns

# docs/index_monthly.json holds month-end closes for ~32 NSE indices back to
# each index's base date (one-time backfill from niftyindices.com history).
# This job only refreshes the CURRENT month's cell from NSE's live index watch
# JSON, so the Monthly Returns page shows a live MTD value that turns into the
# final month-end close after the last trading day. The fetcher targets the
# (year, month) from the feed's own timestamp — a morning catch-up run on the
# 1st can't poison the new month — so evening + catch-up runs are both safe.

on:
  schedule:
    - cron: "50 15 * * 1-5"   # 21:20 IST weekdays — after the close
    - cron: "10 3 * * 2-6"    # 08:40 IST Tue-Sat — catch-up for a missed evening
  repository_dispatch:
    types: [index-monthly-refresh]
  workflow_dispatch: {}
  # Bootstrap/self-test: also run when the fetcher or this workflow changes.
  push:
    paths:
      - "scripts/fetch_index_monthly.py"
      - ".github/workflows/refresh-index-monthly.yml"

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a bot commit (loop guard blocks auto-trigger)

concurrency:
  group: refresh-index-monthly
  cancel-in-progress: false

jobs:
  refresh-index-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Top up the current month from the live index watch
        run: python3 -X utf8 scripts/fetch_index_monthly.py

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      # ⚠️ reset-and-replay gotcha (runbook §18): every file the fetch step
      # writes must ride the cp-to-/tmp + cp-back + git-add lists below.
      - name: Commit updated feed (only if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/index_monthly.json /tmp/index_monthly.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/index_monthly.json docs/index_monthly.json
            git add docs/index_monthly.json
            if git diff --cached --quiet; then
              echo "Feed unchanged — nothing to commit"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Index monthly returns refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1

      # Bot commits can't auto-trigger pages.yml — dispatch it explicitly on change.
      - name: Publish to Pages (only when the feed changed)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # ⚠️ RETRY, AND NEVER FAIL THE RUN ON THIS LINE. The data is already committed and pushed by
        # the step above, so a GitHub-side 503 here turns a fully successful run red and mails about
        # it. Measured 2026-08-17 on refresh-insider: "unable to determine default branch ... HTTP
        # 503" fired AFTER "processed 22 new filings, 50 fresh rows". 14 of the 23 workflows already
        # guarded this line with `|| echo`; these 8 were the stragglers. Retried rather than merely
        # swallowed because the dispatch IS load-bearing (a CI payload cannot deploy itself), and
        # warned rather than failed because the next push, or ci-janitor.yml, publishes it anyway.
        run: |
          for i in 1 2 3; do
            gh workflow run pages.yml && exit 0
            echo "::warning::pages dispatch attempt $i failed (GitHub-side); retrying in 15s"
            sleep 15
          done
          echo "::warning::pages dispatch failed 3x — payload is committed; next push or ci-janitor publishes it"
