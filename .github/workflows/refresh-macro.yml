name: Refresh Macro dashboard

on:
  schedule:
    # 15:10 UTC = 20:40 IST daily — after NSE close so Nifty PE/PB/DY, VIX and the
    # Yahoo rate/commodity series carry the day's value. The feed is CUMULATIVE
    # (every series merges into docs/macro.json and never shrinks), so a skipped
    # or partially-failed run self-heals on the next one.
    - cron: "10 15 * * *"
  # Optional external trigger (cron-job.org):
  #   POST /repos/dhruvan246/stocks-dashboard/dispatches {"event_type":"macro-refresh"}
  repository_dispatch:
    types: [macro-refresh]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a change so the data publishes itself

concurrency:
  group: refresh-macro
  cancel-in-progress: false

jobs:
  refresh-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch macro series (Yahoo + mql5 + FRED + NSE — stdlib only)
        run: python3 scripts/fetch_macro.py

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit updated macro data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/mac/docs
          cp docs/macro.json /tmp/mac/docs/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mac/docs/macro.json docs/macro.json
            git add docs/macro.json

            if git diff --cached --quiet; then
              echo "No new macro data — nothing to commit"
              exit 0
            fi

            git commit -m "Macro refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              gh workflow run pages.yml || echo "(pages deploy dispatch failed — will publish on next push)"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
