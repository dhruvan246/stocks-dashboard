name: Employees — read headcount from annual reports

# Fills the Employee-Headcount dashboard (docs/employees.html). For the survivorship-free Nifty 500
# it downloads each company's newest annual reports from BSE and reads the headcount out of the BRSR
# 'Employees and workers' table (permanent employees + permanent workers = on-roll), validating every
# number structurally — a filing whose layout can't be parsed cleanly is left blank, never guessed.
# Ledgers land in scripts/headcount/<SYM>.json; build_headcount.py bakes docs/employee_headcount.json
# which the page reads. India does not report headcount quarterly, so this is annual (FY ending March).
#
# Seasonal since 2026-09-13: FY ends 31 March and the report is filed by the 30 September AGM deadline, so
# the job runs weekly June-October (+ one November straggler pass) with --refresh-latest, which selects only
# the names whose ledger lacks the newest fiscal year and ADDS that year (merge, never overwrite — hand-
# verified vision/§197 reads stay). The old --skip-existing first-fill skipped any name with a ledger, so it
# could never add a new year. Re-reading one name from scratch: workflow_dispatch with symbols (overwrites).

on:
  schedule:
    - cron: "15 22 * 6-10 0"  # Mondays 03:45 IST, June-October: the annual-report filing window
    - cron: "15 22 15 11 *"   # one straggler pass on 15 November
  workflow_dispatch:
    inputs:
      symbols:
        description: "Only these symbols (space-separated); empty = sweep the universe"
        required: false
        default: ""
      limit:
        description: "Max symbols to read this run"
        required: false
        default: "150"

permissions:
  contents: write
  actions: write        # to dispatch pages.yml (a github-actions push does NOT auto-trigger it)

concurrency:
  group: refresh-headcount
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyMuPDF
        run: pip install --quiet pymupdf

      - name: Read annual reports
        env:
          HC_DOC_CACHE: /tmp/hc_docs
        run: |
          set -e
          touch /tmp/hc_run_start          # only ledgers written after this get committed (never a stale full copy)
          LIM="${{ github.event.inputs.limit || '150' }}"
          SYMS="${{ github.event.inputs.symbols }}"
          if [ -n "$SYMS" ]; then
            python3 scripts/headcount_extract.py $SYMS --max-reports 4 --save
          else
            python3 scripts/headcount_extract.py --universe --refresh-latest --limit "$LIM" --max-reports 2 --save
          fi
          python3 scripts/build_headcount.py

      - name: Commit ledgers + baked payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/hc_led && mkdir -p /tmp/hc_led
          find scripts/headcount -name '*.json' -newer /tmp/hc_run_start -exec cp {} /tmp/hc_led/ \; 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            mkdir -p scripts/headcount && cp /tmp/hc_led/*.json scripts/headcount/ 2>/dev/null || true
            python3 scripts/build_headcount.py
            git add -- scripts/headcount/*.json docs/employee_headcount.json
            if git diff --cached --quiet; then echo "no headcount changes"; exit 0; fi
            git commit -q -m "Employees: headcount ledgers $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "pushed (attempt #$attempt)"
              # a GITHUB_TOKEN push does not trigger pages.yml — dispatch it so the site actually updates
              gh workflow run pages.yml || echo "(pages dispatch failed — will deploy on the next human push)"
              exit 0
            fi
            sleep $(( attempt * 5 ))
          done
          echo "headcount push failed after 5 attempts"; exit 1
