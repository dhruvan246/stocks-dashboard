# Widget feed for the private portfolio page — runs in the cloud so the numbers
# stay live whether the Mac is awake, asleep or shut.
#
# Each run LOOPS for ~30 minutes pushing every 2 minutes, rather than relying on a
# */5 cron: GitHub's scheduler routinely delays scheduled runs by tens of minutes,
# which would leave the widget stale exactly when the market is moving. Overlapping
# runs are harmless (the write is idempotent), so a late start just closes its own gap.
#
# Payload is percentages ONLY — no stock names, no portfolio names, no amounts.
name: Portfolio widget feed

on:
  schedule:
    # Through the session (03:09-09:49 UTC = 08:39-15:19 IST, Mon-Fri), 3x/hour.
    # OFFSET minutes (:09/:29/:49), NOT round numbers: GitHub sheds :00/:20/:40 crons
    # under load — 2026-08-27 EVERY :00/:20/:40 trigger was dropped all morning while
    # the market was open, so the widget froze on the prior close. Offset minutes dodge
    # that contention, and each run loops 35 min (> the 20-min gap) so a dropped trigger
    # is bridged by the previous run. Writes are idempotent, so overlap costs nothing.
    - cron: '9,29,49 3-9 * * 1-5'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'Minutes to keep pushing (0 = single shot)'
        default: '0'

permissions:
  contents: read

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push portfolio feed
        env:
          PF_HOLDINGS_TOKEN: ${{ secrets.PF_HOLDINGS_TOKEN }}
          PF_FEED_TOKEN: ${{ secrets.PF_FEED_TOKEN }}
        run: |
          LOOP="${{ github.event.inputs.loop_minutes }}"
          # 35 > the 20-minute trigger gap on purpose: a run keeps pushing across the
          # next slot, so a dropped/delayed trigger still leaves no hole.
          if [ -z "$LOOP" ]; then LOOP=35; fi
          # --every 60: refresh the number every 60s, matching the live dashboard's poll (no
          # point faster — the quote worker's own cache is ~1 min). The widget still only
          # SHOWS it as often as Android lets KWGT fetch.
          python3 scripts/portfolio_feed.py --loop "$LOOP" --every 60
