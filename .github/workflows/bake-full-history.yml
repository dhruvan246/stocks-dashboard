name: Bake full-history snapshot

# Precomputes every saved strategy's FULL-HISTORY result (true-daily floor 2002-01-02 → the latest
# data date) into the same Supabase snapshot the waves use (bt_snapshots id 'waves', key `full`).
# The 🏛 Full history button on Saved Strategies then reads it instantly — no 24-year backtest in
# anyone's browser, and nobody has to press anything: this fires off the daily data refresh.
#
# Runs in NODE, not a browser. The Playwright harness the wave bake uses could never finish this
# window — every batch died ~40s in, during the data load, before a single backtest ran (2026-08-03).
# The engine is DOM-free by design, so scripts/bake_full.mjs runs it directly: no renderer to crash,
# no service-worker reload, no batch/resume machinery. Measured cost: ~68s per 24-year backtest at a
# flat ~630 MB heap, so the whole set lands well inside the timeout.
#
# Not correctness-critical: if it fails, the button says "isn't baked yet" and nothing else changes.
# It also refuses to publish an empty result set, so a bad run can't blank a good snapshot.

# Chained AFTER the wave bake, not in parallel with it: both write the same snapshot row, and the
# browser-side wave bake rewrites the WHOLE payload from the copy it read at page load. Running
# concurrently, its final write would silently drop a `full` key published while it was working.
# The wave bake itself only runs after a successful data refresh, so this still means "once the
# day's data is in". Any conclusion counts — a failed wave bake shouldn't hold back this one.
on:
  workflow_run:
    workflows: ["Bake wave snapshot"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bake-full-history
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # ~68s x strategies + ~1 min of data load; ample headroom as the list grows
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Node's default heap is under what the merged 24-year dataset needs (~630 MB live, with
      # transient peaks while the deep parts are parsed and prepended).
      - name: Bake the full-history window
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/bake_full.mjs
