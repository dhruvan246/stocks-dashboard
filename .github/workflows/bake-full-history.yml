name: Bake full-history snapshot

# Precomputes every saved strategy's FULL-HISTORY result (true-daily floor 2002-01-02 → the latest
# data date) into the same Supabase snapshot the waves use (bt_snapshots id 'waves', key `full`).
# The 🏛 Full history button on Saved Strategies then reads it instantly — no 24-year backtest in
# anyone's browser, and nobody has to press anything: this fires off the daily data refresh.
#
# Runs in NODE, not a browser. The Playwright harness the wave bake uses could never finish this
# window — every batch died ~40s in, during the data load, before a single backtest ran (2026-08-03).
# The engine is DOM-free by design, so scripts/bake_full.mjs runs it directly: no renderer to crash,
# no service-worker reload, no batch/resume machinery. Measured cost: ~68s per 24-year backtest at a
# flat ~630 MB heap, so the whole set lands well inside the timeout.
#
# Not correctness-critical: if it fails, the column just doesn't appear and nothing else changes.
# It also refuses to publish an empty result set, so a bad run can't blank a good snapshot.

# ONCE A DAY, off the data refresh. Deliberately NOT chained behind bake-waves: that workflow also
# fires on the FUNDAMENTALS refresh, so it runs every ~30 min, and chaining would run this ~30-minute
# job dozens of times a day. The two no longer share a snapshot row (this one owns 'waves_full'), so
# there is nothing to serialise against.
on:
  workflow_run:
    workflows: ["Daily backtest data refresh"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

# QUEUE, don't cancel. This job takes ~30 min; a data refresh that lands while it runs would, with
# cancel-in-progress, kill it and start over — and on a busy day (2026-08-03 saw four refreshes in
# twelve minutes) it can be killed indefinitely and never finish once. GitHub keeps at most one
# pending run per group, so the worst case is "current finishes, one more follows", never a pile-up.
concurrency:
  group: bake-full-history
  cancel-in-progress: false

jobs:
  bake:
    # Manual runs always; auto runs only after the data refresh actually SUCCEEDED.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180        # ~68s x strategies + ~1 min of data load; ample headroom as the list grows
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Node's default heap is under what the merged 24-year dataset needs (~630 MB live, with
      # transient peaks while the deep parts are parsed and prepended).
      - name: Bake the full-history window
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/bake_full.mjs
