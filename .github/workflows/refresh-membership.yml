name: Weekly index membership refresh

# Keeps point-in-time Nifty index membership current. The semi-annual reshuffle is end-March /
# end-September, plus interim changes; NSE publishes each as a press release. build_changelog.py
# now AUTO-DISCOVERS recent press releases, and build_membership_v2.py re-anchors from today's
# official list + the changelog. Running weekly means a new reshuffle is reflected within days
# instead of silently lagging (the failure that mis-dated the March-2026 reshuffle).

on:
  schedule:
    - cron: "30 16 * * 6"   # Saturday 22:00 IST
  # External trigger (cron-job.org) — reliable timing; native cron above stays as backup.
  repository_dispatch:
    types: [membership-refresh]
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/build_changelog.py"
      - "scripts/build_membership_v2.py"
      - ".github/workflows/refresh-membership.yml"

permissions:
  contents: write

concurrency:
  group: refresh-membership
  cancel-in-progress: false

jobs:
  refresh-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pypdf

      - name: Refresh changelog from NSE press releases (auto-discovers new ones)
        run: python3 scripts/build_changelog.py || echo "changelog refresh failed — keeping committed copy"

      # The builder judges "does this key trade on this date" (PHANTOM FLOOR + era-aware key
      # emission, DATA_RUNBOOK §105) from docs/sf_stock_data.bin — the COMMITTED copy is a frozen
      # snapshot (§0), so it must read the LIVE merged bin or it will emit keys the served series
      # no longer carry (CASTROL after CASTROL->CASTROLIND merged). Best-effort: on failure the
      # builder falls back to the committed copy and says so in the log.
      - name: Fetch the LIVE sf price bin for the builder's date checks
        run: python3 scripts/fetch_live_sf.py || echo "live sf fetch failed — builder will read the committed (stale) bin"

      - name: Rebuild point-in-time membership (validates vs official archives)
        run: python3 scripts/build_membership_v2.py

      - name: Drop the fetched bin (never commit the 190 MB live copy)
        run: git checkout -- docs/sf_stock_data.bin || true

      # Append the latest F&O constituents (survivorship-free) from NSE's derivatives bhavcopy and
      # patch docs/stock_data.bin's fnoHistory in place. build_membership_v2.py preserves fnoHistory,
      # so this stays consistent. Catches new F&O additions (e.g. GVT&D) within a week.
      - name: Refresh F&O membership (point-in-time, survivorship-free)
        run: python3 scripts/extend_fno_history.py || echo "F&O refresh failed — keeping existing fnoHistory"

      # Auto-detect PHANTOM corporate actions: a big single-day fall matching a split/bonus ratio but
      # with NO corporate announcement is a CRASH, not a CA — record it so the price build keeps the drop.
      # Appends to scripts/phantom_crashes.json, which build_corp_actions.py (noadjust) and
      # update_sf_data.py (self_heal) both read, so the daily build self-corrects new crashes too.
      - name: Detect phantom corporate actions (crashes mis-read as splits)
        run: python3 scripts/audit_phantom_ca.py 120 || echo "phantom-CA scan failed — keeping existing list"

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit if membership changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/indices_history.json scripts/_changelog.json scripts/fno_history.json scripts/phantom_crashes.json docs/stock_data.bin
          if git diff --cached --quiet; then echo "membership unchanged"; exit 0; fi
          git commit -m "Weekly membership refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d')"
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "pushed"; exit 0; fi
            git fetch origin main && git rebase origin/main || true
          done
          echo "push failed after retries"; exit 1
