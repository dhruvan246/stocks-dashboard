name: Deep-fundamentals ledger top-up

# ★ THE NIGHTLY RUNNER since 2026-09-19 (DATA_RUNBOOK §50a). From 2026-08-05 to 2026-09-19 the nightly
# was the cloud routine trig_013Vx5YYo7xdKgTqKcXBP2DC (claude.ai/code/routines, 00:00 IST): it ran this
# SAME script with the same flags and landed via a claude/xbrl-extra-* PR — but every step is plain
# scripting (NSE filings list → XBRL download → parse → gzip → commit), no LLM read anywhere, so it
# spent a Claude session nightly on work a free runner does identically. The routine is DISABLED, not
# deleted. NEVER run both: they share ONE state contract — the committed ledger .gz and seen-window
# .gz — so either can own the slot, but two schedulers race each other's pushes for the same filings.
# If this cron ever stops delivering, re-enable the routine AND delete the cron below in the same move.
# Manual dispatch stays the catch-up lever (a GitHub runner reaches nsearchives without the worker
# relay, and the Actions cache makes repeat runs cheap).
#
# Keeps scripts/xbrl_extra.json.gz — the ~200-tag-per-filing ledger behind the stock page's
# "Financial detail" block (EPS, balance sheet, cash flow, segments, bank health) — current with
# each day's NSE filings. A GITHUB_TOKEN push cannot fire refresh-stock-fin.yml's `push:` trigger
# (the routine's PR merge was a real push and could), so the commit step DISPATCHES it explicitly,
# the same way refresh-kpi-insights.yml does; the per-stock fin slices follow minutes later.
#
# STATE, and why none of it has to be committed:
#   ledger  — gunzipped from the committed .gz at the start of every run (authoritative).
#   cache   — CI keeps a ROLLING copy of just the last ~3 weeks of XBRL (~150 MB), restored from
#             the Actions cache. The local 5.9-GB cache is NOT needed: --incremental only ever
#             reads files the seen-set hasn't got, and the filings list only offers the window.
#   seen-set— rides in the same Actions cache entry as the cache dir, so the two can't disagree.
#             Lost cache ⇒ empty seed ⇒ the window is re-downloaded and re-extracted, which is
#             harmless: the window only holds the NEWEST filings and the ledger merges per-field
#             non-null latest-wins, so a replay can only re-assert (see xtra_nightly.py).
#   The cache is saved ONLY on success — a run that dies after fetching but before pushing leaves
#   no state behind, so tomorrow redoes it rather than marking those filings seen-but-unextracted.

on:
  # SCHEDULE — started by scripts/cron_dispatch.py (cron-job.org tick every 5 min), NOT GitHub cron,
  # which runs 4-7 h late in this repo (measured 2026-09-29, runbook §217). The dispatcher reads the
  # "dispatch-cron" lines below (UTC, standard cron syntax); edit them to change the time.
  # 18:40 UTC = 00:10 IST — the slot the routine held (18:30 UTC), kept off the :00/:30 marks and
  # after tl-reconcile (18:15 UTC). ONE cron on purpose: a single daily cron delivers reliably on
  # this repo (feed-monitor / tl-reconcile / macro: ~100% of nights over 60 days — it is DENSE
  # schedules GitHub throttles, see refresh-fundamentals.yml), and a missed night self-heals: the
  # filings list is a 14-day window and the ledger merge is per-field latest-wins, so the next run
  # simply picks up what was skipped. Do not add a catch-up cron; do not re-enable the routine.
  # dispatch-cron: "40 18 * * *"
  repository_dispatch:
    types: [tick-xbrl-extra-nightly]   # sent by scripts/cron_dispatch.py
  workflow_dispatch:
    inputs:
      max_fetch:
        description: "Cap on new XBRL downloads this run (cold-start throttle)"
        default: "1500"
      window:
        description: "Filing-list window in days"
        default: "14"

permissions:
  contents: write
  actions: write   # dispatch refresh-stock-fin.yml after a push (a bot push cannot trigger it)

concurrency:
  group: xbrl-extra-nightly
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    # A warm night is ~5 min (a few hundred filings). A COLD one downloads up to max_fetch files
    # sequentially at NSE's pace (~1 s each), so the cap and this timeout move together.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Chrome-TLS transport
        # curl_cffi is the 2nd rung of the transport ladder — NSE's Akamai serves the bot-challenge
        # page to plain-urllib fingerprints (same reason refresh-fundamentals.yml installs it).
        run: pip install -q curl_cffi

      # scripts/_xbrl_cache and scripts/_xtra_seen.json are both gitignored (scripts/_*), so they
      # survive the reset --hard in the commit loop below and never reach a commit.
      - name: Restore rolling XBRL window + seen-set
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/_xbrl_cache
            scripts/_xtra_seen.json
          key: xbrl-window-${{ github.run_id }}
          restore-keys: xbrl-window-

      - name: Unpack the ledger the .gz carries
        run: |
          python3 -c "import gzip,shutil; shutil.copyfileobj(gzip.open('scripts/xbrl_extra.json.gz','rb'), open('scripts/xbrl_extra.json','wb'))"
          ls -l scripts/xbrl_extra.json

      - name: Fetch new filings and extract into the ledger
        run: |
          MF="${{ github.event.inputs.max_fetch }}"; MF="${MF:-1500}"
          WIN="${{ github.event.inputs.window }}"; WIN="${WIN:-14}"
          python3 -X utf8 scripts/xtra_nightly.py \
            --window "$WIN" --max-fetch "$MF" --seed-seen --prune-cache-days 21 \
            --seen-repo scripts/xtra_seen_window.json.gz

      # No --push above: xtra_nightly.py refuses it from a tree named stocks-dashboard (CLAUDE.md
      # rule 2) and the runner's checkout is exactly that. Committing here also matches the rest of
      # the repo's workflows. reset --hard is legal in this ephemeral checkout, hence the copy-back.
      # The ledger and its seen-window are one read: they land together or not at all, and only if origin still
      # holds the copies this run started from. Sessions heal xbrl_extra.json.gz often (40 commits in the 30 days
      # to 28-Sep); the old whole-file copy put this run's build over any heal landed during it (runbook §212).
      # A REFUSED ledger must not mark its filings as done: the seen-set in the Actions cache would advance anyway
      # and the next night would skip them for good. So `refused` gates the cache save below - the next night
      # restores the previous cache, re-downloads those filings (the 14-day window still lists them) and extracts
      # them onto origin's ledger.
      - name: Commit the ledger
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)   # nothing has committed yet: the tree the builders above read
          python3 -X utf8 scripts/ci_land.py snapshot "$BASE" /tmp/land scripts/xbrl_extra.json.gz scripts/xtra_seen_window.json.gz
          cp scripts/ci_land.py /tmp/ci_land.py   # the reset below must not swap it mid-loop
          refused() { python3 -c "import json; print(len(json.load(open('/tmp/land/landing.json'))['refused']))"; }
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python3 -X utf8 /tmp/ci_land.py apply "$BASE" /tmp/land
            git add scripts/xbrl_extra.json.gz scripts/xtra_seen_window.json.gz
            if git diff --cached --quiet; then
              echo "gz unchanged — nothing to push"; echo "refused=$(refused)" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git commit -q -m "Deep-fundamentals ledger top-up $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')" -m "$(cat /tmp/land/landing.txt)"
            if git push origin HEAD:main; then
              echo "pushed (attempt #$attempt)"
              echo "refused=$(refused)" >> "$GITHUB_OUTPUT"
              # A GITHUB_TOKEN push never fires `push:` workflows — kick the slice rebuild ourselves
              # (refresh-stock-fin.yml then dispatches pages.yml once docs/fin changes).
              gh workflow run refresh-stock-fin.yml || echo "(fin-slice rebuild dispatch failed — the next results commit will rebuild)"
              exit 0
            fi
            sleep $(( attempt * 5 ))
          done
          echo "ledger push failed after 5 attempts"; exit 1

      - name: Save rolling XBRL window + seen-set
        if: success() && steps.commit.outputs.refused == '0'
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/_xbrl_cache
            scripts/_xtra_seen.json
          key: xbrl-window-${{ github.run_id }}
