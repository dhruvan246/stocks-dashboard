name: Refresh Market Mood (Nifty 500 turnover + breadth)

on:
  schedule:
    # 16:05 UTC = 21:35 IST, weekdays — after the "Daily backtest data refresh"
    # (15:15 UTC) has rebuilt + published the fresh sf_stock_data.bin `data`
    # release asset. The monthly series only changes at month-end, so most runs
    # are no-ops (the commit step exits when nothing changed).
    - cron: "5 16 * * 1-5"
  # Optional external trigger (cron-job.org) — SEPARATE event type from the
  # other jobs. POST /repos/dhruvan246/stocks-dashboard/dispatches with
  #   {"event_type":"market-mood-refresh"}
  repository_dispatch:
    types: [market-mood-refresh]
  workflow_dispatch: {}
  # Bootstrap/self-test: also run when the builders or this workflow change.
  push:
    paths:
      - "scripts/build_nifty500_turnover.py"
      - "scripts/build_market_breadth.py"
      - "scripts/build_market_breadth_pit.py"
      - ".github/workflows/refresh-market-mood.yml"

permissions:
  contents: write
  actions: write   # needed to dispatch pages.yml after a change

concurrency:
  group: refresh-market-mood
  cancel-in-progress: false

jobs:
  refresh-market-mood:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pull the freshest survivorship-free dataset (published daily by
      # refresh-backtest-data.yml as the `data` release asset). We BUILD from it
      # but never commit it — docs/sf_stock_data.bin stays a frozen snapshot.
      - name: Download fresh sf_stock_data.bin (data release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mm
          gh release download data --pattern 'sf_stock_data.bin' --dir /tmp/mm --clobber
          cp /tmp/mm/sf_stock_data.bin docs/sf_stock_data.bin
          python3 -c "import json,gzip;print('data end =', json.loads(gzip.decompress(open('docs/sf_stock_data.bin','rb').read()))['end'])"

      - name: Rebuild Nifty 500 monthly turnover
        run: python3 -X utf8 scripts/build_nifty500_turnover.py

      - name: Rebuild Nifty 500 market breadth
        run: python3 -X utf8 scripts/build_market_breadth.py

      # Point-in-time breadth 2002->date for BOTH universes (Nifty 500 + F&O) as a backtest
      # regime input (runbook section 21a). Same fresh bin; membership from docs/dash_slim.bin.
      - name: Rebuild point-in-time breadth (N500 + F&O regime series)
        run: python3 -X utf8 scripts/build_market_breadth_pit.py

      # Commit BOTH built feeds (the freshly downloaded bin is discarded by the
      # reset). ⚠️ reset-and-replay gotcha (runbook §18): every file the build
      # steps write MUST ride the cp-to-/tmp + cp-back + git-add lists below,
      # or it is silently thrown away every run (the mf_funds/dash_slim bug).
      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit updated turnover + breadth series (only if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/nifty500_turnover.json /tmp/nifty500_turnover.json
          cp docs/market_breadth.json    /tmp/market_breadth.json
          cp docs/market_breadth_pit.json /tmp/market_breadth_pit.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nifty500_turnover.json docs/nifty500_turnover.json
            cp /tmp/market_breadth.json    docs/market_breadth.json
            cp /tmp/market_breadth_pit.json docs/market_breadth_pit.json
            git add docs/nifty500_turnover.json docs/market_breadth.json docs/market_breadth_pit.json
            if git diff --cached --quiet; then
              echo "Turnover + breadth series unchanged — nothing to commit"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Market Mood: refresh turnover + breadth $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1

      # A GITHUB_TOKEN commit can't trigger pages.yml (GitHub's loop guard), so
      # publish explicitly when the series changed. workflow_dispatch IS allowed
      # from GITHUB_TOKEN; pages.yml's cancel-in-progress de-dupes concurrent deploys.
      - name: Publish to Pages (only when the series changed)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # ⚠️ RETRY, AND NEVER FAIL THE RUN ON THIS LINE. The data is already committed and pushed by
        # the step above, so a GitHub-side 503 here turns a fully successful run red and mails about
        # it. Measured 2026-08-17 on refresh-insider: "unable to determine default branch ... HTTP
        # 503" fired AFTER "processed 22 new filings, 50 fresh rows". 14 of the 23 workflows already
        # guarded this line with `|| echo`; these 8 were the stragglers. Retried rather than merely
        # swallowed because the dispatch IS load-bearing (a CI payload cannot deploy itself), and
        # warned rather than failed because the next push, or ci-janitor.yml, publishes it anyway.
        run: |
          for i in 1 2 3; do
            gh workflow run pages.yml && exit 0
            echo "::warning::pages dispatch attempt $i failed (GitHub-side); retrying in 15s"
            sleep 15
          done
          echo "::warning::pages dispatch failed 3x — payload is committed; next push or ci-janitor publishes it"
