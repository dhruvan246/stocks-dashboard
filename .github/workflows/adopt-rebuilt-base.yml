name: Adopt rebuilt sf_stock_data.bin base (one-shot)

# ONE-SHOT: adopts a locally-rebuilt sf_stock_data.bin as the new release-asset base, then
# re-triggers the normal daily pipeline so it re-splits + force-pushes to sf-data + bumps clients.
# Context: coverage-campaign STEP 3 (scripts/COVERAGE_CAMPAIGN.md) rebuilds TRUE DAILY bars back to
# 2002 (was weekly pre-2018). The rebuilt bin is 200+MB — sessions can't `gh release upload` it
# (permission classifier) and a single file that size can't be committed to git directly, so it is
# split into <95MB parts and pushed to the `rebuild-base` orphan branch; this workflow is the only
# piece that needs CI's token to finish the publish.
# Delete this workflow file + the rebuild-base branch once the adoption is verified live (runbook §41).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout rebuild-base (split parts)
        uses: actions/checkout@v5
        with:
          ref: rebuild-base

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Join split parts into one sf_stock_data.bin
        run: |
          python3 - <<'EOF'
          import json, gzip, glob, re

          parts = sorted(glob.glob("sf_stock_data_*.bin"),
                          key=lambda p: int(re.search(r"_(\d+)\.bin$", p).group(1)))
          if not parts:
              raise SystemExit("ABORT: no sf_stock_data_*.bin parts found on rebuild-base")
          print("joining %d parts: %s" % (len(parts), parts))
          merged = {"data": {}, "meta": {}}
          for p in parts:
              D = json.loads(gzip.decompress(open(p, "rb").read()))
              merged["data"].update(D["data"])
              merged["meta"].update(D["meta"])
              for k in ("start", "dailyFrom", "end"):
                  if k in D:
                      merged[k] = D[k]
          try:
              smeta = json.load(open("sf_meta.json"))
          except Exception:
              smeta = {}
          print("joined %d symbols, end=%s (sf_meta end=%s, rev=%s)"
                % (len(merged["data"]), merged.get("end"), smeta.get("end"), smeta.get("rev")))
          if "ZOMATO" in merged["data"] or not merged["data"].get("ETERNAL"):
              raise SystemExit("ABORT: joined bin looks UN-merged (ZOMATO present or ETERNAL missing)")
          blob = gzip.compress(json.dumps(merged, separators=(",", ":")).encode(), 6)
          open("sf_stock_data.bin", "wb").write(blob)
          print("wrote sf_stock_data.bin (%.1f MB)" % (len(blob) / 1048576))
          EOF

      - name: Publish joined bin as the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload data sf_stock_data.bin --clobber
          echo "Uploaded rebuilt sf_stock_data.bin to the 'data' release."

      - name: Trigger the daily refresh workflow to re-split + publish to sf-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run refresh-backtest-data.yml
          echo "Triggered refresh-backtest-data.yml — it will split the new base (updated split_sf_data.py, N parts) and force-push to sf-data."
