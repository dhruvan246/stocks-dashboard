name: Daily stock data refresh

on:
  schedule:
    # GitHub's own cron is best-effort and skips occasionally. We keep these
    # as a fallback (16:00 / 16:30 / 17:00 IST weekdays), but the primary
    # trigger now comes from an external scheduler (cron-job.org or similar)
    # via the `repository_dispatch` event below.
    - cron: "30 10 * * 1-5"
    - cron: "0  11 * * 1-5"
    - cron: "30 11 * * 1-5"
  # External scheduler hits  POST /repos/{owner}/{repo}/dispatches
  # with header `Authorization: Bearer <PAT>` and body
  # `{"event_type":"scheduled-refresh"}` — guaranteed delivery, no GitHub-cron
  # luck involved.
  repository_dispatch:
    types: [scheduled-refresh]
  workflow_dispatch: {}

permissions:
  contents: write

# Only one refresh run at a time, but later triggers WAIT for in-flight runs
# instead of cancelling them. This way the 16:00 IST cron (which may catch
# partial Yahoo data) completes and commits, then 16:30 / 17:00 runs queue
# and re-fetch in case the earlier one missed today's full close set.
concurrency:
  group: refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download NSE + BSE scrip lists
        env:
          GH_TOKEN: ${{ github.token }}   # scripts/bse_master_asset.py push/pull (data release asset)
        run: |
          # Both masters are checked here before anything reads them: `curl -s` exits 0
          # even when an exchange rejects the request, so a junk body used to land in
          # these files and surface much later as an opaque JSONDecodeError inside
          # fetch_all.py / fetch_sectors.py (which both json.load /tmp/bse.json).
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"

          # --- NSE equity master (~2,400 lines) ---
          ok=0
          for attempt in 1 2 3 4 5 6; do
            curl -sS --compressed --max-time 90 -A "$UA" \
                 "https://archives.nseindia.com/content/equities/EQUITY_L.csv" \
                 -o /tmp/nse.csv || true
            lines=$(wc -l < /tmp/nse.csv 2>/dev/null || echo 0)
            if [ "$lines" -ge 1500 ]; then
              echo "NSE scrip list OK ($lines lines)"
              ok=1; break
            fi
            echo "NSE attempt #$attempt: $lines lines, $(wc -c < /tmp/nse.csv 2>/dev/null || echo 0) bytes — retrying"
            sleep $((attempt * 15))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::NSE scrip list unavailable after 6 attempts"
            exit 1
          fi

          # --- NSE SME-platform master (~570 lines; Emerge, series SM/ST/SZ) — DATA_RUNBOOK §145 ---
          # A SEPARATE file from EQUITY_L.csv: SME names never appear in the main-board master, which
          # is why no SME listing (SUNLITE...) reached the dashboard until 2026-09-22. Fatal on failure
          # for the same reason the other two are: a silently missing list would drop ~570 rows from
          # the published universe and read as "SME vanished" for a day.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            curl -sS --compressed --max-time 90 -A "$UA" \
                 "https://nsearchives.nseindia.com/emerge/corporates/content/SME_EQUITY_L.csv" \
                 -o /tmp/nse_sme.csv || true
            lines=$(wc -l < /tmp/nse_sme.csv 2>/dev/null || echo 0)
            if [ "$lines" -ge 300 ]; then
              echo "NSE SME scrip list OK ($lines lines)"
              ok=1; break
            fi
            echo "NSE SME attempt #$attempt: $lines lines, $(wc -c < /tmp/nse_sme.csv 2>/dev/null || echo 0) bytes — retrying"
            sleep $((attempt * 15))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::NSE SME scrip list unavailable after 6 attempts"
            exit 1
          fi

          # --- BSE active-equity master (~4,900 scrips) ---
          # BSE rate-limits by IP: over quota it answers 302 -> error_Bse.html, and that
          # 162-byte stub is exactly what used to poison /tmp/bse.json (so `-L` would not
          # help — it would just save the error page instead). Quota refills slowly and a
          # success seems to buy a cooldown, so retries are spaced 30s and up rather than
          # hammered. The record-count floor, not the retry, is what guarantees a bad body
          # never reaches the build.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            # BSE gets the honest header set from scripts/bse_headers.py (own UA, no browser
            # impersonation; Accept-Language + Referer are what BSE requires — runbook §181).
            code=$(curl -sS --compressed --max-time 90 -A "stocks-dashboard-research/1.0" \
                 -H "Accept: application/json, text/plain, */*" -H "Accept-Language: en-US,en;q=0.9" \
                 -H "Referer: https://www.bseindia.com/" \
                 "https://api.bseindia.com/BseIndiaAPI/api/ListofScripData/w?Group=&Scripcode=&industry=&segment=Equity&status=Active" \
                 -o /tmp/bse.json -w '%{http_code}') || code=000
            n=$(python3 -c "import json;d=json.load(open('/tmp/bse.json'));print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo 0)
            if [ "$n" -ge 3000 ]; then
              echo "BSE scrip list OK ($n scrips)"
              ok=1; break
            fi
            echo "BSE attempt #$attempt: HTTP $code, $(wc -c < /tmp/bse.json 2>/dev/null || echo 0) bytes, $n scrips — retrying. Body starts:"
            head -c 200 /tmp/bse.json 2>/dev/null || true; echo
            sleep $((attempt * 30))
          done
          if [ "$ok" = 1 ]; then
            # Keep the outage fallback fresh: the live list goes to the `data` release as
            # bse_scrip_master.json.gz (the repo is 9 GB; ~1.7 MB up to 4x/day does not belong in
            # git). Non-fatal — a failed upload only means the fallback stays one run older. §150.
            python3 scripts/bse_master_asset.py push /tmp/bse.json \
              || echo "::warning::could not refresh the bse_scrip_master fallback asset (see log) — DATA_RUNBOOK §150"
          else
            # 2026-09-23: api.bseindia.com answered 403 "Access Denied" (Akamai) to every client for
            # hours; three scheduled runs + their auto-retries all died right here and no close prices
            # shipped that evening. Fall back to the last-good list instead: prices stay fresh, market
            # caps (Mktcap is the ONE source of every mcap on the site) are as old as the fallback —
            # the "FALLBACK BSE MASTER in use" line below says exactly how old. DATA_RUNBOOK §150.
            echo "::warning::BSE scrip list unavailable after 6 attempts (last HTTP $code; bodies logged above) — using the last-good master from the data release; market caps are as old as that copy (DATA_RUNBOOK §150)"
            python3 scripts/bse_master_asset.py pull /tmp/bse.json \
              || { echo "::error::no BSE scrip list: the live fetch failed AND no valid bse_scrip_master.json.gz is on the data release (DATA_RUNBOOK §150)"; exit 1; }
          fi

      - name: Fetch price history from Yahoo Finance
        run: python3 scripts/fetch_all.py

      - name: Fill tickers Yahoo cannot serve from the NSE and BSE bhavcopy stores
        # NSE SME-platform names (SUNLITE...) and a few main-board series have no Yahoo chart
        # (SUNLITE.NS = Not Found; the SME tickers Yahoo does carry are typed MUTUALFUND and
        # rejected by fetch_all). Their series come from docs/sf_stock_data.bin's release asset
        # (NSE bhavcopies, SME ingested since 2026-09-22). Fill-only where Yahoo returned nothing,
        # never a mix inside one ticker. BSE-only rows are filled from docs/bse_prices.bin (BSE's own
        # bhavcopy, split/bonus steps inferred and divided out). Non-fatal: the Yahoo-only payload still ships, and the
        # warning below is what tells you the SME rows shipped price-less. DATA_RUNBOOK §145.
        run: python3 scripts/fill_prices_from_sf.py || echo "::warning::bhavcopy fill failed — SME/NSE-only rows ship without prices this run (see log)"

      - name: Last BSE trade for BSE-only rows still without a price series
        # Listed-but-untraded BSE scrips (no BSE bhavcopy row since 2023-12): BSE's quote header gives the
        # last trade (LTP + date) or none on record; the page shows it with a label. Cached ~1 week in
        # scripts/bse_last_trade.json. Non-fatal. DATA_RUNBOOK §145.
        run: python3 scripts/fill_bse_last_trade.py || echo "::warning::BSE last-trade fill failed — untraded BSE rows show no price this run"

      - name: Share counts for BSE-only rows with no BSE market cap
        # BSE leaves Mktcap blank/0 for scrips with no recent trade; their own BSE shareholding
        # filing still carries the share count (scripts/shares_bse_only.json, cached ~1 quarter, so a
        # normal run makes no BSE calls). build_compressed turns it into mcap x last traded close.
        # Non-fatal. DATA_RUNBOOK §145.
        run: python3 scripts/fill_bse_share_counts.py || echo "::warning::BSE-only share-count fill failed — those rows keep a blank market cap this run"

      - name: Floor the fetch against the last published build
        # fetch_all.py rebuilds stock_data.json from scratch, so whatever Yahoo returns IS
        # what ships. Yahoo intermittently serves a series with one whole session missing
        # (2026-07-31 went 4454 -> 598 bars between two builds 1h45m apart, and back the next
        # morning), and the wholesale overwrite published the hole. This re-adds any bar the
        # committed dash_slim.bin already has, plus the recorded heal ledger. Fill-only, and
        # every re-added bar is gated on neighbouring closes matching, so a Yahoo split
        # re-adjustment is never overwritten with a stale-basis close. DATA_RUNBOOK 1b.
        run: python3 scripts/heal_price_series.py

      - name: Fetch sector metadata from BSE
        run: python3 scripts/fetch_sectors.py

      - name: Build dashboard HTML
        run: python3 scripts/build_compressed.py

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Guard — refuse to commit a half-loaded trading day
        # guard_feed.py only sees file SIZE: the build that dropped 3,856 of 2026-07-31's
        # bars still weighed 99.45% of the good build it replaced. This one counts bars PER
        # SESSION and fails when a published session collapses or sits far below its
        # neighbours. DATA_RUNBOOK 1b.
        run: python3 scripts/guard_sessions.py

      - name: Commit updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save the newly built files outside the working tree first.
          # We use a "reset-and-replay" strategy on push conflicts: pull latest
          # main, drop our new files on top (overwrite, no merge), commit,
          # push. Avoids content-merge conflicts on the binary-ish HTML.
          # NOTE (runbook section 18): EVERY file the build step writes must be
          # carried through /tmp here, or reset-and-replay silently discards it.
          # docs/stock_data.bin (17 MB) is committed on a capped cadence, not
          # every run, to limit repo growth — see the content-based staleness
          # check below (runbook §103: a schedule-based cap silently drifted
          # into a ~10-week price freeze once refresh-membership.yml's weekly
          # commits stopped actually touching the price series).
          cp docs/nse-bse-dashboard.html /tmp/new_dashboard.html
          cp docs/dash_slim.bin          /tmp/new_dash_slim.bin
          cp docs/stock_data.bin         /tmp/new_stock_data.bin

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/new_dashboard.html docs/nse-bse-dashboard.html
            git add docs/nse-bse-dashboard.html

            # dash_slim.bin (~2 MB) backs sectors.html + the dashboard's first
            # paint, and CI builders (build_discovery, enrich_order_shares,
            # build_quarterly_results) read the COMMITTED copy. Commit it only
            # when its data really changed (new trading day / corrected close);
            # identical same-day re-runs skip it to limit git-history growth.
            if ! python3 scripts/dash_slim_same.py /tmp/new_dash_slim.bin docs/dash_slim.bin; then
              cp /tmp/new_dash_slim.bin docs/dash_slim.bin
              git add docs/dash_slim.bin
            fi

            # stock_data.bin (17 MB, full price history — sectors/movers/stock/
            # stock-backtest pages' long-range views) is only worth the repo-size
            # cost when its own committed copy's prices have actually gone stale.
            # Checked by CONTENT (actual last price date inside the committed
            # file), not by day-of-week or "did a commit land recently" — the
            # latter is exactly what let a fnoHistory-only patch pass as a real
            # refresh for ~10 weeks (runbook §103). Self-healing: any missed or
            # failed run just means the NEXT run still sees it as stale and
            # commits, so this can't silently drift again.
            if ! python3 scripts/stock_bin_stale.py docs/stock_data.bin 5 /tmp/new_stock_data.bin; then   # stale prices OR a changed symbol set (§145)
              cp /tmp/new_stock_data.bin docs/stock_data.bin
              git add docs/stock_data.bin
            fi

            if git diff --cached --quiet; then
              echo "Remote already has identical dashboard — nothing to commit"
              exit 0
            fi

            git commit -m "Daily refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1

      - name: Upload raw data as artifact (optional, 7-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: stock_data
          path: scripts/stock_data.json
          retention-days: 7
          if-no-files-found: ignore
