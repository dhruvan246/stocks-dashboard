name: Cron dispatcher (starts scheduled jobs on time)

# GitHub's own cron runs 4-7 h late in this repo (measured 2026-09-29, runbook §217), so
# scheduled workflows keep their slots as `# dispatch-cron: "..."` comment lines and this
# job starts whatever is due. PRIMARY trigger: cron-job.org POSTs
#   /repos/dhruvan246/stocks-dashboard/dispatches  {"event_type":"cron-tick"}
# every 5 minutes (same PAT/mechanism as refresh.yml's "scheduled-refresh" job).
# The */5 GitHub cron below is only a backup; a late tick is harmless (the script looks at
# the last 3 h of slots and at what has already run, so nothing starts twice).
# Slots tagged `dispatch-cron[in-season]` / `[off-season]` are picked by the results-season state
# that scripts/season_state.py measures from docs/results_feed.json + the quarter calendar on
# every tick (runbook §222) — that is why those two files are in the sparse checkout.

on:
  repository_dispatch:
    types: [cron-tick]
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write   # POST /dispatches
  actions: read     # list recent runs

concurrency:
  group: cron-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts/cron_dispatch.py
            scripts/season_state.py
            docs/results_feed.json
          sparse-checkout-cone-mode: false
      - name: Start due workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/cron_dispatch.py
