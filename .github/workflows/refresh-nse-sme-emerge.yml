name: Refresh Nifty SME Emerge index

# Nifty SME Emerge (runbook §210): NSE's official end-of-day level (docs/nifty_sme_emerge.json — home card +
# index-chart.html?ix=smeemerge), NSE's official constituent list (captured every run; changes land in
# docs/nse_sme_emerge/changes.json), NSE Indices' press releases (every change to the index is announced in one:
# new ones are parsed into scripts/nse_sme_emerge_events.json) and the point-in-time membership rebuilt from them
# (docs/nse_sme_emerge/history.json + stints.json). The every-member table (docs/survivorship/niftysmeemerge.json)
# needs the sf price bin and is rebuilt by refresh-market-mood.yml each weekday evening.

on:
  # SCHEDULE — started by scripts/cron_dispatch.py (cron-job.org tick every 5 min), NOT GitHub cron,
  # which runs 4-7 h late in this repo (measured 2026-09-29, runbook §217). The dispatcher reads the
  # "dispatch-cron" lines below (UTC, standard cron syntax); edit them to change the time.
  # dispatch-cron: "0 14 * * *"  # 19:30 IST daily — after NSE publishes the day's index close file
  # dispatch-cron: "45 3 * * *"  # 09:15 IST daily — catch-up (lists / releases published overnight)
  repository_dispatch:
    types: [tick-refresh-nse-sme-emerge]   # sent by scripts/cron_dispatch.py
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/fetch_nse_sme_emerge.py"
      - "scripts/nse_sme_emerge_prs.py"
      - "scripts/build_nse_sme_emerge_pit.py"
      - "scripts/fetch_nifty_microcap250.py"
      - ".github/workflows/refresh-nse-sme-emerge.yml"

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a bot commit (loop guard blocks auto-trigger)

concurrency:
  group: refresh-nse-sme-emerge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        # pypdf PINNED (runbook §227): 6.20.0 (2026-10) reads NSE's revocation tables differently and dropped real rows
        # (ind_prs19032024: Smallcap 100 'BSE Exclusion', Microcap 250 'VGUARD Inclusion revoked'). 6.19.0 reads them as
        # printed. Bump only after build_changelog.py output is byte-identical on the new version.
        run: pip install pypdf==6.19.0

      # NSE_INDCLOSE_CACHE: a temp dir — the level is fetched from 7 days before the last stored session.
      - name: Fetch the official level, member list, renames and new press releases
        env:
          NSE_INDCLOSE_CACHE: /tmp/nse_ind_close
        run: python3 -X utf8 scripts/fetch_nse_sme_emerge.py

      # Nifty Microcap 250 level (runbook §227) — the same NSE all-indices file, already in the cache dir above.
      # Its members live in scripts/indices_history.json (refresh-membership.yml), not here.
      - name: Fetch the Nifty Microcap 250 official level
        env:
          NSE_INDCLOSE_CACHE: /tmp/nse_ind_close
        run: python3 -X utf8 scripts/fetch_nifty_microcap250.py

      - name: Rebuild point-in-time membership
        run: python3 -X utf8 scripts/build_nse_sme_emerge_pit.py

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      # ⚠️ reset-and-replay (runbook §18): everything the fetch wrote rides /tmp across the reset.
      - name: Commit (only if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The level, the member list and its change log, the press-release ledgers and the point-in-time tables
          # built from them are one read: they land together or not at all, and only if origin still holds the
          # copies this run started from. Each snapshots/<date>.json lands on its own - NSE serves only the CURRENT
          # list, undated, so a captured one can never be fetched again and must not wait on an unrelated conflict
          # (runbook §212).
          BASE=$(git rev-parse HEAD)   # nothing has committed yet: the tree the builders above read
          python3 -X utf8 scripts/ci_land.py snapshot "$BASE" /tmp/land docs/nifty_sme_emerge.json docs/nifty_microcap250.json docs/nse_sme_emerge/ scripts/nse_sme_emerge_events.json scripts/nse_sme_emerge_renames.json
          cp scripts/ci_land.py /tmp/ci_land.py   # the reset below must not swap it mid-loop
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -X utf8 /tmp/ci_land.py apply "$BASE" /tmp/land --single 'docs/nse_sme_emerge/snapshots/ docs/nifty_microcap250.json'
            git add docs/nifty_sme_emerge.json docs/nifty_microcap250.json docs/nse_sme_emerge scripts/nse_sme_emerge_events.json scripts/nse_sme_emerge_renames.json
            if git diff --cached --quiet; then echo "unchanged"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            git commit -m "Nifty SME Emerge index refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')" -m "$(cat /tmp/land/landing.txt)"
            if git push origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push #$attempt rejected; retry"; sleep $((attempt*3))
          done
          echo "push failed"; exit 1

      - name: Publish to Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml || echo "(pages dispatch failed — next push publishes)"
