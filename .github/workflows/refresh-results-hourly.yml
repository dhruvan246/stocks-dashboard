name: Hourly results feed + calendar

# Light hourly top-up for the Quarterly Results page during filing hours
# (08:30–00:30 IST, every day — results land all day and past midnight in season).
# Commits ONLY the two small side-files (results_feed.json ~100 KB, results_calendar.json
# ~40 KB) — the big announcements.json stays on its own 4×/day cadence to avoid
# bloating git history with 4.7 MB hourly snapshots.

on:
  schedule:
    - cron: "0 3-19 * * *"   # hourly, 03:00–19:00 UTC = 08:30–00:30 IST
  repository_dispatch:
    types: [results-hourly]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-results-hourly
  cancel-in-progress: false

jobs:
  refresh-results-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # fetch_announcements refreshes announcements.json locally too (merge-based, needed as
      # the base for the feed slice) — we just don't commit the big file here.
      - name: Fetch NSE announcements slice + results feed
        run: python3 -X utf8 scripts/fetch_announcements.py

      - name: Fetch NSE results calendar
        run: python3 -X utf8 scripts/fetch_results_calendar.py || echo "(calendar fetch failed — keeping previous)"

      - name: Merge BSE results into feed + calendar
        run: python3 -X utf8 scripts/fetch_bse_results.py || echo "(BSE merge failed — keeping NSE-only)"

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit feed + calendar (only if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/results_feed.json     /tmp/results_feed.json
          cp docs/results_calendar.json /tmp/results_calendar.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/results_feed.json     docs/results_feed.json
            cp /tmp/results_calendar.json docs/results_calendar.json
            git add docs/results_feed.json docs/results_calendar.json
            if git diff --cached --quiet; then
              echo "No new result filings — nothing to commit"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Results feed hourly top-up $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"; exit 1

      - name: Publish to Pages (only when changed)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml || echo "(pages dispatch failed — next push publishes)"
