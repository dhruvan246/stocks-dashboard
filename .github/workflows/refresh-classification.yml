name: Refresh sector classification

# The 5-level BSE industry classification (docs/sector_classification.json) powers
# the Sector & Industry Indexes page. It changes rarely, so weekly is plenty.
# Isolated from the daily price refresh so a flaky BSE day never blocks prices.
on:
  schedule:
    - cron: "0 18 * * 6"        # Saturdays 18:00 UTC = 23:30 IST
  # External trigger (cron-job.org) — reliable timing; native cron above stays as backup.
  repository_dispatch:
    types: [classification-refresh]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Self-sufficient: downloads its own NSE + BSE scrip masters, reads the
      # committed docs/stock_data.bin for ticker keys, writes the side file.
      # Has a built-in guard that refuses to overwrite with a partial result.
      - name: Fetch BSE 5-level classification
        run: python3 scripts/fetch_classification.py

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/sector_classification.json; then
            echo "No classification change."; exit 0
          fi
          git add docs/sector_classification.json
          git commit -m "Refresh sector classification (weekly)"
          for i in 1 2 3 4 5; do
            git fetch origin -q
            git rebase --autostash origin/main || git rebase --abort
            git push origin main && break
            sleep $((i*3))
          done
