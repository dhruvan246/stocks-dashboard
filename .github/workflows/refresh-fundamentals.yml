name: Daily fundamentals refresh

on:
  schedule:
    # HOURLY at :45 from 04:45–17:45 UTC = 10:15–23:15 IST, EVERY day (weekend board
    # meetings exist) — so a company's numbers appear within ~an hour of its XBRL landing,
    # not the next night. Self-heals: the updater scans a 120-day window each run.
    # The 15:45 UTC (21:15 IST) run is the FULL nightly one — it always rebuilds the
    # Quarterly Results payload (price reactions/drift) even with no new filings; other
    # hours rebuild it only when new earnings actually landed (keeps git history lean).
    - cron: "45 4-17 * * *"
  # Optional external triggers (cron-job.org) — SEPARATE event types from the
  # stock/MF/FII/backtest-data jobs. POST /repos/dhruvan246/stocks-dashboard/dispatches
  # with {"event_type":"fundamentals-refresh"} for the full pipeline, or
  # {"event_type":"insurer-refresh"} for a DAILY run that ALSO fills insurers (IRDAI-format
  # vision fill). The insurer step runs only on insurer-refresh, the 21:15 IST schedule, or a
  # manual dispatch — NOT on fundamentals-refresh — so an hourly fundamentals trigger doesn't
  # re-fetch/re-vision the 11 insurers every hour.
  repository_dispatch:
    types: [fundamentals-refresh, insurer-refresh]
  workflow_dispatch:
    inputs:
      insurer_verify_quarter:
        description: "Diagnostic: re-read insurers for this quarter-end (YYYYMMDD) and print vision-vs-stored WITHOUT writing. Blank = normal gap-fill."
        default: ""

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a change so the data publishes itself

concurrency:
  group: refresh-fundamentals
  cancel-in-progress: false

jobs:
  refresh-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Pull newly-filed quarterly results into sf_fundamentals.json
        run: python3 scripts/update_fundamentals.py

      # INSURERS (LICI/SBILIFE/HDFCLIFE/ICICIPRULI/ICICIGI/GICRE/NIACL/STARHEALTH/GODIGIT/NIVABUPA/MFSL)
      # file IRDAI-format results the XBRL parser above can't read. fetch_insurers.py fills them unattended:
      # (1) text-extract Profit-after-tax off the Shareholders' P&L + DOUBLE-ANCHOR (preceding-quarter AND
      # year-ago columns must both match our stored con series) — free, handles the clean filings; (2) for
      # the text-resistant ones (scanned tables / computed owners-profit), a FREE **Gemini vision** fallback
      # (GEMINI_API_KEY, Google AI Studio free tier — no billing) reads the P&L page, still ANCHOR-VERIFIED
      # against the stored year-ago value. NEVER writes an unanchored guess. Runs once daily (see gate);
      # fill-only + 5-month window self-heal a missed day. Deps: pymupdf + curl_cffi (both stdlib-light;
      # Gemini is called over plain HTTPS). No GEMINI_API_KEY ⇒ text-only (the 4 clean insurers still fill).
      - name: Auto-fill insurer net profit (IRDAI-format, free text + double-anchor + Gemini vision)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          VQ="${{ github.event.inputs.insurer_verify_quarter }}"
          if [ -n "$VQ" ]; then
            pip install -q pymupdf curl_cffi
            echo "DIAGNOSTIC: verifying insurer reads for $VQ (no write)"
            python3 -X utf8 scripts/fetch_insurers.py --verify "$VQ"; exit 0
          fi
          # Run insurers only on: manual dispatch, the daily cron-job.org "insurer-refresh" trigger, or
          # the 21:15 IST (15:xx UTC) nightly schedule. Skip on every other trigger (hourly schedule,
          # fundamentals-refresh) so we don't re-fetch/re-parse 11 insurers every hour.
          EV="${{ github.event_name }}"; ACTION="${{ github.event.action }}"; RUN=0
          [ "$EV" = "workflow_dispatch" ] && RUN=1
          [ "$EV" = "schedule" ] && [ "$(date -u +%H)" = "15" ] && RUN=1
          [ "$EV" = "repository_dispatch" ] && [ "$ACTION" = "insurer-refresh" ] && RUN=1
          if [ "$RUN" != "1" ]; then echo "Not an insurer-fill trigger ($EV/$ACTION) — skipping"; exit 0; fi
          pip install -q pymupdf curl_cffi
          python3 -X utf8 scripts/fetch_insurers.py || echo "(insurer fill failed — keeping existing; insurers stay gapped this run)"

      # Backstop: any quarter that lands without a filing date (Screener backfills, integrated
      # rows with broadcast_Date=None) gets the SEBI deadline so the point-in-time screen can use
      # it (a null date silently drops the quarter -> stale fallback, which wrongly excluded AIIL).
      - name: Fill any null announcement dates (point-in-time safety)
        run: python3 scripts/fill_ann_dates.py

      # Re-assert OWNERS-ATTRIBUTABLE consolidated profit from the reconciled XBRL cache. Without
      # this, newly-filed quarters land as total PAT, and (critically) renamed tickers never matched
      # the cache (keyed by the OLD name) so they silently kept total PAT — e.g. SWANCORP Dec-2022
      # showed -157 instead of owners +16.85. The applier is rename-aware (REV map) + guards 0-mistags.
      - name: Re-assert owners-attributable consolidated profit (incl. renamed tickers)
        run: python3 scripts/apply_owners_full.py

      # Rebuild the Results Season chart payload from the just-updated net profit + rev/op. The
      # aggregator keys every filing by its OWN quarter-end, so a late filing (e.g. a March quarter
      # declared in July) lands in the March column, and a brand-new quarter (June) appears as its own
      # column from its VERY FIRST filing, flagged partial (rendered "in progress" until enough
      # companies report). Universe (turnover floor) is read from the committed sf_stock_data.bin
      # (stable; fine if a little stale).
      - name: Rebuild Results Season chart data
        if: ${{ hashFiles('docs/.fund_updated') != '' }}
        run: python3 scripts/build_results_season.py

      # SAFETY NET: for every index on results-season.html, flag any member that has DECLARED results
      # for the live quarter but whose numbers aren't parsed into the chart yet (the 22-vs-25 gap). Prints
      # to the CI log the moment a gap appears and writes docs/_season_coverage.json. Never fails the run.
      - name: Check Results Season coverage (declared vs parsed)
        if: ${{ hashFiles('docs/.fund_updated') != '' }}
        run: python3 -X utf8 scripts/check_season_coverage.py || echo "(coverage check errored — non-fatal)"

      # Quarterly Results page payload — rebuilt EVERY run (not just when new earnings land):
      # result-day reactions and since-result drift move with prices daily. Reactions need the
      # FRESH price bin (the committed docs bin is a stale snapshot — runbook §0), so pull the
      # `data` release asset like refresh-market-mood does. Non-fatal on download failure.
      - name: Rebuild Quarterly Results payload (fresh prices)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hourly runs rebuild only when new earnings landed; the 15:xx UTC (21:xx IST)
          # run always rebuilds so reactions/drift track daily prices (published ~20:45 IST).
          if [ ! -f docs/.fund_updated ] && [ "$(date -u +%H)" != "15" ]; then
            echo "No new earnings this hour — skipping payload rebuild"
            exit 0
          fi
          mkdir -p /tmp/qr
          if gh release download data --pattern 'sf_stock_data.bin' --dir /tmp/qr --clobber; then
            SF_BIN=/tmp/qr/sf_stock_data.bin python3 -X utf8 scripts/build_quarterly_results.py
          else
            echo "(release download failed — building from committed bin; reactions may lag)"
            python3 -X utf8 scripts/build_quarterly_results.py
          fi

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      - name: Commit updated fundamentals + results pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FUND=0; [ -f docs/.fund_updated ] && FUND=1
          cp docs/sf_fundamentals.json /tmp/sf_fundamentals.json
          cp docs/sf_revop.json        /tmp/sf_revop.json
          cp docs/results_season.json  /tmp/results_season.json
          [ -f docs/_season_coverage.json ] && cp docs/_season_coverage.json /tmp/_season_coverage.json
          cp docs/quarterly_results.json /tmp/quarterly_results.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            if [ "$FUND" = "1" ]; then
              cp /tmp/sf_fundamentals.json docs/sf_fundamentals.json
              cp /tmp/sf_revop.json        docs/sf_revop.json
              cp /tmp/results_season.json  docs/results_season.json
              [ -f /tmp/_season_coverage.json ] && cp /tmp/_season_coverage.json docs/_season_coverage.json && git add docs/_season_coverage.json
              git add docs/sf_fundamentals.json docs/sf_revop.json docs/results_season.json
            fi
            cp /tmp/quarterly_results.json docs/quarterly_results.json
            git add docs/quarterly_results.json
            if git diff --cached --quiet; then echo "no diff"; exit 0; fi
            git commit -m "Daily fundamentals + results refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then echo "pushed (attempt #$attempt)"; gh workflow run pages.yml || echo "(pages deploy dispatch failed)"; exit 0; fi
            sleep $(( attempt * 3 ))
          done
          echo "push failed after 5 attempts"; exit 1
