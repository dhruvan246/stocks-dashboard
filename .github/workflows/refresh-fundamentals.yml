name: Daily fundamentals refresh

on:
  schedule:
    # Hourly at :00, 04:00–14:00 UTC = 09:30–19:30 IST, EVERY day (weekend board meetings
    # exist). Span covers the results-filing window (filings cluster 15:00–20:00 IST).
    #
    # 2026-08-18 — HALVED from twice-hourly (":00/:30", 22 runs) to hourly (":00", 11 runs) for the
    # off-season. The Jun-2026 season closed 14-Aug and new filings fell 756/day -> ~8/day, so the
    # second slot each hour bought nothing but git churn on single-line JSONs — the same files the
    # bse-vision-fill routine has to merge past. This is a REDUCTION and does NOT contradict the
    # throttling note below, which warns only against making the cron DENSER. The 19:30 IST last
    # slot (was 20:00) is covered by refresh-bse 20:10 and the 21:15 IST nightly below.
    # RESTORE "0,30 4-14 * * *" when the next season opens ~mid-Oct 2026.
    #
    # ⚠️ THE REQUESTED CADENCE IS NOT THE DELIVERED CADENCE. This was "*/15" until
    # 2026-07-22, on the theory that firing 4×/h makes a dropped slot cheap. Measuring the
    # actual run history killed that theory: over 07-19→07-22 the gaps between consecutive
    # SCHEDULED runs were 102, 63, 56, 94, 65, 79, 123, 205, 134, 134, 95, 51, 129, 164,
    # 127, 94, 131, 116, 114, 163 min — median ~115 min, and NOT ONE gap under 51 min.
    # "*/15" was delivering ~8% of the requested runs. GitHub throttles high-frequency cron
    # on free public repos, and asking for more appears to get you dropped harder, so the
    # dense schedule was buying nothing. ":00/:30" states an honest intent; if delivery
    # still measures ~2 h, the fault is GitHub's queue, not this line — do NOT "fix" it by
    # making the cron denser again. That was already tried.
    #
    # For cadence that actually holds, use the repository_dispatch path below (external
    # scheduler = guaranteed delivery). GitHub cron is the FALLBACK, not the primary.
    # Idle runs are ~40 s (the updater skips iXBRL for quarters already stored) and the
    # 1.8 MB Quarterly Results baker stays GATED on docs/.fund_updated, so this costs
    # ~nothing and does NOT bloat git history. Actions minutes are free (public repo).
    - cron: "0 4-14 * * *"
    # 15:45 UTC (21:15 IST) — the FULL nightly run: insurer vision fill + IPO-base fill +
    # an UNGATED baker rebuild (so reactions/drift track the 20:45 IST prices). It gets
    # hours 15 AND 16 UTC to itself — no dense cron there — because the steps below detect
    # it by wall-clock hour, and a run that drifts past the hour boundary must still count
    # as the nightly (see the 15|16 gate). Don't add a cron in hour 15/16.
    - cron: "45 15 * * *"
    # 17:45 UTC (23:15 IST) — final light top-up for late-evening filings.
    - cron: "45 17 * * *"
  # Optional external triggers (cron-job.org) — SEPARATE event types from the
  # stock/MF/FII/backtest-data jobs. POST /repos/dhruvan246/stocks-dashboard/dispatches
  # with {"event_type":"fundamentals-refresh"} for the full pipeline, or
  # {"event_type":"insurer-refresh"} for a DAILY run that ALSO fills insurers (IRDAI-format
  # vision fill). The insurer step runs only on insurer-refresh, the 21:15 IST schedule, or a
  # manual dispatch — NOT on fundamentals-refresh — so an hourly fundamentals trigger doesn't
  # re-fetch/re-vision the 11 insurers every hour.
  repository_dispatch:
    types: [fundamentals-refresh, insurer-refresh]
  workflow_dispatch:
    inputs:
      insurer_verify_quarter:
        description: "Diagnostic: re-read insurers for this quarter-end (YYYYMMDD) and print vision-vs-stored WITHOUT writing. Blank = normal gap-fill."
        default: ""

permissions:
  contents: write
  actions: write   # dispatch pages.yml after a change so the data publishes itself

concurrency:
  group: refresh-fundamentals
  cancel-in-progress: false

jobs:
  refresh-fundamentals:
    runs-on: ubuntu-latest
    # ⚠️ 20 was too tight for the NIGHTLY run: insurer vision (~11m) + IPO-base backfill (~9m) alone
    # hit 20m, so the job was CANCELLED before "Rebuild Quarterly Results payload" + commit ever ran —
    # quarterly_results.json went 2 days stale (2026-07-18→20) and freshly-parsed numbers (RBLBANK,
    # FEDERALBNK…) never reached the page. Non-nightly runs skip those heavy steps and still finish in
    # ~2-3m, so this only affects the one nightly/dispatch pass. 40m leaves headroom for the rebuild.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # BASE snapshot for the three-way merge in the commit step. MUST be taken before any step
      # below modifies the payloads, so it records the files as checked out -- i.e. what origin
      # looked like when this run began. Without a base, the commit step can only choose between
      # its own copy and origin's, and it chose its own: on 2026-08-06 that silently reverted 193
      # backfilled cells that landed mid-run. See scripts/ci_preserve_merge.py.
      - name: Snapshot payload baseline (concurrent-writer merge)
        run: |
          mkdir -p /tmp/base
          cp docs/sf_fundamentals.json /tmp/base/sf_fundamentals.json
          cp docs/sf_revop.json        /tmp/base/sf_revop.json

      - name: Pull newly-filed quarterly results into sf_fundamentals.json
        # curl_cffi = Chrome-TLS fallback transport — 2026-07-20 NSE's Akamai began serving the
        # bot-challenge page to this API for plain-urllib fingerprints (fails LOUD without it).
        # continue-on-error (2026-07-21): during the 2026-07-20 lockdown this step failed EVERY run
        # and took the season/payload bakes down with it, so the Season Trends chart froze at 44
        # reporters while the vision safety-net kept the page itself current at 62. The bakes below
        # must run regardless; the LAST step re-raises this failure so the run still goes red.
        id: xbrl
        continue-on-error: true
        run: |
          pip install -q curl_cffi
          python3 scripts/update_fundamentals.py

      # INSURERS (LICI/SBILIFE/HDFCLIFE/ICICIPRULI/ICICIGI/GICRE/NIACL/STARHEALTH/GODIGIT/NIVABUPA/MFSL)
      # file IRDAI-format results the XBRL parser above can't read. fetch_insurers.py fills them unattended:
      # (1) text-extract Profit-after-tax off the Shareholders' P&L + DOUBLE-ANCHOR (preceding-quarter AND
      # year-ago columns must both match our stored con series) — free, handles the clean filings; (2) for
      # the text-resistant ones (scanned tables / computed owners-profit), a FREE **Gemini vision** fallback
      # (GEMINI_API_KEY, Google AI Studio free tier — no billing) reads the P&L page, still ANCHOR-VERIFIED
      # against the stored year-ago value. NEVER writes an unanchored guess. Runs once daily (see gate);
      # fill-only + 5-month window self-heal a missed day. Deps: pymupdf + curl_cffi (both stdlib-light;
      # Gemini is called over plain HTTPS). No GEMINI_API_KEY ⇒ text-only (the 4 clean insurers still fill).
      - name: Auto-fill insurer net profit (IRDAI-format, free text + double-anchor + Gemini vision)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          VQ="${{ github.event.inputs.insurer_verify_quarter }}"
          if [ -n "$VQ" ]; then
            pip install -q pymupdf curl_cffi
            echo "DIAGNOSTIC: verifying insurer reads for $VQ (no write)"
            python3 -X utf8 scripts/fetch_insurers.py --verify "$VQ"; exit 0
          fi
          # Run insurers only on: manual dispatch, the daily cron-job.org "insurer-refresh" trigger, or
          # the 21:15 IST nightly schedule. Skip on every other trigger (the 15-min schedule,
          # fundamentals-refresh) so we don't re-fetch/re-parse 11 insurers four times an hour.
          # ⚠️ Hour 15 OR 16 UTC both count as nightly: the "45 15" cron can DRIFT past the hour
          # boundary (GitHub fired a :45 cron at :02–:29 past on 2026-07-17), and an exact
          # "=15" test would then silently skip the nightly for that whole day. Only the one
          # nightly cron lives in hours 15–16, so the wider window can't double-fire.
          EV="${{ github.event_name }}"; ACTION="${{ github.event.action }}"; RUN=0
          [ "$EV" = "workflow_dispatch" ] && RUN=1
          [ "$EV" = "schedule" ] && case "$(date -u +%H)" in 15|16) RUN=1;; esac
          [ "$EV" = "repository_dispatch" ] && [ "$ACTION" = "insurer-refresh" ] && RUN=1
          if [ "$RUN" != "1" ]; then echo "Not an insurer-fill trigger ($EV/$ACTION) — skipping"; exit 0; fi
          pip install -q pymupdf curl_cffi
          python3 -X utf8 scripts/fetch_insurers.py || echo "(insurer fill failed — keeping existing; insurers stay gapped this run)"

      # Manual insurer PAT entries typed on docs/insurer-inbox.html (Supabase kv INSURER_INBOX).
      # Cheap (1 HTTP call when idle) so it runs on EVERY trigger — a number typed on the phone
      # right after a result lands is filed within the hour, not at night. Validated hard
      # (insurer whitelist + plausible-range gate) and fill-only unless the entry says overwrite.
      - name: Apply insurer-inbox manual entries
        run: python3 -X utf8 scripts/apply_insurer_inbox.py || echo "(insurer inbox failed — entries stay pending)"

      # NEW-LISTING year-ago bases: a fresh IPO/migration files XBRLs that carry ONLY the current
      # quarter, so its profit-growth YoY% stays blank. backfill_ipo_bases.py reads the COMPARATIVE
      # COLUMNS printed in the company's own results PDF (text layer first, free Gemini vision for
      # scanned filings), ANCHOR-VERIFIED against our stored XBRL values — never an unanchored guess.
      # Nightly-gated like the insurer step; --limit keeps a first-time backlog inside the timeout.
      - name: Backfill new-listing year-ago bases (comparative columns, anchored)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EV="${{ github.event_name }}"; ACTION="${{ github.event.action }}"; RUN=0
          [ "$EV" = "workflow_dispatch" ] && RUN=1
          # Hour 15 OR 16 UTC — drift-tolerant, same reasoning as the insurer gate above.
          [ "$EV" = "schedule" ] && case "$(date -u +%H)" in 15|16) RUN=1;; esac
          [ "$EV" = "repository_dispatch" ] && [ "$ACTION" = "insurer-refresh" ] && RUN=1
          if [ "$RUN" != "1" ]; then echo "Not a nightly trigger ($EV/$ACTION) — skipping IPO-base fill"; exit 0; fi
          pip install -q pymupdf
          # --max-minutes keeps the step well inside the job's 20-min timeout so the commit step
          # ALWAYS runs; --vision-cap protects the shared Gemini free-tier daily quota (insurers
          # use the same key; quota-dead is detected and re-queued without burning attempts).
          python3 -X utf8 scripts/backfill_ipo_bases.py --limit 40 --max-minutes 9 --vision-cap 60 || echo "(IPO-base fill failed — bases stay gapped this run)"

      # Backstop: any quarter that lands without a filing date (Screener backfills, integrated
      # rows with broadcast_Date=None) gets the SEBI deadline so the point-in-time screen can use
      # it (a null date silently drops the quarter -> stale fallback, which wrongly excluded AIIL).
      - name: Fill any null announcement dates (point-in-time safety)
        run: python3 scripts/fill_ann_dates.py

      # ★ ANN-DATE TRUTH (runbook §104, wired 2026-08-23). The upsert stores NSE's broadcast_Date,
      # which can LAG the true first-public BSE board-outcome date by days-to-months (SBICARD 88d,
      # MFSL 61d, ABB 118d; 152-cell batch heal a479d6c4d). Two guards:
      #   reapply — re-asserts the override ledger (scripts/ann_date_fills.json) so full rebuilds
      #             can't resurrect lagged dates. Cheap, no fetching.
      #   recent  — BSE-checks dated cells in the actively-filing window (bounded, resumable,
      #             rate-limit aware) and ledgers an earlier-only override where BSE precedes the
      #             stored date by >=2d. Stops the class regrowing on new quarters.
      - name: Reconcile announcement dates vs BSE first-public record (runbook 104)
        run: |
          python3 -X utf8 scripts/backfill_ann_dates_bse.py --reapply || echo "(ledger reapply failed — stale dates stay this run)"
          python3 -X utf8 scripts/backfill_ann_dates_bse.py --recent 220 --limit 120 --max-minutes 6 || echo "(BSE reconcile failed — lagged dates stay this run)"

      # Re-assert OWNERS-ATTRIBUTABLE consolidated profit from the reconciled XBRL cache. Without
      # this, newly-filed quarters land as total PAT, and (critically) renamed tickers never matched
      # the cache (keyed by the OLD name) so they silently kept total PAT — e.g. SWANCORP Dec-2022
      # showed -157 instead of owners +16.85. The applier is rename-aware (REV map) + guards 0-mistags.
      - name: Re-assert owners-attributable consolidated profit (incl. renamed tickers)
        run: python3 scripts/apply_owners_full.py

      # ★ CLOBBER DETECTOR (runbook §41/§56b, wired in 2026-08-09, BLOCKING since 2026-08-10). Every fill
      # and correction ledger claims specific cells; this re-checks that the SERVED payloads still carry
      # them, immediately after the rebuild that could have reverted them. It exists because "verified at
      # push time" is not verified: on 2026-08-06 a refresh restored its own pre-run snapshot over
      # sf_revop.json and silently reverted 193 backfilled cells, and the push had been reported successful.
      # The pre-existing items are adjudicated: the AURUS 2017-09 "MISSING" was a mis-keyed ledger entry
      # (a CON heal journalled under correct_pat — re-keyed to correct_pat_con, runbook §56b), and the 7
      # DRIFTs (RSYSTEMS/AARTIDRUGS/ADFFOODSx2/GODREJPROP/MMTC/SURAJEST) are report-only by design (a
      # later correction may supersede; DRIFT never exits 1). So a non-zero exit here = a REAL clobber:
      # this step failing aborts the run BEFORE the commit step, i.e. clobbered payloads don't publish.
      # If it turns red: run scripts/verify_fills_live.py locally, adjudicate per §56b (repair vs re-key
      # vs skip-flag the ledger entry) — do NOT re-add `|| true` (runbook §39).
      # ★ SELF-HEAL THE ONE RESURRECTED CLASS THAT IS MECHANICAL, so it stops mailing.
      # Measured three times in two days (2026-08-16 x2, 2026-08-17): a fill pass READ a consolidated
      # cell out of a primary filing and journalled it, while an AGGREGATOR ledger still flagged that
      # same cell `held` — and a held cell asserts ABSENCE, so the step below was guaranteed red. Each
      # time the resolution was the same: the hold was stale, because these holds rest on "this source's
      # con == our std" and their OWN text says "Settle from the filing (§57/§58), not this source".
      # This step applies exactly that rule and NOTHING else: it lifts a hold only when a filing-sourced
      # ledger asserts the same cell at the same value, it never touches a payload cell, and it is
      # all-or-nothing. A resurrected value with NO document behind it — the case the guard actually
      # exists for — is left standing so the blocking step below still fails it. Never `|| true` (§39).
      - name: Settle stale aggregator holds a filing already answered
        run: python3 -X utf8 scripts/settle_stale_holds.py --apply

      - name: Detect clobbered ledger cells in the served payloads (blocking)
        run: python3 -X utf8 scripts/verify_fills_live.py

      # Refiner excise netting (Trendlyne parity, runbook §11): petroleum cos' XBRL revenue is GROSS
      # (no excise tag exists), the PDF prints the "Excise Duty" row — net it off rev for the VERIFIED
      # symbol list in fetch_excise.py (anchored to stored gross; ledger scripts/excise_duty.json;
      # idempotent). Gated on new filings — that's the only time a new refiner quarter can appear.
      - name: Net refiner excise off revenue (PDF-anchored, verified symbols only)
        if: ${{ hashFiles('docs/.fund_updated') != '' }}
        run: |
          pip install -q pymupdf
          python3 -X utf8 scripts/fetch_excise.py || echo "(excise netting failed — revenue stays gross this run)"

      # Rebuild the Results Season chart payload from the just-updated net profit + rev/op. The
      # aggregator keys every filing by its OWN quarter-end, so a late filing (e.g. a March quarter
      # declared in July) lands in the March column, and a brand-new quarter (June) appears as its own
      # column from its VERY FIRST filing, flagged partial (rendered "in progress" until enough
      # companies report). Universe (turnover floor) is read from the committed sf_stock_data.bin
      # (stable; fine if a little stale).
      # UNGATED (2026-07-21): the chart also consumes vision_fills.json now, which the scheduled
      # vision routine commits from OUTSIDE this workflow — so a rebuild can be due even when this
      # run parsed no new XBRL. The build is a cheap JSON aggregation; commit-if-changed below.
      - name: Rebuild Results Season chart data
        run: python3 scripts/build_results_season.py

      # SAFETY NET: for every index on the Season Trends tab (quarterly-results.html), flag any member that has DECLARED results
      # for the live quarter but whose numbers aren't parsed into the chart yet (the 22-vs-25 gap). Prints
      # to the CI log the moment a gap appears and writes docs/_season_coverage.json. Never fails the run.
      - name: Check Results Season coverage (declared vs parsed)
        run: python3 -X utf8 scripts/check_season_coverage.py || echo "(coverage check errored — non-fatal)"

      # Quarterly Results page payload — rebuilt EVERY run (not just when new earnings land):
      # result-day reactions and since-result drift move with prices daily. Reactions need the
      # FRESH price bin (the committed docs bin is a stale snapshot — runbook §0), so pull the
      # `data` release asset like refresh-market-mood does. Non-fatal on download failure.
      - name: Rebuild Quarterly Results payload (fresh prices)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 15-min runs rebuild only when new earnings landed (else a 1.8 MB commit 4×/hour
          # for nothing); the nightly run always rebuilds so reactions/drift track daily
          # prices (published ~20:45 IST). Hour 15 OR 16 UTC = nightly, drift-tolerant —
          # same reasoning as the insurer/IPO-base gates above.
          NIGHTLY=0; case "$(date -u +%H)" in 15|16) NIGHTLY=1;; esac
          if [ ! -f docs/.fund_updated ] && [ "$NIGHTLY" != "1" ]; then
            echo "No new earnings this run — skipping payload rebuild"
            exit 0
          fi
          mkdir -p /tmp/qr
          if gh release download data --pattern 'sf_stock_data.bin' --dir /tmp/qr --clobber; then
            SF_BIN=/tmp/qr/sf_stock_data.bin python3 -X utf8 scripts/build_quarterly_results.py
          else
            echo "(release download failed — building from committed bin; reactions may lag)"
            python3 -X utf8 scripts/build_quarterly_results.py
          fi

      - name: Guard — refuse to commit a broken or shrunken feed
        run: python3 scripts/guard_feed.py

      # 15:30 look-ahead gate re-run (runbook §12 + §88c). Backfill campaigns stamp ann-dates
      # through writers that skip gated_ann, so month-end look-aheads REGROW (~870 new events
      # measured 2026-08-11). Nightly: rebuild events from the committed calendar, fetch BSE
      # broadcast times for NEW dates only (fetch_filing_times.py is resumable over the tracked
      # cache; a quiet day = ~0 requests), then bump confirmed after-close filings. Conservative
      # by construction: no BSE record / any pre-close broadcast => cell untouched. CI gates the
      # docs file only (scripts/fundamentals.json, the big mirror, is NOT committed from CI —
      # local gate runs keep it in sync; bumps verified durable across nightlies, JSL §12).
      # Ordering matters: this must run BEFORE the commit step snapshots /tmp copies.
      - name: 15:30 gate re-run (nightly)
        run: |
          RUN=0
          EV="${{ github.event_name }}"
          [ "$EV" = "workflow_dispatch" ] && RUN=1
          [ "$EV" = "schedule" ] && case "$(date -u +%H)" in 15|16) RUN=1;; esac
          [ "$RUN" = "1" ] || { echo "not the nightly — skipped"; exit 0; }
          ( set -e
            [ -f scripts/filing_times_cache.json.gz ] && gunzip -c scripts/filing_times_cache.json.gz > scripts/_filing_times.json
            python3 scripts/build_gate_events.py --calendar
            python3 scripts/fetch_filing_times.py
            python3 scripts/gate_1530.py --apply
            gzip -c scripts/_filing_times.json > scripts/filing_times_cache.json.gz
          ) || echo "::warning::15:30 gate re-run failed — retried next nightly"

      - name: Commit updated fundamentals + results pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FUND=0; [ -f docs/.fund_updated ] && FUND=1
          cp docs/sf_fundamentals.json /tmp/sf_fundamentals.json
          cp docs/sf_revop.json        /tmp/sf_revop.json
          cp docs/results_season.json  /tmp/results_season.json
          [ -f docs/_season_coverage.json ] && cp docs/_season_coverage.json /tmp/_season_coverage.json
          cp docs/quarterly_results.json /tmp/quarterly_results.json
          # IPO-base fill ledger + skip tracker (small; the big scripts/ mirrors are NOT committed from CI)
          [ -f scripts/ipo_base_fills.json ] && cp scripts/ipo_base_fills.json /tmp/ipo_base_fills.json
          [ -f scripts/_ipo_base_skips.json ] && cp scripts/_ipo_base_skips.json /tmp/_ipo_base_skips.json
          [ -f scripts/excise_duty.json ] && cp scripts/excise_duty.json /tmp/excise_duty.json
          [ -f scripts/filing_times_cache.json.gz ] && cp scripts/filing_times_cache.json.gz /tmp/filing_times_cache.json.gz
          # ann-date truth ledger + reconcile skip tracker (runbook 104) — written by the reconcile
          # step earlier in this job; must survive the reset --hard below or every night refetches
          [ -f scripts/ann_date_fills.json ] && cp scripts/ann_date_fills.json /tmp/ann_date_fills.json
          [ -f scripts/_ann_recon_skips.json ] && cp scripts/_ann_recon_skips.json /tmp/_ann_recon_skips.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            if [ "$FUND" = "1" ]; then
              # THREE-WAY MERGE, never a blind copy. The reset above just pulled in whatever other
              # writers (backfill sessions, the vision routine) landed while this job ran; copying
              # our pre-run snapshot over it would throw all of that away -- which is exactly what
              # happened on 2026-08-06. Per slot: if this run changed it, ours wins (deliberate
              # nulls from revop_sanity included); if this run did not touch it, origin's value is
              # kept. Falls back to a plain copy on any unexpected shape.
              python3 scripts/ci_preserve_merge.py /tmp/base/sf_fundamentals.json \
                      /tmp/sf_fundamentals.json docs/sf_fundamentals.json docs/sf_fundamentals.json
              python3 scripts/ci_preserve_merge.py /tmp/base/sf_revop.json \
                      /tmp/sf_revop.json        docs/sf_revop.json        docs/sf_revop.json
              [ -f /tmp/ipo_base_fills.json ] && cp /tmp/ipo_base_fills.json scripts/ipo_base_fills.json && git add scripts/ipo_base_fills.json
              [ -f /tmp/excise_duty.json ] && cp /tmp/excise_duty.json scripts/excise_duty.json && git add scripts/excise_duty.json
              git add docs/sf_fundamentals.json docs/sf_revop.json
            fi
            # ★ Persist the stale-hold settle, and do it HERE — inside the loop, AFTER the reset+merge.
            # The step earlier in the job ran against the pre-reset tree, and `git reset --hard` above
            # just threw those ledger edits away. Re-running recomputes against whatever other writers
            # landed while this job ran, instead of pasting a pre-reset snapshot over their work — which
            # is the 2026-08-06 clobber class this whole block exists to avoid. Idempotent: a hold that
            # is already lifted produces no diff. Non-fatal: exit 1 means "a resurrected cell needs a
            # human", which the BLOCKING step above already reported and failed on, and a scripts/
            # ledger must never stop the payload itself from publishing.
            python3 -X utf8 scripts/settle_stale_holds.py --apply \
              || echo "::warning::settle_stale_holds: something needs adjudication (see the blocking step above)"
            git add scripts/mc_pat_fills.json scripts/mc_history_fills.json
            # season chart + coverage commit UNCONDITIONALLY (2026-07-21): they also move when the
            # vision routine committed new fills — i.e. exactly when no .fund_updated exists
            cp /tmp/results_season.json  docs/results_season.json
            git add docs/results_season.json
            [ -f /tmp/_season_coverage.json ] && cp /tmp/_season_coverage.json docs/_season_coverage.json && git add docs/_season_coverage.json
            cp /tmp/quarterly_results.json docs/quarterly_results.json
            git add docs/quarterly_results.json
            [ -f /tmp/_ipo_base_skips.json ] && cp /tmp/_ipo_base_skips.json scripts/_ipo_base_skips.json && git add scripts/_ipo_base_skips.json
            [ -f /tmp/filing_times_cache.json.gz ] && cp /tmp/filing_times_cache.json.gz scripts/filing_times_cache.json.gz && git add scripts/filing_times_cache.json.gz
            # ★ ann-date truth (runbook 104): persist ledger + skips, then RE-ASSERT the override
            # ledger onto the post-reset/post-merge payload — same rationale as settle_stale_holds
            # above: the reset threw away the pre-reset application, and other writers' payloads
            # must still get the corrected dates. Earlier-only, idempotent, no fetching. Runs
            # unconditionally (not FUND-gated): date corrections happen even on no-new-quarter days.
            # UNION-merge, never cp: the /tmp snapshot predates the reset --hard above, and a
            # session may have pushed NEW ledger entries while this job ran — a plain cp restores
            # the stale snapshot over them (this exact clobber wiped 1,240 tier-2 entries on the
            # 2026-08-23 15:02 run). Current tree (= origin, post-reset) wins per key; the
            # snapshot only re-adds keys this run itself created before the reset.
            for LF in scripts/ann_date_fills.json scripts/_ann_recon_skips.json; do
              if [ -f "/tmp/$(basename $LF)" ]; then
                python3 -c "import json,os; lf='$LF'; sn='/tmp/'+os.path.basename(lf); cur=json.load(open(lf)) if os.path.exists(lf) else {}; snap=json.load(open(sn)); m={**snap, **cur}; json.dump(m,open(lf,'w'),separators=(',',':')); print(lf,'union:',len(snap),'snap +',len(cur),'tree ->',len(m))"
                git add "$LF"
              fi
            done
            python3 -X utf8 scripts/backfill_ann_dates_bse.py --reapply || echo "::warning::ann-date ledger reapply failed"
            git add docs/sf_fundamentals.json
            # Fill-coverage scoreboard (docs/fill-coverage.html) — built HERE, inside the loop and
            # AFTER the three-way merge, deliberately. It is derived from sf_revop + sf_fundamentals,
            # so building it earlier would compute over pre-merge data and then be wiped by the
            # reset --hard above. Cheap (~20 KB, pure recompute) so it runs every attempt.
            # Non-fatal: a scoreboard must never block the data commit.
            python3 -X utf8 scripts/build_fill_coverage.py \
              && git add docs/fill_coverage.json \
              || echo "(fill-coverage build failed — non-fatal)"
            if git diff --cached --quiet; then echo "no diff"; exit 0; fi
            git commit -m "Daily fundamentals + results refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then echo "pushed (attempt #$attempt)"; gh workflow run pages.yml || echo "(pages deploy dispatch failed)"; exit 0; fi
            sleep $(( attempt * 3 ))
          done
          echo "push failed after 5 attempts"; exit 1

      # Re-raise the XBRL fetch failure LAST, so the bakes/commits above still ran but the run
      # goes red and the outage stays visible (fail-LOUD contract of update_fundamentals.py).
      - name: Surface XBRL fetch failure
        if: ${{ steps.xbrl.outcome == 'failure' }}
        run: |
          echo "::error::NSE XBRL fetch failed this run (lockdown?) — season/payload bakes still ran"
          exit 1
