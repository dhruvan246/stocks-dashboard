name: Deploy site to Pages

# Controlled replacement for the managed branch-based Pages build. The managed
# flow rebuilt on every push and, when many commits landed close together (daily
# refresh bots + manual pushes), superseded deploys were reported as FAILED and
# emailed. Here, cancel-in-progress makes a superseded deploy CANCEL cleanly —
# cancelled runs send no failure email — so only a genuine error notifies you.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"        # only redeploy when the published site actually changes
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
