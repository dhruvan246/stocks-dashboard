name: Deploy site to Pages

# Controlled replacement for the managed branch-based Pages build. The managed
# flow rebuilt on every push and, when many commits landed close together (daily
# refresh bots + manual pushes), superseded deploys were reported as FAILED and
# emailed. Here, cancel-in-progress makes a superseded deploy CANCEL cleanly —
# cancelled runs send no failure email — so only a genuine error notifies you.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"        # only redeploy when the published site actually changes
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages waits for GitHub's Pages backend to build the uploaded artifact and
          # gives up after 10 minutes by DEFAULT. On a busy day that is not enough: on
          # 2026-08-06 every run from 12:02 UTC onward died with "Timeout reached, aborting"
          # while still reporting `deployment_queued` — i.e. the artifact uploaded fine and the
          # backend queue was simply slower than the wait. The site went ~1.5 h without
          # publishing anything, from ~30 writers' worth of commits, and each failure also
          # cancels its own queued deployment, which feeds the backlog.
          # 30 minutes costs nothing when the queue is healthy (the step returns as soon as the
          # deployment reports success) and rides out the backlog when it is not.
          timeout: 1800000
          error_count: 20
