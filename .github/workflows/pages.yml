name: Deploy site to Pages

# Controlled replacement for the managed branch-based Pages build. The managed
# flow rebuilt on every push and, when many commits landed close together (daily
# refresh bots + manual pushes), superseded deploys were reported as FAILED and
# emailed.
#
# cancel-in-progress was TRUE here for that reason, and on 2026-08-06 it stopped the
# site publishing for over two hours. Every run from 12:02 UTC onward ended in
# "Timeout reached, aborting!" while still reading `deployment_queued`. Cause: a
# cancel fires AFTER the run has already created a Pages deployment on GitHub's side,
# and cancelling the workflow does not retire that deployment. Under the day's commit
# volume each cancel abandoned another queued deployment, the backend queue never
# drained, and every subsequent run timed out waiting behind the wreckage — which
# then cancelled ITS deployment too. A self-feeding jam.
#
# Raising the wait cannot fix it: deploy-pages caps `timeout` at 600000 ms and warns
# "timeout value is greater than the allowed maximum" if you ask for more.
#
# So: cancel-in-progress FALSE, which is also what GitHub's own Pages starter
# workflow specifies — "do NOT cancel in-progress runs as we want to allow these
# production deployments to complete". The concurrency group still prevents a
# pile-up: only ONE run may be pending per group, and a newly queued run cancels the
# previously PENDING one, so intermediate deploys are skipped without ever touching a
# deployment that is already in flight. Superseded runs are therefore still cancelled
# (no failure email — the original concern) but only while they are waiting, never
# mid-deploy.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"        # only redeploy when the published site actually changes
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 600000 ms is the action's HARD MAXIMUM — asking for more is silently clamped with
          # "timeout value is greater than the allowed maximum". Stated explicitly so nobody
          # tries to ride out a queue backlog by raising it; fix the queue instead (see the
          # cancel-in-progress note above).
          timeout: 600000
