name: Deploy site to Pages

# Controlled replacement for the managed branch-based Pages build. The managed
# flow rebuilt on every push and, when many commits landed close together (daily
# refresh bots + manual pushes), superseded deploys were reported as FAILED and
# emailed.
#
# cancel-in-progress was TRUE here for that reason, and on 2026-08-06 it stopped the
# site publishing for over two hours. Every run from 12:02 UTC onward ended in
# "Timeout reached, aborting!" while still reading `deployment_queued`. Cause: a
# cancel fires AFTER the run has already created a Pages deployment on GitHub's side,
# and cancelling the workflow does not retire that deployment. Under the day's commit
# volume each cancel abandoned another queued deployment, the backend queue never
# drained, and every subsequent run timed out waiting behind the wreckage — which
# then cancelled ITS deployment too. A self-feeding jam.
#
# Raising the wait cannot fix it: deploy-pages caps `timeout` at 600000 ms and warns
# "timeout value is greater than the allowed maximum" if you ask for more.
#
# So: cancel-in-progress FALSE, which is also what GitHub's own Pages starter
# workflow specifies — "do NOT cancel in-progress runs as we want to allow these
# production deployments to complete". The concurrency group still prevents a
# pile-up: only ONE run may be pending per group, and a newly queued run cancels the
# previously PENDING one, so intermediate deploys are skipped without ever touching a
# deployment that is already in flight. Superseded runs are therefore still cancelled
# (no failure email — the original concern) but only while they are waiting, never
# mid-deploy.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"        # only redeploy when the published site actually changes
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Group RENAMED from "pages" on 2026-08-07. After the 2026-08-06 Actions/Pages
  # outage the old group wedged on GitHub's side: runs queued into it stayed
  # `pending` (which in the Actions API means "blocked by concurrency") and NEVER
  # got a runner — 29 consecutive runs, alive up to 43 min with ZERO jobs created,
  # against a 9-second created→started time on the last healthy run. Nothing
  # legitimately held it: no other workflow uses the group, no runner saturation,
  # environment gate open, and no deployment left in `waiting`. A fresh group name
  # carries no wedged state; the semantics below are deliberately unchanged.
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever attempt below actually succeeded owns the url — attempt 1's output is empty when
      # it 503s, and an empty environment url shows the deployment as unlinked in the UI.
      url: ${{ steps.deployment.outputs.page_url || steps.deploy_retry1.outputs.page_url || steps.deploy_retry2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      # ⚠️ RETRY THE CREATE — GitHub's Pages API 503s, and that is not our failure to report.
      # Measured 2026-08-17 18:00–18:31 UTC: five runs died on
      #   "Creating Pages deployment failed / HttpError: No server is currently available to service
      #    your request" / "Failed to create deployment (status: 503)"
      # while NINE others in the same half hour succeeded — flapping, not down. The site never went
      # stale (live sf_meta.json stayed {"end":"2026-08-17"}, identical to origin/main) because a
      # later deploy published the same content, so every one of those emails was pure noise about a
      # self-healing condition. Same class as the bake-waves 503 fix: the transient was the ONE path
      # with no second chance. `timeout` does NOT help — it governs polling AFTER the deployment is
      # created, and these die at creation.
      # Three attempts, and the third is NOT continue-on-error: a genuine multi-minute Pages outage
      # still fails the run and still mails, which is the alarm we want to keep.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # 600000 ms is the action's HARD MAXIMUM — asking for more is silently clamped with
          # "timeout value is greater than the allowed maximum". Stated explicitly so nobody
          # tries to ride out a queue backlog by raising it; fix the queue instead (see the
          # cancel-in-progress note above).
          timeout: 600000

      - name: Wait out the 503, then retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy attempt 1 failed (GitHub-side); retrying in 45s"
          sleep 45
      - name: Deploy to GitHub Pages (retry 1)
        id: deploy_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      - name: Wait again before the final attempt
        if: steps.deployment.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy attempt 2 failed (GitHub-side); final retry in 90s"
          sleep 90
      # No continue-on-error here on purpose: if Pages is still refusing after ~2.5 minutes of
      # retries, that is a real outage and the run SHOULD go red.
      - name: Deploy to GitHub Pages (final attempt)
        id: deploy_retry2
        if: steps.deployment.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
