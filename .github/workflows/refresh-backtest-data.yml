name: Daily backtest data refresh

on:
  schedule:
    # 15:15 UTC = 20:45 IST, weekdays — after NSE publishes the day's bhavcopy
    # (~19:00 IST). GitHub cron is best-effort; the updater self-heals (it
    # appends every missing day since the file's `end`), so a skipped run is
    # caught up by the next one.
    - cron: "15 15 * * 1-5"
    # 03:25 UTC = 08:55 IST Tue-Sat — catch-up for a missed evening (GitHub cron is
    # best-effort and can skip a slot entirely; the cron-job.org dispatch is the other
    # leg but has failed before too). The updater self-heals and picks log by data-day
    # (SF.end), so this is a no-op when the evening run succeeded.
    - cron: "25 3 * * 2-6"
  # Optional external trigger (cron-job.org), SEPARATE event type from the
  # stock/MF/FII jobs: POST /repos/dhruvan246/stocks-dashboard/dispatches
  # with {"event_type":"backtest-data-refresh"}
  repository_dispatch:
    types: [backtest-data-refresh]
  workflow_dispatch: {}
  # Bootstrap/self-test: also run when the updater itself changes
  push:
    paths:
      - "scripts/update_sf_data.py"
      - ".github/workflows/refresh-backtest-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-backtest-data
  cancel-in-progress: false

jobs:
  refresh-backtest-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # +10 for cutting and pushing the 5k per-stock slices
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Refresh OFFICIAL split/bonus ratios first so the updater applies exact factors on any
      # ex-date (a split/bonus that moves on its ex-date, or a small bonus, is mis-inferred from
      # the price drop otherwise). Cheap (~9 NSE API calls); on failure the committed copy is used.
      - name: Refresh official corporate-action ratios
        run: python3 scripts/build_corp_actions.py || echo "corp-action refresh failed — using committed copy"

      - name: Append missing trading days to sf_stock_data.bin
        run: python3 scripts/update_sf_data.py

      # TRIPWIRE: an ISIN-changed rename (GUJGASLTD->GUJENERGY class) starts a FRESH series the
      # ISIN auto-merge can't catch — the stock looks like a days-old IPO with its history
      # stranded on the dead ticker. Detect via NSE's symbolchange.csv + company-name match and
      # report loudly; each suspect needs a hand-verified MANUAL_MERGE (update_sf_data.py).
      # Report-only, never fails the run; suppression via scripts/_rename_ack.json.
      - name: Detect unmerged ticker renames (ISIN-changed)
        run: python3 -X utf8 scripts/detect_renames.py || echo "(rename tripwire errored — non-fatal)"

      # The 80+ MB dataset is published as a RELEASE ASSET (replaced in place),
      # NOT committed — committing it daily would grow the repo by ~2.5 GB/month.
      # The backtest pages fetch the release URL first and fall back to the
      # in-repo copy.
      - name: Publish dataset as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Seed the release on first run even with no new data, so the frontend's
          # release-first load works immediately. On later runs, only re-upload when
          # the updater actually appended a day (docs/.sf_updated present).
          if gh release view data >/dev/null 2>&1; then
            EXISTS=1
          else
            EXISTS=0
            gh release create data --title "Backtest data (rolling)" \
              --notes "Rolling daily survivorship-free dataset for the stock backtest. Replaced in place every trading day." \
              --latest=false
          fi
          if [ -f docs/.sf_updated ] || [ "$EXISTS" = "0" ]; then
            gh release upload data docs/sf_stock_data.bin --clobber
            echo "Published sf_stock_data.bin (end=$(python3 -c "import json,gzip;print(json.loads(gzip.decompress(open('docs/sf_stock_data.bin','rb').read()))['end'])"))"
          else
            echo "No new data and release already seeded — nothing to publish"
          fi

      # The browser loads the dataset from the dedicated same-origin sf-data Pages repo (the release
      # asset fails CORS in-browser). Split the >100MB file into 2 sub-100MB halves and FORCE-PUSH them
      # there — a fresh single commit each day, so that repo never accumulates history/bloat.
      #
      # The same push carries stk/ — one small pre-cut slice per stock, which is what docs/stock.html
      # actually opens with (runbook §40). They ride along here because they need this job's freshly
      # appended sf_stock_data.bin, and they belong in a force-pushed repo: every stock's slice changes
      # every trading day, so committing them to the main repo would add ~40 MB a day forever.
      - name: Force-push split data + per-stock slices to sf-data Pages repo
        if: ${{ hashFiles('docs/.sf_updated') != '' || github.event_name == 'workflow_dispatch' }}
        env:
          SF_DATA_TOKEN: ${{ secrets.SF_DATA_TOKEN }}
        run: |
          python3 scripts/split_sf_data.py
          python3 scripts/build_stock_slices.py
          cd scripts/_sfsplit
          git init -q -b main
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sf_stock_data_1.bin sf_stock_data_2.bin sf_meta.json stk_meta.json stk
          git commit -q -m "data $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          git push -q --force "https://x:${SF_DATA_TOKEN}@github.com/dhruvan246/sf-data.git" main
          echo "force-pushed fresh split data + $(ls stk | wc -l) stock slices to sf-data"

      # ── PUBLISH != VISIBLE ────────────────────────────────────────────────────────────────────
      # Browsers cache the two 50MB+ parts in IndexedDB keyed on sf_meta.json {end}+{rev}. A HEAL
      # (delivery backfill, corp-action fix, rename merge) rewrites history WITHOUT advancing `end`,
      # so `rev` — a fingerprint of the published bytes — is the ONLY thing that tells a warm browser
      # to re-download. This shipped broken once: the 2002-2019 delivery backfill was live on every
      # server layer while every returning visitor kept serving pre-heal bytes, and it took a user
      # running a backtest to notice. So assert the browser-facing file really carries THIS build.
      - name: Verify clients will see this build (sf_meta rev is live)
        if: ${{ hashFiles('docs/.sf_updated') != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          REV=$(python3 -c "import json;print(json.load(open('scripts/_sfsplit/sf_meta.json')).get('rev') or '')")
          if [ -z "$REV" ]; then
            echo "::error::split_sf_data.py published no 'rev'. Browsers key their ~115MB cache on it; without it a heal is INVISIBLE to every warm client until the next trading day. Restore the rev in split_sf_data.py."
            exit 1
          fi
          for i in $(seq 1 20); do
            LIVE=$(curl -s "https://dhruvan246.github.io/sf-data/sf_meta.json?t=$(date +%s%N)" || true)
            case "$LIVE" in
              *"$REV"*) echo "clients will load rev=$REV (live: $LIVE)"; exit 0 ;;
            esac
            echo "waiting for Pages to serve rev=$REV (attempt $i/20) — live: $LIVE"
            sleep 30
          done
          echo "::error::Pages still serves a stale sf_meta.json after 10 min (want rev=$REV, live: $LIVE). The data is published but clients would keep the PREVIOUS version cached — check the sf-data Pages deployment."
          exit 1

      # Symbol/name index behind the site-wide 🔍 search box. Built from the SAME meta the
      # backtest payload carries, so search only ever offers stocks stock.html can render.
      # Tiny (~190 KB) and committed, unlike the bin itself.
      - name: Rebuild search index
        if: ${{ hashFiles('docs/.sf_updated') != '' || github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/build_search_index.py || echo "search index rebuild failed — keeping committed copy"

      # Commit ONLY the tiny version marker (docs/sf_meta.json, ~20 bytes) plus the search
      # index, and only when the updater actually appended a day (it rewrote sf_meta.json
      # then). The browser keys its IndexedDB cache of the big bin on this `end`, so bumping
      # it is what makes clients re-download; the 80 MB bin itself is never committed (stays
      # a release asset). NOTE: the retry loop resets --hard, so every file to be committed
      # must be stashed in /tmp first and copied back INSIDE the loop.
      - name: Commit version marker
        if: ${{ hashFiles('docs/.sf_updated') != '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/sf_meta.json /tmp/sf_meta.json     # preserve the updater's fresh marker across reset
          [ -f docs/search_index.json ] && cp docs/search_index.json /tmp/search_index.json
          [ -f scripts/_rename_suspects.json ] && cp scripts/_rename_suspects.json /tmp/_rename_suspects.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/sf_meta.json docs/sf_meta.json
            git add docs/sf_meta.json
            [ -f /tmp/search_index.json ] && cp /tmp/search_index.json docs/search_index.json && git add docs/search_index.json
            [ -f /tmp/_rename_suspects.json ] && cp /tmp/_rename_suspects.json scripts/_rename_suspects.json && git add -f scripts/_rename_suspects.json
            if git diff --cached --quiet; then echo "marker unchanged"; exit 0; fi
            git commit -m "Backtest data version marker $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then echo "pushed marker (attempt #$attempt)"; exit 0; fi
            sleep $(( attempt * 3 ))
          done
          echo "marker push failed after 5 attempts"; exit 1
