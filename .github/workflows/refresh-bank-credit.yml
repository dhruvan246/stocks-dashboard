name: Refresh Banking Growth (bank credit)

on:
  schedule:
    # RBI releases bank loan growth ~fortnightly (Fridays). Run Tue & Sat
    # 15:00 UTC = 20:30 IST to catch the new print soon after it posts.
    # GitHub cron is best-effort; the feed is cumulative so a skipped run
    # self-heals on the next one (the history file only grows).
    - cron: "0 15 * * 2,6"
  # Optional external trigger (cron-job.org) — its own event type, independent
  # of the stock / MF / FII-DII jobs. POST /repos/dhruvan246/stocks-dashboard/dispatches
  #   {"event_type":"bank-credit-refresh"}
  repository_dispatch:
    types: [bank-credit-refresh]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-bank-credit
  cancel-in-progress: false

jobs:
  refresh-bank-credit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch latest bank loan growth (stdlib only — no deps)
        run: python3 scripts/fetch_bank_credit.py

      - name: Commit updated bank-credit history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/bc/docs
          cp docs/bank_credit.json /tmp/bc/docs/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bc/docs/bank_credit.json docs/bank_credit.json
            git add docs/bank_credit.json

            if git diff --cached --quiet; then
              echo "No new bank-credit data — nothing to commit"
              exit 0
            fi

            git commit -m "Banking Growth refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            if git push origin HEAD:main; then
              echo "Pushed on attempt #$attempt"
              exit 0
            fi
            echo "Push attempt #$attempt rejected; resetting and retrying"
            sleep $(( attempt * 3 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
